// 雷达图轴序 = 用户定义的全部 9 项基础属性(推理/知识/长上下文/速度/指令遵循/工具调用/多模态/拟合/参数)。
// 前 7 项是"越高越好"的能力维度(与相似度算法 ATTR_KEYS 同集合,只是显示顺序更靠前);
// 「拟合」「参数」不是单调属性,放最后并单独处理:
//   拟合 —— 在轴上额外标出最优点 CAP_FIT_OPT,玩家一眼能看出自己欠拟合还是过拟合;
//   参数 —— 值本身有意义(放大训练收益),照常画。
// 轴序变化不影响算法:相似度与叠影对照都是按 key 取值的。
const RADAR_KEYS = ['reasoning', 'knowledge', 'longCtx', 'speed', 'instruct', 'toolCall', 'multimodal', 'fit', 'params'];
function drawTrainPage(x, y, w, h) {
  const R = state.relay, T = R.train, A = R.ability;
  // 顶部 HUD:点数 / 压力 / 刀乐 + 能力 / 下一测评进度(中国式家长"这回合还剩多少精力")
  const pMul = Math.max(0, 1 - (T.pressure / TRAIN_CFG.PRESSURE_PENALTY_DIV));
  const hud = makeText('算力 ' + (T.ap | 0) + '/' + TRAIN_CFG.AP_MAX +
    '      压力 ' + (T.pressure | 0) + '(效果×' + pMul.toFixed(2) + ')' + (trainPressureMaxed() ? '摆烂' : '') +
    '      刀乐 $' + formatNum(R.dollars),
    { size: 16, color: '#5a4632', weight: 'bold' });
  hud.x = x + 20; hud.y = y + 12;
  panelContentArea.addChild(hud);
  // §22:拟合度概览 —— 玩家必须能实时看见它在练/在回落(星光:「训练过程中伴随拟合度的概览增长和减少」)
  const fitV = A.fit;
  const fitTxt = makeText('拟合 ' + fitV.toFixed(0) + ' ' + fitStateText(fitV),
    { size: 15, color: fitStateColor(fitV), weight: 'bold' });
  fitTxt.x = hud.x + hud.width + 20; fitTxt.y = y + 13;
  panelContentArea.addChild(fitTxt);
  const ex = T.examStage < TRAIN_CFG.EXAMS.length ? TRAIN_CFG.EXAMS[T.examStage] : null;
  const elapsed = trainElapsedDays();
  // §17.6 考试进行中:显示当前得分与剩余时长(过程化可见性);不显示及格线。
  const hud2Text = (() => {
    if (T.examSession) {
      const s = T.examSession;
      const cur = (s.idx < TRAIN_CFG.EXAMS.length) ? TRAIN_CFG.EXAMS[s.idx] : null;
      const leftH = Math.max(0, s.endH - ((state.relay.news && state.relay.news.totalH) || 0));
      return '考试中：' + (cur ? cur.name : '') + ' · 得分 ' + Math.round(s.score) + ' · 剩余 ' + leftH.toFixed(1) + ' 游戏时';
    }
    if (T.graduate) return '已毕业 · 被发掘(阶段2 待开发) · 训练第 ' + elapsed + ' 天';
    return ex ? ('训练第 ' + elapsed + ' 天 · 下一测评：' + ex.name + '（' + Math.max(0, ex.atDay - elapsed) + ' 天后）')
              : ('训练第 ' + elapsed + ' 天 · 测评已全部完成');
  })();
  const hud2 = makeText(hud2Text,
    { size: 15, color: '#8a7a68' });
  hud2.x = x + 20; hud2.y = y + 38;
  panelContentArea.addChild(hud2);

  // §18.3 右上角「说明」(与模型页/后台同款纸页按钮;HUD 全靠左,右上无冲突)
  drawTrainHelpButton(x + w, y);

  // 左上放大数字:能力 / 客户期待值(= §14.11 有效相似度换皮)
  const capNum = makeText(modelCapability(A).toFixed(1), { size: 36, color: '#5a4632', weight: 'bold' });
  capNum.x = x + 20; capNum.y = y + 88;
  panelContentArea.addChild(capNum);
  const capLbl = makeText('能力', { size: 13, color: '#8a7a68' });
  capLbl.x = x + 20; capLbl.y = y + 66;
  panelContentArea.addChild(capLbl);

  const listed = relayListedModel();
  const expVal = listed ? similarityTo(A, listed) : -1;
  const expNum = makeText(listed ? (expVal.toFixed(0) + '%') : '未标榜',
    { size: 36, color: expVal >= 80 ? '#2a7a3a' : (expVal < 0 ? '#b0a294' : '#c05a2a'), weight: 'bold' });
  expNum.x = x + 120; expNum.y = y + 88;
  panelContentArea.addChild(expNum);
  const expLbl = makeText('客户期待值', { size: 13, color: '#8a7a68' });
  expLbl.x = x + 120; expLbl.y = y + 66;
  panelContentArea.addChild(expLbl);

  // 左下:缩小的 9 维属性雷达(我的成长;对照标榜模型灰影)——只是调小,不动 drawRadar
  const their = listed ? modelToAttrs(listed) : null;
  const radarR = Math.min(w * 0.19, (h - 176) * 0.30);
  drawRadar(x + w * 0.26, y + 176 + radarR, radarR, A, their);

  // 右:训练道具卡列表(沿用原鞭子卡样式:圆角槽 + 左图标块 + 名 + 描述;点=买并用)
  // §19.15(2026-10-21 星光「强化训练的按钮可以大一点」):卡片加高 + 字号抬一档 + 右侧加「使用」按钮区,
  //   让「这张卡能点」这件事一眼可见(原来整卡是热区但没有按钮观感,像只读列表)。
  const listX = x + w * 0.50, listW = w * 0.48, gap = 10;
  const startY = y + 68;
  const n = TRAIN_ITEMS.length;
  const cardH = Math.max(48, Math.min(76, ((y + h - 12) - startY - gap * (n - 1)) / n));
  const head = makeText('训练道具（点卡片使用）', { size: 15, color: '#5a4632', weight: 'bold' });
  head.x = listX; head.y = y + 40;
  panelContentArea.addChild(head);
  const iconSz = Math.min(44, cardH - 12);   // §19.15 图标块同步放大
  for (let i = 0; i < n; i++) {
    const it = TRAIN_ITEMS[i];
    const cy = startY + i * (cardH + gap);
    const usable = trainCanUse(it);
    const inSession = it.kind === 'session' && T.session && T.session.key === it.key;
    const maxed = trainItemMaxed(it.key);   // 累计买满 cap → 置灰锁定(2026-10-05)
    const card = new PIXI.Graphics();
    card.lineStyle(2, inSession ? 0x3a9a6a : (maxed ? 0xbdb4a6 : (usable ? 0xd4a574 : 0xc4b8a8)), 0.9);
    card.beginFill(inSession ? 0xe6f2e8 : (maxed ? 0xdcd8ce : (usable ? 0xf5ecd8 : 0xe8e0d4)), 0.95);
    card.drawRoundedRect(listX, cy, listW, cardH, 8);
    card.endFill();
    card.beginFill(it.color, maxed ? 0.30 : 0.92);
    card.drawRoundedRect(listX + 8, cy + (cardH - iconSz) / 2, iconSz, iconSz, 6);
    card.endFill();
    card.eventMode = 'static';
    card.cursor = maxed ? 'default' : 'pointer';   // 买满 → 不给手型,配合置灰
    card.hitArea = new PIXI.Rectangle(listX, cy, listW, cardH);
    card.on('pointerdown', (e) => { e.stopPropagation(); if (useTrainItem(it)) layoutScreenPanel(); });
    panelContentArea.addChild(card);
    const tx = listX + 8 + iconSz + 10;
    const nm = makeText(it.name, { size: 16, color: maxed ? '#8a8278' : '#3a2f22', weight: 'bold' });
    nm.x = tx; nm.y = cy + cardH * 0.08;
    panelContentArea.addChild(nm);
    // §19.15:消耗必须**写清「消耗」二字**(星光要求)——原来只写「$1.20 · 8算力」,玩家得自己猜哪是钱哪是点数。
    //   有闭关时只显示剩余分钟数(此时不再扣费,详见 useTrainItem 的 session 分支)。
    const btnW = Math.min(76, listW * 0.26);   // 右侧「使用」按钮区宽
    const costStr = inSession ? ('闭关中 剩 ' + Math.max(0, Math.ceil(T.session.remainMin)) + ' 分钟')
      : (maxed ? '已练到头'
        : ('消耗 ' + trainPriceText(trainItemPrice(it.key)) + ' + ' + it.ap + ' 算力'));
    const cost = makeText(costStr, { size: 13, color: maxed ? '#8a8278' : '#7a5a2a', weight: 'bold' });
    cost.anchor.set(1, 0);
    cost.x = listX + listW - 10 - btnW - 8; cost.y = cy + cardH * 0.10;
    panelContentArea.addChild(cost);
    const gain = Object.keys(it.rate).map((k) => {
      const dynamicGain = (100 - A[k]) * it.rate[k] * trainGainMul();
      return (ATTR_CN[k] || k) + '+' + dynamicGain.toFixed(1);
    }).join(' ');
    // §22:概览行要带上**拟合度变化**(星光:「购买的时候概览增长拟合度」)——
    //   玩家在买之前就要看见「练这一下会把拟合从 42 推到 49」,才知道自己在往过拟合走。
    //   超过最优 70 时额外标「过拟合」提示(那一步开始掉能力,但隐蔽度上升 → 伪装流)。
    const fitNow = A.fit;
    const fitNext = Math.max(0, Math.min(100, fitNow + (it.fitDrift || 0)));
    const fitPrevTxt = '  ·  拟合 ' + fitNow.toFixed(0) + '→' + fitNext.toFixed(0);
    const gainT = makeText(maxed ? '再买也不涨了' : ('得到 ' + gain + fitPrevTxt),
      { size: 12, color: maxed ? '#8a8278' : '#2a7a3a' });
    gainT.x = tx; gainT.y = cy + cardH * 0.40;
    // 概览行变长(属性 + 拟合变化),窄屏/多属性道具会顶出卡片 ⇒ 超宽就按比例缩字号(不换行,单行制)
    const gainMaxW = listX + listW - 10 - tx;
    if (gainT.width > gainMaxW && gainT.width > 0) gainT.scale.set(gainMaxW / gainT.width);
    panelContentArea.addChild(gainT);
    let riskStr = '代价 压力+' + it.pres + (it.kind === 'session' ? (' · 训练需' + it.duraMin + 'min') : '');
    if (it.need) { for (const k in it.need) { if (A[k] < it.need[k]) riskStr = '🔒 需' + (ATTR_CN[k] || k) + '≥' + it.need[k]; } }
    if (maxed) riskStr = '已练到头 · 买过 ' + trainBoughtCount(it.key) + '/' + it.cap + ' 次';
    // §22:拟合度后果提示 —— 越过最优(70)会在代价行尾部标红字,提醒「这一下开始掉能力了」
    if (!maxed && it.fitDrift && fitNext > 70) riskStr += '  ·  拟合将过优(掉能力)';
    const riskT = makeText(riskStr, { size: 12, color: maxed ? '#8a8278' : (fitNext > 70 && !maxed ? '#8a4ab8' : '#a05a2a') });
    riskT.x = tx; riskT.y = cy + cardH * 0.64;
    const riskMaxW = listX + listW - 10 - tx;
    if (riskT.width > riskMaxW && riskT.width > 0) riskT.scale.set(riskMaxW / riskT.width);
    panelContentArea.addChild(riskT);
    // §19.15:右侧「使用」按钮 —— 让「能点」这件事一眼可见(整卡仍是热区,这里只是视觉 + 独立命中区)
    const bH = Math.min(34, cardH - 18), bY = cy + (cardH - bH) / 2, bX = listX + listW - btnW - 8;
    const btnG = new PIXI.Graphics();
    const bCol = maxed || !usable ? 0xc4b8a8 : 0xd4a574;
    btnG.lineStyle(2, bCol, 0.95);
    btnG.beginFill(maxed || !usable ? 0xdcd8ce : 0xf5d9a8, 0.98);
    btnG.drawRoundedRect(bX, bY, btnW, bH, 8);
    btnG.endFill();
    btnG.eventMode = 'static';
    btnG.cursor = maxed || !usable ? 'default' : 'pointer';
    btnG.hitArea = new PIXI.Rectangle(bX, bY, btnW, bH);
    btnG.on('pointerdown', (e) => { e.stopPropagation(); if (useTrainItem(it)) layoutScreenPanel(); });
    panelContentArea.addChild(btnG);
    const bTxt = makeText(inSession ? '进行中' : (maxed ? '已满' : '使用'),
      { size: 14, color: maxed || !usable ? '#8a8278' : '#5a3a12', weight: 'bold', anchor: 0.5 });
    bTxt.x = bX + btnW / 2; bTxt.y = bY + bH / 2;
    panelContentArea.addChild(bTxt);
  }

  // ===== §17.6 第二步:考试中的「限时提示」渲染(点选加分)=====
  // 只画卡片本身;命中判定在 examHintClick(用同一套 area/x/y,坐标口径一致)。
  const es = T.examSession;
  if (es && es.hints && es.hints.length) {
    const totalH = (state.relay.news && state.relay.news.totalH) || 0;
    const area = { x: x, y: y, w: w, h: h };
    for (const hd of es.hints) {
      const cx = area.x + hd.ux * area.w;
      const cy = area.y + hd.uy * area.h;
      const cardW = Math.max(52, Math.min(120, area.w * 0.22));
      // 剩余时间:越紧迫越红/越闪(纯视觉,不影响数值)
      const left = Math.max(0, hd.untilH - totalH);
      const ttl0 = Math.max(0.001, examHintLerp(EXAM_HINT_CFG.TTL_H, (TRAIN_CFG.EXAMS[es.idx] || {}).importance || 0.2));
      const urgency = 1 - Math.min(1, left / ttl0);
      const bg = new PIXI.Graphics();
      bg.beginFill(0xfff4d6, 0.94 - urgency * 0.1);
      bg.lineStyle(1.5, urgency > 0.6 ? 0xd0442a : 0xc9a24a, 0.95);
      bg.drawRoundedRect(cx - cardW / 2, cy - 13, cardW, 26, 7);
      bg.endFill();
      bg.eventMode = 'static';
      bg.cursor = 'pointer';
      bg.on('pointerdown', (e) => {
        e.stopPropagation();
        const p = e.global || { x: cx, y: cy };
        if (examHintClick(p.x, p.y, area)) { refreshRelayPanel(); }   // 重绘面板 ⇒ 卡片消失/分数刷新
      });
      panelContentArea.addChild(bg);
      const tx = makeText(hd.prefix + ' ' + hd.text, { size: 11, color: '#6a4a1a', weight: 'bold' });
      tx.x = cx - cardW / 2 + 6; tx.y = cy - 8;
      // 文本别超出卡片(粗裁:超长就缩一点)
      if (tx.width > cardW - 12) tx.scale.set((cardW - 12) / tx.width);
      panelContentArea.addChild(tx);
      // 剩余时间细条
      const bar = new PIXI.Graphics();
      bar.beginFill(0xd0442a, 0.8);
      bar.drawRect(cx - cardW / 2 + 3, cy + 9, Math.max(0, (cardW - 6) * (left / ttl0)), 2);
      bar.endFill();
      panelContentArea.addChild(bar);
    }
  }
}

function drawPublishPage(x, y, w, h) {
  const R = state.relay, P = R.publish;
  const cap = modelCapability(R.ability);
  const listed = relayListedModel();
  const txt = (s, opt, px, py) => { const t = makeText(s, opt); t.x = px; t.y = py; panelContentArea.addChild(t); return t; };
  const btn = (bx, by, bw, bh, title, sub, onTap) => {
    const wrap = new PIXI.Container();
    const g = new PIXI.Graphics(); g.lineStyle(2, 0xc4b8a8, 0.9); g.beginFill(0xf5ecd8, 0.95); g.drawRoundedRect(bx, by, bw, bh, 8); g.endFill();
    wrap.addChild(g);
    const t = makeText(title, { size: 15, color: '#3a2f22', weight: 'bold' }); t.x = bx + 14; t.y = by + (sub ? 8 : bh / 2 - 10); wrap.addChild(t);
    if (sub) { const s = makeText(sub, { size: 11, color: '#8a7a68' }); s.x = bx + 14; s.y = by + 30; wrap.addChild(s); }
    wrap.eventMode = 'static'; wrap.cursor = 'pointer'; wrap.hitArea = new PIXI.Rectangle(bx, by, bw, bh);
    wrap.on('pointerdown', (e) => { e.stopPropagation(); onTap(); });
    panelContentArea.addChild(wrap);
  };
  const back = () => { publishPhase = 'overview'; publishPendingStrategy = null; publishMsg = ''; publishConfirm = null; layoutScreenPanel(); };
  const fmtLeft = () => { const d = Math.floor(P.remainH / 24), rem = P.remainH - d * 24, hh = Math.floor(rem), mm = Math.floor((rem - hh) * 60); return d + '天' + ('' + hh).padStart(2, '0') + ':' + ('' + mm).padStart(2, '0'); };

  const bar = P.active
    ? ('发布中 · ' + (P.strategy === 'bench' ? '对标' : '跑分') + ' · ' + P.model + ' · 剩余 ' + fmtLeft() + (P.strategy === 'bench' ? ' · 标榜已锁定 · 信誉增长 −20%' : ''))
    : ('未发布 · 能力 ' + cap.toFixed(1) + (P.lastCap != null ? ('（比上次发布 ' + (cap - P.lastCap >= 0 ? '+' : '') + (cap - P.lastCap).toFixed(1) + '）') : ''));
  txt(bar, { size: 15, color: P.active ? '#7a4a22' : '#5a4632', weight: 'bold' }, x + 20, y + 14);
  if (publishMsg) txt(publishMsg, { size: 12, color: publishMsgOk ? '#2a7a3a' : '#c05a2a' }, x + 20, y + 40);

  const topY = y + 66;
  if (P.active) { txt(P.strategy === 'bench' ? '发布进行中，标榜已锁定（到期前不可改标榜 / 下架），到期后可再次发布。' : '发布进行中，到期后可再次发布。', { size: 13, color: '#8a7a68' }, x + 20, topY); return; }

  if (publishPhase === 'overview') {
    txt('当前能力', { size: 13, color: '#8a7a68' }, x + 20, topY);
    txt(cap.toFixed(1), { size: 40, color: '#5a4632', weight: 'bold' }, x + 20, topY + 20);
    const exp = listed ? similarityTo(R.ability, listed) : -1;
    txt('客户期待值', { size: 13, color: '#8a7a68' }, x + 220, topY);
    txt(listed ? (exp.toFixed(0) + '%') : '未标榜', { size: 40, color: exp >= 80 ? '#2a7a3a' : '#a05a2a', weight: 'bold' }, x + 220, topY + 20);
    btn(x + 20, topY + 96, 220, 56, '发 布', '选择策略发布当前模型', () => { publishPhase = 'strategy'; publishMsg = ''; layoutScreenPanel(); });
    return;
  }

  if (publishPhase === 'strategy') {
    txt('选择发布策略', { size: 14, color: '#5a4632', weight: 'bold' }, x + 20, topY);
    const sw = Math.min(380, w * 0.6), sh = 60, sx = x + 20, gy = topY + 26;
    btn(sx, gy, sw, sh, '对标', '选真实型号·相似度达标才发·5天锁标榜+少量信誉', () => { publishPendingStrategy = 'bench'; publishPhase = 'model'; publishModelScroll = 0; layoutScreenPanel(); });
    btn(sx, gy + (sh + 10), sw, sh, '跑分', '不达标可发·短期爆量·随机扣信誉', () => { publishPendingStrategy = 'run'; publishPhase = 'model'; publishModelScroll = 0; layoutScreenPanel(); });
    // §8.4:点一下不直接发布 —— 与公关同款「确认才执行」(星光的诉求本质是行为一致,不特判策略)
    btn(sx, gy + 2 * (sh + 10), sw, sh, '实话实说', '无额外用户·无代价(记录基线)', () => { publishConfirm = { strategy: 'honest', model: null }; layoutScreenPanel(); });
    btn(sx + sw + 16, gy, 96, 38, '返回', null, back);
    return;
  }

  // model:全部模型可滚选
  const stratName = publishPendingStrategy === 'bench' ? '对标' : '跑分';
  txt('选择' + stratName + '的模型（滚轮翻页 · 全部可选）', { size: 14, color: '#5a4632', weight: 'bold' }, x + 20, topY);
  const listX = x + 20, listW = Math.min(480, w * 0.74), rowH = 30, listTop = topY + 26;
  const all = boardOrder();
  const visible = Math.max(4, Math.floor((y + h - 16 - listTop) / rowH));
  publishModelScroll = Math.max(0, Math.min(Math.max(0, all.length - visible), publishModelScroll));
  for (let i = 0; i < visible && (publishModelScroll + i) < all.length; i++) {
    const m = all[publishModelScroll + i].m, yy = listTop + i * rowH;
    const sim = similarityTo(R.ability, m), ok = sim >= PUBLISH_CFG.SIM_GATE;
    const row = new PIXI.Graphics();
    row.lineStyle(2, 0xc4b8a8, 0.9); row.beginFill(0xf5ecd8, 0.9); row.drawRoundedRect(listX, yy, listW, rowH - 4, 6); row.endFill();
    row.eventMode = 'static'; row.cursor = 'pointer'; row.hitArea = new PIXI.Rectangle(listX, yy, listW, rowH - 4);
    // §8.4:选模型 = 打开确认弹窗(带相似度预览);doPublish 只在弹窗「确认」里执行
    row.on('pointerdown', (e) => { e.stopPropagation(); publishConfirm = { strategy: publishPendingStrategy, model: m.n }; layoutScreenPanel(); });
    panelContentArea.addChild(row);
    txt(m.n, { size: 13, color: '#3a2f22' }, listX + 10, yy + 5);
    const tag = publishPendingStrategy === 'bench' ? (ok ? '✓ 可对标' : ('相似度 ' + sim.toFixed(0))) : ('相似度 ' + sim.toFixed(0));
    const tagT = txt(tag, { size: 11, color: (publishPendingStrategy === 'bench' && !ok) ? '#a05a2a' : '#2a7a3a' }, listX + listW - 10, yy + 6);
    tagT.anchor.set(1, 0);
  }
  btn(listX + listW + 16, topY, 96, 38, '返回', null, back);
}

function drawRadar(cx, cy, r, myAttrs, theirAttrs, parent, labelSize) {
  // parent/labelSize 缺省 = 模型页用法;榜单编辑器传 attrDetailLayer + 小号字,把图画进卡片右侧
  parent = parent || panelContentArea;
  labelSize = labelSize || 12;
  const n = RADAR_KEYS.length;
  const angle = (i) => -Math.PI / 2 + i * 2 * Math.PI / n;   // 第一条轴朝正上
  const at = (i, v) => {
    const rr = r * Math.max(0, Math.min(100, v)) / 100;
    return [cx + Math.cos(angle(i)) * rr, cy + Math.sin(angle(i)) * rr];
  };

  // 网格与轴线是"边界",完全静止(用户定稿:多边形边界不要动);动的只有内部线圈的范围和数字。
  const grid = new PIXI.Graphics();
  // 5 层同心多边形网格
  for (let lv = 1; lv <= 5; lv++) {
    const rr = r * lv / 5;
    grid.lineStyle(1, 0xc4b8a8, lv === 5 ? 0.9 : 0.35);
    for (let i = 0; i <= n; i++) {
      const a = angle(i % n);
      const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
      if (i === 0) grid.moveTo(px, py); else grid.lineTo(px, py);
    }
  }
  // 轴线
  for (let i = 0; i < n; i++) {
    grid.lineStyle(1, 0xc4b8a8, 0.35);
    grid.moveTo(cx, cy);
    const [ex, ey] = at(i, 100);
    grid.lineTo(ex, ey);
  }
  parent.addChild(grid);

  // ---- 数据层(数据线圈出的范围 + 拟合最优点刻度)从中心长出来 ----
  // 网格不动,只有这一层做 0→1 的缩放;每帧重画这层 Graphics 太贵,缩放容器最省。
  const dataLayer = new PIXI.Container();
  dataLayer.pivot.set(cx, cy);
  dataLayer.position.set(cx, cy);
  parent.addChild(dataLayer);
  if (radarAnim) {
    dataLayer.scale.set(0.01);
    // tween 的第二个参数是**增量**:从 0.01 长到 1 要写 0.99,写 1 会停在 1.01。
    // 打 __radar 标记给 radarTicker 找进度用。
    dataLayer.scale.__radar = true;
    tween(dataLayer.scale, { x: 0.99, y: 0.99 }, 0.45);
    radarCounters.clear();          // 上一次动画的旧 Text 都被清出面板了,计数器一并作废
    radarCounting = true;
    radarAnim = false;
  }

  // 单个多边形(叠影对照 / 我的模型共用)
  const polyOf = (attrs, color, alpha, lineW) => {
    const g = new PIXI.Graphics();
    if (lineW) g.lineStyle(lineW, color, 1);
    g.beginFill(color, alpha);
    for (let i = 0; i < n; i++) {
      const [px, py] = at(i, attrs[RADAR_KEYS[i]]);
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.endFill();
    dataLayer.addChild(g);
  };
  if (theirAttrs) polyOf(theirAttrs, 0x8a8a8a, 0.16, 1);   // 对照:最接近的真实模型(灰)
  polyOf(myAttrs, 0xe86a3a, 0.22, 2);                       // 我的模型(暖橙)

  // 拟合轴上的"最优点"刻度:拟合不是越高越好,单看多边形大小会读反
  const fi = RADAR_KEYS.indexOf('fit');
  const [ox, oy] = at(fi, CAP_FIT_OPT);
  const perp = angle(fi) + Math.PI / 2;
  const mk = new PIXI.Graphics();
  mk.lineStyle(2, 0x3a8a4a, 1);
  mk.moveTo(ox + Math.cos(perp) * 7, oy + Math.sin(perp) * 7);
  mk.lineTo(ox - Math.cos(perp) * 7, oy - Math.sin(perp) * 7);
  dataLayer.addChild(mk);   // 跟着数据圈一起长出来;下面那行文字留在外面(缩放会把字拉变形)
  const optT = makeText('最优 ' + CAP_FIT_OPT, { size: 10, color: '#3a8a4a', weight: 'bold', anchor: 0.5 });
  optT.x = ox + Math.cos(perp) * 26;
  optT.y = oy + Math.sin(perp) * 26;
  parent.addChild(optT);

  // 轴标签 + 数值(9 条轴,全部属性都要能看到值)
  for (let i = 0; i < n; i++) {
    const k = RADAR_KEYS[i];
    const a = angle(i);
    const label = ATTR_NAMES[k] + ' ';
    const t = makeText(label + Math.round(myAttrs[k]),
      { size: labelSize, color: '#2a2118', weight: 'bold' });
    // 左右两侧的标签贴圆外缘对齐(anchor 0/1),避免 9 轴下标签互相压字或压到左侧评分块
    t.anchor.set(Math.cos(a) > 0.2 ? 0 : (Math.cos(a) < -0.2 ? 1 : 0.5), 0.5);
    t.x = cx + Math.cos(a) * (r + 12);
    t.y = cy + Math.sin(a) * (r + 20);
    parent.addChild(t);
    // 数字从 0 滚到当前值(动画期间每帧只改这 9 个 Text 的 text,不重绘面板)
    radarCounters.set(t, {
      from: 0, to: Math.round(myAttrs[k]), prefix: label,
      apply(v) { t.text = this.prefix + v; },
    });
  }
  // 动画进行中才逐帧推进数字;不动了就把计数器清掉,平常一帧的开销为 0
  if (tweens.some((tw) => tw.target === dataLayer.scale)) radarCounting = true;
  else if (!tweens.some((t) => t.target && t.target.__radar)) {
    // 没动画也没补间在跑(非动画重绘):计数器直接定格在目标值,别留下半截状态
    for (const c of radarCounters.values()) c.apply(c.to);
    radarCounters.clear();
  }
}

// 轴标签数字的滚动计数器(drawRadar 注册;radarTicker 每帧消费)
// key = Text 对象,value = { from, to, prefix, apply(v) }。动画结束统一清空。
const radarCounters = new Map();
let radarCounting = false;
function radarTicker() {
  if (!radarCounting) return;
  // 找到还在跑的雷达缩放补间,用它的缓动进度同步数字 —— 图形长多少,数字就滚多少
  const tw = tweens.find((t) => t.target && t.target.__radar);
  if (!tw) {
    radarCounting = false;
    for (const c of radarCounters.values()) c.apply(c.to);
    radarCounters.clear();
    return;
  }
  const p = Math.min(tw.elapsed / tw.duration, 1);
  const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;   // 与 updateTweens 同一条缓动
  for (const c of radarCounters.values()) c.apply(Math.round(c.from + (c.to - c.from) * e));
}

// ---------- 内容页:榜单(全部在售模型的数据) ----------
// 数据源就是 REAL_MODELS(由《中转站设计.md》§3.1 生成)。
// ⚠️ 型号、性能、价格全部是**虚构设定**(设计文档 §3.1 顶部有同样的声明),所以页脚必须带上免责提示。
// 显示顺序 = boardOrder()(有效 cap 降序):编辑器改数值 → 名次实时跟着变(用户要求,方便调榜)。
// 价格只显示一列(用户要求):入价/出价合并成一个「价$」= 混合价(取入:出 ≈ 1:3 的常用加权),
// 只是榜单速览用,后台定价仍读 §3.1 的 pi/po 两个字段。
const BOARD_COLS = [
  // [标题, 从左起算的 x 占比, 取值函数]
  ['#',    0.00, (m, i) => String(i + 1)],
  ['模型', 0.045, (m) => m.n],
  ['厂商', 0.29, (m) => m.v],
  ['档位', 0.42, (m) => m.t],
  ['截止', 0.49, (m) => effectiveCutoff(m)],   // 编辑器改「知识」后这里跟着变
  ['上下文', 0.57, (m) => (m.c >= 1000 ? (m.c / 1000).toFixed(2).replace(/\.?0+$/, '') + 'M' : m.c + 'k')],
  // 游戏内自洽的 tokens/s(速度属性 × 3),不是外部榜单的实测值
  ['tokens/s', 0.66, (m) => fmt2(m.ts)],   // AA 实测输出速度(与编辑器速度属性×3 一致);最多两位小数
  ['价$', 0.77, (m) => blendPrice(m)],
  ['cap',  0.89, (m) => String(Math.round(effectiveCap(m) * 10) / 10)],
];
// 单一参考价($/M tokens):出价为主、入价加权 —— 真实用量里输出 token 通常只有输入的 ~1/3,
// 但计费上输出贵 3~4 倍,两边占比差不多,取 (pi + po*3) / 4 四舍五入。
function blendPrice(m) {
  const v = (m.pi + m.po * 3) / 4;
  return v >= 10 ? String(Math.round(v)) : String(Math.round(v * 10) / 10);
}

function drawLeaderboardPage(x, y, w, h) {
  const padX = w * 0.04;
  const title = makeText('模型榜单', { size: Math.min(30, w * 0.055), color: '#2a2118', weight: 'bold' });
  title.x = x + padX; title.y = y + h * 0.04;
  panelContentArea.addChild(title);

  const sub = makeText('全部 ' + REAL_MODELS.length + ' 个在售模型 · 按综合能力(cap)排序 · 滚轮翻页'
    + (lbDebug ? ' · 调试模式:点行编辑/保存' : ' · 点行查看模型属性'),
    { size: 12, color: '#8a7a68' });
  sub.x = x + padX; sub.y = title.y + title.height + 5;
  panelContentArea.addChild(sub);

  // 右上角:导出全榜 CSV(带 BOM,Excel 打开中文不乱码)。数据 = REAL_MODELS 基准值,不含编辑器覆盖。
  const exp = new PIXI.Graphics();
  exp.lineStyle(1, 0xc4b8a8, 0.9);
  exp.beginFill(0xe8e0d4, 1);
  exp.drawRoundedRect(x + w - 160, y + 4, 150, 26, 8);
  exp.endFill();
  exp.eventMode = 'static';
  exp.cursor = 'pointer';
  exp.hitArea = new PIXI.Rectangle(x + w - 160, y + 4, 150, 26);
  exp.on('pointerdown', () => {
    // 导出"修改后"的数据:属性/截止/cap 取有效值(含编辑器覆盖),另加「手改项」列标明你动了哪些。
    // 名次按实时排序(tokens/s 列除外,它固定显示 AA 实测原值)。
    const modalNames = ['文', '文图', '文图视', '文图视PDF'];
    const head = '名次,模型,厂商,档位,知识截止,上下文(k),tokens/s,价$,cap,模态,工具,'
      + '推理,知识,长上下文,速度,多模态,指令遵循,工具调用,拟合,参数,手改项';
    const lines = boardOrder().map((e, i) => {
      const m = e.m;
      const a = modelToAttrs(m);                      // 已含覆盖 = 修改后的值
      const ov = MODEL_ATTR_OVERRIDE[m.n];
      const dirty = ov ? RADAR_KEYS.filter((k) => ov[k] !== undefined).join('+') : '';
      return [
        i + 1, '"' + m.n + '"', '"' + m.v + '"', '"' + m.t + '"', effectiveCutoff(m), m.c,
        Math.round(m.ts), blendPrice(m), Math.round(effectiveCap(m) * 10) / 10,
        '"' + (modalNames[m.m] || '文') + '"', m.tools ? '✓' : '✗',
        Math.round(a.reasoning), Math.round(a.knowledge), Math.round(a.longCtx), Math.round(a.speed),
        Math.round(a.multimodal), Math.round(a.instruct), Math.round(a.toolCall),
        Math.round(a.fit), Math.round(a.params),
        '"' + dirty + '"',
      ].join(',');
    });
    const csv = '\ufeff' + head + '\n' + lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dshgame-leaderboard.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  panelContentArea.addChild(exp);
  const expT = makeText('导出全榜 CSV', { size: 12, color: '#5a4632', weight: 'bold', anchor: 0.5 });
  expT.x = x + w - 85; expT.y = y + 17;
  panelContentArea.addChild(expT);

  // 搜索框(DOM input 叠在画布上;见 ensureLbDom / handleLbSearch / tryAdmodel)
  const lbDom = ensureLbDom();
  const sy = sub.y + sub.height + 6;
  const sw = Math.min(360, w * 0.4);
  lbDom.inp.style.left = (x + padX) + 'px';
  lbDom.inp.style.top = sy + 'px';
  lbDom.inp.style.width = (sw - 20) + 'px';
  lbDom.inp.style.display = 'block';
  lbSearchGeom = { x: x + padX, y: sy + 30, w: sw };

  // 表头
  const headY = sy + 36;
  const colW = w - padX * 2;
  const head = new PIXI.Graphics();
  head.beginFill(0xe8e0d4, 1);
  head.drawRoundedRect(x + padX, headY, colW, BOARD_ROW_H, 5);
  head.endFill();
  panelContentArea.addChild(head);
  for (const [label, fx] of BOARD_COLS) {
    const t = makeText(label, { size: 13, color: '#6a5a48', weight: 'bold' });
    t.x = x + padX + 8 + colW * fx;
    t.y = headY + (BOARD_ROW_H - t.height) / 2;
    panelContentArea.addChild(t);
  }

  // 显示顺序:有效 cap 降序(改数值实时重排)。原始下标跟着行走,点行编辑用它。
  const ordered = boardOrder();

  // 可视行数:表头以下到底部提示文字之上的空间
  const listTop = headY + BOARD_ROW_H + 4;
  const listBottom = y + h - 26;
  const maxRows = Math.max(1, Math.floor((listBottom - listTop) / BOARD_ROW_H));
  boardScroll = Math.max(0, Math.min(REAL_MODELS.length - maxRows, boardScroll));
  const end = Math.min(REAL_MODELS.length, boardScroll + maxRows);

  // 悬停描边(共享一块,哪行 hover 就挪到哪行;行循环里的事件负责画,这里只创建)
  const hoverRect = new PIXI.Graphics();
  hoverRect.visible = false;

  for (let i = boardScroll; i < end; i++) {
    const { m, i: srcIdx } = ordered[i];
    const ry = listTop + (i - boardScroll) * BOARD_ROW_H;
    // 斑马纹:奇数行浅色底,长列表横向读的时候不容易串行
    if ((i - boardScroll) % 2 === 1) {
      const band = new PIXI.Graphics();
      band.beginFill(0xe8e0d4, 0.35);
      band.drawRect(x + padX, ry, colW, BOARD_ROW_H);
      band.endFill();
      panelContentArea.addChild(band);
    }
    for (let c = 0; c < BOARD_COLS.length; c++) {
      const [label, fx, get] = BOARD_COLS[c];
      const isCap = label === 'cap';
      const t = makeText(get(m, i), {
        size: 13,
        color: isCap ? '#c05a2a' : '#3a2f22',
        weight: isCap ? 'bold' : 'normal',
      });
      t.x = x + padX + 8 + colW * fx;
      t.y = ry + (BOARD_ROW_H - t.height) / 2;
      panelContentArea.addChild(t);
    }
    // 搜索跳转蓝框:常驻显示,移动鼠标后消失(jumpToModel 设置,一次性 pointermove 清除)
    if (i === searchHitIdx) {
      const sh = new PIXI.Graphics();
      sh.lineStyle(2, 0x7ab8d4, 0.9);
      sh.drawRoundedRect(x + padX + 1, ry + 1, colW - 2, BOARD_ROW_H - 2, 4);
      panelContentArea.addChild(sh);
    }
    {
      // 整行点击 → 打开该模型的属性面板(玩家态只读查看;/admodel 调试态可改数值)。
      // 用透明 Graphics 当热区,比给每段文字都挂事件省事;盖在文字上层才能接到点击。
      const hit = new PIXI.Graphics();
      hit.beginFill(0xffffff, 0.001);   // 必须非 0:alpha=0 的 Graphics 仍可命中,但显式给个极小值更稳
      hit.drawRect(x + padX, ry, colW, BOARD_ROW_H);
      hit.endFill();
      hit.eventMode = 'static';
      hit.cursor = 'pointer';
      hit.hitArea = new PIXI.Rectangle(x + padX, ry, colW, BOARD_ROW_H);
      // 悬停高亮:淡蓝描边告诉用户当前选中的是哪一行。
      // 一块共享的 hoverRect 画在文字层之上、热区之下,谁 hover 谁负责把描边挪到自己位置。
      hit.on('pointerover', () => {
        hoverRect.clear();
        hoverRect.lineStyle(2, 0x7ab8d4, 0.9);       // 淡蓝描边
        hoverRect.drawRoundedRect(x + padX + 1, ry + 1, colW - 2, BOARD_ROW_H - 2, 4);
        hoverRect.visible = true;
      });
      hit.on('pointerout', () => { hoverRect.visible = false; });
      hit.on('pointerdown', () => {
        boardPickIdx = srcIdx;      // 存原始下标,编辑器/覆盖表都按 REAL_MODELS 下标寻址
        editingKey = null;
        layoutScreenPanel();
      });
      panelContentArea.addChild(hit);
    }
  }

  // 悬停描边层要盖住斑马纹和文字,又不能挡热区命中 —— 在行循环前声明、循环里 addChild 不到它,
  // 这里统一插到最上层(热区 alpha≈0 不遮视线,但 hoverRect 必须在文字上面才看得清)。
  panelContentArea.addChild(hoverRect);

  // 底部:左边滚动提示,右边虚构声明(和设计文档 §3.1 顶部那条是同一件事)
  const hint = boardScroll + maxRows >= REAL_MODELS.length
    ? '已到底 · 共 ' + REAL_MODELS.length + ' 个'
    : '↓ 滚轮继续 · ' + (boardScroll + maxRows) + ' / ' + REAL_MODELS.length;
  const ht = makeText(hint, { size: 11, color: '#b0a294' });
  ht.x = x + padX; ht.y = y + h - 20;
  panelContentArea.addChild(ht);

  const note = makeText('非真实榜单 · 型号与数值均为虚构', { size: 11, color: '#b0a294', anchor: 1 });
  note.x = x + padX + colW; note.y = y + h - 20;
  panelContentArea.addChild(note);
}

// ---- 榜单搜索框(DOM input 叠在画布上)与 /admodel 调试开关 ----
// 玩家:输入关键字 → 下拉列出命中模型 → 点击跳转该行并显示蓝框(移动鼠标消失)。
// 调试:输入 /admodel 回车 → 切换调试态(行可点开编辑器、显示已改标记)。入口不写在任何玩家可见文案里。
function ensureLbDom() {
  let inp = document.getElementById('lbSearch');
  if (!inp) {
    inp = document.createElement('input');
    inp.id = 'lbSearch';
    inp.placeholder = '搜索模型 / 厂商…';
    inp.style.cssText = 'position:fixed;display:none;z-index:20;padding:3px 10px;border-radius:8px;'
      + 'border:1px solid #c4b8a8;background:#fffaf2;color:#3a2f22;font-size:16px;outline:none;'
      + 'font-family:"PingFang SC","Microsoft YaHei","DSHGameCN",sans-serif;';
    document.body.appendChild(inp);
    inp.addEventListener('input', () => handleLbSearch(inp.value));
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (!tryAdmodel(inp.value)) {
          const hits = lbHits(inp.value);
          if (hits.length) jumpToModel(hits[0].i);
        }
      }
      if (e.key === 'Escape') { inp.value = ''; handleLbSearch(''); inp.blur(); }
    });
  }
  let drop = document.getElementById('lbSearchDrop');
  if (!drop) {
    drop = document.createElement('div');
    drop.id = 'lbSearchDrop';
    drop.style.cssText = 'position:fixed;display:none;z-index:20;background:#fffaf2;border:1px solid #c4b8a8;'
      + 'border-radius:8px;max-height:240px;overflow-y:auto;box-shadow:0 4px 14px rgba(0,0,0,0.25);'
      + 'font-family:"PingFang SC","Microsoft YaHei","DSHGameCN",sans-serif;';
    document.body.appendChild(drop);
  }
  return { inp, drop };
}

function lbHits(v) {
  v = v.trim().toLowerCase();
  if (!v) return [];
  const hits = [];
  REAL_MODELS.forEach((m, i) => {
    if (m.n.toLowerCase().includes(v) || m.v.toLowerCase().includes(v)) hits.push({ m, i });
  });
  return hits;
}

function handleLbSearch(v) {
  const dom = ensureLbDom();
  const hits = lbHits(v);
  if (!hits.length) { dom.drop.style.display = 'none'; return; }
  dom.drop.innerHTML = '';
  hits.slice(0, 10).forEach(({ m, i }) => {
    const d = document.createElement('div');
    d.textContent = (i + 1) + '. ' + m.n + ' · ' + m.v + ' · cap ' + m.cap;
    d.dataset.i = i;
    d.style.cssText = 'padding:6px 12px;cursor:pointer;font-size:14px;color:#3a2f22;';
    d.addEventListener('pointerenter', () => { d.style.background = '#f0e6d8'; });
    d.addEventListener('pointerleave', () => { d.style.background = ''; });
    d.addEventListener('click', () => jumpToModel(i));
    dom.drop.appendChild(d);
  });
  if (hits.length > 10) {
    const d = document.createElement('div');
    d.textContent = '…共 ' + hits.length + ' 条';
    d.style.cssText = 'padding:4px 12px;font-size:12px;color:#b0a294;';
    dom.drop.appendChild(d);
  }
  if (lbSearchGeom) {
    dom.drop.style.left = lbSearchGeom.x + 'px';
    dom.drop.style.top = lbSearchGeom.y + 'px';
    dom.drop.style.width = lbSearchGeom.w + 'px';
  }
  dom.drop.style.display = 'block';
}

function jumpToModel(i) {
  if (!Number.isFinite(i)) return;
  const dom = ensureLbDom();
  boardScroll = Math.max(0, Math.min(i - 2, REAL_MODELS.length - 1));
  searchHitIdx = i;
  layoutScreenPanel();
  dom.drop.style.display = 'none';
  dom.inp.value = '';
  dom.inp.blur();
  // 移动鼠标后蓝框消失:一次性 pointermove 监听
  const clear = () => { searchHitIdx = -1; layoutScreenPanel(); window.removeEventListener('pointermove', clear); };
  window.addEventListener('pointermove', clear, { once: true });
}

function tryAdmodel(v) {
// __DEBUG_STRIP_BEGIN__ 调试:/admodel 开关(正式构建替换为恒 false,输入走普通搜索)
  if (v.trim().toLowerCase() !== '/admodel') return false;
  lbDebug = !lbDebug;
  const dom = ensureLbDom();
  dom.inp.value = '';
  dom.drop.style.display = 'none';
  layoutScreenPanel();
  spawnFloatText(lbDebug ? '调试模式已开启' : '调试模式已关闭', app.screen.width / 2, 90);
  return true;
// __RELEASE__
  return false; // 正式构建:调试态不可达,输入 /admodel 当普通搜索词
// __DEBUG_STRIP_END__
}

// 列表可滚;点进详情看假互动数;右上角「发帖」占位(引导/中和,影响权重或当前负面)。
let communityScroll = 0;
let communityDetailKey = null; // 点开的活跃/归档条目 key
let communityPostOpen = false;
let communityLiveCount = null;

function newsFeedSorted() {
  const R = state.relay;
  if (!R.news) return [];
  return R.news.active.slice().sort((a, b) => b.bornH - a.bornH);
}

// 绝对游时 → 时钟 xx:xx(24 进制循环)
function gameHourClock(totalH) {
  const t = ((totalH % 24) + 24) % 24;
  const hh = Math.floor(t);
  const mm = Math.floor((t - hh) * 60);
  return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}

// 绝对游时 → 「第 N 天」(1-indexed;首日为第 1 天)
function gameDayLabel(totalH) {
  const d = Math.floor(Math.max(0, totalH) / 24) + 1;
  return '第' + d + '天';
}

// 当前游戏时刻:第 N 天 HH:MM(后台/顶栏共用)
function gameClockFull() {
  const totalH = (state.relay && state.relay.news && typeof state.relay.news.totalH === 'number')
    ? state.relay.news.totalH : 0;
  // 用 gameHour 显示「当前钟面」,天数用累计;两者同速推进
  const gh = state.relay ? state.relay.gameHour : 0;
  const hh = Math.floor(gh);
  const mm = Math.floor((gh - hh) * 60);
  const clock = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  return gameDayLabel(totalH) + ' ' + clock;
}

    panelContentArea.addChild(tagBg);
    const tag = makeText(NEWS_TYPE_NAME[item.type] || item.type, { size: 12, color: '#fff', weight: 'bold', anchor: 0.5 });
    tag.x = x + padX + 14 + 24; tag.y = ry + 24;
    panelContentArea.addChild(tag);

    const tt = makeText(item.title, { size: 17, color: '#2a2118', weight: 'bold' });

    bt.x = x + padX + 72; bt.y = ry + 38;

    if (item.fxText) {

  const R = state.relay;
  if (!R.news) R.news = newsDefaults();
  const ven = item.vendor || '全场';
  const boosts = newsBoosts(R);
  boosts.push({ vendor: ven, kind, untilH: R.news.totalH + 12 });
  R.news.boosts = boosts;

  // 中和:对当前负面有概率立刻缓解
  if (kind === 'neutral') {
    let eased = false;
    if (item.type === 'station' && item.fx && item.fx.kind === 'rep' && item.fx.v < 0 && Math.random() < 0.45) {
      R.reputation = Math.min(100, R.reputation - item.fx.v * 0.5); // 回一半
      eased = true;
    }
    if ((item.type === 'traffic' || item.type === 'price') && Math.random() < 0.35) {
      // 提前结束该条
      R.news.active = R.news.active.filter(a => a.key !== item.key);
      eased = true;
    }
    spawnFloatText(eased ? '中和成功!' : '中和已记账(下一篇更稳)',
      app.screen.width / 2, app.screen.height * 0.35);
  } else {
    spawnFloatText('引导已发出,同厂热度上升',
      app.screen.width / 2, app.screen.height * 0.35);
  }
  saveGame();
}

  const rateStr = (listed && R.price > 0)
    ? '+$' + formatRate(R.users * R.ability.speed * R.activeCoef
        * relayUsageMul(R.price, officialPriceOf(listed)) * R.price
        * relaySellPayMul(listed, R.price, officialPriceOf(listed))
        * (1 + RELAY_BIZ.TRUST_PRICE_K * (R.reputation || 0) / 100) / 1e6) + ' /秒'

  const barH = h * 0.13;

    ['用户量', String(R.users), 'users', '#4a3c2c'],

    ['收益速率', rateStr, 'rate', '#2a7a3a'],
  ];
  backendLive = {};   // 每帧重建;bottleneck / bottleneck2 在本函数内按本帧内容赋值(见瓶颈提示段)
  const gap = 6;
  const colW = (w - padX * 2 - gap * (cols.length - 1)) / cols.length;
  cols.forEach(([label, val, key, color], i) => {
    const cx = x + padX + i * (colW + gap);
    const card = new PIXI.Graphics();
    card.beginFill(0xe8e0d4, 0.7);
    card.drawRoundedRect(cx, barY, colW, barH, 6);
    card.endFill();
    panelContentArea.addChild(card);
    const lt = makeText(label, { size: 11, color: '#8a7a68' });
    lt.x = cx + 8; lt.y = barY + 6;
    panelContentArea.addChild(lt);
    const vt = makeText(val, { size: Math.min(18, colW * 0.14), color, weight: 'bold' });
    vt.x = cx + 8; vt.y = barY + barH * 0.42;
    panelContentArea.addChild(vt);
    backendLive[key] = vt;
  });

  // 相似度行:选中行优先,否则当前标榜;≥80 绿 / <80 红。口径 = 有效相似(属性×能力倍率)
  {
    let simM = null;
    if (backendSelIdx >= 0) simM = REAL_MODELS[backendSelIdx];
    else if (listed) simM = listed;
    let st;
    if (simM) {
      const raw = rawSimilarityTo(R.ability, simM);
      const mul = capMulTo(R.ability, simM);
      const sv = similarityTo(R.ability, simM);
      const tag = (backendSelIdx >= 0 && listed && simM.n !== listed.n) ? '(选中)'
        : (listed && simM.n === listed.n) ? '(标榜)' : '';
      // 标榜资格门槛(2026-10-04):选型阶段就标出来,别等点了按钮才被拦
      const gateOK = sv >= RELAY_BIZ.LIST_SIM_MIN;
      st = makeText('有效相似 ' + sv.toFixed(0) + '% ' + tag + '  ·  ' + simM.n
        + '  ·  基础' + raw.toFixed(0) + '% × 能力' + mul.toFixed(2) + '× = ' + sv.toFixed(0) + '%'
        + '  ·  标榜门槛 ' + RELAY_BIZ.LIST_SIM_MIN + '% ' + (gateOK ? '✓可标' : '✗不可标'),
        { size: 12, color: !gateOK ? '#c05a2a' : ((sv >= 80 || sv > 100) ? '#2a7a3a' : '#8a6a2a'), weight: 'bold' });
    } else {
      st = makeText('未标榜 · 点下方列表选一个模型', { size: 12, color: '#b0a294' });
    }
    st.x = x + padX; st.y = barY + barH + 4;
    panelContentArea.addChild(st);
    backendLive.sim = st;
    // 最接近模型建议:信誉卡 0 常因标错对象 —— 直接给出「该标谁」
    const cl = closestModel(R.ability);
    if (cl.model) {
      const clEff = similarityTo(R.ability, cl.model);
      const isCl = listed && cl.model.n === listed.n;
      const tip = isCl
        ? ('已标最接近模型 · ' + simBreakdown(R.ability, cl.model).text + '(≥80 才涨信誉)')
        : ('建议标榜:' + cl.model.n + ' · ' + simBreakdown(R.ability, cl.model).text
          + '  当前标 ' + (listed ? listed.n + ' ' + simBreakdown(R.ability, listed).text : '无'));
      const tipT = makeText(tip, {
        size: 11,
        color: isCl ? (clEff >= 80 ? '#2a7a3a' : '#8a6a2a') : '#5a6a8a',
      });
      tipT.x = x + padX; tipT.y = barY + barH + 20;
      panelContentArea.addChild(tipT);
    }
  }

  // ===== 标榜信息 / 定价 =====
  const infoY = y + h * 0.30;
  let bnLines = 0;                      // 瓶颈提示占几个槽位(0/1/2),由本帧的 relayBottleneckInfo 决定
  if (listed) {
    const official = officialPriceOf(listed);
    const baseP = blendPriceNum(listed);
    const mulNow = official / Math.max(baseP, 0.0001);
    const simL = similarityTo(R.ability, listed);
    // 价格两条线(2026-10-04):CHEAP_LINE/RENEW_LINE 原本只活在常量里,UI 完全不可见 ——
    // 玩家定 1.2× 官价只看到「在价格带内」,实际增长已停、续约已停。现在把门槛值和当前状态直接画出来。
    // 续约状态(2026-10-05 减层):超续约线不再是「已停」,而是概率衰减(relayRenewMul)。
    const growLine = official * RELAY_BIZ.CHEAP_LINE, renewLine = official * RELAY_BIZ.RENEW_LINE;
    const gw = relayGrowWeight(R.price, official);
    const rMul = relayRenewMul(R.price, official);

      : gw < 0 ? ' · ✗用户净流失(留不住人)'
      : ' · ✗增长已停(不进新用户)';
    const renewTxt = rMul >= 0.999 ? ' · 续约中'
      : ' · 续约衰减 ' + Math.round(rMul * 100) + '%';
    // 用量状态(2026-10-04):定价对单用户消耗的压制,与增长/续约线并排展示,保持三线全可见
    const um = relayUsageMul(R.price, official);
    const usageTxt = um >= 0.999 ? ' · 用量满速'
      : ' · 用量 ' + Math.round(um * 100) + '%(高价省着用)';
    // §19.11 数据区重排(2026-10-19 星光:图1 数据字太小、信息太密,右侧空间没用):
    // 左列 = 玩家决策要看的:标谁 / 有效相似(关键值 22px 大字) / 参考价与定价;

    const simBD = simBreakdown(R.ability, listed);

    // §19.11b(2026-10-20 星光截图:三行重叠)—— 22px 大字占高 ~31px,旧版把结论(PITCH+20)和公式(PITCH+44)

    addL('当前标榜 ' + listed.n, infoY, 15, '#2a2118', true);

    const simBig = addL(simL.toFixed(0) + '%', labY, 22, good ? '#2a7a3a' : '#c05a2a', true);
    simBig.x = x + padX + 62;   // 与标签同行,横向排(大字占高 31px,纵向再塞行必叠)
    const vdT = addL(good ? '偏涨 ✓ 信誉会涨' : '掺水 ✗ 会被发现', labY + 7, 13, good ? '#2a7a3a' : '#c05a2a', true);
    vdT.x = simBig.x + simBig.width + 10;
    addL('基础' + simBD.raw.toFixed(0) + '% × 能力' + simBD.mul.toFixed(2) + '×', labY + 32, 11, '#8a7a68', false);
    addL('官方参考价', labY + 54, 12, '#8a7a68', false);
    const fmt = (v) => (v >= 10 ? v.toFixed(0) : v.toFixed(1));
    const priceYRow = labY + 52;
    if (Math.abs(mulNow - 1) > 0.01) {
      const oldT = addL(fmt(baseP), priceYRow, 15, '#8a7a68', false);
      oldT.x = x + padX + 62;   // 与大数字左缘对齐
      const strike = new PIXI.Graphics();
      strike.lineStyle(1.5, 0xc05a2a, 0.9);
      strike.moveTo(oldT.x, priceYRow + oldT.height * 0.55);
      strike.lineTo(oldT.x + oldT.width, priceYRow + oldT.height * 0.55);
      panelContentArea.addChild(strike);
      const newT = addL('$' + fmt(official) + ' /M', priceYRow, 15, mulNow < 1 ? '#2a7a3a' : '#c05a2a', true);
      newT.x = oldT.x + oldT.width + 10;
    } else {
      const okT = addL('$' + fmt(baseP) + ' /M tokens', priceYRow, 15, '#2a2118', false);
      okT.x = x + padX + 62;
    }
    // §19.12(星光截图:「略有重叠,放开一点,字体大一点」):标签与状态**同行**(状态 x 链在标签宽后),
    // 行距 30、字号 12→13 —— 状态不再压下一个标签。右列 4 行到 infoY+90+17,均在警告行(infoY+124)之上。
    const gl1 = addR('增长线 ≤$' + fmt2(growLine), infoY, '#8a7a68', 13);
    const gs1 = addR(growTxt.replace(' · ', ''), infoY, gw >= 0.999 ? '#2a7a3a' : gw > 0 ? '#8a6a2a' : '#c05a2a', 13);
    gs1.x = rx + gl1.width + 10;
    const rl1 = addR('续约线 ≤$' + fmt2(renewLine), infoY + 30, '#8a7a68', 13);
    const rs1 = addR(renewTxt.replace(' · ', ''), infoY + 30, rMul >= 0.999 ? '#2a7a3a' : '#8a6a2a', 13);
    rs1.x = rx + rl1.width + 10;
    const ul1 = addR('用量 ' + (um >= 0.999 ? '满速 ✓' : Math.round(um * 100) + '%'), infoY + 60,
      um >= 0.999 ? '#2a7a3a' : '#8a6a2a', 13);
    addR('速度 ' + fmt2(R.ability.speed) + ' → 每用户 ' + fmt2(R.ability.speed) + ' tok/s', infoY + 90, '#8a7a68', 13);
    if (R.serviceDown) addL('⚠ 库存见底 · 服务中断中(每小时信誉 -0.1 · 流失 10% 用户)', labY + 76, 13, '#c05a2a', true);
    // 瓶颈提示(2026-10-05):「卡产能还是卡客流」+ 库存可支撑时长,实时行(0.25s 节流刷新)。
    // 占据警告行下方的槽位;relayBottleneckInfo 为 null(没在卖/没客)时不画、不占位。
    const bnInfo = relayBottleneckInfo();
    // 2026-10-13:拆两行(槽位算法见下方 priceY)。bnLines 本帧现算,不用上一帧的残留对象,
    // 否则「上一帧有瓶颈、这一帧没有」时 priceY 会多留一个空槽。
    bnLines = bnInfo ? (bnInfo.text2 ? 2 : 1) : 0;
    backendLive.bottleneck = null;
    backendLive.bottleneck2 = null;
    if (bnInfo) {
      const bt = makeText(bnInfo.text, { size: 12, color: bnInfo.color, weight: 'bold' });
      bt.x = x + padX;
      bt.y = infoY + (R.serviceDown ? 148 : 124);   // §19.11b:左列到 labY+76 = infoY+124(高亮行 19px 至 +143)
      panelContentArea.addChild(bt);
      backendLive.bottleneck = bt;
      if (bnInfo.text2) {
        const bt2 = makeText(bnInfo.text2, { size: 12, color: '#8a7a68' });
        bt2.x = x + padX;
        bt2.y = bt.y + 22;
        panelContentArea.addChild(bt2);
        backendLive.bottleneck2 = bt2;
      }
    }
  } else {
    // P1-9:未标榜不再等于「不能卖」—— 不选模型直接定价就是自研开卖(§5.4)
    const t = makeText('尚未标榜 · 直接定价 = 自研开卖(上限 $' + fmt2(RELAY_BIZ.SELF_PRICE_MAX) + '/M · 客流少 · 不结算信誉)',
      { size: 12, color: '#8a7a68' });
    t.x = x + padX; t.y = infoY;
    panelContentArea.addChild(t);
  }

  // 价格输入(DOM,叠画布)—— 布局末尾统一显隐
  // 瓶颈提示行占位与警告行互斥相加:5 行固定 + 警告(serviceDown) + 瓶颈(有内容时),各占 22
  const priceY = infoY
    + (listed ? 124 + (R.serviceDown ? 24 : 0) + bnLines * 22 : 22) + 6;   // §19.11b:左列到 infoY+124(见上)
  const priceLabel = makeText('定价($/M):', { size: 13, color: '#4a3c2c' });
  priceLabel.x = x + padX; priceLabel.y = priceY + 4;
  panelContentArea.addChild(priceLabel);

  // 价格区间提示:必须放在 DOM 输入框(width 88 @ left=padX+96)右侧,
  // 否则会被 input 盖住中段,只剩两头露出来(2026-09-12 用户截图坑)
  {
    let bandM = null;
    if (backendSelIdx >= 0) bandM = REAL_MODELS[backendSelIdx];
    else if (listed) bandM = listed;
    if (bandM) {
      const offB = officialPriceOf(bandM);
      const band = relayPriceBand(offB);
      const hint = isFinite(band.max)
        ? ('官价×' + RELAY_BIZ.PRICE_MIN + '~×' + RELAY_BIZ.PRICE_MAX + ' · $'
          + fmt2(band.min) + ' ~ $' + fmt2(band.max)
          + ' · 增长≤$' + fmt2(offB * RELAY_BIZ.CHEAP_LINE) + ' 续约衰减> $' + fmt2(offB * RELAY_BIZ.RENEW_LINE))
        : '';
      const ht = makeText(hint, { size: 11, color: '#8a7a68' });
      // input: left = x+padX+96, width 88 → 文字从 +196 起,避免叠在框下
      ht.x = x + padX + 96 + 88 + 12;
      ht.y = priceY + 6;
      panelContentArea.addChild(ht);
    } else {
      // P1-9 自研:没有官价参照,只有一条硬上限
      const ht = makeText('自研上限 $' + fmt2(RELAY_BIZ.SELF_PRICE_MAX) + '/M', { size: 11, color: '#8a7a68' });
      ht.x = x + padX + 96 + 88 + 12;
      ht.y = priceY + 6;
      panelContentArea.addChild(ht);
    }
  }

  // 标榜上架 / 下架 按钮
  const btnY = priceY;
  const btnW = 100, btnH = 30;
  // P1-10:对标锁定期 → 两个按钮变灰并拦下操作(§19.2 的「5 天锁定」原本没实现,这里补上)
  const lockedNow = publishLocked();
  // 标榜资格门槛(2026-10-04):有效相似 < LIST_SIM_MIN 不许标榜该模型(价格带上限跟着标榜官价走,
  // 全库官价差 400 倍 → 不设门槛 = 标 $40 模型白拿 $60/M 卖价,trustMul 5 折根本拦不住)
  const gateM = (backendSelIdx >= 0) ? REAL_MODELS[backendSelIdx] : listed;
  const gateSim = gateM ? similarityTo(R.ability, gateM) : Infinity;
  const gated = !lockedNow && !!gateM && gateSim < RELAY_BIZ.LIST_SIM_MIN;
  const listBtn = new PIXI.Graphics();
  listBtn.lineStyle(1, 0xc4b8a8, 0.9);
  listBtn.beginFill(lockedNow ? 0xbfb4a4 : (gated ? 0xc9c0b2 : 0xd4a574), 1);
  listBtn.drawRoundedRect(x + w - padX - btnW, btnY, btnW, btnH, 6);
  listBtn.endFill();
  listBtn.eventMode = 'static';
  listBtn.cursor = (lockedNow || gated) ? 'not-allowed' : 'pointer';
  listBtn.hitArea = new PIXI.Rectangle(x + w - padX - btnW, btnY, btnW, btnH);
  listBtn.on('pointerdown', () => {
    if (backendEditingPrice) return;
    if (publishLocked()) { flashBackendHint('对标锁定期内不可改标榜 · 剩余 ' + publishLockRemainText()); return; }
    if (gated) { flashBackendHint('有效相似 ' + gateSim.toFixed(0) + '% < 门槛 ' + RELAY_BIZ.LIST_SIM_MIN + '% · 能力差距过大,用户不会买账 · 不可标榜 ' + gateM.n); return; }
    const p = parseFloat(backendPriceDom().inp.value);
    if (!isFinite(p) || p <= 0) { flashBackendHint('请输入大于 0 的价格'); return; }
    // 硬价格带:标榜/选中模型 = 官价 × 0.5~1.5;自研(P1-9,未选模型且未标榜)= 上限 $0.5/M
    const bandM = (backendSelIdx >= 0) ? REAL_MODELS[backendSelIdx] : listed;
    let price = Math.round(p * 100) / 100;
    if (bandM) {
      const off = officialPriceOf(bandM);
      const band = relayPriceBand(off);
      if (price < band.min || price > band.max) {
        price = clampRelayPrice(price, off);
        flashBackendHint('价格已调到官价×' + RELAY_BIZ.PRICE_MIN + '~×' + RELAY_BIZ.PRICE_MAX + ' 区间:$' + fmt2(price));
      }
    } else if (price > RELAY_BIZ.SELF_PRICE_MAX) {
      price = RELAY_BIZ.SELF_PRICE_MAX;
      flashBackendHint('自研(不标榜)价格上限 $' + fmt2(RELAY_BIZ.SELF_PRICE_MAX) + '/M · 已调到上限');
    }
    R.price = price;
    if (backendSelIdx >= 0) {
      R.listedModel = REAL_MODELS[backendSelIdx].n;
    }
    saveGame();
    layoutScreenPanel();
  });
  panelContentArea.addChild(listBtn);
  const listBtnT = makeText(lockedNow ? '对标锁定中' : (gated ? '相似不足' : (listed ? '更新标榜' : (backendSelIdx >= 0 ? '标榜上架' : '自研开卖'))), { size: 13, color: (lockedNow || gated) ? '#8a7a68' : '#3a2f22', weight: 'bold', anchor: 0.5 });
  listBtnT.x = x + w - padX - btnW / 2; listBtnT.y = btnY + btnH / 2;
  panelContentArea.addChild(listBtnT);

  if (listed) {
    const delW = 70;
    const delX = x + w - padX - btnW - 8 - delW;
    const del = new PIXI.Graphics();
    del.lineStyle(1, 0xc4b8a8, 0.9);
    del.beginFill(lockedNow ? 0xd8d0c6 : 0xe8e0d4, 1);
    del.drawRoundedRect(delX, btnY, delW, btnH, 6);
    del.endFill();
    del.eventMode = 'static';
    del.cursor = lockedNow ? 'not-allowed' : 'pointer';
    del.hitArea = new PIXI.Rectangle(delX, btnY, delW, btnH);
    del.on('pointerdown', () => {
      if (backendEditingPrice) return;
      if (publishLocked()) { flashBackendHint('对标锁定期内不可下架 · 剩余 ' + publishLockRemainText()); return; }
      R.listedModel = null;
      R.price = 0;
      R.serviceDown = false;
      saveGame();
      layoutScreenPanel();
    });
    panelContentArea.addChild(del);
    const delT = makeText('下架', { size: 13, color: '#4a3c2c', anchor: 0.5 });
    delT.x = delX + delW / 2; delT.y = btnY + btnH / 2;
    panelContentArea.addChild(delT);
  }

  // ===== 模型选型列表(点击选中,配合上方按钮标榜) =====
  const listTitle = makeText('可标榜模型(点击选中 · 按 cap 降序)', { size: 12, color: '#8a7a68' });
  listTitle.x = x + padX; listTitle.y = btnY + btnH + 14;
  panelContentArea.addChild(listTitle);

  const listY = listTitle.y + 20;
  const listH = y + h - listY - 16;
  const rowH = 26;
  const maxRows = Math.max(3, Math.floor(listH / rowH));
  const order = boardOrder();

  backendPickScroll = Math.max(0, Math.min(order.length - 1, backendPickScroll));
  const hover = new PIXI.Graphics();

  for (let r = 0; r < maxRows; r++) {
    const oi = backendPickScroll + r;
    if (oi >= order.length) break;
    const { m, i: srcIdx } = order[oi];
    const ry = listY + r * rowH;
    if (r % 2 === 0) {
      const zebra = new PIXI.Graphics();
      zebra.beginFill(0xe8e0d4, 0.35);
      zebra.drawRect(x + padX, ry, w - padX * 2, rowH);
      zebra.endFill();
      panelContentArea.addChild(zebra);
    }
    const isSel = srcIdx === backendSelIdx;
    const isCur = listed && m.n === listed.n;
    const nameCol = isCur ? '#2a7a3a' : (isSel ? '#c05a2a' : '#2a2118');
    // 每行右侧:有效相似(选中或当前标榜时高亮颜色)
    const rowRaw = rawSimilarityTo(R.ability, m);
    const rowMul = capMulTo(R.ability, m);
    const rowSim = similarityTo(R.ability, m);
    const showSim = isSel || isCur;
    const simCol = rowSim >= 80 || rowSim > 100 ? '#2a7a3a' : '#c05a2a';
    const parts = [
      [m.n, 0.00, nameCol],
      [m.v, 0.30, '#8a7a68'],
      [m.t, 0.44, '#8a7a68'],
      ['cap ' + (Math.round(effectiveCap(m) * 10) / 10), 0.52, '#4a3c2c'],
      ['官 $' + (officialPriceOf(m) >= 10 ? officialPriceOf(m).toFixed(0) : officialPriceOf(m).toFixed(1)), 0.64, '#4a3c2c'],
    ];
    if (showSim) parts.push([rowRaw.toFixed(0) + '%×' + rowMul.toFixed(2) + '=' + rowSim.toFixed(0) + '%', 0.74, simCol]);
    if (isCur) parts.push(['● 标榜中', 0.90, '#2a7a3a']);
    for (const [s, fx, c] of parts) {
      const t = makeText(s, { size: 12, color: c, weight: (isSel || isCur || showSim) ? 'bold' : 'normal' });
      t.x = x + padX + 8 + fx * (w - padX * 2 - 16);
      t.y = ry + 5;
      panelContentArea.addChild(t);
    }
    const hit = new PIXI.Graphics();
    hit.beginFill(0xffffff, 0.001);
    hit.drawRect(x + padX, ry, w - padX * 2, rowH);
    hit.endFill();
    hit.eventMode = 'static';
    hit.cursor = 'pointer';
    hit.hitArea = new PIXI.Rectangle(x + padX, ry, w - padX * 2, rowH);
    hit.on('pointerover', () => {
      hover.clear();
      hover.lineStyle(2, 0x7ab8d4, 0.9);
      hover.drawRoundedRect(x + padX + 1, ry + 1, w - padX * 2 - 2, rowH - 2, 4);
      hover.visible = true;
    });
    hit.on('pointerout', () => { hover.visible = false; });
    hit.on('pointerdown', () => {
      backendSelIdx = srcIdx;
      const pd = backendPriceDom();
      if (!isCur) {
        const op = officialPriceOf(m);
        pd.inp.value = String(op >= 10 ? Math.round(op) : Math.round(op * 10) / 10);
      }
      layoutScreenPanel();
    });
    panelContentArea.addChild(hit);
  }
  panelContentArea.addChild(hover);

  const hint = backendPickScroll + maxRows >= order.length
    ? '已到底 · 共 ' + order.length + ' 个'
    : '↓ 滚轮继续 · ' + (backendPickScroll + maxRows) + ' / ' + order.length;
  const ht = makeText(hint, { size: 11, color: '#b0a294' });
  ht.x = x + padX; ht.y = y + h - 12;
  panelContentArea.addChild(ht);

  // ===== §8.1 P2-2 公关三选一(2026-10-17):事件中/预警时出现在后台页 =====
  drawPrPanel(x, y, w, h, priceY);

  // 价格输入框定位到 priceY
  const pd = backendPriceDom();
  pd.inp.style.top = (priceY + 2) + 'px';
  pd.inp.style.left = (x + padX + 96) + 'px';
  if (!backendEditingPrice) {
    pd.inp.value = String(R.price > 0 ? R.price
      : (backendSelIdx >= 0 ? (() => {
          const op = officialPriceOf(REAL_MODELS[backendSelIdx]);
          return op >= 10 ? Math.round(op) : Math.round(op * 10) / 10;
        })() : ''));
  }
}

  const bw = 108, bh = 30;
  const bx = right - bw - 16, by = top + 14;
  const btn = new PIXI.Graphics();
  btn.lineStyle(1, 0xc4b8a8, 0.9);
  btn.beginFill(backendDetailOpen ? 0xd4a574 : 0xe8e0d4, 1);

  drawPaperIcon(btn, bx + 13, by + 8, 14);

// 后台数据详情弹层:信誉 / 用户量 / 相似度 / 时长 / 中断 的涨跌说明
function drawBackendDetail(px, py, pw, ph) {
  const w = app.screen.width, h = app.screen.height;

  const shade = new PIXI.Graphics();
  shade.beginFill(0x1a1208, 0.5);
  shade.drawRect(0, 0, w, h);
  shade.endFill();
  shade.eventMode = 'static';
  shade.hitArea = new PIXI.Rectangle(0, 0, w, h);
  shade.on('pointerdown', () => { backendDetailOpen = false; layoutScreenPanel(); });
  attrDetailLayer.addChild(shade);

  const rows = BACKEND_DETAIL_ROWS;
  const headH = 58, footH = 24;
  const pg = popupGeom(px, py, pw, ph, rows.length, 58, headH, footH, 0.9, 900);   // §19.12:放大
  const cw = pg.cw, rowH = pg.rowH, chh = pg.chh, cx = pg.cx, cy = pg.cy;
  const fsK = (pg.narrow ? 1.15 : 1) * Math.max(0.95, Math.min(1.1, rowH / 58));   // §19.12:小屏字号增益

  const card = new PIXI.Graphics();
  card.lineStyle(1, 0xc4b8a8, 0.9);
  card.beginFill(0xf5f0e8, 1);
  card.drawRoundedRect(cx, cy, cw, chh, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRoundedRect(cx, cy, cw, headH, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRect(cx, cy + headH - 12, cw, 12);
  card.endFill();
  card.eventMode = 'static';
  card.hitArea = new PIXI.Rectangle(cx, cy, cw, chh);
  attrDetailLayer.addChild(card);

  const title = makeText('经营数据详情', { size: 17, color: '#2a2118', weight: 'bold' });
  title.x = cx + 20; title.y = cy + 17;
  attrDetailLayer.addChild(title);

  const tip = makeText('点卡片外任意处关闭', { size: 11, color: '#8a7a68' });
  tip.x = cx + cw - tip.width - 20; tip.y = cy + 21;
  attrDetailLayer.addChild(tip);

  rows.forEach(([name, what, how], i) => {
    const ry = cy + headH + i * rowH;
    if (i > 0) {
      const line = new PIXI.Graphics();
      line.lineStyle(1, 0xc4b8a8, 0.28);
      line.moveTo(cx + 20, ry); line.lineTo(cx + cw - 20, ry);
      attrDetailLayer.addChild(line);
    }
    const nm = makeText(name, { size: Math.round(14 * fsK), color: '#2a2118', weight: 'bold' });
    nm.x = cx + 20; nm.y = ry + 10 * fsK;
    attrDetailLayer.addChild(nm);

    const wt = makeText(what, { size: Math.round(12 * fsK), color: '#4a3c2c' });
    wt.style.wordWrap = true;
    wt.style.breakWords = true;
    wt.style.wordWrapWidth = cw - 148 - 20;
    wt.x = cx + 100; wt.y = ry + 8 * fsK;
    attrDetailLayer.addChild(wt);

    const ht2 = makeText(how, { size: Math.round(11 * fsK), color: '#8a7a68' });
    ht2.style.wordWrap = true;
    ht2.style.breakWords = true;
    ht2.style.wordWrapWidth = cw - 148 - 20;
    ht2.x = cx + 100; ht2.y = ry + Math.min(rowH - 22, 32 * fsK);
    attrDetailLayer.addChild(ht2);
  });
}

// 价格 DOM input(和榜单搜索同一套路:叠画布、按面板开关显隐)
function backendPriceDom() {
  let inp = document.getElementById('backendPrice');
  if (!inp) {
    inp = document.createElement('input');
    inp.id = 'backendPrice';
    inp.placeholder = '0';
    inp.style.cssText = 'position:fixed;display:none;z-index:20;width:88px;padding:3px 8px;border-radius:8px;'
      + 'border:1px solid #c4b8a8;background:#fffaf2;color:#3a2f22;font-size:14px;outline:none;'
      + 'font-family:"PingFang SC","Microsoft YaHei","DSHGameCN",sans-serif;';
    document.body.appendChild(inp);
    inp.addEventListener('focus', () => { backendEditingPrice = true; });
    inp.addEventListener('blur', () => { backendEditingPrice = false; });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { inp.blur(); }
      e.stopPropagation(); // 别把键传给全局(设置面板/编辑器)
    });
  }
  return { inp };
}

function flashBackendHint(msg) {
  // 轻提示:改相似度行的文案 1.5s
  if (!backendLive || !backendLive.sim) return;
  backendLive.sim.text = msg;
  backendLive.sim.style.fill = '#c05a2a';
  setTimeout(() => {
    if (backendLive && backendLive.sim) layoutScreenPanel();
  }, 1500);
}

// 行走人物:工厂创建多实例(中转站 / 调教各一套状态与精灵,共用同一套代码)
// 中转站人物可在椅子上办公;调教人物只走动。禁止用 reparent 搬同一个 container —— 会打乱椅子层级。
const WALK_FRAME_W = 158;
const WALK_FRAME_H = 220;
const WALK_FRAMES = 6;

function makeWalkFrames(assetKey) {
  const baseTex = PIXI.Texture.from(ASSETS[assetKey]);
  const frames = [];
  for (let i = 0; i < WALK_FRAMES; i++) {
    frames.push(new PIXI.Texture(baseTex.baseTexture,
      new PIXI.Rectangle(i * WALK_FRAME_W, 0, WALK_FRAME_W, WALK_FRAME_H)));
  }
  return frames;
}
const walkFramesLeft = makeWalkFrames('walk_left');
const walkFramesRight = makeWalkFrames('walk_right');
const walkIdleTex = PIXI.Texture.from(ASSETS.walk_idle);
const walkerLiftTex = PIXI.Texture.from(ASSETS.walker_lift);
const walkerSitTex = PIXI.Texture.from(ASSETS.walker_sit);
// 调教 Q 版 idle:启动即 Texture.from,避免首次进场景才开始解码导致 scale 算错
const tuneIdleTex = PIXI.Texture.from(ASSETS.tune_idle);
// 受击贴图(鞭打命中时替换 idle;画布同为 210x280,与 tune_idle 人物等大)
const tuneHitTex = PIXI.Texture.from(ASSETS.tune_hit);
let tuneHitTimer = 0;                 // >0 时人物处于受击表现
const TUNE_HIT_DURATION = 1.2;        // 受击持续(现实秒),到时恢复 idle 并让 AI 继续

// 一套完整人物 rig:容器 + 四张贴图 + AI/拖拽/落体状态
// idleAssetKey: 可选覆盖 idle; sitAssetKey: 可选覆盖坐姿(调教用同一张 Q 版,避免出现背影)
function createWalkerRig(idleAssetKey, sitAssetKey) {
  const container = new PIXI.Container();
  const walk = new PIXI.AnimatedSprite(walkFramesLeft);
  walk.anchor.set(0.5, 1);
  walk.animationSpeed = 0.25;
  walk.visible = false;
  const idleTex = idleAssetKey ? PIXI.Texture.from(ASSETS[idleAssetKey]) : walkIdleTex;
  const idle = new PIXI.Sprite(idleTex);
  idle.anchor.set(0.5, 1);
  idle.visible = true;
  const lift = new PIXI.Sprite(walkerLiftTex);
  lift.anchor.set(0.5, 1);
  lift.visible = false;
  const sitTex = sitAssetKey ? PIXI.Texture.from(ASSETS[sitAssetKey]) : walkerSitTex;
  const sit = new PIXI.Sprite(sitTex);
  sit.anchor.set(0.5, 1);
  sit.visible = false;
  container.addChild(walk, idle, lift, sit);
  return {
    container, walk, idle, lift, sit,
    ai: {
      x: 0, y: 0, dx: 0, dy: 0, speed: 1.2,
      state: 'idle', timer: 0, facing: 'left',
      bounds: { minX: 0, maxX: 0, minY: 0, maxY: 0 },
    },
    drag: { isDragging: false, offsetX: 0, offsetY: 0 },
    physics: { vy: 0, gravity: 0.25, isFalling: false, targetY: 0, sitOnChair: false },
  };
}

function showWalkerRig(rig, which) {
  rig.walk.visible = which === 'walk';
  rig.idle.visible = which === 'idle';
  rig.lift.visible = which === 'lift';
  rig.sit.visible = which === 'sit';
}

function safeSpriteScale(rigSprite, targetFrameH, fallbackScale) {
  // 纹理未解码时 height 可能是 0/1,直接除会得到 Infinity/NaN → 贴图整张画不出来
  const th = rigSprite.texture && rigSprite.texture.height;
  if (th > 1) rigSprite.scale.set(targetFrameH / th);
  else rigSprite.scale.set(fallbackScale);
}

function applyWalkerMetrics(rig, originX, originY, bgW, bgH, floorStart, groundEnd) {
  const w = app.screen.width;
  const h = app.screen.height;
  const walkerScale = (h * 0.32) / WALK_FRAME_H;
  rig.walk.scale.set(walkerScale);
  safeSpriteScale(rig.idle, WALK_FRAME_H * walkerScale * 1.12, walkerScale * 1.12);
  safeSpriteScale(rig.lift, WALK_FRAME_H * walkerScale, walkerScale);
  safeSpriteScale(rig.sit, WALK_FRAME_H * walkerScale * 1.15, walkerScale * 1.15);
  const ww = WALK_FRAME_W * walkerScale;
  const wh = WALK_FRAME_H * walkerScale;
  // floorStart:活动区上沿(越小越靠上);groundEnd:站立线(可选,默认贴背景底)
  // ⚠️ 背景是 cover 缩放,可能比屏幕大(超宽/非16:9 会被裁切)。
  // 若只按背景矩形算边界,人物会走进裁切区 = 走出可视范围后“消失”。
  // 边界必须再与屏幕求交;锚点是底部中心,脚踩在 [0,h]、头顶至少露出。
  let minX = originX + ww * 0.6;
  let maxX = originX + bgW - ww * 0.6;
  let minY = originY + bgH * floorStart;
  let maxY = (groundEnd != null) ? originY + bgH * groundEnd : (originY + bgH - wh * 0.12);
  minX = Math.max(minX, ww * 0.5);
  maxX = Math.min(maxX, w - ww * 0.5);
  minY = Math.max(minY, wh * 0.2);
  maxY = Math.min(maxY, h - 2);
  if (minX > maxX) { minX = maxX = w * 0.5; }
  if (minY > maxY) { minY = maxY = h * 0.85; }
  rig.ai.bounds = { minX, maxX, minY, maxY };
  if (rig.ai.x !== 0 || rig.ai.y !== 0) {
    rig.ai.x = Math.max(rig.ai.bounds.minX, Math.min(rig.ai.bounds.maxX, rig.ai.x));
    rig.ai.y = Math.max(rig.ai.bounds.minY, Math.min(rig.ai.bounds.maxY, rig.ai.y));
    rig.container.x = rig.ai.x;
    rig.container.y = rig.ai.y;
  }
}

// 椅子可坐区域(仅中转站;layoutRelayScene 计算)
const chairSeat = { sitY: 0, minX: 0, maxX: 0 };
// 调教课桌可坐区域(layoutTuneScene 计算)
const deskSeat = { sitY: 0, minX: 0, maxX: 0 };

// 椅子(高清素材)—— 先建椅子,人物插到椅子下层
const chairSprite = PIXI.Sprite.from(ASSETS.chair);
chairSprite.anchor.set(0.5, 1);
relayScene.addChild(chairSprite);

const chairOutline = PIXI.Sprite.from(ASSETS.chair_outline);
chairOutline.anchor.set(0.5, 1);
chairOutline.visible = false;
relayScene.addChild(chairOutline);

// 中转站人物:插在椅子之前 → 椅子盖在人上(坐姿时背影露出椅背上沿)
const relayWalker = createWalkerRig();
relayScene.addChildAt(relayWalker.container, relayScene.getChildIndex(chairSprite));

// 屏幕点击区保持最上
relayScene.addChild(screenGlowHit);

// 调教人物:独立实例,只挂进 tuneScene(场景创建在后面,open 时再 addChild)
let tuneWalker = null; // openTuneScene 首次创建

function bindWalkerDrag(rig, mode) {
  // mode: 'relay' 可落座换椅子描边; 'tune' 仅落地
  rig.container.eventMode = 'static';
  rig.container.cursor = 'pointer';
  rig.container.on('pointerdown', (e) => {
    if (mode === 'relay' && !relaySceneOpen) return;
    if (mode === 'tune' && !tuneSceneOpen) return;
    // 道具选中时不拖人物(点击交给挥鞭)
    if (mode === 'tune' && tuneSelectedItem) return;
    rig.drag.isDragging = true;
    const pos = e.global;
    rig.drag.offsetX = pos.x - rig.container.x;
    rig.drag.offsetY = pos.y - rig.container.y;
    rig.ai.state = 'idle';
    rig.ai.timer = 0;
    rig.physics.isFalling = false;
    rig.physics.sitOnChair = false;
    if (rig.walk.playing) { rig.walk.stop(); rig.walk.gotoAndStop(0); }
    showWalkerRig(rig, 'lift');
    if (mode === 'relay') {
      screenGlow.visible = false;
      screenGlowHit.visible = false;
      chairSprite.visible = false;
      chairOutline.visible = true;
    }
    rig.container.scale.set(1);
  });
  rig.container.on('pointermove', (e) => {
    if (!rig.drag.isDragging) return;
    const pos = e.global;
    rig.container.x = pos.x - rig.drag.offsetX;
    rig.container.y = pos.y - rig.drag.offsetY;
    rig.ai.x = rig.container.x;
    rig.ai.y = rig.container.y;
  });
  const endDrag = () => {
    if (!rig.drag.isDragging) return;
    rig.drag.isDragging = false;
    if (mode === 'relay') {
      chairSprite.visible = true;
      chairOutline.visible = false;
    }
    const atChair = mode === 'relay' &&
      (rig.ai.x >= chairSeat.minX && rig.ai.x <= chairSeat.maxX && rig.ai.y < chairSeat.sitY);
    // 调教:可坐课桌。桌宽内即可,高度放宽(站地上丢进桌区也能坐)
    const atDesk = mode === 'tune' && deskSeat.maxX > deskSeat.minX &&
      (rig.ai.x >= deskSeat.minX && rig.ai.x <= deskSeat.maxX);
    rig.physics.vy = 0;
    rig.physics.isFalling = true;
    if (atChair) {
      rig.physics.targetY = chairSeat.sitY;
      rig.physics.sitOnChair = true;
    } else if (atDesk) {
      // 调教坐桌:直接落座,不起落体(落体 + lift 会让人“消失”一瞬或卡住)
      rig.physics.isFalling = false;
      rig.physics.vy = 0;
      rig.physics.sitOnChair = true;
      rig.ai.state = 'sitting';
      if (tuneDeskSprite) rig.ai.x = tuneDeskSprite.x;
      rig.ai.y = Math.min(deskSeat.sitY || (app.screen.height * 0.9), app.screen.height - 2);
      rig.container.x = rig.ai.x;
      rig.container.y = rig.ai.y;
      rig.container.visible = true;
      rig.container.alpha = 1;
      showWalkerRig(rig, 'idle');
      // 人物插到课桌正下方(桌 index 前一格);人在桌后/不相邻时修正
      if (tuneDeskSprite && tuneScene && rig.container.parent === tuneScene) {
        const di = tuneScene.getChildIndex(tuneDeskSprite);
        const wi = tuneScene.getChildIndex(rig.container);
        if (wi > di) tuneScene.setChildIndex(rig.container, di);
        else if (wi < di - 1) tuneScene.setChildIndex(rig.container, di - 1);
      }
      return;
    } else {
      rig.physics.targetY = rig.ai.bounds.maxY || app.screen.height * 0.85;
      rig.physics.sitOnChair = false;
      rig.physics.isFalling = true;
      rig.physics.vy = 0;
    }
  };
  rig.container.on('pointerup', endDrag);
  rig.container.on('pointerupoutside', endDrag);
}

function pickWalkDir(ai) {
  if (Math.random() < 0.5) {
    ai.dx = Math.random() < 0.5 ? -1 : 1;
    ai.dy = 0;
  } else {
    const angle = Math.random() * Math.PI * 2;
    ai.dx = Math.cos(angle);
    ai.dy = Math.sin(angle) * 0.5;
  }
}

// 按水平速度同步朝向贴图。⚠️ 任何 pickWalkDir / 落地 / 开场进 walking 之后都要调,
// 否则会保持默认朝左贴图却向右移动(2026-09-12 调教首次进入踩坑)。
function syncWalkFacing(ai, rig) {
  if (Math.abs(ai.dx) <= 0.1) return;
  const nf = ai.dx > 0 ? 'right' : 'left';
  if (nf !== ai.facing) {
    ai.facing = nf;
    rig.walk.textures = nf === 'left' ? walkFramesLeft : walkFramesRight;
  }
  if (ai.state === 'walking' && !rig.walk.playing) rig.walk.play();
}

// 共用 AI/落体推进。opts.mode = 'relay' | 'tune'
function updateWalkerRig(rig, mode) {
  const ai = rig.ai;
  const ph = rig.physics;
  const c = rig.container;

  // 鞭打受击:冻结移动 + 显示受击贴图(仅调教人物),计时器到点在 updateWalkerAI 里恢复
  if (mode === 'tune' && tuneHitTimer > 0) {
    if (rig.walk.playing) { rig.walk.stop(); rig.walk.gotoAndStop(0); }
    rig.idle.texture = tuneHitTex;
    c.scale.set(1);
    showWalkerRig(rig, 'idle');
    // 坐着挨打:保持贴桌对齐(layoutTuneScene 只在 state==='sitting' 时重算,这里跟着夹一次,
    // 否则受击期间改窗口尺寸会留在旧坐标 ⇒ 看起来「滑出椅子」)
    if (ai.state === 'sitting' && rig.physics.sitOnChair) {
      if (tuneDeskSprite) ai.x = tuneDeskSprite.x;
      ai.y = Math.min(deskSeat.sitY || (app.screen.height * 0.9), app.screen.height - 2);
      c.x = ai.x; c.y = ai.y;
    }
    return;
  }

  // 调教:允许坐在课桌上(不再强制改回 walking);中转站坐姿逻辑不变
  // (原先 mode==='tune' && sitting 会立刻踢回走路,课桌落座做不了)

  if (ph.isFalling) {
    ph.vy += ph.gravity;
    c.y += ph.vy;
    ai.y = c.y;
    if (c.y >= ph.targetY) {
      c.y = ph.targetY;
      ai.y = ph.targetY;
      ph.isFalling = false;
      ph.vy = 0;
      if (ph.sitOnChair && mode === 'relay') {
        ai.state = 'sitting';
        ai.x = chairSprite.x;
        c.x = ai.x;
      } else if (ph.sitOnChair && mode === 'tune') {
        // 调教坐桌:直接落位,不靠落体动画(避免 lift 卡住/沉进桌图)
        ai.state = 'sitting';
        if (tuneDeskSprite) ai.x = tuneDeskSprite.x;
        // sitY 可能尚未算出/算到屏外,落座前再夹一次
        ai.y = Math.min(deskSeat.sitY || (app.screen.height * 0.9), app.screen.height - 2);
        c.x = ai.x;
        c.y = ai.y;
        c.visible = true;
        c.alpha = 1;
        c.scale.set(1);
        showWalkerRig(rig, 'idle');
        // 人物保持在课桌正下方(桌盖人)
        if (tuneDeskSprite && tuneScene && c.parent === tuneScene) {
          const di = tuneScene.getChildIndex(tuneDeskSprite);
          const wi = tuneScene.getChildIndex(c);
          if (wi > di) tuneScene.setChildIndex(c, di);
          else if (wi < di - 1) tuneScene.setChildIndex(c, di - 1);
        }
        return; // 不再走下面的 lift
      } else {
        ai.state = 'walking';
        ai.timer = 120 + Math.floor(Math.random() * 120);
        pickWalkDir(ai);
        syncWalkFacing(ai, rig);
      }
    }
    showWalkerRig(rig, 'lift');
    return;
  }

  if (ai.state === 'sitting') {
    // 调教坐课桌也显示 Q 版 idle,不显示背影
    if (mode === 'tune') {
      showWalkerRig(rig, 'idle');
    } else {
      showWalkerRig(rig, 'sit');
    }
    c.scale.set(1.0);
    if (mode === 'relay') {
      screenGlow.visible = true;
      screenGlowHit.visible = true;
    }
    return;
  }
  if (mode === 'relay') {
    if (screenGlow.visible) screenGlow.visible = false;
    if (screenGlowHit.visible) screenGlowHit.visible = false;
  }
  if (c.scale.x !== 1) c.scale.set(1);

  if (rig.drag.isDragging) {
    showWalkerRig(rig, 'lift');
    return;
  }

  ai.timer--;
  if (ai.state === 'idle') {
    if (ai.timer <= 0) {
      ai.state = 'walking';
      ai.timer = 180 + Math.floor(Math.random() * 180);
      pickWalkDir(ai);
      syncWalkFacing(ai, rig);
    }
  } else {
    // 已在 walking:每帧校正朝向(覆盖「开场直接 walking 未切贴图」等路径)
    syncWalkFacing(ai, rig);
    ai.x += ai.dx * ai.speed;
    ai.y += ai.dy * ai.speed;
    const b = ai.bounds;
    if (ai.x < b.minX) { ai.x = b.minX; ai.dx = Math.abs(ai.dx); ai.facing = 'right'; rig.walk.textures = walkFramesRight; rig.walk.play(); }
    if (ai.x > b.maxX) { ai.x = b.maxX; ai.dx = -Math.abs(ai.dx); ai.facing = 'left'; rig.walk.textures = walkFramesLeft; rig.walk.play(); }
    if (ai.y < b.minY) { ai.y = b.minY; ai.dy = Math.abs(ai.dy); }
    if (ai.y > b.maxY) { ai.y = b.maxY; ai.dy = -Math.abs(ai.dy); }
    if (ai.timer <= 0) {
      ai.state = 'idle';
      ai.timer = 120 + Math.floor(Math.random() * 120);
    }
  }

  c.x = ai.x;
  c.y = ai.y;
  if (ai.state === 'idle') {
    if (rig.walk.playing) { rig.walk.stop(); rig.walk.gotoAndStop(0); }
    showWalkerRig(rig, 'idle');
  } else {
    showWalkerRig(rig, 'walk');
    if (!rig.walk.playing) rig.walk.play();
  }
}

function updateWalkerAI() {
  // 性能:两场景都关时不跑
  if (relaySceneOpen) updateWalkerRig(relayWalker, 'relay');
  if (tuneSceneOpen && tuneWalker) { syncTuneTrainingSit(); updateWalkerRig(tuneWalker, 'tune'); }
}

// 闭关训练头顶标签:跟随"当前可见场景"的人物头顶(生产/中转站/调教都显示)
let sessionLabel = null;
function syncSessionLabel() {
  // 电脑面板(screenPanel)与强化训练棋盘是盖住人物的整屏覆盖层:头顶标签在 topbar(panel 之上),浮其上会穿帮盖住它们,此时让位隐藏
  if (screenPanelOpen || (gameState && tuneSceneOpen)) { if (sessionLabel) sessionLabel.visible = false; return; }
  const sess = state.relay.train && state.relay.train.session;
  if (!sess) { if (sessionLabel) sessionLabel.visible = false; return; }
  if (!sessionLabel) {
    sessionLabel = makeText('', { size: 15, color: '#ffe9a8', weight: 'bold', anchor: 0.5 });
    sessionLabel.style.stroke = 0x1c1611; sessionLabel.style.strokeThickness = 5;
    sessionLabel.eventMode = 'none';
    layers.topbar.addChild(sessionLabel);
  }
  let ax, ay;
  if (tuneSceneOpen && tuneWalker) { const c = tuneWalker.container; ax = c.x; ay = c.y - c.height - 16; }
  else if (relaySceneOpen && relayWalker) { const c = relayWalker.container; ax = c.x; ay = c.y - c.height - 16; }
  else { ax = charClosed.x + charClosed.width / 2; ay = charClosed.y - 18; }
  sessionLabel.x = ax; sessionLabel.y = Math.max(20, ay);
  sessionLabel.text = '闭关训练… ' + Math.max(0, Math.ceil(sess.remainMin)) + 'min';
  sessionLabel.visible = true;
}
function seatTuneWalker() {
  if (!tuneWalker) return;
  const rig = tuneWalker, ai = rig.ai, c = rig.container, ph = rig.physics;
  ph.isFalling = false; ph.vy = 0; ph.sitOnChair = true;
  ai.state = 'sitting';
  if (tuneDeskSprite) ai.x = tuneDeskSprite.x;
  ai.y = Math.min(deskSeat.sitY || (app.screen.height * 0.9), app.screen.height - 2);
  c.x = ai.x; c.y = ai.y;
  c.visible = true; c.alpha = 1; c.scale.set(1);

// ==================== 背景音乐(BGM):三场景各一首,循环,切换交叉淡入淡出 ====================
// 浏览器自动播放策略:首次用户手势前不播;之后 setBGM 按场景切。地下室=默认,中转站=relay,调教=tune。
const BGM = { tracks: {}, cur: null, started: false, inited: false };
// 轨懒加载(2026-10-13):Audio 对象只在首次要用时创建。原先启动即建满 3 首
// (全 preload='auto',首访一次性拉 2.9MB);现在只预载当前场景那一轨(默认地下室 ~1.1MB),
// 中转站/调教两首(~1.8MB)首次切场景才建。后建轨初始 volume=0,由 setBGM/bgmFade 淡入到
// musicVolume;音量滑条只遍历已建轨,行为不变。⚠️ 建轨一律走 ensureBgmTrack,别搬回 initBGM。
function ensureBgmTrack(k) {
  if (!BGM.tracks[k] && AUDIO[k]) {
    const a = new Audio(AUDIO[k]);
    a.loop = true; a.preload = 'auto'; a.volume = 0;
    BGM.tracks[k] = a;
  }
  return BGM.tracks[k];
}
function initBGM() {
  if (BGM.inited) return;
  BGM.inited = true;
  ensureBgmTrack(currentBgmKey()); // 只预载当前场景那一轨,其余按需
}
function bgmStopFade(a) {
  if (a && a.__fadeTimer) { clearInterval(a.__fadeTimer); a.__fadeTimer = null; }
}
const BGM_FADE_MS = 1000;   // §19.9(星光 2026-10-19):浅入浅出各 1 秒(原 10×30ms=300ms 太急)
function bgmFade(a, target, done) {
  if (!a) { if (done) done(); return; }
  bgmStopFade(a); // 同轨只保留一条 fade,避免旧 interval 把音量抬回去
  const start = a.volume, steps = 20, step = (target - start) / steps;
  let i = 0;
  const t = setInterval(() => {
    i++; a.volume = Math.max(0, Math.min(1, start + step * i));
    if (i >= steps) {
      a.volume = target;
      if (a.__fadeTimer === t) a.__fadeTimer = null;
      clearInterval(t);
      if (done) done();
    }
  }, BGM_FADE_MS / steps);
  a.__fadeTimer = t;
}
function currentBgmKey() { return tuneSceneOpen ? 'bgm_tune' : (relaySceneOpen ? 'bgm_relay' : 'bgm_basement'); }
function setBGM(key) {
  initBGM();
  ensureBgmTrack(key); // 懒加载:先把目标轨建出来再判断;同轨重复调用是 no-op
  if (BGM.cur === key || !BGM.tracks[key]) return;
  const from = BGM.cur ? BGM.tracks[BGM.cur] : null;
  if (from) {
    if (musicVolume <= 0) {
      bgmStopFade(from);
      from.volume = 0;
      try { from.pause(); } catch (e) {}
    } else {
      bgmFade(from, 0, () => { try { from.pause(); } catch (e) {} });
    }
  }
  BGM.cur = key;
  if (!BGM.started) return; // 手势前只记目标,不播
  if (musicVolume <= 0) {
    const muted = BGM.tracks[key];
    if (muted) {
      bgmStopFade(muted);
      muted.volume = 0;
      try { muted.pause(); } catch (e) {}
    }
    return;
  }
  const to = BGM.tracks[key];
  try { to.play().catch(() => {}); } catch (e) {}
  bgmFade(to, musicVolume);
}
function startBGMOnGesture() {
  if (BGM.started) return;
  initBGM();
  BGM.started = true;
  const key = currentBgmKey();
  BGM.cur = key;
  const a = ensureBgmTrack(key); // 懒加载:手势到点才建当前场景那一轨
  if (!a) return;
  if (musicVolume <= 0) { a.volume = 0; try { a.pause(); } catch (e) {} return; }
  try { a.play().then(() => bgmFade(a, musicVolume)).catch(() => {}); } catch (e) {}
}
// 设置面板「音乐音量」滑条:改全局音量。
// ⚠️ 必须①取消所有进行中的 fade(否则场景切换的交叉淡入会把 0 又抬回旧目标)②写到全部轨
// ③音量 0 时直接 pause —— 只改 cur.volume 且不杀 fade,会出现「拉到 0 还有一点声」。
function setBgmVolume(v) {
  musicVolume = Math.max(0, Math.min(1, v));
  for (const k in BGM.tracks) {
    const a = BGM.tracks[k];
    bgmStopFade(a);
    a.volume = musicVolume;
  }
  if (musicVolume <= 0) {
    for (const k in BGM.tracks) {
      try { BGM.tracks[k].pause(); } catch (e) {}
    }
  } else if (BGM.started && BGM.cur && BGM.tracks[BGM.cur]) {
    const a = BGM.tracks[BGM.cur];
    if (a.paused) { try { a.play().catch(() => {}); } catch (e) {} }
  }
  saveSettingsSoon();
}
// ==================== SFX:操作音效(程序化合成,assets/audio/sfx_*;消费设置里的「音效音量」滑条) ====================
// 触发点:生产点击(clickMask)/ 购买成功(createBuyItem 扣款点)/ 挥鞭(调教选中鞭子时按下)/ 成组消除。
// 全部由用户手势触发,不受浏览器自动播放策略限制。池化复用、上限 8 并发,超出丢弃(连点不炸内存)。
// 改音色:改 make_sfx.py 里的参数重跑即可。
const SFX = { names: { click: 'sfx_click', buy: 'sfx_buy', whip: 'sfx_whip', pop: 'sfx_pop', reject: 'sfx_reject' }, pool: [] };   // §19.13 拒绝音
function playSfx(name) {
  const key = SFX.names[name];
  if (!key || !AUDIO[key] || sfxVolume <= 0) return;
  let a = null;
  for (let i = 0; i < SFX.pool.length; i++) { if (SFX.pool[i].ended) { a = SFX.pool[i]; break; } }
  if (!a) {
    if (SFX.pool.length >= 8) return;
    a = new Audio();
    SFX.pool.push(a);
  }
  a.src = AUDIO[key];
  a.volume = Math.max(0, Math.min(1, sfxVolume));
  try { a.currentTime = 0; } catch (e) {}
  try { a.play().catch(() => {}); } catch (e) {}
}

function isNodeIn(root, node) {
  let n = node;
  while (n) {
    if (n === root) return true;
    n = n.parent;
  }
  return false;
}

// 是否落在矩形内(pixi 全局坐标)
function ptInRect(p, x, y, w, h) {
  return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
}

// 容器全局包围盒(含展开子节点)
function ptInObj(p, obj) {
  if (!obj || obj.destroyed || obj.visible === false) return false;
  try {
    const b = obj.getLocalBounds();
    // 子对象可能有偏移:用 getBounds 更稳(含位置)
    const g = obj.getBounds();
    return ptInRect(p, g.x, g.y, g.width, g.height);
  } catch (e) {
    return false;
  }
}

function isOverUIChrome(p) {
  if (!p) return false;
  // 电脑面板开着:整屏都算 UI(面板几乎全屏,简化处理)
  if (screenPanelOpen) return true;
  // 设置按钮(左上 48×48 @14,14)

  // 底部标签条(约底 70px,避开标签间隙误伤场景也可接受)
  if (p.y >= app.screen.height - 70) return true;
  // 调教「面板」按钮
  if (tunePanelBtn && ptInObj(p, tunePanelBtn)) return true;
  // 道具抽屉:窄条 + 展开面板
  if (tunePropDrawer && ptInObj(p, tunePropDrawer)) return true;
  // 若展开内容是 drawer 子节点,getBounds 已覆盖
  if (tunePropContent && ptInObj(p, tunePropContent)) return true;
  if (tunePropBtn && ptInObj(p, tunePropBtn)) return true;
  return false;
}

}
