  expT.x = x + w - 85; expT.y = y + 17;
  panelContentArea.addChild(expT);

  // 搜索框(DOM input 叠在画布上;见 ensureLbDom / handleLbSearch / tryAdmodel)
  const lbDom = ensureLbDom();
  const sy = sub.y + sub.height + 6;
  const sw = Math.min(360, w * 0.4);
  lbDom.inp.style.left = (x + padX) + 'px';
  lbDom.inp.style.top = sy + 'px';
  lbDom.inp.style.width = (sw - 20) + 'px';
  lbDom.inp.style.display = 'block';
  lbSearchGeom = { x: x + padX, y: sy + 30, w: sw };

  // 表头
  const headY = sy + 36;
  const colW = w - padX * 2;
  const head = new PIXI.Graphics();
  head.beginFill(0xe8e0d4, 1);
  head.drawRoundedRect(x + padX, headY, colW, BOARD_ROW_H, 5);
  head.endFill();
  panelContentArea.addChild(head);
  for (const [label, fx] of BOARD_COLS) {
    const t = makeText(label, { size: 13, color: '#6a5a48', weight: 'bold' });
    t.x = x + padX + 8 + colW * fx;
    t.y = headY + (BOARD_ROW_H - t.height) / 2;
    panelContentArea.addChild(t);
  }

  // 显示顺序:有效 cap 降序(改数值实时重排)。原始下标跟着行走,点行编辑用它。
  const ordered = boardOrder();

  // 可视行数:表头以下到底部提示文字之上的空间
  const listTop = headY + BOARD_ROW_H + 4;
  const listBottom = y + h - 26;
  const maxRows = Math.max(1, Math.floor((listBottom - listTop) / BOARD_ROW_H));
  boardScroll = Math.max(0, Math.min(REAL_MODELS.length - maxRows, boardScroll));
  const end = Math.min(REAL_MODELS.length, boardScroll + maxRows);

  // 悬停描边(共享一块,哪行 hover 就挪到哪行;行循环里的事件负责画,这里只创建)
  const hoverRect = new PIXI.Graphics();
  hoverRect.visible = false;

  for (let i = boardScroll; i < end; i++) {
    const { m, i: srcIdx } = ordered[i];
    const ry = listTop + (i - boardScroll) * BOARD_ROW_H;
    // 斑马纹:奇数行浅色底,长列表横向读的时候不容易串行
    if ((i - boardScroll) % 2 === 1) {
      const band = new PIXI.Graphics();
      band.beginFill(0xe8e0d4, 0.35);
      band.drawRect(x + padX, ry, colW, BOARD_ROW_H);
      band.endFill();
      panelContentArea.addChild(band);
    }
    for (let c = 0; c < BOARD_COLS.length; c++) {
      const [label, fx, get] = BOARD_COLS[c];
      const isCap = label === 'cap';
      const t = makeText(get(m, i), {
        size: 13,
        color: isCap ? '#c05a2a' : '#3a2f22',
        weight: isCap ? 'bold' : 'normal',
      });
      t.x = x + padX + 8 + colW * fx;
      t.y = ry + (BOARD_ROW_H - t.height) / 2;
      panelContentArea.addChild(t);
    }
    // 搜索跳转蓝框:常驻显示,移动鼠标后消失(jumpToModel 设置,一次性 pointermove 清除)
    if (i === searchHitIdx) {
      const sh = new PIXI.Graphics();
      sh.lineStyle(2, 0x7ab8d4, 0.9);
      sh.drawRoundedRect(x + padX + 1, ry + 1, colW - 2, BOARD_ROW_H - 2, 4);
      panelContentArea.addChild(sh);
    }
    {
      // 整行点击 → 打开该模型的属性面板(玩家态只读查看;/admodel 调试态可改数值)。
      // 用透明 Graphics 当热区,比给每段文字都挂事件省事;盖在文字上层才能接到点击。
      const hit = new PIXI.Graphics();
      hit.beginFill(0xffffff, 0.001);   // 必须非 0:alpha=0 的 Graphics 仍可命中,但显式给个极小值更稳
      hit.drawRect(x + padX, ry, colW, BOARD_ROW_H);
      hit.endFill();
      hit.eventMode = 'static';
      hit.cursor = 'pointer';
      hit.hitArea = new PIXI.Rectangle(x + padX, ry, colW, BOARD_ROW_H);
      // 悬停高亮:淡蓝描边告诉用户当前选中的是哪一行。
      // 一块共享的 hoverRect 画在文字层之上、热区之下,谁 hover 谁负责把描边挪到自己位置。
      hit.on('pointerover', () => {
        hoverRect.clear();
        hoverRect.lineStyle(2, 0x7ab8d4, 0.9);       // 淡蓝描边
        hoverRect.drawRoundedRect(x + padX + 1, ry + 1, colW - 2, BOARD_ROW_H - 2, 4);
        hoverRect.visible = true;
      });
      hit.on('pointerout', () => { hoverRect.visible = false; });
      hit.on('pointerdown', () => {
        boardPickIdx = srcIdx;      // 存原始下标,编辑器/覆盖表都按 REAL_MODELS 下标寻址
        editingKey = null;
        layoutScreenPanel();
      });
      panelContentArea.addChild(hit);
    }
  }

  // 悬停描边层要盖住斑马纹和文字,又不能挡热区命中 —— 在行循环前声明、循环里 addChild 不到它,
  // 这里统一插到最上层(热区 alpha≈0 不遮视线,但 hoverRect 必须在文字上面才看得清)。
  panelContentArea.addChild(hoverRect);

  // 底部:左边滚动提示,右边虚构声明(和设计文档 §3.1 顶部那条是同一件事)
  const hint = boardScroll + maxRows >= REAL_MODELS.length
    ? '已到底 · 共 ' + REAL_MODELS.length + ' 个'
    : '↓ 滚轮继续 · ' + (boardScroll + maxRows) + ' / ' + REAL_MODELS.length;
  const ht = makeText(hint, { size: 11, color: '#b0a294' });
  ht.x = x + padX; ht.y = y + h - 20;
  panelContentArea.addChild(ht);

  const note = makeText('非真实榜单 · 型号与数值均为虚构', { size: 11, color: '#b0a294', anchor: 1 });
  note.x = x + padX + colW; note.y = y + h - 20;
  panelContentArea.addChild(note);
}

// ---- 榜单搜索框(DOM input 叠在画布上)与 /admodel 调试开关 ----
// 玩家:输入关键字 → 下拉列出命中模型 → 点击跳转该行并显示蓝框(移动鼠标消失)。
// 调试:输入 /admodel 回车 → 切换调试态(行可点开编辑器、显示已改标记)。入口不写在任何玩家可见文案里。
function ensureLbDom() {
  let inp = document.getElementById('lbSearch');
  if (!inp) {
    inp = document.createElement('input');
    inp.id = 'lbSearch';
    inp.placeholder = '搜索模型 / 厂商…';
    inp.style.cssText = 'position:fixed;display:none;z-index:20;padding:3px 10px;border-radius:8px;'
      + 'border:1px solid #c4b8a8;background:#fffaf2;color:#3a2f22;font-size:16px;outline:none;'
      + 'font-family:"PingFang SC","Microsoft YaHei",sans-serif;';
    document.body.appendChild(inp);
    inp.addEventListener('input', () => handleLbSearch(inp.value));
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (!tryAdmodel(inp.value)) {
          const hits = lbHits(inp.value);
          if (hits.length) jumpToModel(hits[0].i);
        }
      }
      if (e.key === 'Escape') { inp.value = ''; handleLbSearch(''); inp.blur(); }
    });
  }
  let drop = document.getElementById('lbSearchDrop');
  if (!drop) {
    drop = document.createElement('div');
    drop.id = 'lbSearchDrop';
    drop.style.cssText = 'position:fixed;display:none;z-index:20;background:#fffaf2;border:1px solid #c4b8a8;'
      + 'border-radius:8px;max-height:240px;overflow-y:auto;box-shadow:0 4px 14px rgba(0,0,0,0.25);'
      + 'font-family:"PingFang SC","Microsoft YaHei",sans-serif;';
    document.body.appendChild(drop);
  }
  return { inp, drop };
}

function lbHits(v) {
  v = v.trim().toLowerCase();
  if (!v) return [];
  const hits = [];
  REAL_MODELS.forEach((m, i) => {
    if (m.n.toLowerCase().includes(v) || m.v.toLowerCase().includes(v)) hits.push({ m, i });
  });
  return hits;
}

function handleLbSearch(v) {
  const dom = ensureLbDom();
  const hits = lbHits(v);
  if (!hits.length) { dom.drop.style.display = 'none'; return; }
  dom.drop.innerHTML = '';
  hits.slice(0, 10).forEach(({ m, i }) => {
    const d = document.createElement('div');
    d.textContent = (i + 1) + '. ' + m.n + ' · ' + m.v + ' · cap ' + m.cap;
    d.dataset.i = i;
    d.style.cssText = 'padding:6px 12px;cursor:pointer;font-size:14px;color:#3a2f22;';
    d.addEventListener('pointerenter', () => { d.style.background = '#f0e6d8'; });
    d.addEventListener('pointerleave', () => { d.style.background = ''; });
    d.addEventListener('click', () => jumpToModel(i));
    dom.drop.appendChild(d);
  });
  if (hits.length > 10) {
    const d = document.createElement('div');
    d.textContent = '…共 ' + hits.length + ' 条';
    d.style.cssText = 'padding:4px 12px;font-size:12px;color:#b0a294;';
    dom.drop.appendChild(d);
  }
  if (lbSearchGeom) {
    dom.drop.style.left = lbSearchGeom.x + 'px';
    dom.drop.style.top = lbSearchGeom.y + 'px';
    dom.drop.style.width = lbSearchGeom.w + 'px';
  }
  dom.drop.style.display = 'block';
}

function jumpToModel(i) {
  if (!Number.isFinite(i)) return;
  const dom = ensureLbDom();
  boardScroll = Math.max(0, Math.min(i - 2, REAL_MODELS.length - 1));
  searchHitIdx = i;
  layoutScreenPanel();
  dom.drop.style.display = 'none';
  dom.inp.value = '';
  dom.inp.blur();
  // 移动鼠标后蓝框消失:一次性 pointermove 监听
  const clear = () => { searchHitIdx = -1; layoutScreenPanel(); window.removeEventListener('pointermove', clear); };
  window.addEventListener('pointermove', clear, { once: true });
}

function tryAdmodel(v) {
  if (v.trim().toLowerCase() !== '/admodel') return false;
  lbDebug = !lbDebug;
  const dom = ensureLbDom();
  dom.inp.value = '';
  dom.drop.style.display = 'none';
  layoutScreenPanel();
  spawnFloatText(lbDebug ? '调试模式已开启' : '调试模式已关闭', app.screen.width / 2, 90);
  return true;
}

function drawBackendPage(x, y, w, h) {
  backendLive = null;
  const R = state.relay;
  const listed = relayListedModel();
  const padX = w * 0.04;

  const title = makeText('后台', { size: Math.min(30, w * 0.055), color: '#2a2118', weight: 'bold' });
  title.x = x + padX; title.y = y + h * 0.04;
  panelContentArea.addChild(title);

  // 右上角「数据详情」(与模型页同款按钮)
  drawBackendDetailButton(x + w, y);

  const clockStr = String(Math.floor(R.gameHour)).padStart(2, '0') + ':' + String(Math.floor((R.gameHour % 1) * 60)).padStart(2, '0');
  const rateStr = (listed && R.price > 0)
    ? '+$' + (R.users * R.ability.speed * R.activeCoef * R.price / 1e6).toFixed(3) + ' /秒'
    : '未标榜';

  // ===== 资源条(6 格) =====
  const barY = y + h * 0.12;
  const barH = h * 0.13;
  const cols = [
    ['刀乐', '$' + formatNum(R.dollars), 'dollars', '#c05a2a'],
    ['tokens 库存', formatNum(state.tokens), 'tokens', '#4a3c2c'],
    ['信誉', R.reputation.toFixed(1), 'rep', '#4a3c2c'],
    ['用户量', String(R.users), 'users', '#4a3c2c'],
    ['游戏时钟', clockStr, 'clock', '#2a5a8a'],
    ['收益速率', rateStr, 'rate', '#2a7a3a'],
  ];
  backendLive = {};
  const gap = 6;
  const colW = (w - padX * 2 - gap * (cols.length - 1)) / cols.length;
  cols.forEach(([label, val, key, color], i) => {
    const cx = x + padX + i * (colW + gap);
    const card = new PIXI.Graphics();
    card.beginFill(0xe8e0d4, 0.7);
    card.drawRoundedRect(cx, barY, colW, barH, 6);
    card.endFill();
    panelContentArea.addChild(card);
    const lt = makeText(label, { size: 11, color: '#8a7a68' });
    lt.x = cx + 8; lt.y = barY + 6;
    panelContentArea.addChild(lt);
    const vt = makeText(val, { size: Math.min(18, colW * 0.14), color, weight: 'bold' });
    vt.x = cx + 8; vt.y = barY + barH * 0.42;
    panelContentArea.addChild(vt);
    backendLive[key] = vt;
  });

  // 相似度行:选中行优先,否则当前标榜;≥80 绿 / <80 红。口径 = 有效相似(属性×能力倍率)
  {
    let simM = null;
    if (backendSelIdx >= 0) simM = REAL_MODELS[backendSelIdx];
    else if (listed) simM = listed;
    let st;
    if (simM) {
      const raw = rawSimilarityTo(R.ability, simM);
      const mul = capMulTo(R.ability, simM);
      const sv = similarityTo(R.ability, simM);
      const tag = (backendSelIdx >= 0 && listed && simM.n !== listed.n) ? '(选中)'
        : (listed && simM.n === listed.n) ? '(标榜)' : '';
      st = makeText('有效相似 ' + sv.toFixed(0) + '% ' + tag + '  ·  ' + simM.n
        + '  ·  属性' + raw.toFixed(0) + '% × 能力' + mul.toFixed(2) + '×',
        { size: 12, color: (sv >= 80 || sv > 100) ? '#2a7a3a' : '#c05a2a', weight: 'bold' });
    } else {
      st = makeText('未标榜 · 点下方列表选一个模型', { size: 12, color: '#b0a294' });
    }
    st.x = x + padX; st.y = barY + barH + 4;
    panelContentArea.addChild(st);
    backendLive.sim = st;
  }

  // ===== 标榜信息 / 定价 =====
  const infoY = y + h * 0.30;
  if (listed) {
    const official = officialPriceOf(listed);
    const rawL = rawSimilarityTo(R.ability, listed);
    const mulL = capMulTo(R.ability, listed);
    const simL = similarityTo(R.ability, listed);
    const lines = [
      '当前标榜模型:' + listed.n + '  (' + listed.v + ' · ' + listed.t + ' · cap ' + listed.cap + ')',
      '官方参考价 $' + blendPrice(listed) + ' /M tokens',
      '我的定价:$' + R.price + ' /M  ·  你的速度属性 ' + R.ability.speed + ' → 每用户 ' + R.ability.speed + ' tok/s',
      '有效相似 ' + simL.toFixed(0) + '%  =  属性' + rawL.toFixed(0) + '% × 能力' + mulL.toFixed(2)
        + '×  (我的 cap ' + modelCapability(R.ability).toFixed(1) + ' / 标榜 ' + listed.cap + ')'
        + (simL >= 80 || simL > 100 ? '  → 偏涨' : '  → 会被发现掺水'),
    ];
    if (R.serviceDown) lines.push('⚠ 库存见底 · 服务中断中(每小时信誉 -1)');
    lines.forEach((s, i) => {
      const isSimLine = i === 3;
      const t = makeText(s, {
        size: 13,
        color: isSimLine ? ((simL >= 80 || simL > 100) ? '#2a7a3a' : '#c05a2a')
          : (i >= 4 ? '#c05a2a' : '#4a3c2c'),
        weight: isSimLine ? 'bold' : 'normal',
      });
      t.x = x + padX; t.y = infoY + i * 22;
      panelContentArea.addChild(t);
    });
  } else {
    const t = makeText('尚未标榜 · 在下方列表点选模型,设好价格后点「标榜上架」', { size: 13, color: '#8a7a68' });
    t.x = x + padX; t.y = infoY;
    panelContentArea.addChild(t);
  }

  // 价格输入(DOM,叠画布)—— 布局末尾统一显隐
  const priceY = infoY + (listed ? 22 * (R.serviceDown ? 5 : 4) : 22) + 8;
  const priceLabel = makeText('定价($/M):', { size: 13, color: '#4a3c2c' });
  priceLabel.x = x + padX; priceLabel.y = priceY + 4;
  panelContentArea.addChild(priceLabel);

  // 标榜上架 / 下架 按钮
  const btnY = priceY;
  const btnW = 100, btnH = 30;
  const listBtn = new PIXI.Graphics();
  listBtn.lineStyle(1, 0xc4b8a8, 0.9);
  listBtn.beginFill(0xd4a574, 1);
  listBtn.drawRoundedRect(x + w - padX - btnW, btnY, btnW, btnH, 6);
  listBtn.endFill();
  listBtn.eventMode = 'static';
  listBtn.cursor = 'pointer';
  listBtn.hitArea = new PIXI.Rectangle(x + w - padX - btnW, btnY, btnW, btnH);
  listBtn.on('pointerdown', () => {
    if (backendEditingPrice) return;
    const p = parseFloat(backendPriceDom().inp.value);
    if (!isFinite(p) || p <= 0) { flashBackendHint('请输入大于 0 的价格'); return; }
    if (!listed && backendSelIdx < 0) { flashBackendHint('请先在列表里选一个模型'); return; }
    R.price = Math.round(p * 100) / 100;
    if (backendSelIdx >= 0) {
      R.listedModel = REAL_MODELS[backendSelIdx].n;
    }
    saveGame();
    layoutScreenPanel();
  });
  panelContentArea.addChild(listBtn);
  const listBtnT = makeText(listed ? '更新标榜' : '标榜上架', { size: 13, color: '#3a2f22', weight: 'bold', anchor: 0.5 });
  listBtnT.x = x + w - padX - btnW / 2; listBtnT.y = btnY + btnH / 2;
  panelContentArea.addChild(listBtnT);

  if (listed) {
    const delW = 70;
    const delX = x + w - padX - btnW - 8 - delW;
    const del = new PIXI.Graphics();
    del.lineStyle(1, 0xc4b8a8, 0.9);
    del.beginFill(0xe8e0d4, 1);
    del.drawRoundedRect(delX, btnY, delW, btnH, 6);
    del.endFill();
    del.eventMode = 'static';
    del.cursor = 'pointer';
    del.hitArea = new PIXI.Rectangle(delX, btnY, delW, btnH);
    del.on('pointerdown', () => {
      if (backendEditingPrice) return;
      R.listedModel = null;
      R.price = 0;
      R.serviceDown = false;
      saveGame();
      layoutScreenPanel();
    });
    panelContentArea.addChild(del);
    const delT = makeText('下架', { size: 13, color: '#4a3c2c', anchor: 0.5 });
    delT.x = delX + delW / 2; delT.y = btnY + btnH / 2;
    panelContentArea.addChild(delT);
  }

  // ===== 模型选型列表(点击选中,配合上方按钮标榜) =====
  const listTitle = makeText('可标榜模型(点击选中 · 按 cap 降序)', { size: 12, color: '#8a7a68' });
  listTitle.x = x + padX; listTitle.y = btnY + btnH + 14;
  panelContentArea.addChild(listTitle);

  const listY = listTitle.y + 20;
  const listH = y + h - listY - 16;
  const rowH = 26;
  const maxRows = Math.max(3, Math.floor(listH / rowH));
  const order = boardOrder();

  backendPickScroll = Math.max(0, Math.min(order.length - 1, backendPickScroll));
  const hover = new PIXI.Graphics();

  for (let r = 0; r < maxRows; r++) {
    const oi = backendPickScroll + r;
    if (oi >= order.length) break;
    const { m, i: srcIdx } = order[oi];
    const ry = listY + r * rowH;
    if (r % 2 === 0) {
      const zebra = new PIXI.Graphics();
      zebra.beginFill(0xe8e0d4, 0.35);
      zebra.drawRect(x + padX, ry, w - padX * 2, rowH);
      zebra.endFill();
      panelContentArea.addChild(zebra);
    }
    const isSel = srcIdx === backendSelIdx;
    const isCur = listed && m.n === listed.n;
    const nameCol = isCur ? '#2a7a3a' : (isSel ? '#c05a2a' : '#2a2118');
    // 每行右侧:有效相似(选中或当前标榜时高亮颜色)
    const rowRaw = rawSimilarityTo(R.ability, m);
    const rowMul = capMulTo(R.ability, m);
    const rowSim = similarityTo(R.ability, m);
    const showSim = isSel || isCur;
    const simCol = rowSim >= 80 || rowSim > 100 ? '#2a7a3a' : '#c05a2a';
    const parts = [
      [m.n, 0.00, nameCol],
      [m.v, 0.30, '#8a7a68'],
      [m.t, 0.44, '#8a7a68'],
      ['cap ' + (Math.round(effectiveCap(m) * 10) / 10), 0.52, '#4a3c2c'],
      ['官 $' + (officialPriceOf(m) >= 10 ? officialPriceOf(m).toFixed(0) : officialPriceOf(m).toFixed(1)), 0.64, '#4a3c2c'],
    ];
    if (showSim) parts.push(['相似 ' + rowSim.toFixed(0) + '%(×' + rowMul.toFixed(2) + ')', 0.74, simCol]);
    if (isCur) parts.push(['● 标榜中', 0.90, '#2a7a3a']);
    for (const [s, fx, c] of parts) {
      const t = makeText(s, { size: 12, color: c, weight: (isSel || isCur || showSim) ? 'bold' : 'normal' });
      t.x = x + padX + 8 + fx * (w - padX * 2 - 16);
      t.y = ry + 5;
      panelContentArea.addChild(t);
    }
    const hit = new PIXI.Graphics();
    hit.beginFill(0xffffff, 0.001);
    hit.drawRect(x + padX, ry, w - padX * 2, rowH);
    hit.endFill();
    hit.eventMode = 'static';
    hit.cursor = 'pointer';
    hit.hitArea = new PIXI.Rectangle(x + padX, ry, w - padX * 2, rowH);
    hit.on('pointerover', () => {
      hover.clear();
      hover.lineStyle(2, 0x7ab8d4, 0.9);
      hover.drawRoundedRect(x + padX + 1, ry + 1, w - padX * 2 - 2, rowH - 2, 4);
      hover.visible = true;
    });
    hit.on('pointerout', () => { hover.visible = false; });
    hit.on('pointerdown', () => {
      backendSelIdx = srcIdx;
      const pd = backendPriceDom();
      if (!isCur) {
        const op = officialPriceOf(m);
        pd.inp.value = String(op >= 10 ? Math.round(op) : Math.round(op * 10) / 10);
      }
      layoutScreenPanel();
    });
    panelContentArea.addChild(hit);
  }
  panelContentArea.addChild(hover);

  const hint = backendPickScroll + maxRows >= order.length
    ? '已到底 · 共 ' + order.length + ' 个'
    : '↓ 滚轮继续 · ' + (backendPickScroll + maxRows) + ' / ' + order.length;
  const ht = makeText(hint, { size: 11, color: '#b0a294' });
  ht.x = x + padX; ht.y = y + h - 12;
  panelContentArea.addChild(ht);

  // 价格输入框定位到 priceY
  const pd = backendPriceDom();
  pd.inp.style.top = (priceY + 2) + 'px';
  pd.inp.style.left = (x + padX + 96) + 'px';
  if (!backendEditingPrice) {
    pd.inp.value = String(R.price > 0 ? R.price
      : (backendSelIdx >= 0 ? (() => {
          const op = officialPriceOf(REAL_MODELS[backendSelIdx]);
          return op >= 10 ? Math.round(op) : Math.round(op * 10) / 10;
        })() : ''));
  }
}

// 后台「数据详情」按钮(与模型页 drawAttrDetailButton 同款样式)

  const bw = 108, bh = 30;
  const bx = right - bw - 16, by = top + 14;

  btn.beginFill(backendDetailOpen ? 0xd4a574 : 0xe8e0d4, 1);

// 后台数据详情弹层:信誉 / 用户量 / 相似度 / 时长 / 中断 的涨跌说明
function drawBackendDetail(px, py, pw, ph) {
  const w = app.screen.width, h = app.screen.height;

  const shade = new PIXI.Graphics();
  shade.beginFill(0x1a1208, 0.5);
  shade.drawRect(0, 0, w, h);
  shade.endFill();
  shade.eventMode = 'static';
  shade.hitArea = new PIXI.Rectangle(0, 0, w, h);
  shade.on('pointerdown', () => { backendDetailOpen = false; layoutScreenPanel(); });
  attrDetailLayer.addChild(shade);

  const rows = BACKEND_DETAIL_ROWS;
  const rowH = 58, headH = 58, footH = 24;
  const cw = Math.min(pw * 0.86, 780);
  const chh = headH + rows.length * rowH + footH;
  const cx = px + (pw - cw) / 2;
  const cy = py + (ph - chh) / 2;

  const card = new PIXI.Graphics();
  card.lineStyle(1, 0xc4b8a8, 0.9);
  card.beginFill(0xf5f0e8, 1);
  card.drawRoundedRect(cx, cy, cw, chh, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRoundedRect(cx, cy, cw, headH, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRect(cx, cy + headH - 12, cw, 12);
  card.endFill();
  card.eventMode = 'static';
  card.hitArea = new PIXI.Rectangle(cx, cy, cw, chh);
  attrDetailLayer.addChild(card);

  const title = makeText('经营数据详情', { size: 17, color: '#2a2118', weight: 'bold' });
  title.x = cx + 20; title.y = cy + 17;
  attrDetailLayer.addChild(title);

  const tip = makeText('点卡片外任意处关闭', { size: 11, color: '#8a7a68' });
  tip.x = cx + cw - tip.width - 20; tip.y = cy + 21;
  attrDetailLayer.addChild(tip);

  rows.forEach(([name, what, how], i) => {
    const ry = cy + headH + i * rowH;
    if (i > 0) {
      const line = new PIXI.Graphics();
      line.lineStyle(1, 0xc4b8a8, 0.28);
      line.moveTo(cx + 20, ry); line.lineTo(cx + cw - 20, ry);
      attrDetailLayer.addChild(line);
    }
    const nm = makeText(name, { size: 14, color: '#2a2118', weight: 'bold' });
    nm.x = cx + 20; nm.y = ry + 10;
    attrDetailLayer.addChild(nm);

    const wt = makeText(what, { size: 12, color: '#4a3c2c' });
    wt.style.wordWrap = true;
    wt.style.breakWords = true;
    wt.style.wordWrapWidth = cw - 148 - 20;
    wt.x = cx + 100; wt.y = ry + 8;
    attrDetailLayer.addChild(wt);

    const ht2 = makeText(how, { size: 11, color: '#8a7a68' });
    ht2.style.wordWrap = true;
    ht2.style.breakWords = true;
    ht2.style.wordWrapWidth = cw - 148 - 20;
    ht2.x = cx + 100; ht2.y = ry + 32;
    attrDetailLayer.addChild(ht2);
  });
}

// 价格 DOM input(和榜单搜索同一套路:叠画布、按面板开关显隐)
function backendPriceDom() {
  let inp = document.getElementById('backendPrice');
  if (!inp) {
    inp = document.createElement('input');
    inp.id = 'backendPrice';
    inp.placeholder = '0';
    inp.style.cssText = 'position:fixed;display:none;z-index:20;width:88px;padding:3px 8px;border-radius:8px;'
      + 'border:1px solid #c4b8a8;background:#fffaf2;color:#3a2f22;font-size:14px;outline:none;'
      + 'font-family:"PingFang SC","Microsoft YaHei",sans-serif;';
    document.body.appendChild(inp);
    inp.addEventListener('focus', () => { backendEditingPrice = true; });
    inp.addEventListener('blur', () => { backendEditingPrice = false; });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { inp.blur(); }
      e.stopPropagation(); // 别把键传给全局(设置面板/编辑器)
    });
  }
  return { inp };
}

function flashBackendHint(msg) {
  // 轻提示:改相似度行的文案 1.5s
  if (!backendLive || !backendLive.sim) return;
  backendLive.sim.text = msg;
  backendLive.sim.style.fill = '#c05a2a';
  setTimeout(() => {
    if (backendLive && backendLive.sim) layoutScreenPanel();
  }, 1500);
}

// ---------- 中转站顶栏 HUD(与生产 tokens 同一位置,盖在 topbar 之上但不进 screenPanel) ----------
// 面板占屏 88%×85% 会盖到 y≈(1-0.85)/2*h,顶栏区(y=12 起)露在面板上方;
// HUD 挂在 layers.topbar 最上层,与 tokenLabel 同一套坐标逻辑,不会被 panel 遮住(panel 在 topbar 之下)。
const relayHud = new PIXI.Container();
relayHud.visible = false;
layers.topbar.addChild(relayHud);
let relayHudLine1 = null, relayHudLine2 = null;

function layoutRelayHud() {
  const w = app.screen.width;
  const old = relayHud.removeChildren();
  setTimeout(() => { for (const c of old) if (!c.destroyed) c.destroy({ children: true }); }, 0);
  // 与 layoutTopbar 同一几何:居中胶囊,避免和设置按钮(右上角)打架
  const bw = Math.min(420, w * 0.55);
  const bh = 52;
  const x = (w - bw) / 2;
  const y = 12;
  const bg = new PIXI.Graphics();
  roundRect(bg, x, y, bw, bh, 14, 0x2a1f16, 0.78);
  relayHud.addChild(bg);
  relayHudLine1 = makeText('', { size: 15, color: '#ffd98a', weight: 'bold', anchor: 0.5 });
  relayHudLine1.x = w / 2; relayHudLine1.y = y + 18;
  relayHudLine2 = makeText('', { size: 12, color: '#d4c4a8', anchor: 0.5 });
  relayHudLine2.x = w / 2; relayHudLine2.y = y + 38;
  relayHud.addChild(relayHudLine1, relayHudLine2);
}

// 行走人物(在椅子之前添加,这样椅子在人物上层,有前后层次感)
const WALK_FRAME_W = 158;
const WALK_FRAME_H = 220;
const WALK_FRAMES = 6;

// 从精灵图提取6帧纹理(向左/向右各一套)
function makeWalkFrames(assetKey) {
  const baseTex = PIXI.Texture.from(ASSETS[assetKey]);
  const frames = [];
  for (let i = 0; i < WALK_FRAMES; i++) {
    frames.push(new PIXI.Texture(baseTex.baseTexture,
      new PIXI.Rectangle(i * WALK_FRAME_W, 0, WALK_FRAME_W, WALK_FRAME_H)));
  }
  return frames;
}
const walkFramesLeft = makeWalkFrames('walk_left');
const walkFramesRight = makeWalkFrames('walk_right');

relayScene.addChild(walkerContainer);

// 行走动画(行走时显示)

walker.anchor.set(0.5, 1); // 底部中心

walker.visible = false;

// 统一切换人物贴图:任何状态都一次性设好全部 visible,避免漏设导致旧贴图残留。
// 新增贴图只需在这里加一行;所有状态切换(含事件处理函数)都必须走这里,不要各自手写四行。

  walker.visible = which === 'walk';

  walkerLift.visible = which === 'lift';
  walkerSit.visible = which === 'sit';

};
// 人物自由落体物理(无碰撞反弹,落地即恢复走路/坐下)
const walkerPhysics = {
  vy: 0,
  gravity: 0.25,  // 重力加速度(较小,避免太快)
  isFalling: false,
  targetY: 0,     // 目标落地高度(地面或椅子坐高)
  sitOnChair: false, // 是否落在椅子上
};
// 椅子可坐区域参数(在 layoutRelayScene 中计算)
const chairSeat = {
  sitY: 0,        // 坐的高度(人物底部y)
  minX: 0,        // 可坐区域左边界
  maxX: 0,        // 可坐区域右边界
};

// 椅子(高清素材,锚点底部中心,方便按地面线摆放)
const chairSprite = PIXI.Sprite.from(ASSETS.chair);
chairSprite.anchor.set(0.5, 1);
relayScene.addChild(chairSprite);

// 椅子描边图(提起人物时替换椅子原图显示,提示可坐区域)
const chairOutline = PIXI.Sprite.from(ASSETS.chair_outline);
chairOutline.anchor.set(0.5, 1);
chairOutline.visible = false;
relayScene.addChild(chairOutline);

// 把屏幕点击区域移到最上层(不被walkerContainer/chairSprite等遮挡)
relayScene.addChild(screenGlowHit);

// AI 随机行走状态
const walkerAI = {
  x: 0, y: 0,           // 当前位置
  dx: 0, dy: 0,         // 移动方向(归一化)
  speed: 1.2,            // 移动速度(像素/帧)
  state: 'idle',         // idle / walking
  timer: 0,               // 状态持续计时器
  facing: 'left',         // 朝向
  bounds: { minX: 0, maxX: 0, minY: 0, maxY: 0 }
};

function updateWalkerAI() {
  if (!relaySceneOpen) return;

  // 自由落体中(无碰撞,落到目标高度后恢复走路或锁定坐姿)
  if (walkerPhysics.isFalling) {
    walkerPhysics.vy += walkerPhysics.gravity;
    walkerContainer.y += walkerPhysics.vy;
    walkerAI.y = walkerContainer.y;
    if (walkerContainer.y >= walkerPhysics.targetY) {
      walkerContainer.y = walkerPhysics.targetY;
      walkerAI.y = walkerPhysics.targetY;
      walkerPhysics.isFalling = false;
      walkerPhysics.vy = 0;
      if (walkerPhysics.sitOnChair) {
        // 落在椅子上:锁定坐姿,不再随机走动
        walkerAI.state = 'sitting';
        walkerAI.x = chairSprite.x; // 对齐椅子中心
        walkerContainer.x = walkerAI.x;
      } else {
        // 落在地面:恢复走路姿态
        walkerAI.state = 'walking';
        walkerAI.timer = 120 + Math.floor(Math.random() * 120);
        if (Math.random() < 0.5) {
          walkerAI.dx = Math.random() < 0.5 ? -1 : 1;
          walkerAI.dy = 0;
        } else {
          const angle = Math.random() * Math.PI * 2;
          walkerAI.dx = Math.cos(angle);
          walkerAI.dy = Math.sin(angle) * 0.5;
        }
        if (Math.abs(walkerAI.dx) > 0.1) {
          walkerAI.facing = walkerAI.dx > 0 ? 'right' : 'left';
          walker.textures = walkerAI.facing === 'left' ? walkFramesLeft : walkFramesRight;
        }
      }
    }
    // 落体时显示提起贴图
    showWalker('lift');
    return;
  }

  // 坐姿锁定:不随机走动,显示背影,电脑屏幕显示草绿色描边
  if (walkerAI.state === 'sitting') {
    showWalker('sit'); // 坐姿背影
    walkerContainer.scale.set(1.0); // 背影本身已放大,不需要额外缩放
    screenGlow.visible = true; // 人物坐下,电脑屏幕描边显示
    screenGlowHit.visible = true;
    return;
  }
  // 非坐姿时隐藏屏幕描边
  if (screenGlow.visible) screenGlow.visible = false;
  if (screenGlowHit.visible) screenGlowHit.visible = false;
  // 非坐姿时恢复正常大小
  if (walkerContainer.scale.x !== 1) walkerContainer.scale.set(1);

  if (walkerDrag.isDragging) {
    // 拖拽中:显示提起贴图,暂停AI;椅子保持描边图显示
    showWalker('lift');
    return;
  }

  walkerAI.timer--;

  if (walkerAI.state === 'idle') {
    // 休息结束,开始行走
    if (walkerAI.timer <= 0) {
      walkerAI.state = 'walking';
      walkerAI.timer = 180 + Math.floor(Math.random() * 180); // 3-6秒(60fps)
      // 随机方向(8方向)
      if (Math.random() < 0.5) {
        walkerAI.dx = Math.random() < 0.5 ? -1 : 1;
        walkerAI.dy = 0;
      } else {
        const angle = Math.random() * Math.PI * 2;
        walkerAI.dx = Math.cos(angle);
        walkerAI.dy = Math.sin(angle) * 0.5;
      }
      // 更新朝向
      if (Math.abs(walkerAI.dx) > 0.1) {
        const newFacing = walkerAI.dx > 0 ? 'right' : 'left';
        if (newFacing !== walkerAI.facing) {
          walkerAI.facing = newFacing;
          walker.textures = newFacing === 'left' ? walkFramesLeft : walkFramesRight;
          walker.play();
        }
      }
    }
  } else {
    // 行走中
    walkerAI.x += walkerAI.dx * walkerAI.speed;
    walkerAI.y += walkerAI.dy * walkerAI.speed;

    // 碰到边界反弹
    const b = walkerAI.bounds;
    if (walkerAI.x < b.minX) { walkerAI.x = b.minX; walkerAI.dx = Math.abs(walkerAI.dx); walkerAI.facing = 'right'; walker.textures = walkFramesRight; walker.play(); }
    if (walkerAI.x > b.maxX) { walkerAI.x = b.maxX; walkerAI.dx = -Math.abs(walkerAI.dx); walkerAI.facing = 'left'; walker.textures = walkFramesLeft; walker.play(); }
    if (walkerAI.y < b.minY) { walkerAI.y = b.minY; walkerAI.dy = Math.abs(walkerAI.dy); }
    if (walkerAI.y > b.maxY) { walkerAI.y = b.maxY; walkerAI.dy = -Math.abs(walkerAI.dy); }

    // 行走结束,休息
    if (walkerAI.timer <= 0) {
      walkerAI.state = 'idle';
      walkerAI.timer = 120 + Math.floor(Math.random() * 120); // 2-4秒休息(60fps)
    }
  }

  walkerContainer.x = walkerAI.x;
  walkerContainer.y = walkerAI.y;
  // 休息时显示静态贴图,行走时播放动画
  if (walkerAI.state === 'idle') {
    if (walker.playing) { walker.stop(); walker.gotoAndStop(0); }
    showWalker('idle');
  } else {
    showWalker('walk');
    if (!walker.playing) walker.play();
  }
}

// ========== 人物拖拽(无物理碰撞,松开恢复走路) ==========
function startWalkerDrag(e) {
  if (!relaySceneOpen) return;
  walkerDrag.isDragging = true;
  const pos = e.global;
  walkerDrag.offsetX = pos.x - walkerContainer.x;
  walkerDrag.offsetY = pos.y - walkerContainer.y;
  walkerAI.state = 'idle';
  walkerAI.timer = 0;
  walkerPhysics.isFalling = false;
  walkerPhysics.sitOnChair = false;
  if (walker.playing) { walker.stop(); walker.gotoAndStop(0); }
  // 立即切到提起贴图(不能等 updateWalkerAI,拖拽分支会提前return,坐姿背影会残留)
  showWalker('lift');
  screenGlow.visible = false; // 从椅子上拖起,隐藏屏幕描边
  screenGlowHit.visible = false;
  // 提起人物时椅子换成描边图,提示可坐区域
  chairSprite.visible = false;
  chairOutline.visible = true;
  walkerContainer.scale.set(1); // 拖拽时恢复正常大小
}

function updateWalkerDrag(e) {
  if (!walkerDrag.isDragging) return;
  const pos = e.global;
  walkerContainer.x = pos.x - walkerDrag.offsetX;
  walkerContainer.y = pos.y - walkerDrag.offsetY;
  walkerAI.x = walkerContainer.x;
  walkerAI.y = walkerContainer.y;
}

function endWalkerDrag(e) {
  if (!walkerDrag.isDragging) return;
  walkerDrag.isDragging = false;
  // 恢复椅子原图
  chairSprite.visible = true;
  chairOutline.visible = false;

  // 判断是否在椅子可坐区域内松开
  const atChair = (walkerAI.x >= chairSeat.minX && walkerAI.x <= chairSeat.maxX &&
                   walkerAI.y < chairSeat.sitY); // 在坐高上方松开
  walkerPhysics.vy = 0;
  walkerPhysics.isFalling = true;
  if (atChair) {
    // 落在椅子上:目标高度=坐高
    walkerPhysics.targetY = chairSeat.sitY;
    walkerPhysics.sitOnChair = true;
  } else {
    // 落在地面:目标高度=行走区域下边界
    walkerPhysics.targetY = walkerAI.bounds ? walkerAI.bounds.maxY : h * 0.85;
    walkerPhysics.sitOnChair = false;
  }
}

// 人物可拖拽(事件绑定到容器,三个子元素都能触发)
walkerContainer.eventMode = 'static';
walkerContainer.cursor = 'pointer';
walkerContainer.on('pointerdown', startWalkerDrag);
walkerContainer.on('pointermove', updateWalkerDrag);
walkerContainer.on('pointerup', endWalkerDrag);
walkerContainer.on('pointerupoutside', endWalkerDrag);

function layoutTuneScene() {

function layoutRelayScene() {
  const w = app.screen.width;
  const h = app.screen.height;
  // 纹理未加载完成时使用默认尺寸,避免除以0导致NaN边界
  const rbgW = relayBg.texture.width > 1 ? relayBg.texture.width : 1672;
  const rbgH = relayBg.texture.height > 1 ? relayBg.texture.height : 941;
  const bgScale = Math.max(w / rbgW, h / rbgH);
  relayBg.scale.set(bgScale);
  relayBg.x = (w - rbgW * bgScale) / 2;
  relayBg.y = (h - rbgH * bgScale) / 2;
  // 椅子:与背景同一坐标系,位置/大小对齐原始带椅子背景
  // (在 1672x941 原图坐标系中:顶 0.3996 / 底 0.9277 / 水平中心 0.508)
  const bw = rbgW;
  const bh = rbgH;
  const chH = (0.9277 - 0.3996) * bh * bgScale;
  const chairTexH = chairSprite.texture.height > 1 ? chairSprite.texture.height : 800;
  chairSprite.scale.set(chH / chairTexH);
  chairSprite.x = relayBg.x + 0.508 * bw * bgScale;
  chairSprite.y = relayBg.y + 0.9277 * bh * bgScale; // anchor (0.5, 1):底部中心

  // 电脑屏幕草绿色描边(贴合左边显示表格的宽屏主显示器)
  screenGlow.clear();
  const sgX = relayBg.x + 0.421 * bw * bgScale;
  const sgY = relayBg.y + 0.298 * bh * bgScale;
  const sgW = 0.174 * bw * bgScale;
  const sgH = 0.160 * bh * bgScale;
  screenGlow.lineStyle(3, 0x7cba3f, 0.85); // 草绿色
  screenGlow.drawRoundedRect(sgX, sgY, sgW, sgH, 4);
  // 透明点击区域覆盖整个矩形(描边+内部)
  screenGlowHit.clear();
  screenGlowHit.beginFill(0x000000, 0.001); // 几乎透明(alpha=0可能不响应事件)
  screenGlowHit.drawRect(sgX, sgY, sgW, sgH);
  screenGlowHit.endFill();
  screenGlowHit.hitArea = new PIXI.Rectangle(sgX, sgY, sgW, sgH);

  // 行走人物:大小与场景适配,边界在背景图范围内
  const walkerScale = (h * 0.32) / WALK_FRAME_H;
  walker.scale.set(walkerScale);
  // 休息贴图与行走人物等高(保持比例)
  const idleScale = (WALK_FRAME_H * walkerScale) / walkerIdle.texture.height * 1.12;
  walkerIdle.scale.set(idleScale);
  // 提起贴图与行走人物等高(保持比例)
  const liftScale = (WALK_FRAME_H * walkerScale) / walkerLift.texture.height;
  walkerLift.scale.set(liftScale);
  // 坐姿背影贴图:比行走人物稍大(坐姿背影更饱满)
  const sitScale = (WALK_FRAME_H * walkerScale * 1.15) / walkerSit.texture.height;
  walkerSit.scale.set(sitScale);
  const ww = WALK_FRAME_W * walkerScale;
  const wh = WALK_FRAME_H * walkerScale;
  // 活动边界:地面区域(背景图下半部分),留出边距
  // 用 rbgH*bgScale 而非 relayBg.height,后者在纹理未加载时=1*bgScale 会导致边界错误
  const bgH = rbgH * bgScale;
  walkerAI.bounds = {
    minX: relayBg.x + ww * 0.6,
    maxX: relayBg.x + rbgW * bgScale - ww * 0.6,
    minY: relayBg.y + bgH * 0.70,
    maxY: relayBg.y + bgH - wh * 0.12
  };
  // 首次布局时设置初始位置(椅子旁边)
  if (walkerAI.x === 0 && walkerAI.y === 0) {
    walkerAI.x = chairSprite.x - 150;
    walkerAI.y = chairSprite.y;
  }
  walkerContainer.x = walkerAI.x;
  walkerContainer.y = walkerAI.y;

  // 计算椅子可坐区域:坐高=椅子高度40%处(从底部往上,比一半低一点),宽度=椅子宽度
  const chairW = chairSprite.width;
  const chairH = chairSprite.height;
  chairSeat.sitY = chairSprite.y - chairH * 0.40; // 底部往上40%(顶部往下60%,比一半低一点)
  chairSeat.minX = chairSprite.x - chairW * 0.5;
  chairSeat.maxX = chairSprite.x + chairW * 0.5;

  // 椅子描边图与椅子同位置同大小
  const outlineTexH = chairOutline.texture.height > 1 ? chairOutline.texture.height : chairTexH;
  chairOutline.scale.set(chH / outlineTexH);
  chairOutline.x = chairSprite.x;
  chairOutline.y = chairSprite.y;

  // resize时(如F12开关控制台)如果人物处于坐姿,重新对齐到椅子坐高,避免位置偏移
  if (walkerAI.state === 'sitting') {
    walkerAI.x = chairSprite.x;
    walkerAI.y = chairSeat.sitY;
    walkerContainer.x = chairSprite.x;
    walkerContainer.y = chairSeat.sitY;
  }
}

function formatNum(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  // 一位小数，去掉末尾多余的0
  const rounded = Math.round(n * 10) / 10;
  return rounded.toString();
}

let lastTpsStr = '';
function updateTokenDisplay() {
  const ts = formatNum(state.tokens) + ' tokens';
  if (ts !== lastTokenStr) { lastTokenStr = ts; tokenLabel.text = ts; }
  const ps = state.tokensPerSecond > 0 ? ('+ ' + formatNum(state.tokensPerSecond) + ' / 秒') : '点击屏幕获取 tokens';
  if (ps !== lastTpsStr) { lastTpsStr = ps; tpsLabel.text = ps; }
}

function drawGear(g, cx, cy, r) {
  g.clear();
  g.lineStyle(2.5, 0xfff5e6, 0.9);
  g.beginFill(0xfff5e6, 0.1);
  const teeth = 8;
  g.moveTo(cx + r, cy);
  for (let i = 0; i < teeth * 2; i++) {
    const angle = (i / (teeth * 2)) * Math.PI * 2;
    const rr = i % 2 === 0 ? r : r * 0.7;
    g.lineTo(cx + Math.cos(angle) * rr, cy + Math.sin(angle) * rr);
  }
  g.closePath();
  g.endFill();
  g.drawCircle(cx, cy, r * 0.35);
}

function createSlider(x, y, w, value, onChange) {
  const container = new PIXI.Container();
  container.x = x; container.y = y;

  const track = new PIXI.Graphics();
  track.beginFill(0x4a3a2a, 0.8);
  track.drawRoundedRect(0, 8, w, 6, 3);
  track.endFill();
  container.addChild(track);

  const fill = new PIXI.Graphics();
  container.addChild(fill);

  const handle = new PIXI.Graphics();
  container.addChild(handle);

  function update() {
    fill.clear();
    fill.beginFill(0xffd98a, 0.9);
    fill.drawRoundedRect(0, 8, w * value, 6, 3);
    fill.endFill();
    handle.clear();
    handle.beginFill(0xffd98a, 1);
    handle.drawCircle(w * value, 11, 9);
    handle.endFill();
  }
  update();

  container.eventMode = 'static';
  container.cursor = 'pointer';
  container.hitArea = new PIXI.Rectangle(0, 0, w, 22);
  container.on('pointerdown', (e) => {
    const localX = e.global.x - container.getGlobalPosition().x;
    value = Math.max(0, Math.min(1, localX / w));
    update();
    if (onChange) onChange(value);
  });
  container.on('pointermove', (e) => {
    if (e.buttons === 1) {
      const localX = e.global.x - container.getGlobalPosition().x;
      value = Math.max(0, Math.min(1, localX / w));
      update();
      if (onChange) onChange(value);
    }
  });

  return container;
}

// ESC 打开设置(临时调试:榜单属性编辑器在输入时,键盘归它,见 editingKey)
window.addEventListener('keydown', (e) => {

// 【临时调试】榜单属性编辑器的键盘输入:数字追加、退格、回车提交、ESC 取消。
// 上面那个 ESC「打开设置」的 handler 开头有 `if (editingKey) return;`,输入时不会误弹设置。
window.addEventListener('keydown', (e) => {
  if (!editingKey) return;
  if (e.key >= '0' && e.key <= '9') {
    if (editBuf.length < 3) editBuf += e.key;      // 属性上限 100,3 位够了
  } else if (e.key === 'Backspace') {
    editBuf = editBuf.slice(0, -1);
  } else if (e.key === 'Enter') {
    commitModelAttrEdit(); e.preventDefault(); return;
  } else if (e.key === 'Escape') {
    editingKey = null; editBuf = ''; editRef = null;
    layoutScreenPanel(); e.preventDefault(); return;
  } else {
    return;                                         // 其他键不吞,交回给游戏
  }
  if (editRef) editRef.text = editBuf || '0';       // 只更新当前框,不整页重绘
  e.preventDefault();
});

function rtx3080Price() {
  return Math.floor(50 * Math.pow(1.5, state.machines.rtx3080.count));
}
function fanPrice() {
  return Math.floor(80 * Math.pow(1.5, state.cooling.fan.count));
}
function a100Price() {
  return Math.floor(2000 * Math.pow(1.5, state.machines.a100.count));
}
function extraRackPrice() {
  return Math.floor(5000 * Math.pow(2, state.machines.extraRack.count));
}
function recalcClickPower() {
  state.tokensPerClick = Math.pow(1.25, state.cooling.fan.count);
}
function recalcCrit() {
  state.critChance = 0.005 + state.machines.a100.count * 0.005;
  state.critMultiplier = 1.5 + state.machines.extraRack.count * 0.01;
}
function recalcProduction() {
  state.tokensPerSecond = state.machines.rtx3080.count * 5 + state.machines.a100.count * 50;
}

// ==================== 本地存档 ====================
const SAVE_KEY = 'dshgame_save_v1';
let saveAccum = 0;

function saveGame() {
  try {
    const data = {
      tokens: state.tokens,
      rtx3080: state.machines.rtx3080.count,
      a100: state.machines.a100.count,
      extraRack: state.machines.extraRack.count,
      server: state.machines.server.count,
      fan: state.cooling.fan.count,
      waterCooling: state.cooling.waterCooling.count,
      autoClick: state.scripts.autoClick,
      miracle: state.scripts.miracle,
      relay: state.relay,
      savedAt: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch(e) { return false; }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    state.tokens = data.tokens || 0;
    state.machines.rtx3080.count = data.rtx3080 || 0;
    state.machines.a100.count = data.a100 || 0;
    state.machines.extraRack.count = data.extraRack || 0;
    state.machines.server.count = data.server || 0;
    state.cooling.fan.count = data.fan || 0;
    state.cooling.waterCooling.count = data.waterCooling || 0;
    state.scripts.autoClick = !!(data.autoClick || data.niger); // 兼容旧存档的 niger 字段
    state.scripts.miracle = data.miracle || false;
    // 中转站:旧存档没有该字段 → 保持初始值(data.relay 为 undefined 时不覆盖)
    if (data.relay && typeof data.relay === 'object') {
      Object.assign(state.relay, data.relay);
      Object.assign(state.relay.ability, data.relay.ability || {});
      // 经营 v1 迁移:老存档(无 dollars)的 reputation=50 是旧稿初值,按 §14 重置
      if (data.relay.dollars === undefined) {
        state.relay.reputation = 1;
        state.relay.users = 2;
        state.relay.userSlots = [];
        state.relay.listedModel = null;
        state.relay.price = 0;
        state.relay.dollars = 0;
        state.relay.activeCoef = 0.65;
        state.relay.gameHour = 0;
        state.relay.hourAccum = 0;
        state.relay.repAccum = 0;
        state.relay.serviceDown = false;
        state.relay.totalTokensSold = 0;
        state.relay.totalDollarsEarned = 0;
      }
      if (!Array.isArray(state.relay.userSlots)) state.relay.userSlots = [];
      // 初始用户:人数按 slots 补齐
      while (state.relay.userSlots.length < state.relay.users) {
        state.relay.userSlots.push({ leftH: 2 + Math.random() * 4 });
      }
      if (state.relay.userSlots.length > state.relay.users) {
        state.relay.userSlots.length = state.relay.users;
      }
    }
    refreshRelayPanel(); // 属性可能变了,刷新雷达图/最接近模型
    recalcProduction();
    recalcClickPower();
    recalcCrit();
    return true;
  } catch(e) { return false; }
}

function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
  state.tokens = 0;
  state.machines.rtx3080.count = 0;
  state.machines.a100.count = 0;
  state.machines.extraRack.count = 0;

    ability: { reasoning: 5, longCtx: 2, speed: 5, knowledge: 5, fit: 10, multimodal: 10, instruct: 5, params: 5, toolCall: 5 },

// resize 高频触发(拖拽窗口/旋转手机),rAF 节流到每帧最多一次全量布局

// ==================== 手机横屏引导 ====================
function isTouchDevice() {
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  const touches = Number(navigator.maxTouchPoints || 0) > 0;
  return coarse || touches;
}
function isPortraitViewport() { return window.innerHeight > window.innerWidth; }
function updateOrientationGate() {
  const el = document.getElementById('rotatePrompt');
  if (!el) return;
  const show = isTouchDevice() && isPortraitViewport();
  el.classList.toggle('show', show);
  el.setAttribute('aria-hidden', String(!show));
}
updateOrientationGate();
window.addEventListener('resize', updateOrientationGate);
window.addEventListener('orientationchange', () => { setTimeout(updateOrientationGate, 300); });

// ==================== 主循环 ====================
let secondAccum = 0;
let lastFrameTime = performance.now();

app.ticker.add(() => {
  const now = performance.now();
  const dt = Math.min((now - lastFrameTime) / 1000, 0.5);
  lastFrameTime = now;
  updateTweens(dt);
  // 雷达图轴标签数字滚动(只在雷达开启动画的 0.45s 内有活,平时直接 return)
  radarTicker();
  // 中转站行走人物AI(不受暂停影响)
  updateWalkerAI();
  // 电脑屏幕描边呼吸动画(4s周期:0.4s出现+1.2s保持+0.4s消失+2s等待,悬停常驻)
  // 悬停时timer停止累积,移出时平滑过渡避免跳变
  if (relaySceneOpen && screenGlow.visible) {
    if (!screenGlowHover) {
      screenGlowTimer += dt;
      if (screenGlowTimer >= 4) screenGlowTimer -= 4;
    }
    let targetA = 0;
    if (screenGlowHover) {
      targetA = 1;
    } else if (screenGlowTimer < 0.4) {
      targetA = screenGlowTimer / 0.4;
    } else if (screenGlowTimer < 1.6) {
      targetA = 1;
    } else if (screenGlowTimer < 2.0) {
      targetA = 1 - (screenGlowTimer - 1.6) / 0.4;
    }
    // 平滑过渡(lerp),避免移出时alpha突然跳变被误以为卡顿
    screenGlow.alpha += (targetA - screenGlow.alpha) * Math.min(1, dt * 8);
  } else {
    screenGlowTimer = 0;
    screenGlow.alpha = 0;
  }
  if (!state.paused) {
    // ===== 生产场景专属更新(中转站时跳过,减少CPU开销) =====
    if (!relaySceneOpen) {
      updateLight();
      updateCharacters(dt);
      updateAllBuyButtons();
      updateCasePhysics();
      // 说话气泡：拖动或物理运动时显示，静止时隐藏
      const caseMoving = casePhysics.isDragging || (casePhysics.isActive && (Math.abs(casePhysics.vx) > 0.2 || Math.abs(casePhysics.vy) > 0.2));
      speechBubble.visible = caseMoving;
    }

    // ===== 全局逻辑(中转站时也运行:token增加/自动点击/水冷/存档) =====
    // 自动点击脚本：每秒3次
    if (state.scripts.autoClick) {
      state.autoClickAccum += dt * 3;
      while (state.autoClickAccum >= 1) {
        state.autoClickAccum -= 1;
        const cx = pcCase.x + pcCase.texture.width * pcCase.scale.x / 2;
        const cy = pcCase.y + 20;
        doClick(cx, cy);
      }
    }

    // 水冷随机事件
    if (state.cooling.waterCooling.count > 0) {
      state.waterCoolingTimer += dt;
      if (state.waterCoolingTimer >= state.waterCoolingNextTrigger) {
        state.waterCoolingTimer = 0;
        state.waterCoolingNextTrigger = 10 + Math.random() * 110;
        if (Math.random() < 0.19) {
          const bonus = state.tokens * 0.2;
          state.tokens += bonus;
          spawnFloatText('水冷! +' + formatNum(bonus), app.screen.width / 2, app.screen.height / 3);
          updateTokenDisplay();
        }
      }
    }

    secondAccum += dt;
    if (secondAccum >= 1) {
      const add = state.tokensPerSecond * Math.floor(secondAccum);
      if (add > 0) {
        state.tokens += add;
        updateTokenDisplay();
      }
      if (state.cooling.fan.count > 0) recalcClickPower();
      secondAccum = secondAccum % 1;
    }
    // 自动存档：每30秒
    saveAccum += dt;
    if (saveAccum >= 30) {
      saveAccum = 0;
      saveGame();
    }

    // 中转站经营 v1:时钟 + 卖 token 换刀乐 + 小时/信誉刷新(§14;生产中也跑,不依赖场景)
    updateRelayBusiness(dt);
  }
});

// ==================== 启动（多重布局保险） ====================
// 加载本地存档

if (hasSave) {
  updateTokenDisplay();
  layoutCase();

}

let relayoutPending = false;
function safeRelayout() {
  const texturesReady = bgLight.texture.width > 0 && bgDark.texture.width > 0 &&
    charClosed.texture.width > 0 && charOpen.texture.width > 0 &&
    pcCase.texture.width > 0;
  if (!texturesReady) return false;
  if (relayoutPending) return true;
  relayoutPending = true;
  requestAnimationFrame(() => { relayoutPending = false; layoutAll(); });
  return true;
}

bgLight.texture.on('update', () => { safeRelayout(); });
bgDark.texture.on('update', () => { safeRelayout(); });
charClosed.texture.on('update', () => { safeRelayout(); });
charOpen.texture.on('update', () => { safeRelayout(); });
pcCase.texture.on('update', () => { safeRelayout(); });
relayBg.texture.on('update', () => { safeRelayout(); });
chairSprite.texture.on('update', () => { safeRelayout(); });
tuneBgSprite.texture.on('update', () => { safeRelayout(); });

window.addEventListener('load', () => { setTimeout(safeRelayout, 0); });

// ticker 一次性布局修正：前60帧检查背景图是否覆盖全屏
let layoutFixFrames = 0;
const layoutFixTicker = () => {
  layoutFixFrames++;
  if (layoutFixFrames > 60) { app.ticker.remove(layoutFixTicker); return; }
  const bl = bgLight;
  const coversFull = bl.texture.width > 0 && isFinite(bl.scale.x) && bl.scale.x > 0 &&
    bl.texture.width * bl.scale.x >= app.screen.width - 1 &&
    bl.texture.height * bl.scale.y >= app.screen.height - 1;
  if (!coversFull) { safeRelayout(); }
  else { app.ticker.remove(layoutFixTicker); }
};
app.ticker.add(layoutFixTicker);
