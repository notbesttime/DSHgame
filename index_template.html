<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSH · 地下机房</title>
<style>
  /* P2-5 兜底字体(§20.17):子集化 Noto Sans SC(OFL,可再分发)—— 栈里放最后一位,
     有雅黑/PingFang 的设备零变化,缺字体的安卓/Linux 才吃到,防布局错位 */
  @font-face {
    font-family: "DSHGameCN";
    src: url(__FONT__) format("woff2");
    font-display: swap;
    font-weight: 100 900;   /* 可变字体:wght 轴全保留 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a1410;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "DSHGameCN", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #game { width: 100%; height: 100%; }
  canvas { display: block; touch-action: none; }
  /* 自定义光标模式:盖过 Pixi InteractionManager 写回的 inline cursor */
  canvas.whip-cursor, canvas.whip-cursor *,
  canvas.custom-cursor, canvas.custom-cursor * { cursor: none !important; }

  /* 手机横屏引导 */
  #rotatePrompt {
    position: fixed; inset: 0; z-index: 9999;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(15, 10, 6, 0.96);
    color: #ffd98a; font-family: inherit;
    pointer-events: auto;
  }
  #rotatePrompt.show { display: flex; }
  #rotatePrompt .rotate-phone {
    width: 64px; height: 104px;
    border: 3px solid #ffb35c; border-radius: 12px;
    position: relative;
    animation: rotateDevice 1.8s ease-in-out infinite;
    margin-bottom: 20px;
  }
  #rotatePrompt .rotate-phone::after {
    content: ""; position: absolute;
    left: 50%; bottom: 7px;
    transform: translateX(-50%);
    width: 20px; height: 3px;
    background: #ffb35c; border-radius: 2px;
  }
  #rotatePrompt .rotate-title {
    color: #ffd98a; font-size: 1.1rem;
    letter-spacing: 6px; font-weight: bold;
    margin-bottom: 8px;
  }
  #rotatePrompt .rotate-sub {
    color: #a89880; font-size: 0.78rem;
    letter-spacing: 2px;
  }
  @keyframes rotateDevice {
    0%, 38% { transform: rotate(0); }
    62%, 100% { transform: rotate(-90deg); }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotatePrompt" aria-hidden="true">
  <div class="rotate-phone"></div>
  <div class="rotate-title">请横屏游玩</div>
  <div class="rotate-sub">旋转设备以获得最佳体验</div>
</div>
<script>__PIXIES__</script>
<script>__ASSETS__</script>
<script>__AUDIO__</script>
<script>
// ==================== 工具函数 ====================
// 渲染分辨率唯一来源:canvas 后备缓冲与文字栅格化都用它,避免两处各写一份而不同步。
// 上限 2 是性能与清晰度的折中(填充率按平方增长):dpr=3 的手机也用 2。
// 注:autoDensity 下 app.screen 仍是 CSS 像素,所有百分比布局不受影响。
const RENDER_RESOLUTION = Math.min(window.devicePixelRatio || 1, 2);

function rand(min, max) { return Math.random() * (max - min) + min; }

function makeText(text, opts) {
  const style = new PIXI.TextStyle({
    fontFamily: '"PingFang SC", "Microsoft YaHei", "DSHGameCN", sans-serif',
    fontSize: opts.size || 16,
    fill: opts.color || '#fff5e6',
    fontWeight: opts.weight || 'normal',
    align: opts.align || 'left',
    lineHeight: opts.lineHeight || opts.size * 1.3,
  });
  const t = new PIXI.Text(text, style);
  t.resolution = RENDER_RESOLUTION;
  if (opts.anchor !== undefined) t.anchor.set(opts.anchor);
  return t;
}

function roundRect(g, x, y, w, h, r, color, alpha) {
  g.clear();
  g.beginFill(color, alpha);
  g.drawRoundedRect(x, y, w, h, r);
  g.endFill();
}

// ==================== 补间动画 ====================
const tweens = [];
function tween(target, delta, duration, onComplete) {
  const start = {};
  for (const k in delta) start[k] = target[k];
  const tw = { target, start, delta, duration, elapsed: 0, onComplete };
  // target 自身的 expando(如雷达 scale 上的 __radar 标记)透传给补间记录,radarTicker 靠它找进度
  for (const k in target) if (!(k in tw)) tw[k] = target[k];
  tweens.push(tw);
  return tw;
}
// §19.14:同一对象上挂两条同属性 tween 会互相撕扯(都把「当前值」当起点,又各按自己的 delta 写)。
// 坠落动画要频繁重设位置 ⇒ 重设前先把该对象上的旧 tween 清掉。
function cancelTweensOf(target) {
  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].target === target) tweens.splice(i, 1);
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.elapsed += dt;
    const p = Math.min(tw.elapsed / tw.duration, 1);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    for (const k in tw.delta) tw.target[k] = tw.start[k] + tw.delta[k] * e;
    if (p >= 1) {
      if (tw.onComplete) tw.onComplete();
      tweens.splice(i, 1);
    }
  }
}

function addPressFeedback(obj, scale = 0.92) {
  obj.eventMode = 'static';
  obj.cursor = 'pointer';
  obj.on('pointerdown', () => { obj.scale.set(scale); });
  obj.on('pointerup', () => { obj.scale.set(1); });
  obj.on('pointerupoutside', () => { obj.scale.set(1); });
  obj.on('pointercancel', () => { obj.scale.set(1); });
}

// ==================== PIXI 初始化 ====================
const app = new PIXI.Application({
  resizeTo: window,
  background: '#1a1410',
  antialias: false, // 纯 sprite 渲染,MSAA 无收益且移动端费填充率
  autoDensity: true, // canvas CSS 尺寸不变、后备缓冲按 resolution 放大 → app.screen 仍是 CSS 像素
  resolution: RENDER_RESOLUTION, // 手机 dpr 2~3,原来只有 1,全屏贴图会糊
});
document.getElementById('game').appendChild(app.view);

// ==================== 层级容器 ====================
const layers = {
  bg: new PIXI.Container(),
  clickArea: new PIXI.Container(),
  characters: new PIXI.Container(),
  scene: new PIXI.Container(),
  ui: new PIXI.Container(),
  topbar: new PIXI.Container(),
  fx: new PIXI.Container(),
  settings: new PIXI.Container(),
  panel: new PIXI.Container(), // 独立面板层(不受设置面板visible影响)
  nav: new PIXI.Container(), // 底部场景切换标签,置于最顶(切换场景时仍可见)
};
app.stage.addChild(layers.bg, layers.clickArea, layers.characters, layers.scene, layers.ui, layers.topbar, layers.fx, layers.settings, layers.panel, layers.nav);

// ==================== 背景层（灯效） ====================
const bgLight = PIXI.Sprite.from(ASSETS.bg_light);
const bgDark = PIXI.Sprite.from(ASSETS.bg_dark);
bgDark.visible = false; // 用 visible 而非 alpha=0,关灯层不参与渲染批次
layers.bg.addChild(bgLight, bgDark);

function fitBg(sprite) {
  if (!sprite.texture || sprite.texture.width <= 0 || sprite.texture.height <= 0) return;
  const s = Math.max(app.screen.width / sprite.texture.width, app.screen.height / sprite.texture.height);
  if (!isFinite(s) || s <= 0) return;
  sprite.scale.set(s);
  sprite.x = (app.screen.width - sprite.texture.width * s) / 2;
  sprite.y = (app.screen.height - sprite.texture.height * s) / 2;
}
function fitAllBgs() { fitBg(bgLight); fitBg(bgDark); }

// 灯效控制：高频快速交替闪烁
let lightState = 'on';
let lightStateStart = performance.now();
let nextFlickerIn = rand(6, 12);
let nextLightOnIn = 2;
let flickerSeq = [];
let flickerStart = 0;
let flickerNextState = 'off';

function startFlicker(seq, nextState) {
  lightState = 'flickering';
  flickerSeq = seq;
  flickerStart = performance.now();
  flickerNextState = nextState;
  bgDark.visible = seq[0].alpha > 0;
}

function updateLight() {
  if (lightState === 'on') {
    const elapsed = (performance.now() - lightStateStart) / 1000;
    if (elapsed > nextFlickerIn) {
      startFlicker([
        {alpha: 0, dur: 0.07}, {alpha: 1, dur: 0.09},
        {alpha: 0, dur: 0.06}, {alpha: 1, dur: 0.11},
        {alpha: 0, dur: 0.05}, {alpha: 1, dur: 0.08},
        {alpha: 0, dur: 0.04},
      ], 'off');
    }
  } else if (lightState === 'off') {
    const elapsed = (performance.now() - lightStateStart) / 1000;
    if (elapsed > nextLightOnIn) {
      startFlicker([
        {alpha: 1, dur: 0.06}, {alpha: 0, dur: 0.08},
        {alpha: 1, dur: 0.05}, {alpha: 0, dur: 0.1},
        {alpha: 1, dur: 0.04},
      ], 'on');
    }
  } else if (lightState === 'flickering') {
    const fe = (performance.now() - flickerStart) / 1000;
    let acc = 0;
    for (let i = 0; i < flickerSeq.length; i++) {
      acc += flickerSeq[i].dur;
      if (fe < acc) { bgDark.visible = flickerSeq[i].alpha > 0; return; }
    }
    lightState = flickerNextState;
    lightStateStart = performance.now();
    if (flickerNextState === 'off') {
      bgDark.visible = true;
      nextLightOnIn = rand(1.5, 3);
    } else {
      bgDark.visible = false;
      nextFlickerIn = rand(22, 38);
    }
  }
}

// ==================== 点击增量层 ====================
const clickMask = new PIXI.Graphics();
clickMask.beginFill(0x000000, 0.001);
clickMask.drawRect(0, 0, app.screen.width, app.screen.height);
clickMask.endFill();
clickMask.eventMode = 'static';
clickMask.cursor = 'pointer';
layers.clickArea.addChild(clickMask);

const floatTexts = new PIXI.Container();
layers.fx.addChild(floatTexts);

clickMask.on('pointerdown', (e) => {
  if (relaySceneOpen) return; // 中转站时不触发生产点击
  if (state.paused) return;
  playSfx('click'); // 手动点击才响(自动点击脚本不走这条路径)
  const pos = e.global;
  doClick(pos.x, pos.y);
});

function doClick(x, y) {
  const isCrit = Math.random() < state.critChance;
  let gain = state.tokensPerClick;
  if (isCrit) gain = state.tokensPerClick * state.critMultiplier;
  state.tokens += gain;
  if (isCrit) {
    spawnCritText('暴击! +' + formatNum(gain), x, y);
  } else {
    spawnFloatText('+' + formatNum(gain), x, y);
  }
  updateTokenDisplay();
  triggerCharacterTalk();
}

// 浮字对象池:避免连点时反复创建/销毁 PIXI.Text
const floatPool = [];
const FLOAT_POOL_MAX = 40;
const FLOAT_LIVE_MAX = 30; // 同时在屏上限,防连点刷屏
let floatLiveCount = 0;

function acquireFloatText(size, color, rotation) {
  let t = floatPool.pop();
  if (!t) t = makeText('', { size, color, weight: 'bold', anchor: 0.5 });
  t.style.fontSize = size;
  t.style.fill = color;
  t.text = '';
  t.alpha = 1;
  t.rotation = rotation || 0;
  t.scale.set(1);
  return t;
}

function releaseFloatText(t) {
  floatLiveCount--;
  floatTexts.removeChild(t);
  if (floatPool.length < FLOAT_POOL_MAX) floatPool.push(t);
  else t.destroy();
}

function spawnFloatText(text, x, y) {
  if (floatLiveCount >= FLOAT_LIVE_MAX) return;
  floatLiveCount++;
  const t = acquireFloatText(22, '#ffd98a');
  t.text = text;
  t.x = x; t.y = y;
  floatTexts.addChild(t);
  tween(t, { y: y - 60, alpha: 0 }, 0.9, () => { releaseFloatText(t); });
}

function spawnCritText(text, x, y) {
  if (floatLiveCount >= FLOAT_LIVE_MAX) return;
  floatLiveCount++;
  const t = acquireFloatText(30, '#ff6b6b', -0.08);
  t.text = text;
  t.x = x; t.y = y;
  floatTexts.addChild(t);
  tween(t.scale, { x: 1.3, y: 1.3 }, 0.12);
  tween(t, { y: y - 80, alpha: 0 }, 1.1, () => { releaseFloatText(t); });
}

// ==================== 角色层 ====================
const charClosed = PIXI.Sprite.from(ASSETS.char2);
const charOpen = PIXI.Sprite.from(ASSETS.char1);
charClosed.visible = true;
charOpen.visible = false;
const speechBubble = PIXI.Sprite.from(ASSETS.speech_bubble);
speechBubble.visible = false;
layers.characters.addChild(charClosed, charOpen, speechBubble);

let isTalking = false;
let talkTimer = 0;

function triggerCharacterTalk() {
  if (isTalking) { talkTimer = 0.35; return; }
  isTalking = true;
  talkTimer = 0.35;
  charClosed.visible = false;
  charOpen.visible = true;
}

function updateCharacters(dt) {
  if (isTalking) {
    talkTimer -= dt;
    if (talkTimer <= 0) {
      isTalking = false;
      charClosed.visible = true;
      charOpen.visible = false;
    }
  }
}

function layoutCharacters() {
  const targetH = Math.min(340, app.screen.height * 0.4);
  const scale = targetH / 400;
  for (const c of [charClosed, charOpen]) {
    c.scale.set(scale);
    c.x = app.screen.width - 400 * scale - 10;
    c.y = app.screen.height - 400 * scale - 10;
  }
  // 说话气泡：人物左上角
  const bubbleScale = Math.min(1, (app.screen.width * 0.15) / speechBubble.texture.width);
  speechBubble.scale.set(bubbleScale);
  const bw = speechBubble.texture.width * bubbleScale;
  const bh = speechBubble.texture.height * bubbleScale;
  speechBubble.x = charClosed.x - bw + 110;
  speechBubble.y = charClosed.y - bh + 85;
}

// ==================== 场景层（机箱/占位图） ====================
const pcCase = PIXI.Sprite.from(ASSETS.pc_case);
const casePlaceholder = PIXI.Sprite.from(ASSETS.placeholder);
const fanSprite = PIXI.Sprite.from(ASSETS.fan);
layers.scene.addChild(pcCase, casePlaceholder, fanSprite);

// ==================== 机箱物理交互系统 ====================
const casePhysics = {
  vx: 0, vy: 0,
  isDragging: false,
  isActive: false,
  groundY: 0,
  gravity: 0.7,
  bounce: 0.45,
  friction: 0.96,
  dragHistory: [],
  dragOffset: { x: 0, y: 0 },
  userMoved: false,
};
let caseInitialized = false;

function getCaseDisplayWidth() {
  return pcCase.texture.width * pcCase.scale.x;
}
function getCaseDisplayHeight() {
  return pcCase.texture.height * pcCase.scale.y;
}

function startCaseDrag(e) {
  if (!pcCase.visible) return;
  e.stopPropagation();
  casePhysics.isDragging = true;
  casePhysics.isActive = false;
  casePhysics.vx = 0;
  casePhysics.vy = 0;
  casePhysics.dragHistory = [];
  const pos = e.global;
  casePhysics.dragOffset.x = pos.x - pcCase.x;
  casePhysics.dragOffset.y = pos.y - pcCase.y;
  pcCase.cursor = 'grabbing';
}

function updateCaseDrag(e) {
  if (!casePhysics.isDragging) return;
  const pos = e.global;
  const now = performance.now();
  pcCase.x = pos.x - casePhysics.dragOffset.x;
  pcCase.y = pos.y - casePhysics.dragOffset.y;
  casePhysics.dragHistory.push({ x: pcCase.x, y: pcCase.y, t: now });
  if (casePhysics.dragHistory.length > 6) casePhysics.dragHistory.shift();
}

function endCaseDrag() {
  if (!casePhysics.isDragging) return;
  casePhysics.isDragging = false;
  pcCase.cursor = 'pointer';
  // 从拖动历史计算松开时的速度
  const hist = casePhysics.dragHistory;
  if (hist.length >= 2) {
    const first = hist[Math.max(0, hist.length - 4)];
    const last = hist[hist.length - 1];
    const dt = Math.max(last.t - first.t, 1);
    casePhysics.vx = (last.x - first.x) / dt * 16;
    casePhysics.vy = (last.y - first.y) / dt * 16;
  }
  // 限制最大速度
  const maxV = 30;
  casePhysics.vx = Math.max(-maxV, Math.min(maxV, casePhysics.vx));
  casePhysics.vy = Math.max(-maxV, Math.min(maxV, casePhysics.vy));
  casePhysics.isActive = true;
}

function updateCasePhysics() {
  if (!casePhysics.isActive || casePhysics.isDragging) return;
  if (!pcCase.visible) return;

  // 重力
  casePhysics.vy += casePhysics.gravity;

  // 更新位置
  pcCase.x += casePhysics.vx;
  pcCase.y += casePhysics.vy;

  const cw = getCaseDisplayWidth();
  const ch = getCaseDisplayHeight();
  const sw = app.screen.width;
  let settled = false;

  // 地面碰撞
  if (pcCase.y >= casePhysics.groundY) {
    pcCase.y = casePhysics.groundY;
    if (Math.abs(casePhysics.vy) > 2.5) {
      casePhysics.vy = -casePhysics.vy * casePhysics.bounce;
      casePhysics.vx *= casePhysics.friction;
      // 奇迹算法：砸地面有概率获得额外token
      if (state.scripts.miracle && Math.random() < 0.25) {
        const bonus = Math.max(1, Math.floor(state.tokens * 0.03));
        state.tokens += bonus;
        spawnFloatText('奇迹! +' + formatNum(bonus), pcCase.x + 60, casePhysics.groundY - 20);
        updateTokenDisplay();
      }
    } else {
      casePhysics.vy = 0;
      casePhysics.vx *= 0.85;
      if (Math.abs(casePhysics.vx) < 0.15) {
        casePhysics.vx = 0;
        settled = true;
      }
    }
  }

  // 左墙碰撞
  if (pcCase.x <= 0) {
    pcCase.x = 0;
    casePhysics.vx = -casePhysics.vx * casePhysics.bounce;
  }
  // 右墙碰撞
  if (pcCase.x >= sw - cw) {
    pcCase.x = sw - cw;
    casePhysics.vx = -casePhysics.vx * casePhysics.bounce;
  }
  // 顶部碰撞
  if (pcCase.y <= 0) {
    pcCase.y = 0;
    casePhysics.vy = -casePhysics.vy * casePhysics.bounce;
  }

  if (settled) casePhysics.isActive = false;
}

// 机箱拖动事件
pcCase.eventMode = 'static';
pcCase.cursor = 'pointer';
pcCase.hitArea = new PIXI.Rectangle(0, 0, 1, 1); // 临时，layoutCase中更新
pcCase.on('pointerdown', startCaseDrag);
pcCase.on('pointermove', updateCaseDrag);
pcCase.on('pointerup', endCaseDrag);
pcCase.on('pointerupoutside', endCaseDrag);

function layoutCase() {
  // RTX3080数量>=9时切换为升级机箱贴图
  const useUpgraded = state.machines.rtx3080.count >= 9;
  const targetSource = useUpgraded ? ASSETS.pc_case_upgraded : ASSETS.pc_case;
  const newTexture = PIXI.Texture.from(targetSource);
  if (pcCase.texture !== newTexture) {
    pcCase.texture = newTexture;
  }
  const maxCaseH = app.screen.height * 0.42;
  const maxWByHeight = maxCaseH * pcCase.texture.width / pcCase.texture.height;
  const targetW = Math.min(app.screen.width * 0.38, 420, maxWByHeight);
  const s = targetW / pcCase.texture.width;
  const caseH = pcCase.texture.height * s;
  pcCase.scale.set(s);
  const bottomMargin = Math.min(80, app.screen.height * 0.06);
  const defaultX = app.screen.width * 0.28;
  const defaultY = app.screen.height - caseH - bottomMargin - 65;
  const hasFirstGpu = state.machines.rtx3080.count > 0;
  // 只在机箱首次显示时设置默认位置，之后永远不主动改变x/y
  if (hasFirstGpu && !caseInitialized) {
    pcCase.x = defaultX;
    pcCase.y = defaultY;
    caseInitialized = true;
  }
  const ps = targetW * 0.82 / casePlaceholder.texture.width;
  casePlaceholder.scale.set(ps);
  casePlaceholder.x = defaultX;
  casePlaceholder.y = defaultY + (caseH - casePlaceholder.texture.height * ps) / 2;
  casePlaceholder.visible = !hasFirstGpu;
  pcCase.visible = hasFirstGpu;

  // 风扇：机箱镜像位置（右侧），竖长造型
  const maxFanH = app.screen.height * 0.48;
  const fanS = maxFanH / fanSprite.texture.height;
  const fanW = fanSprite.texture.width * fanS;
  fanSprite.scale.set(fanS);
  // 镜像：机箱左边距28%，风扇右边距也28%
  fanSprite.x = app.screen.width * 0.72 - fanW;
  fanSprite.y = app.screen.height - maxFanH - bottomMargin - 65;
  fanSprite.visible = state.cooling.fan.count > 0;

  // 记录地面高度（物理系统用）
  casePhysics.groundY = defaultY;
  // 更新机箱hitArea为实际大小
  pcCase.hitArea = new PIXI.Rectangle(0, 0, pcCase.texture.width, pcCase.texture.height);
}

// ==================== 购买面板 ====================
const purchasePanel = new PIXI.Container();
layers.ui.addChild(purchasePanel);

const purchaseBtn = new PIXI.Container();
const purchaseBtnBg = new PIXI.Graphics();
const purchaseArrow = new PIXI.Graphics();
const purchaseText = makeText('购\n买', { size: 15, color: '#fff5e6', weight: 'bold', align: 'center', anchor: 0.5, lineHeight: 18 });
purchaseBtn.addChild(purchaseBtnBg, purchaseArrow, purchaseText);

const panelContent = new PIXI.Container();
const panelBg = new PIXI.Graphics();
panelContent.addChild(panelBg);
purchasePanel.addChild(panelContent, purchaseBtn);

let panelExpanded = false;
const panelW = 360;
const panelH = 420;

function drawPurchaseArrow(expanded) {
  purchaseArrow.clear();
  purchaseArrow.lineStyle(2.5, 0xfff5e6, 0.9);
  const cx = 21, cy = 18;
  if (expanded) {
    purchaseArrow.moveTo(cx - 6, cy + 4);
    purchaseArrow.lineTo(cx, cy - 4);
    purchaseArrow.lineTo(cx + 6, cy + 4);
  } else {
    purchaseArrow.moveTo(cx - 4, cy - 6);
    purchaseArrow.lineTo(cx + 4, cy);
    purchaseArrow.lineTo(cx - 4, cy + 6);

const allBuyItems = [];

// 只有"可负担/已拥有/数量"状态变化时才重绘 Graphics,每帧仅做几次比较
function refreshBuyItem(item, force) {
  const ownedNow = item.oneTime && item.owned();
  const lockedNow = item.lockedFn && item.lockedFn();
  const price = item.priceFn();
  const afford = !ownedNow && !lockedNow && state.tokens >= price;
  const count = item.countFn ? item.countFn() : 0;
  const key = (ownedNow ? 'o' : lockedNow ? 'l' : afford ? 'a' : 'p') + ':' + count;
  if (!force && item._uiKey === key) return;
  item._uiKey = key;
  if (ownedNow) {
    item.priceText.text = '已拥有';
    item.countText.text = '';
    drawBuyButton(item.bg, false, item.buyColor);
  } else if (lockedNow) {
    // 锁定状态:显示提示文字,按钮灰色不可点击
    item.priceText.text = item.lockHintFn ? item.lockHintFn() : '未解锁';
    if (item.countFn) {
      item.countText.text = count > 0 ? 'x' + count : '';
      item.countText.x = item.nameText.x + item.nameText.width + 6;
    }
    drawBuyButton(item.bg, false, item.buyColor);
  } else {
    item.priceText.text = price + ' token';
    if (item.countFn) {
      item.countText.text = count > 0 ? 'x' + count : '';
      item.countText.x = item.nameText.x + item.nameText.width + 6;
    }
    drawBuyButton(item.bg, afford, item.buyColor);
  }
}

function updateAllBuyButtons(force) {
  for (const item of allBuyItems) refreshBuyItem(item, force);
}

function createBuyItem(container, y, iconDraw, name, desc, priceFn, buyColor, onBuy, oneTime, owned, countFn, lockedFn, lockHintFn) {
  const bg = new PIXI.Graphics();
  bg.x = 20; bg.y = y;
  container.addChild(bg);

  const icon = new PIXI.Graphics();
  icon.x = 28; icon.y = y + 12;
  iconDraw(icon);
  container.addChild(icon);

  const nameText = makeText(name, { size: 15, color: '#fff5e6', weight: 'bold' });
  nameText.x = 80; nameText.y = y + 14;
  container.addChild(nameText);

  const countText = makeText('', { size: 13, color: '#ffd98a', weight: 'bold' });
  countText.y = y + 14;
  container.addChild(countText);

  const descText = makeText(desc, { size: 11, color: '#d4c4a8' });
  descText.x = 80; descText.y = y + 36;
  container.addChild(descText);

  const priceText = makeText('', { size: 14, color: '#ffd98a', weight: 'bold', anchor: 1 });
  priceText.x = panelW - 24; priceText.y = y + 30;
  container.addChild(priceText);

  const item = { bg, nameText, countText, priceText, priceFn, oneTime, owned, countFn, buyColor, lockedFn, lockHintFn, _uiKey: null };
  refreshBuyItem(item, true);

  bg.eventMode = 'static';
  bg.cursor = 'pointer';
  bg.hitArea = new PIXI.Rectangle(0, 0, 320, 68);
  bg.on('pointerdown', () => {
    if (oneTime && owned()) return;
    if (lockedFn && lockedFn()) return; // 锁定状态不可购买
    const price = priceFn();
    if (state.tokens >= price) {
      state.tokens -= price;
      playSfx('buy'); // 所有购买共用一个扣款点(机器/散热/脚本/服务器)
      onBuy();
      refreshBuyItem(item, true);
      updateAllBuyButtons();
      updateTokenDisplay();
      layoutCase();
      updateRelayTabVisibility();
      saveGame();
    }
  });

  allBuyItems.push(item);
  return item;
}

function layoutNavTabs() {
  const w = 104, h = 42, gap = 18;
  const vis = TABS.filter(t => t.container.visible);
  // 右下角站着人物(layoutCharacters 用的同一套尺寸)。旧版把标签均匀铺满整屏宽,
  // 最后一个标签会正好压在人物身上 → 这里改成:先按屏宽居中,再整体左移到人物左边。
  const charW = Math.min(340, app.screen.height * 0.4);
  const rightLimit = app.screen.width - charW - 16;
  const totalW = vis.length * w + Math.max(0, vis.length - 1) * gap;
  let startX = Math.min((app.screen.width - totalW) / 2, rightLimit - totalW);
  startX = Math.max(startX, 12);
  vis.forEach((t, i) => {
    t.container.x = startX + i * (w + gap);
    t.container.y = app.screen.height - h - 14;
    // 高亮当前场景:这里统一画,避免"布局函数画一种颜色、切换函数再覆盖另一种"的两处不同步
    roundRect(t.bg, 0, 0, w, h, 10, navScene === t.key ? t.on : t.off, 0.85);
    t.text.x = w / 2;
    t.text.y = h / 2;
  });
}

function switchScene(name) {
  // 中转站/调教常显但未解锁:买了服务器才放行。点击冒提示 —— 原地保持 1.6s 再缓慢淡出
  if ((name === 'relay' || name === 'tune') && state.machines.server.count <= 0) {
    const tb = tabOf(name).container;
    if (sceneHint) { sceneHint.destroy(); sceneHint = null; }
    const hint = makeText('暂未解锁 · 购买服务器后开放', { size: 15, color: '#ffd98a', weight: 'bold', anchor: 0.5 });
    hint.x = tb.x + 52;
    hint.y = tb.y - 34;
    floatTexts.addChild(hint);
    sceneHint = hint;
    setTimeout(() => {
      if (sceneHint !== hint) return;
      tween(hint, { alpha: 0 }, 1.2, () => { hint.destroy(); sceneHint = null; });
    }, 1600);
    return;
  }
  if (name !== 'relay' && relaySceneOpen) closeRelayScene();
  if (name !== 'tune' && tuneSceneOpen) closeTuneScene();
  if (name === 'relay' && !relaySceneOpen) openRelayScene();
  if (name === 'tune' && !tuneSceneOpen) openTuneScene();
  navScene = name;
  layoutNavTabs();
}

// 属性 → 派生量。三处互逆:ctxK() ↔ 长上下文属性、cutoffMonths() ↔ 知识属性。
// 上下文区间 0k ~ 1000k(2026-09-11 用户改:原来 20k 起步,8k 的小模型属性被顶死在 0)。
// 曲线 = 平移对数:x=0 → 恰好 0k、x=100 → 1000k,中高段保持对数手感,严格递增、可精确反解。
const CTX_MAX_K = 1000, CTX_RATIO = 50;
const KNOW_M0 = 2024 * 12 + 8;    // 知识=5   → 2024-08
const KNOW_M1 = 2026 * 12 + 9;    // 知识=100 → 2026-09
const TOK_PER_SPEED_POINT = 3;    // 2026-09-11 用户改:1 分 = 3 tok/s(原 2)

function ctxK(longCtx)      { return CTX_MAX_K * (Math.pow(CTX_RATIO, longCtx / 100) - 1) / (CTX_RATIO - 1); }
function tokPerSec(speed)   { return speed * TOK_PER_SPEED_POINT; }
function cutoffMonths(know) { return KNOW_M0 + (know - 5) * (KNOW_M1 - KNOW_M0) / 95; }
// 月份存的是 年*12 + 月(1~12),不是 0-indexed —— 曾经按 0-indexed 还原,所有日期显示都差一个月
function monthsStr(m)       { m = Math.round(m); const y = Math.floor((m - 1) / 12), mo = m - y * 12; return y + '-' + (mo < 10 ? '0' : '') + mo; }
// 长上下文属性 → 上下文 的逆映射(ctxK 的反函数),deriveModelAttrs 用
function ctxAttr(ctxKv)     { return 100 * Math.log(1 + (CTX_RATIO - 1) * ctxKv / CTX_MAX_K) / Math.log(CTX_RATIO); }
function modelCapability(a) {

  // 推理决定这些能力用不用得上:推理 0 时三者一律 0 分,推理 100 时足额给(× reasoning/100)。
  // 权重都刻意小于主项(CAP_W),加分 = 属性值 × 权重,直接进 core(照样吃知识/拟合乘区)。
  const gate = a.reasoning / 100;
  const ctxW = a.longCtx >= 60 ? CAP_CTX_W_HI : CAP_CTX_W_LO;   // 长上下文 60 分两档,高档略大
  const mmW = a.multimodal > 60 ? CAP_MM_W_HIGH                 // >60(文图视PDF):比 LOW 略高
    : a.multimodal >= 40 ? CAP_MM_W_MID                          // 40–60(文图/文图视):最小,平台期不给甜头
    : CAP_MM_W_LOW;                                              // <40(纯文本):小权重
  const core = a.reasoning * CAP_W.reasoning + a.instruct * CAP_W.instruct + a.toolCall * CAP_W.toolCall
    + a.speed * CAP_SPEED_W * gate
    + a.longCtx * ctxW * gate
    + a.multimodal * mmW * gate;

  // gate = 推理/100:推理 100 时足额 ±25%(与旧公式一致),推理 0 时知识不起作用(倍率恒 1)。
  const knowMul = 1 + ((a.knowledge - 50) / 200) * (a.reasoning / 100);
  const fitMul = 1 - CAP_FIT_PENALTY * Math.pow(Math.abs(a.fit - CAP_FIT_OPT) / 70, CAP_FIT_EXP);
  return Math.max(0, Math.min(100, core * knowMul * fitMul / CAP_NORM));
}

function deriveModelAttrs(m) {

  // 推理/知识/长上下/速度/多模态/指令/工具/拟合/参数)时**直接采用**,不再从 cap 硬推;

  if (m.ax) {
    return {
      reasoning: m.ax[0], knowledge: m.ax[1], longCtx: m.ax[2], speed: m.ax[3],
      multimodal: m.ax[4], instruct: m.ax[5], toolCall: m.ax[6], fit: m.ax[7], params: m.ax[8],

  }
  const ao = ctxAttr(m.c);   // 0k~1000k 平移对数的逆映射(见 ctxK/ctxAttr 定义处)
  // 知识属性必须能反推回 m.k 的月份(设计文档 §3.3:与 cutoff() 互逆)。
  // 这里曾经写成 `m.k ? 5 : 0` —— m.k 是 'YYYY-MM' 字符串恒为真,于是**每个模型的知识都恒等于 10**,

  const know = 5 + (monthsFromStr(m.k) - KNOW_M0) * 95 / (KNOW_M1 - KNOW_M0);

    longCtx: Math.max(0, Math.min(100, ao)),
    // 速度:锚定 §3.1 的 AA 实测 tok/s(ts / 3,与 tokPerSec 互逆)——2026-09-12 最终定稿。
    // 这样 cap 重排/任何其它调整都不会再拖动速度(用户要求:不要轻易修改速度属性)。
    // 能力公式里的速度项(0.06 × 推理闸门)基于此值,单项影响 <1 分。
    speed: Math.max(0, Math.min(100, m.ts / TOK_PER_SPEED_POINT)),
    knowledge: Math.max(0, Math.min(100, know)),
    multimodal: [10, 45, 55, 65][m.m] || 10,
    toolCall: m.tools ? 75 : 12,
    instruct: Math.max(0, Math.min(100, m.cap * 0.95 + 4)),
    reasoning: Math.max(0, Math.min(100, m.cap * 1.02 + 3)),
    // 拟合/参数是内部量,真实模型无从反推,按「训练良好的成品」给锚点:
    // 拟合贴近最优点(略偏高,量产模型通常轻微过拟合),参数随能力规模走。
    // 只用于雷达图对照;相似度距离(SIM_W)不含这两个键,所以不影响 closestModel。
    fit: Math.min(100, CAP_FIT_OPT + m.cap * 0.10),
    params: Math.min(100, m.cap * 0.90 + 5),

// 用 Δ 而不是直接拿派生值排,是因为两套刻度有系统差(旗舰派生 ~78 vs 设计 cap 87):
// 直接换刻度会导致"改 1 点属性名次猛跳几位"。Δ 方案:没改的模型顺序与 §3.1 完全一致,
// 改多少、挪多少,顺手感。REAL_MODELS 数组本身仍不动(closestModel 等不受影响)。
function effectiveCap(m) {
  if (!MODEL_ATTR_OVERRIDE[m.n]) return m.cap;
  const before = modelCapability(deriveModelAttrs(m));
  const after = modelCapability(modelToAttrs(m));
  return m.cap + (after - before);
}
// 有效知识截止日期:编辑器改了「知识」后,所有显示日期的地方(编辑器左上角、榜单截止列)
// 都跟着 cutoffMonths() 反推(与知识属性互逆,见 §2.1)。没改过的模型就是表里的静态 m.k。
function effectiveCutoff(m) {
  const ov = MODEL_ATTR_OVERRIDE[m.n];
  if (!ov || ov.knowledge === undefined) return m.k;   // 没改知识 = 表里静态日期(避免钳位反推失真)
  return monthsStr(cutoffMonths(ov.knowledge));        // 改了 → 按改后的知识反推

// 榜单显示顺序:按有效 cap 降序(平手按原表序)。每帧排序 56 条,开销可忽略。
function boardOrder() {
  return REAL_MODELS
    .map((m, i) => ({ m, i }))
    .sort((a, b) => (effectiveCap(b.m) - effectiveCap(a.m)) || (a.i - b.i));
}
// 【临时调试】合并覆盖值(编辑器手改的等效属性);注意它依赖下方 MODEL_ATTR_OVERRIDE(运行时才取,无初始化顺序问题)
function modelToAttrs(m) {
  const a = deriveModelAttrs(m);
  const ov = MODEL_ATTR_OVERRIDE[m.n];
  return ov ? Object.assign(a, ov) : a;
}
function modelCapabilityOf(m) { return modelCapability(modelToAttrs(m)); }

// "最接近的模型"(设计文档第 4 节):7 维加权距离 + 两个硬门槛,取最小距离者
function closestModel(a) {
  const cutoff = cutoffMonths(a.knowledge);
  let best = null, bestD = Infinity;
  for (const m of REAL_MODELS) {
    const ma = modelToAttrs(m);
    let d = 0;
    // ⚠️ 与 rawSimilarityTo 内的循环保持逐字一致(方向折扣见 SIM_OVER_K 定义处),否则口径分叉。
    for (const k of SIM_KEYS) { const df = (a[k] || 0) - (ma[k] || 0); d += SIM_W[k] * (df > 0 ? df * SIM_OVER_K : -df) / 100; }
    const mCut = monthsFromStr(m.k);
    if (cutoff < mCut - 3) d += SIM_GATE_KNOWLEDGE;
    if (a.multimodal < ma.multimodal) d += SIM_GATE_MULTIMODAL;
    // §21.1/§21.2:「相称」还要看能力量级 —— 对数比 + 门槛后平方(见 CAP_SIM_W / CAP_SIM_T0 定义处)
    const lcap = Math.abs(Math.log(Math.max(modelCapability(a), 1) / Math.max(m.cap, 1)));
    d += CAP_SIM_W * Math.pow(Math.max(0, lcap - CAP_SIM_T0) / CAP_SIM_T0, 2) * 4;
    if (d < bestD) { bestD = d; best = m; }
  }
  return { model: best, distance: bestD, similarity: Math.max(0, Math.round(100 * (1 - bestD / SIM_SAT))) };
}
function monthsFromStr(s) { const p = String(s).split('-'); return (+p[0]) * 12 + (+p[1]); }

  // GOUGE_REP_K:信誉罚强度(累积量 → 开方压缩)。

  //    玩家看不到「慢慢崩」的过程,开方把它压成加性,保留过程感。prem = 卖价/相称价 − 法定上限。

// 对「某个指定模型」的属性相似度(逐维覆盖加权,0~100,不含能力倍率)。
// SIM_KEYS 含参数;硬门槛已软化(知识0.18/多模态0.20)。SIM_SAT=1.0 距离满 1 才归零。
// ⚠️ 2026-10-11 起距离**不再对称**:我比它强的维度按 SIM_OVER_K 折减,只有「我更弱」才全额扣。
//    「相似」的语义因此是「我能不能兑现这个标榜」——只能我不如它,不能它不如我(见 SIM_OVER_K 定义处)。
function rawSimilarityTo(a, m) {
  const ma = modelToAttrs(m);
  const cutoff = cutoffMonths(a.knowledge);
  let d = 0;
  // 距离只算「我比它弱」的那一侧:我更强(df>0)的部分按 SIM_OVER_K 折减(取值依据见 SIM_OVER_K 定义处)。
  // ⚠️ closestModel 里有一份**逐字相同**的循环,两处必须同步改,否则「最接近模型」与「有效相似」口径打架。
  for (const k of SIM_KEYS) { const df = (a[k] || 0) - (ma[k] || 0); d += SIM_W[k] * (df > 0 ? df * SIM_OVER_K : -df) / 100; }
  if (cutoff < monthsFromStr(m.k) - 3) d += SIM_GATE_KNOWLEDGE;
  if (a.multimodal < ma.multimodal) d += SIM_GATE_MULTIMODAL;
  return Math.max(0, 100 * (1 - d / SIM_SAT));
}
// 能力倍率:我的 cap / 标榜 cap,幂函数(§14.11,2026-09-12 用户定稿改版)。
// 不再固定 ×1.5:足够强就能靠能力「击破」属性相似的不足。
// 指数 0.4→0.5(曲率加大);下限仍 0.4;上限只留安全垫 6(正常练不到)。
// 比值 1→1.00  2→~1.41  4→~2.00  0.5→~0.71
const CAP_MUL_EXP = 0.5;
const CAP_MUL_MIN = 0.4;
const CAP_MUL_MAX = 6;
// §21.1(2026-10-20):软饱和 —— 比值越大,超出 1 的那部分折扣越重。
//   病灶:纯幂函数在「满配打低端」时倍率可达 5×,有效相似被顶到 200 上限并列(实测满配玩家 61 条里 9 条撞顶),
//   于是「谁更相称」失去区分度(全都显示 200%)。
//   扫描 exp{0.5,0.4,0.35,0.3}×satK{0,0.5,1}:satK=1 时撞顶 0 条、最高 182%(不再并列),且不削弱高配正向感
//   ⇒ 保留 EXP=0.5(§14.11 定稿值不动),只加软饱和。
const CAP_MUL_SAT_K = 0;     // ⚠️ 2026-10-20 实测回退:软饱和(satK=1)虽消除 200 撞顶,但它**整体抬高所有 similarityTo**,
                             //   连带把诚实线的有效相似推过 SIM_GATE(80) ⇒ relayGougePayMul 的闸① 直接 return 1、
                             //   虚标折价整层失效(D30 诚实线刀乐 0.24→1.58,+558%,虚折 0.04→1.00)。
                             //   ⇒ 「有效相似」是**多处机制共用的判定口径**,不能为了让显示好看而整体抬升。
                             //   撞顶问题改由「显示层并列」单独处理(见 §21.1 说明),机制值保持 §14.11 定稿。
                             //   保留此旋钮:0 = 旧行为(纯幂函数),>0 = 软饱和(仅作实验用,勿直接用)。
function capMulTo(a, m) {
  const myCap = Math.max(modelCapability(a), 1);
  const listCap = Math.max(m.cap, 1);
  const r = myCap / listCap;
  const raw = Math.pow(r, CAP_MUL_EXP);
  // 软饱和:只有「我更强」(r>1、raw>1)时折减;低于 1 的一侧保持原样(弱就该罚,§14.11)
  const mul = r > 1 && CAP_MUL_SAT_K > 0
    ? 1 + (raw - 1) / (1 + CAP_MUL_SAT_K * (r - 1) * 0.1)
    : raw;
  return Math.max(CAP_MUL_MIN, Math.min(CAP_MUL_MAX, mul));
}
// 有效相似度 = 属性相似 × 能力倍率。可 >100(高配低标 / 能力溢出的「灰测」感)。
// 上限 200(原 140,配合无 1.5 封顶的倍率,给「强模型击破」留显示空间)。
function similarityTo(a, m) {
  const raw = rawSimilarityTo(a, m);
  const mul = capMulTo(a, m);
  return Math.min(200, raw * mul);
}

function simBreakdown(a, m) {
  const raw = rawSimilarityTo(a, m);
  const mul = capMulTo(a, m);
  const eff = Math.min(200, raw * mul);
  return { raw, mul, eff, text: '基础' + raw.toFixed(0) + '% × 能力' + mul.toFixed(2) + '× = 有效相似' + eff.toFixed(0) + '%' };
}

function newsEffectLabel(fx) {
  if (!fx) return '';
  return fx.text || '';
}

function newsTargetVendor(entry) {
  const fx = entry.fx || {};
  return fx.vendor || null;
}

// 帖子加成:{ vendor, kind:'guide'|'neutral', untilH, weight } —— 影响下一篇同厂抽中权重 / 或对当前负面做一次冲销
function newsBoosts(R) {
  if (!R.news) R.news = newsDefaults();
  return R.news.boosts || (R.news.boosts = []);
}

function newsDefaults() {
  return {
    totalH: 0,
    nextSpawnH: NEWS_INTERVAL_H,
    active: [],          // [{ key, id, type, title, body, fxText, bornH, expireH, fx, fx2, likes, shares, favs, vendor }]
    collected: {},       // id -> true
    boosts: [],          // [{ vendor, kind, untilH }]
  };
}

function applyNewsFx(fx) {
  if (!fx) return;
  const R = state.relay;
  if (fx.kind === 'price') return; // price 挂在 active 上,不直接改 state
  if (fx.kind === 'rep') {
    // 低信誉时社区负面砸盘减半(原先 -3~-6 可从 5 直接打到 0,之后显示 0、并无「隐藏负债」)
    let v = fx.v;
    if (v < 0 && R.reputation < 10) v *= 0.5;
    R.reputation = Math.max(0, Math.min(100, R.reputation + v));
    return;
  }
  if (fx.kind === 'usersAll') {
    const n = Math.max(0, Math.round(R.users * (1 + fx.pct)));
    // 重掷部分时长,保持简单:按比例缩放 slots
    if (fx.pct < 0) {
      const drop = Math.max(0, R.users - n);
      for (let i = 0; i < drop && R.userSlots.length > 0; i++) R.userSlots.pop();
    } else {
      const add = n - R.users;
      for (let i = 0; i < add; i++) {
        // surge:true = 新闻带来的外部流量,不受工具调用并发上限约束(P1-6)
        R.userSlots.push({ leftH: 2 + Math.random() * (4 + R.reputation / 50), surge: true });
      }
    }
    R.users = R.userSlots.length;
    return;
  }
  if (fx.kind === 'users' && fx.ifListed) {
    const listed = relayListedModel();
    if (!listed) return;
    if (fx.vendor && listed.v !== fx.vendor && listed.v.indexOf(fx.vendor) < 0) return;
    if (fx.model && listed.n !== fx.model) return;
    applyNewsFx({ kind: 'usersAll', pct: fx.pct });
    return;
  }
  if (fx.kind === 'usersRoll' && fx.ifListed) {
    const listed = relayListedModel();
    if (!listed) return;
    if (fx.vendor && listed.v !== fx.vendor && listed.v.indexOf(fx.vendor) < 0) return;
    const up = Math.random() < 0.55;
    applyNewsFx({ kind: 'usersAll', pct: up ? fx.up : -fx.down });
    return;
  }
  // blackbox 特殊:无 vendor 时按相似度
  if (fx.kind === 'users' && !fx.vendor && !fx.model) {
    const listed = relayListedModel();
    if (!listed) return;
    const sim = similarityTo(R.ability, listed);
    applyNewsFx({ kind: 'usersAll', pct: sim >= 80 ? 0.10 : -0.15 });
  }
}

function newsPriceMulFor(m) {
  const R = state.relay;
  if (!R.news || !R.news.active) return 1;
  let mul = 1;
  for (const a of R.news.active) {
    if (a.type !== 'price' || !a.fx || a.fx.kind !== 'price') continue;
    const fx = a.fx;
    let hit = false;
    if (fx.model && m.n === fx.model) hit = true;
    else if (fx.vendor === '*') hit = true;
    else if (fx.vendor && (m.v === fx.vendor || m.v.indexOf(fx.vendor) >= 0)) hit = true;
    if (hit) mul = fx.mul; // 覆盖,不叠乘
  }
  return mul;
}

function spawnNews() {
  const R = state.relay;
  if (!R.news) R.news = newsDefaults();
  // 清过期
  R.news.active = R.news.active.filter(a => a.expireH > R.news.totalH);
  if (R.news.active.length >= NEWS_MAX_ACTIVE) return null;

  // 权重抽
  const boosts = newsBoosts(R).filter(b => b.untilH > R.news.totalH);
  R.news.boosts = boosts;
  const cands = [];
  for (const e of NEWS_POOL) {
    if (R.news.active.some(a => a.id === e.id)) continue;
    let w = e.rare || 1;
    const ven = newsTargetVendor(e);
    for (const b of boosts) {
      if (!ven || ven === '*' || (b.vendor && ven.indexOf(b.vendor) >= 0) || (e.fx && e.fx.vendor && b.vendor && e.fx.vendor.indexOf(b.vendor) >= 0)) {
        if (b.kind === 'guide') w *= 2.2;
        else if (b.kind === 'neutral') w *= 1.4;
      }
    }
    cands.push({ e, w });
  }
  if (!cands.length) return null;
  let sum = 0;
  for (const c of cands) sum += c.w;
  let r = Math.random() * sum;
  let pick = cands[0].e;
  for (const c of cands) {
    r -= c.w;
    if (r <= 0) { pick = c.e; break; }
  }

  const key = pick.id + '#' + Math.floor(R.news.totalH);
  const likes = Math.floor(8 + Math.random() * (pick.rare < 0.4 ? 800 : 180));
  const shares = Math.floor(2 + Math.random() * (pick.rare < 0.4 ? 200 : 40));
  const favs = Math.floor(1 + Math.random() * (pick.rare < 0.4 ? 120 : 30));
  const item = {
    key,
    id: pick.id,
    type: pick.type,
    title: pick.title,
    body: pick.body,
    fx: pick.fx ? Object.assign({}, pick.fx) : null,
    fx2: pick.fx2 ? Object.assign({}, pick.fx2) : null,
    fxText: [newsEffectLabel(pick.fx), newsEffectLabel(pick.fx2)].filter(Boolean).join(' · '),
    vendor: newsTargetVendor(pick) || (pick.fx && pick.fx.vendor) || null,
    bornH: R.news.totalH,
    expireH: R.news.totalH + NEWS_LIFE_H,
    likes, shares, favs,
    viewed: false,
  };

  // price 同目标:覆盖旧的
  if (item.type === 'price' && item.fx && item.fx.kind === 'price') {
    R.news.active = R.news.active.filter(a => {
      if (a.type !== 'price' || !a.fx) return true;
      const same =
        (item.fx.model && a.fx.model === item.fx.model) ||
        (item.fx.vendor === '*') ||
        (item.fx.vendor && a.fx.vendor === item.fx.vendor) ||
        (a.fx.vendor === '*');
      return !same;
    });
  }

  // 应用一次性效果
  applyNewsFx(item.fx);
  applyNewsFx(item.fx2);
  // 对「中和」:若抽到负面 station/traffic 且有 neutral 加成,小概率减半(简化:信誉/用户补偿一半)
  // 已在 apply 后,不再拆;引导主要靠权重

  R.news.active.unshift(item);
  R.news.collected[item.id] = true;
  return item;
}

function newsTick(gameHours) {
  const R = state.relay;
  if (!R.news) R.news = newsDefaults();
  R.news.totalH += gameHours;
  R.news.active = R.news.active.filter(a => a.expireH > R.news.totalH);
  while (R.news.totalH >= R.news.nextSpawnH) {
    R.news.nextSpawnH += NEWS_INTERVAL_H;
    spawnNews();
  }
}

// 官方参考价:基础 blend × 活跃 price 系数(覆盖)
function officialPriceOf(m) {
  const base = blendPriceNum(m);
  const R = state.relay;
  if (!R.news || !R.news.active) return base;
  // 新闻系数会带浮点尾数(如 0.8×16=12.800000000000001),价格/价格带/两条线全从这走 → 统一钳到分
  // ⚠️ 别用 Math.round(x*100)/100:x=63.99999999999999 会被放大成 64(实测踩过),toFixed 才是按十进制舍入
  return Number((base * newsPriceMulFor(m)).toFixed(2));
}

// 能力相称价(2026-10-12 星光定稿):玩家「实际值多少钱」= 最接近模型的官价。
// ★ 为什么需要它:定价的合法性应由**你实际交付的东西**决定,而不是你**声称的东西**。
//   旧的高溢价加罚锚在「标榜对象的官价」上 —— 而标榜对象是玩家自己挑的,
//   于是只要标一个贵模型,prem = 卖价/官价 − 1.1 就恒等于 0.4(价格带上限恰好 = 官价×1.5),
//   加罚退化成常数 ×5:对「假得离谱」和「只差一点」一视同仁(实测 8 个能力档位全是 ×5.0)。
//   换成能力相称价后,同样卖 $60:cap21 的玩家是 2990 倍、cap92 的玩家是 20 倍 —— 区分度回来了。
// 复用 closestModel(主跌分支本来就调用它),零额外开销。
function fairPriceOf(a) {
  const cl = closestModel(a);
  return cl.model ? officialPriceOf(cl.model) : 0;
}

// 硬价格带:官价 × [PRICE_MIN, PRICE_MAX](无官价时只保证 >0)
function relayPriceBand(official) {
  if (!(official > 0)) return { min: 0.01, max: Infinity };
  return { min: official * RELAY_BIZ.PRICE_MIN, max: official * RELAY_BIZ.PRICE_MAX };
}
function clampRelayPrice(p, official) {
  const b = relayPriceBand(official);
  let v = p;
  if (v < b.min) v = b.min;
  if (v > b.max) v = b.max;
  return Math.round(v * 100) / 100;
}
// 层2(已删,2026-10-05 减层):原 relayPricePayMul「超续约线成交折价」与用量压制(relayUsageMul)
// 双重折算单位收益 —— 高价惩罚四层叠加把 1.5× 定价打成自杀选项(见 RELAY_BIZ 减层注释)。
// 单位收益惩罚现在由用量压制独自承担。
// 层4:货不对板不许收原价 —— 有效相似 <80 时按比例折成交(sim/80,下限 0.5)
function relayTrustMul(listed) {
  if (!listed) return 1;
  const sim = similarityTo(state.relay.ability, listed);
  if (sim >= 80) return 1;
  return Math.max(0.5, sim / 80);
}
// 层5:虚标折价(2026-10-12 新增;同日改为幂律 + 加相似度闸 + 阈值抬到法定上限)。
// ⚠️ 为什么需要它:层4 只看相似度,于是「标 $40 的模型卖 $60、而自己只值 $0.20」仍能拿 0.5 折。
//    信誉罚也只是把用户数砍到约 1/3 —— 单价差 250 倍 vs 用户数差 3 倍,虚标收入依旧远高于诚实。
// ★ 三道闸各修一个实测出来的坑(2026-10-12):
//   ① 相似度闸:与 relayRepSettle 的 <80 分支对齐。此前价格层没有这道闸,于是
//      「高配低标」(有效相似 >100 —— 我比标榜对象还强)也被罚:实测诚实线 D8-14 被误伤到 0.34,
//      而当时它是 仿=200 的**超额交付**。那是信誉系统明确奖励(只升不降)的诚实策略,绝不该吃虚标罚。
//   ② 阈值抬到法定上限(fair × PRICE_MAX):见 RELAY_BIZ 处推导 ——
//      让触发条件严格等价于「标榜对象比自己值钱」,顺带不再对合法价格带上半段双重收费。
//   ③ 幂律替代开方:折扣是逐笔独立作用的瞬时量,不存在累积清零问题(见 RELAY_BIZ.GOUGE_PAY_EXP)。
function relayGougePayMul(listed, price) {
  if (!listed || !(price > 0)) return 1;
  // ⚠️ SIM_GATE 属于 PUBLISH_CFG(发布线门槛),**不在** RELAY_BIZ 里 ——
  //    写成 RELAY_BIZ.SIM_GATE 会取到 undefined,而 `x >= undefined` 恒为 false
  //    ⇒ 闸门静默失效、误伤照旧(2026-10-12 被 sim/verify_gouge.js 当场抓出)。
  if (similarityTo(state.relay.ability, listed) >= PUBLISH_CFG.SIM_GATE) return 1;
  const fair = fairPriceOf(state.relay.ability);
  if (!(fair > 0)) return 1;
  const over = price / (fair * RELAY_BIZ.PRICE_MAX);   // 卖价 = 「法定上限价」的 over 倍
  if (over <= 1) return 1;
  return Math.pow(1 / over, RELAY_BIZ.GOUGE_PAY_EXP);
}
// 卖出用的综合成交系数(2026-10-05 减层后 = 信誉风险一项;price/official 参数保留以稳定调用点)
// 2026-10-12:叠加层5 虚标折价。两层的乘积会同时出现在真实结算与 UI 预估上(调用点共用本函数)。
function relaySellPayMul(listed, price, official) {
  return relayTrustMul(listed) * relayGougePayMul(listed, price);
}

function relayListedModel() { return findModelByName(state.relay.listedModel); }
// 客流基数 base(P0-D1,2026-10-11):原来只有信誉一项 `2 + floor(信誉/25)`。
// ⚠️ 那条公式的天花板太低:信誉被 Math.min(100,…) 封顶 ⇒ floor(100/25)=4 ⇒ **base 最大只有 6**,
//    再叠加「稳态人数 = base × 新增概率 × 在网时长」(概率 0.10~0.35、时长 4~6 游戏时)
//    ⇒ 自然客流实际只有 0.8~3 人,30 天市场只能吃下 3.25M token,而产线供给 42M+(§20.7/§20.8)。
// 现追加「模型能力」项:trained 出来的模型越强,越有人愿意来试 —— 与
//    「练属性 → 模型强 → 客流大 → 卖得多」的主循环同向,也给能力分一条经营出口。
// 参数依据(sim/startup_loop.js 实测,seed 20261006,30 游戏天):
//    能力项除数  8(取) → base 9~10, 用户 2→8, 已卖 3.25M→7.72M(+138%), 刀乐 $0.66→$1.71
//                6      → base 12  , 用户 9(已撞 relayUserCap,开始浪费 base)
//                4      → base 17  , 用户 9(同上,多出的 base 全部无效)
//    ⚠️ 2026-10-12 更正:上面「两条约束都真的生效了」**当时就写错了** ——
//      实测 cap 天花板只有 12,而 base 的真实上限是 24(信誉硬顶 100 → +12,能力分满 → +10),
//      ⇒ cap 几乎总是先绑定,base 从 12 往上那半条被钳死。真因见 relayUserCap 与 §20.12;
//      本次把 cap 系数 0.1→0.2(cap 上限抬到 22)才修开。
// ⚠️ 门槛 20:模型能力低于 20 时不加成。开局能力分 ≈4 ⇒ 加成 0 ⇒ **起步期数值完全不变**(防早熟通胀)。
// ⚠️ 2026-10-12(§20.12)信誉项除数 25 → 8,**与能力项同分母**。两条理由:
//    ① 语义对称、好向玩家解释:信誉与能力分**各「每 8 点换 1 个基础客流」**;
//    ② 实测信誉项原本是**死项** —— 只把除数 25→12、12→8,诚实线毛收益一分不动(2.09→2.09),
//       因为 base 一直被 relayUserCap 钳着。所以必须**同时**松开 cap(见 relayUserCap),
//       松开后信誉分辨率才兑现:用户 7→14、毛收益 $2.09→$3.03、诚实÷跑分 0.79→1.15。
//    附带:旧式 floor(信誉/25) 在信誉 <25 时恒为 0 —— 诚实线攒到 20.8 一点客流都换不到。
function relayBaseUsers() {
  const rep = state.relay.reputation || 0;
  const mcap = modelCapability(state.relay.ability);
  const base = 2 + Math.floor(rep / 8) + Math.floor(Math.max(0, mcap - 20) / 8);
  // §17.6 考试过关奖励:用户量临时上调(体现「更多人知道」)。
  // ⚠️ 无 boost(或已过期)时**必须逐位返回原值** —— verify_users 的 42 项断言依赖它。
  const T = state.relay.train;
  const b = T && T.userBoost;
  if (!b) return base;
  const H = (state.relay.news && typeof state.relay.news.totalH === 'number') ? state.relay.news.totalH : 0;
  if (!(b.untilH > H) || !(b.pct > 0)) return base;
  return base + Math.floor(base * b.pct);
}
// 并发用户上限(P1-6,2026-10-03):工具调用决定「能同时服务多少用户」——
// ATTR_DESC.toolCall 早就写着这句承诺,但代码里从来没有上限,工具调用在经营层零出口。
// ⚠️ 不能照搬 §6.2 旧稿的 toolCall×1.2(工具100→120人):那是按旧稿「人/天」客流标的,
// 而 v1 的真实约束是**生产吞吐**(产出 ÷ (速度×活跃) ≈ 初始1.5 / 中期5 / 后期10 人),
// toolCall 从 5→100 只要 6→120,永远撞不到 → 照搬等于死代码。
// 改成 2 + toolCall×0.1(初始2 / 中期45→6 / 满100→12),与生产上限同量级 →
// 工具调用成为早中期的第二约束(想多接客,要么练工具调用,要么扩产),两条腿都要练。
// ⚠️ 只管自然增长;发布注入/新闻事件属于外部流量,可短时突破,撑不住由服务中断自然惩罚。
// ⚠️ 2026-10-12 更正(§20.12):系数 0.1 → 0.2。上面那句「工具调用成为早中期的第二约束」
//    在 0.1 时代**其实没成立** —— cap 天花板只有 12,而 base 真实上限是 24
//    ⇒ base 从 12 往上那半条(信誉项 + 能力项)全是死的;
//    实测只提信誉分辨率,收益 2.09→2.09 一分不动(见 relayBaseUsers 与 §20.12)。
//    改成 0.2 后两者**同量级**:base 真实上限 24(信誉硬顶 100 → +12,能力分满 100 → +10)
//    / cap 上限 22(toolCall 100 → floor(2+20))。差距 ≤2 ⇒ 谁先到顶取决于玩家的 build:
//      工具调用高、信誉/能力低 → 卡客源(base);信誉/能力高、工具调用低 → 卡并发(cap)。
//    这才对得起 P1-6 那句「想多接客,要么练工具调用,要么扩产,两条腿都要练」——
//    在 0.1 时代 cap 是唯一约束,base 那两条腿其实一条都没在走。
// ⚠️ 开局 toolCall≈5:旧 cap=2、新 cap=floor(2+1)=3;但开局 base 也恰好是 2 ⇒ **base 仍先绑定**,
//    实际人数不变(逐日 diff 已验证,见 §20.12 自测)。
function relayUserCap() { return Math.floor(2 + (state.relay.ability.toolCall || 0) * 0.2); }

// 增长权重(2026-10-04 软化 0.8 悬崖):增长线(官价×CHEAP_LINE)以下恒 1;
// 以上 FALLOFF 区间内线性衰减到 0。0.8=100% / 0.9=50% / 1.0=0%(FALLOFF=0.2 时)。
// 供 relayHourlyRefresh(实际增长)与后台 UI(状态行)共用,别在两处各写一份公式。
function relayGrowWeight(price, official) {
  if (!(price > 0) || !(official > 0)) return 0;
  const ratio = price / official;
  // C2(2026-10-13):贵过 GROW_NEG_RATIO 不再是「停止增长」而是净流失
  if (ratio >= RELAY_BIZ.GROW_NEG_RATIO) return -RELAY_BIZ.GROW_NEG_K;
  return Math.max(0, Math.min(1, (RELAY_BIZ.CHEAP_LINE + RELAY_BIZ.GROW_FALLOFF - ratio) / RELAY_BIZ.GROW_FALLOFF));
}

// 客户期待值→增长倍率(§18.2,2026-10-18)。纯缩放不设门槛(79→80 无断崖,与 cheapness/relayGrowWeight
// 的连续函数族同风格);钳位 [FLOOR, CAP=1] —— sim 可 >100(capMul 0.4~6),超过一律按 1 算。
function relayExpectMul() {
  const listed = relayListedModel();
  if (!listed) return 1;   // 自研:无「期待对象」,不适用(§5.4「完全不触发」)
  const sim = similarityTo(state.relay.ability, listed);
  return Math.max(RELAY_BIZ.EXPECT_GROW_FLOOR, Math.min(RELAY_BIZ.EXPECT_GROW_CAP, sim / 100));
}

// 用量系数(2026-10-04):定价对**单个用户消耗速度**的压制,补上「高价只挡新用户」的另一半。
// 增长线(官价×CHEAP_LINE)以下满速;以上随溢价线性衰减到 USAGE_FLOOR。
// 0.8×→100% / 1.0×→80% / 1.1×→70% / 1.5×→35%(K=1、FLOOR=0.35 时)。
// 自研(无官价)不适用:自研价本就钉死在 SELF_PRICE_MAX=$0.5,没有参照系也没有套利空间,
// 与 relayGrowWeight 返回 0 不同 —— 这里无参照返回 1(不压制)。
function relayUsageMul(price, official) {
  if (!(price > 0) || !(official > 0)) return 1;
  const ratio = price / official;
  if (ratio <= RELAY_BIZ.CHEAP_LINE) return 1;
  return Math.max(RELAY_BIZ.USAGE_FLOOR, 1 - (ratio - RELAY_BIZ.CHEAP_LINE) * RELAY_BIZ.USAGE_K);
}

// 续约衰减系数(2026-10-05 减层):原「>官价×1.1 续约一律拒绝」改概率线性衰减。
// ratio ≤ 1.1 → 100%;1.1~1.6 线性衰减;≥1.6 → 保底 RENEW_FLOOR。
// 1.3× → 70% / 1.5× → 40% / 2.0× → 25%(触底)。贵仍留不住人,但不再把用户清零。
// 自研(无官价)返回 1 不衰减 —— 自研价上限钉死 $0.5,无参照系。
function relayRenewMul(price, official) {
  if (!(price > 0) || !(official > 0)) return 1;
  const ratio = price / official;
  if (ratio <= RELAY_BIZ.RENEW_LINE) return 1;
  return Math.max(RELAY_BIZ.RENEW_FLOOR,
    1 - (ratio - RELAY_BIZ.RENEW_LINE) / RELAY_BIZ.RENEW_FALLOFF * (1 - RELAY_BIZ.RENEW_FLOOR));
}

// 瓶颈诊断(2026-10-05):补 dt 后收入被「客流需求 / 机器产能」中较小的一侧卡住 ——
// 把当前瓶颈直接写出来,别让玩家靠「看到中断/库存堆积」自己猜(交叉区尤其需要)。
//   产能 < 需求 → 卡产能(该买机器),附库存可支撑时长 = 中断倒计时可视化(看到 ⚠中断 就晚了)
//   产能 ≥ 需求 → 卡客流(练 toolCall/速度/信誉/调定价),附产能利用率
// 只在「标榜 + 有价 + 有客」时返回内容;自研模式规模固定($0.5 上限)不提示。
// 纯函数只出文案,绘制与节流刷新在 drawBackendPage / updateRelayBusiness。
function relayBottleneckInfo() {
  const R = state.relay;
  const listed = relayListedModel();
  if (!listed || !(R.price > 0) || !(R.users > 0)) return null;
  const demand = R.users * R.ability.speed * R.activeCoef * relayUsageMul(R.price, officialPriceOf(listed));
  const prod = state.tokensPerSecond || 0;
  if (!(demand > 0)) return { mode: 'noDemand', color: '#8a7a68', text: '无有效需求(用户/速度/用量为 0)' };
  if (prod < demand * 0.999) {
    const gapPct = Math.round((1 - prod / demand) * 100);
    const deficit = demand - prod;
    const hours = state.tokens / (deficit * 60); // 1 游戏时 = 60 现实秒
    const durTxt = hours >= 1
      ? Math.max(0, hours).toFixed(1) + ' 游戏时'
      : Math.max(0, state.tokens / deficit).toFixed(0) + ' 现实秒';
    return { mode: 'supply', color: '#c05a2a',
      text: '⚠ 卡产能:产出缺口 ' + gapPct + '%',
      text2: '库存可撑 ' + durTxt + ' → 该扩产了' };
  }
  const usePct = Math.round(prod > 0 ? demand / prod * 100 : 0);
  // 2026-10-12(§20.12):把「卡客流」细化为「卡客源 还是 卡并发」。
  // 原来只写「练能力/加用户/调定价」,玩家看不出该练哪条腿 —— 而这两条腿的练法完全不同。
  // ⚠️ 2026-10-13 起本提示**拆成两行**(text + text2),槽位算法见 drawBackendPage 的 priceY。
  //    面板可用宽 =(屏宽×0.88 − min(200,屏宽×0.24))×0.92 → 1440 宽屏 982px、768 平板 452px、390 手机 230px。
  //    单行时代的实测(12px bold 微软雅黑):旧文案 339px、「卡产能」行 367px、后来压过的卡客流行 315px
  //    —— 这些在 390 屏(230px)本来就装不下,属旧账。
  //    **本次实测(12px bold 微软雅黑,GDI+ MeasureString;与历史浏览器实测逐点吻合:339.5/366.8/314.9)**:
  //      卡产能 行1「⚠ 卡产能:产出缺口 12%」= 132.6px、行2「库存可撑 3.2 游戏时 → 该扩产了」= 176.5px
  //      极端值(缺口 99% / 库存 999.9 游戏时)行2 = 191.3px —— **两行都 ≤230px,390 屏也不溢出**;
  //      卡客流 行1「卡客流:产能 100% · 客源封顶(100≤100)」= 223.7px(用「产能只用」会到 247.7px ⇒ 压成「产能」)、
  //      行2「→ 练属性/攒信誉 才涨客源」= 144.8px。
  //    改文案务必先按上面同一口径量一遍(GDI+ 与浏览器 canvas 在本机实测同值),**每行都不许超过旧单行的宽度**。
  const baseU = relayBaseUsers(), capU = relayUserCap();
  const leg = baseU <= capU ? '客源封顶(' + baseU + '≤' + capU + ')' : '并发封顶(' + capU + '<' + baseU + ')';
  return { mode: 'demand', color: '#2a5a8a',
    text: '卡客流:产能 ' + usePct + '% · ' + leg,
    text2: baseU <= capU ? '→ 练属性/攒信誉 才涨客源' : '→ 练工具调用 才涨并发' };
}

// 每游戏时:续约 + 概率增长。增长基于 base(防复利,§14.5 用户强调)。
// 价格对比基准 = 官方参考价(2026-09-12 起无市场价)。
function relayHourlyRefresh() {
  const R = state.relay;
  const listed = relayListedModel();
  const official = listed ? officialPriceOf(listed) : 0;
  // P1-7(2026-10-03):硬价格带要跟着官价走。clampRelayPrice 原来只在玩家拖动定价时执行一次,
  // 新闻事件改动官价后 R.price 可能整个漂出 [0.5×, 1.5×] 官价带(跌破下限白送增长线,超上限原价卖)。
  // 每小时重钳一次,把漂出带外的价格拉回来;带内则数值不变(round 幂等)。
  if (listed && official > 0 && R.price > 0) {
    R.price = clampRelayPrice(R.price, official);
  }
  const keep = [];
  // 续约概率:信誉越高越留得住,但封顶 HOURLY_KEEP_MAX(0.95)——见该常量的说明(修 P0-2)
  p2HeatTick();   // P2-3 热点时钟
  const keepP = Math.min(RELAY_BIZ.HOURLY_KEEP_MAX, 0.5 + R.reputation / 200) * p2FlowMul();   // P2 事件期留存折损
  // 自研模式(P1-9):未标榜时没有「官价」可比,只要求价格在上限内
  const selfMode = !listed && R.price > 0 && R.price <= RELAY_BIZ.SELF_PRICE_MAX;
  // 并发上限(P1-6):工具调用决定自然增长的封顶。存量用户**不强制清退**(靠 leftH 自然到期回落),
  // 只挡新增 —— 否则老存档(旧版无上限,信誉满时能到 60+ 人)一开游戏就被砍掉九成。
  // ⚠️ 只数「自然用户」:发布/新闻注入的 surge 用户是外部流量,不受上限约束(见 relayUserCap 注释)。
  const capUsers = relayUserCap();
  let organicCount = 0;
  for (const u of R.userSlots) if (!u.surge) organicCount++;
  for (const u of R.userSlots) {
    u.leftH -= 1;
    if (u.leftH > 0) { keep.push(u); continue; }
    // 到期:信誉尚可 → 续约(保持留存,不全靠新增)。
    // 减层(2026-10-05):原「>官价×1.1 续约一律拒绝」与增长停叠加 → 高价时用户被清空到
    // 保底 churn(S5 实测收入只剩 0.8× 定价的 22%)。改概率随溢价衰减、保底 RENEW_FLOOR:
    // 贵仍留不住人,但不再归零 —— 高价=低留存高单价,是可行策略而非自杀。
    const renewOK = listed ? (R.price > 0 && official > 0) : selfMode;
    const renewMul = listed ? relayRenewMul(R.price, official) : 1;
    if (renewOK && Math.random() < keepP * renewMul) {
      keep.push({ leftH: RELAY_BIZ.USER_TENURE[0] + Math.random() * (RELAY_BIZ.USER_TENURE[1] - RELAY_BIZ.USER_TENURE[0] + R.reputation / 50) });
    }
  }
  R.userSlots = keep;
  if (typeof updatePrWarnBanner === 'function') updatePrWarnBanner();   // §8.3 横幅随游戏时刷新(到期自动隐藏)
  // 新增:标榜线 = 增长线(官价×0.8)以下全速、以上 FALLOFF 区间线性衰减到 0(2026-10-04 软化悬崖);
  // 自研线(P1-9)= 未标榜 + 价格在上限内。
  // ⚠️ 加 !R.serviceDown(2026-10-03):服务中断期间不该还有新用户进来(原来会出现
  // 「断供中 +0.2 人/游戏时」的荒谬叠加,把中断的压制作用抵消掉)。
  if (!R.serviceDown && (selfMode || (listed && R.price > 0 && official > 0))) {
    let base, pct;
    if (selfMode) {
      // 自研:base 固定、不吃信誉加成、用户时长也不吃信誉(§5.4「完全不触发信誉机制」)
      base = RELAY_BIZ.SELF_BASE_USERS;
      pct = RELAY_BIZ.GROW_PCT[0];
    } else {
      const cheapness = Math.max(0, Math.min(1, (official * RELAY_BIZ.CHEAP_LINE - R.price) / (official * RELAY_BIZ.CHEAP_LINE)));
      base = relayBaseUsers() * p2FlowMul() * p2HeatMul();   // P2 事件期新增折损 × 热点乘数
      pct = (RELAY_BIZ.GROW_PCT[0] + (RELAY_BIZ.GROW_PCT[1] - RELAY_BIZ.GROW_PCT[0]) * cheapness) * relayGrowWeight(R.price, official);
    }
    // P0-6(2026-10-03):原来是「概率 p 触发 → add = max(1, round(base × pct))」两层结构,
    // 但 base ∈ [2,6]、pct ≤ 0.20 → base×pct 最大只有 1.2,round 后非 0 即 1,再被 max(1,…) 兜底
    // ⇒ add 恒等于 1,§14.5 的「基础用户量 base = 2 + 信誉/25」完全空转(信誉对新增零影响)。
    // 现在直接按「期望新增 = base × pct」发放:整数部分必给、小数部分按概率给,
    // base 的差异重新体现出来,且是逐步发放、没有随机跳变。
    const expAddRaw = base * pct;
    // §18.2:期待值倍率只乘正增长;expAddRaw ≤ 0(C2 净流失)原样通过 —— 否则「期待值越低反而流失越少」
    const expAdd = expAddRaw > 0 ? expAddRaw * relayExpectMul() : expAddRaw;
    let add = Math.floor(expAdd) + (Math.random() < (expAdd - Math.floor(expAdd)) ? 1 : 0);
    // C2(2026-10-13):add 为负 = 这一游戏时净流失 |add| 个用户。
    // pop() 从栈尾取 —— surge(发布注入)用户在栈尾,所以「贵到留不住人」先走注入流量。
    if (add < 0) {
      const lose = Math.min(keep.length, -add);
      for (let i = 0; i < lose; i++) keep.pop();
      add = 0;
    }
    add = Math.min(add, Math.max(0, capUsers - organicCount));   // P1-6:自然增长不越过并发上限
    const tMin = RELAY_BIZ.USER_TENURE[0], tMax = RELAY_BIZ.USER_TENURE[1] + (selfMode ? 0 : R.reputation / 50);
    for (let i = 0; i < add; i++) {
      keep.push({ leftH: tMin + Math.random() * Math.max(0.5, tMax - tMin) });
    }
  }
  // 保底:用户量归零时,不要求便宜定价,低概率送回 1~2 个尝鲜用户(防「信誉还在却永远没人」死锁)
  // 有价即可(自研也算「有服务可试」,P1-9 起);服务中断中不送(P0-4:服务都提供不了)
  // P1-6:保底同样受并发上限约束(用户已满时不再塞人)
  if (keep.length === 0 && R.price > 0 && (listed || selfMode) && !R.serviceDown && organicCount < capUsers) {
    if (Math.random() < 0.35) {
      const n = Math.min(1 + (Math.random() < 0.35 ? 1 : 0), capUsers - organicCount);
      const tMin = RELAY_BIZ.USER_TENURE[0], tMax = RELAY_BIZ.USER_TENURE[1] + (selfMode ? 0 : R.reputation / 50);
      for (let i = 0; i < n; i++) {
        keep.push({ leftH: tMin + Math.random() * Math.max(0.5, tMax - tMin) });
      }
    }
  }
  R.userSlots = keep;
  // 服务中断惩罚(P0-4,2026-10-03):信誉缓慢下降 **并且用户开始流失**。
  // 原版只扣信誉、用户照常按 pricing 续约 → 「库存见底」几乎没有代价,库存管理毫无意义。
  // 现在中断期间每小时流失 DOWN_LOSE_P 比例的用户(至少 1 个),补货解除中断即停止流失。
  if (R.serviceDown) {
    R.reputation = Math.max(0, R.reputation - RELAY_BIZ.DOWN_REP_HOURLY);
    if (R.userSlots.length > 0) {
      const lose = Math.max(1, Math.round(R.userSlots.length * RELAY_BIZ.DOWN_LOSE_P));
      for (let i = 0; i < lose && R.userSlots.length > 0; i++) R.userSlots.pop();
    }
  }
  R.users = R.userSlots.length;
}

// 每 10 游戏时:按对标榜模型的相似度结算信誉(§14.4)
function relayRepSettle() {
  const R = state.relay;
  const listed = relayListedModel();
  if (!listed) return; // 自研不结算
  const sim = similarityTo(R.ability, listed);
  const step = RELAY_BIZ.REP_STEP[0] + Math.random() * (RELAY_BIZ.REP_STEP[1] - RELAY_BIZ.REP_STEP[0]);
  const gmul = (R.publish.active && R.publish.strategy === 'bench') ? PUBLISH_CFG.BENCH_GROWTH_MUL : 1;
  if (sim > 100) {
    // 高配低标:只升,永不下降。2026-10-03 修 P0-3 单调性断裂 ——
    // 原为固定 step*0.4(期望 +0.12/10h),比左边 80~100 段在 99% 处的 +0.18 还低,
    // 于是玩家最优解变成「故意把相似度压在 100% 以下」,与「能力溢出应被奖励」的设计意图相反。
    // 现与左段在 100% 处**连续**:左段期望 = step*(1.5*pu-0.5),sim=100 时 pu=0.90 → 恰为 step*0.85。
    //   over = (sim-100)/100 → 100% 得 0.85(与左段接上)、200% 得 1.0(满额 step)。
    // ⚠️ 左段 pu 起步改成 0.40 后(修 P0-5),这里的起点必须同步改成 0.85,否则 100% 处会重新裂开。
    const over = Math.min(1, (sim - 100) / 100);
    R.reputation = Math.min(100, R.reputation + step * (0.85 + over * 0.15) * gmul);
  } else if (sim >= 80) {
    // 上升概率起步 0.40(2026-10-03 修 P0-5):原起步 0.25,85% 时只有 37.5% 概率上升,
    // 而失败要扣 0.5*step,期望零点落在 sim≈83.3% → 80~90% 成了「信誉死亡谷」:
    // 85% 相似度要把信誉 1→100 得挂 874 现实小时,期间用户量长期只有 2 人(base=2+floor(信誉/25))。
    // 提到 0.40 后 80% 起期望即为正,95% 由 126h 缩到 83h,梯度更平缓、中段也能成长。
    const pUp = (sim - 80) / 20; // 80→0  100→1,越高越易升
    if (Math.random() < 0.40 + pUp * 0.5) {
      R.reputation = Math.min(100, R.reputation + step * gmul);
    } else {
      R.reputation = Math.max(0, R.reputation - step * 0.5);
    }
  } else {
    // <80:主跌,越低越狠。两处减缓(防「能力高但像不像最接近模型 → 永远 0」):
    // ① 70~79 差一点点 → 跌幅×0.4;② 标的就是「最接近模型」(诚实尽力) → 再×0.5
    const sev = Math.min(1, (80 - sim) / 80);
    let drop = step * (1 + sev * 2);
    if (sim >= 70) drop *= 0.4;
    const cl = closestModel(R.ability);
    if (cl.model && listed && cl.model.n === listed.n) drop *= 0.5;
    // 高溢价加罚(2026-10-04;2026-10-12 换锚 + 抬阈值 + 改压缩):
    // 原惩罚与卖价无关 → 标弱模型卖 1.5× 官价只掉 ~0.8 点/10 游戏时,100 信誉要 1000 游戏时才跌完,
    // 惩罚速度 ≈ 收益速度的 1/1000。2026-10-04 加了「超过续约线的溢价放大跌幅」。
    // ⚠️ 2026-10-12:那个锚(标榜对象官价)是玩家自己挑的 ⇒ 虚标者能给自己发定价许可,
    //    加罚退化成常数 ×5(实测 8 个档位一模一样),对「假得离谱」毫无额外惩罚。
    //    锚改为「能力相称价」(fairPriceOf),阈值抬到**法定上限**(理由见 RELAY_BIZ 处推导:
    //    抬到 1.5× 相称价后,触发条件严格等价于「标榜对象比自己值钱」,且不再对合法价格带双重收费),
    //    压缩改开方(理由见 RELAY_BIZ.GOUGE_REP_K)。
    //    只挂在 <80 段:≥80 是诚实线,高价由「用户自然流失」在管(续约线 1.1),不双重收费。
    // ⚠️ 本项对极端虚标线实测**零增量**(见 RELAY_BIZ.GOUGE_REP_K 注释),起作用的是 70~79 段。
    const fairHere = fairPriceOf(R.ability);
    if (fairHere > 0 && R.price > 0) {
      const prem = Math.max(0, R.price / fairHere - RELAY_BIZ.PRICE_MAX);
      drop *= 1 + Math.sqrt(prem) * RELAY_BIZ.GOUGE_REP_K;
    }
    R.reputation = Math.max(0, R.reputation - drop);
  }
  p2RiskSettle(sim, listed);   // P2-1 翻车事件 + P2-4 被识破(§20.15)
}

// ========== P2 风险玩法(§20.15;设计 §5.3/§9;扫描《P2风险玩法备料.md》§七) ==========
// 事件管线:relayRepSettle(每 10 游戏时)判定 → 事件进 R.p2.events → relayHourlyRefresh 消费
// (留存×flowMul、新增×flowMul)→ doPublish 的池抽量 ×poolMul(罚到 surge,不罚就是装饰)。
// 被识破(P2-4)复用同一后果管线。声誉罚对信誉恒 0 的投机线无效是已知特性(罚的是客源与池)。
function p2Ensure() {
  const R = state.relay;

// 结算钩子:每 10 游戏时(relayRepSettle 尾部调用)
function p2RiskSettle(sim, listed) {
  const R = state.relay, P = p2Ensure();
  const H = R.news.totalH;
  P.events = P.events.filter(e => e.untilH > H);
  const ma = modelToAttrs(listed);
  const knowBad = cutoffMonths(R.ability.knowledge) < monthsFromStr(listed.k) - 3;
  const modalBad = R.ability.multimodal < ma.multimodal;
  // ── P2-4 被识破(§9):标榜对象比自己强多少 × 暴露系数 × 隐蔽度 ──
  const myCap = modelCapability(R.ability), hisCap = Math.max(1, modelCapability(ma));
  const baseDetect = Math.max(0, Math.min(1, (hisCap - myCap) / hisCap)) * RELAY_BIZ.RISK_DETECT_BASE_K;
  let dm = 1;
  if (knowBad) dm *= RELAY_BIZ.RISK_DETECT_KNOW;
  if (modalBad) dm *= RELAY_BIZ.RISK_DETECT_MODAL;
  dm *= p2StealthMul(R.ability.fit);
  dm *= (1 - Math.min(1, R.ability.instruct / RELAY_BIZ.RISK_DETECT_INST_DIV));
  const pDetect = baseDetect * dm;
  prWarnTick(R, pDetect);                    // §8 事前预警(概率够高才提示)
  if (Math.random() < pDetect) {
    P.detects++;
    const sev = 0.7;
    const rawLoss = RELAY_BIZ.RISK_EV_REP_LO + (RELAY_BIZ.RISK_EV_REP_HI - RELAY_BIZ.RISK_EV_REP_LO) * sev;
    // §8 公关:损失落地**前**介入(先扣再返会把同一事件算两次)
    const pr = prResolve(R, sev, rawLoss, P.prPolicy || null);
    if (pr.loss > 0) R.reputation = Math.max(0, R.reputation - pr.loss);
    if (P.events.length < 1) P.events.push({
      untilH: H + (RELAY_BIZ.RISK_EV_FLOW_DAYS[0] + Math.random() * (RELAY_BIZ.RISK_EV_FLOW_DAYS[1] - RELAY_BIZ.RISK_EV_FLOW_DAYS[0]) + (pr.extraDays || 0)) * 24,
      flowMul: pr.flow, sev });
    if (pr.flow !== 1) p2CrashNews(R, P);
  }
  // ── P2-1 翻车事件(§5.3):gap = sim/100 − 1,货不对板才可能触发(诚实线 sim≥80 恒不触发)──
  const gap = sim / 100 - 1;
  if (gap >= -0.05) { P.warnDays = 0; return; }
  let p = Math.max(0, Math.min(RELAY_BIZ.RISK_EV_CAP, (-gap - 0.35) * RELAY_BIZ.RISK_EV_K));
  if (knowBad) p *= RELAY_BIZ.RISK_DETECT_KNOW;    // 知识不足 ×2.5(与识破共用严厉度)
  if (modalBad) p *= RELAY_BIZ.RISK_DETECT_MODAL;  // 模态不符 ×3
  p *= p2StealthMul(R.ability.fit);                // 过拟合降低被识破概率(§9)
  if (P2_RECLAMP) p = Math.min(RELAY_BIZ.RISK_EV_CAP, p);   // 拍板:按概率发(CAP 是真上限)
  if (P.warnDays < RELAY_BIZ.RISK_EV_GRACE) { P.warnDays++; return; }
  prWarnTick(R, p);                          // §8 事前预警
  if (Math.random() < p) {
    P.triggers++;
    const sev = Math.min(1, -gap);
    const rawLoss = RELAY_BIZ.RISK_EV_REP_LO + (RELAY_BIZ.RISK_EV_REP_HI - RELAY_BIZ.RISK_EV_REP_LO) * sev;
    const pr = prResolve(R, sev, rawLoss, P.prPolicy || null);
    if (pr.loss > 0) R.reputation = Math.max(0, R.reputation - pr.loss);
    if (P.events.length < 1) P.events.push({
      untilH: H + (RELAY_BIZ.RISK_EV_FLOW_DAYS[0] + Math.random() * (RELAY_BIZ.RISK_EV_FLOW_DAYS[1] - RELAY_BIZ.RISK_EV_FLOW_DAYS[0]) + (pr.extraDays || 0)) * 24,

}
// ===== §8 P2-2 公关三选一(2026-10-17 落码)=====
// PR 在**损失落地前**介入,返回 { loss: 声誉损失, flow: 客流乘数 }。
// 「先扣完再返还」会把同一事件算两次(冒烟原创伤),故一律前置决策。
function prChance(R, sev) {
  const B = RELAY_BIZ;
  return Math.max(B.PR_FLOOR, Math.min(B.PR_CAP,
    B.PR_BASE + (R.reputation || 0) / B.PR_REP_DIV + (R.ability.instruct || 0) / B.PR_INST_DIV - sev * B.PR_SEV_K));
}
// 补贴定价:按「当前刀乐收入 × 天数」算,让高收益者也有痛感(百万 tok 计)
function prSubsidyCost(R) {
  // ⚠️ 定价系数实测标定(2026-10-17):初版 2%/天 ⇒ 补贴成了「自杀选项」(跑分线 −69%),
  //    因为它同时吃「花钱」和「刷不出来」两头。降到 0.5%/天(≈ 原设计量级的 1/4)后仍有痛感但不自杀。
  const dayIncome = Math.max(0, R.dollars || 0) * RELAY_BIZ.PR_SUBSIDY_RATE;   // 粗估:日收入 ≈ 存量刀乐 × 估算率(值见 RELAY_BIZ,可被 sim 的 P2_PR_SUBSIDY_RATE 覆盖做剂量曲线)
  const M = RELAY_BIZ.PR_SUBSIDY_DAYS;
  return Math.max(RELAY_BIZ.PR_SUBSIDY_MIN, dayIncome * M) * 1e6;
}
// mode: 'deflect'(诡辩) | 'apologize'(道歉) | 'subsidize'(补贴) | null(不公关)
function prResolve(R, sev, repLoss, mode) {
  const B = RELAY_BIZ;
  if (!mode) return { loss: repLoss, flow: RELAY_BIZ.RISK_EV_FLOW_MUL };
  // 补贴 = 花钱买确定性 ⇒ 成功率额外 +PR_SUBSIDY_BONUS(其余两种按基础概率)
  const pBase = prChance(R, sev);
  // 补贴 = **确定性**消费品:花钱必然消灾(pOk = 1)。风险由价格承担,不由概率承担 ——
  // 实测「花钱还可能白花」让它是纯亏选项(跑分线 −69%),而玩家需要的是一个「可算的保险」。
  const pOk = (mode === 'subsidize') ? 1 : pBase;
  const ok = Math.random() < pOk;
  const P = p2Ensure();
  P.prUsed = (P.prUsed || 0) + 1; if (ok) P.prOk = (P.prOk || 0) + 1;
  if (mode === 'deflect') {
    // 诡辩:成功减半;失败声誉 ×1.5 **且追加客流折损**(关键改造:罚得到投机线的钱)
    return ok ? { loss: repLoss * B.PR_DEFLECT_OK_REP, flow: B.RISK_EV_FLOW_MUL }
              : { loss: repLoss * B.PR_DEFLECT_BAD_REP,
                  flow: B.PR_DEFLECT_BAD_FLOW,
                  extraDays: B.PR_DEFLECT_BAD_DAYS };
  }
  if (mode === 'apologize') {
    // 道歉:成功恢复一半损失(即只承担 50%);失败小幅额外
    return ok ? { loss: repLoss * B.PR_APOLOGY_OK_REP, flow: B.RISK_EV_FLOW_MUL }
              : { loss: repLoss * B.PR_APOLOGY_BAD_REP, flow: B.RISK_EV_FLOW_MUL };
  }
  if (mode === 'subsidize') {
    // 补贴:花钱买「无事发生」。买不起 ⇒ 无公关。
    // 设计:花钱应当换到**更高的成功确定性** —— 用「P + 0.25」体现(上限 0.95),
    // 否则它既贵又弱,必然无人选(实测初版 −69%)。
    const cost = prSubsidyCost(R);
    if ((state.tokens || 0) < cost) return { loss: repLoss, flow: B.RISK_EV_FLOW_MUL, broke: true };
    state.tokens -= cost;
    P.subsidyTok = (P.subsidyTok || 0) + cost;
    return ok ? { loss: 0, flow: 1 } : { loss: repLoss, flow: B.RISK_EV_FLOW_MUL };
  }
  return { loss: repLoss, flow: B.RISK_EV_FLOW_MUL };
}

function prWarnTick(R, prob) {
  const T = R.train; if (!T) return;
  const H = (R.news && R.news.totalH) || 0;

    if (!P.warnUntilH || P.warnUntilH <= H) {

    }

}
