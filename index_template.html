  const sim = similarityTo(R.ability, target);
  if (strategy === 'bench' && sim < PUBLISH_CFG.SIM_GATE)
    return { ok: false, msg: '未达训练预期（相似度 ' + sim.toFixed(0) + '＜' + PUBLISH_CFG.SIM_GATE + '）' };
  if (strategy === 'run' && sim >= PUBLISH_CFG.SIM_GATE)
    return { ok: false, msg: '已达标，用「对标」更划算' };
  R.listedModel = targetName;                                        // 强制标榜
  if (!(R.price > 0)) R.price = officialPriceOf(target);            // 保底定价
  // 保价 UX(2026-10-13;§20.11 九 遗留 2):换标榜后价格会按**新官价**重钳
  // (relayHourlyRefresh 里每小时 clampRelayPrice),而玩家是按**旧标的**定的价 ——
  // 于是常见「发布完增长停了 / 人开始走,却不知道为什么」。这里在发布当下把后果说清楚。
  // ⚠️ 纯提示:只读状态、不改任何数值(改数值会连带改平衡,那要走报告+仿真流程)。
  const pubPriceWarn = (() => {
    const off = officialPriceOf(target);
    if (!(off > 0) || !(R.price > 0)) return '';
    const clamped = clampRelayPrice(R.price, off);
    const ratio = clamped / off;
    const reclamp = Math.abs(clamped - R.price) > 1e-9
      ? '(现价 $' + fmt2(R.price) + ' 会被重钳到 $' + fmt2(clamped) + ') ' : '';
    if (ratio >= RELAY_BIZ.GROW_NEG_RATIO)
      return reclamp + '⚠ 定价 $' + fmt2(clamped) + ' = 新官价 ' + ratio.toFixed(2)
        + '× → 用户会净流失;想留人请降到 ' + RELAY_BIZ.CHEAP_LINE + '× 以内';
    if (ratio > RELAY_BIZ.CHEAP_LINE)
      return reclamp + '⚠ 定价 $' + fmt2(clamped) + ' = 新官价 ' + ratio.toFixed(2)
        + '× → 增长已减弱/停止(想涨人请回到 ' + RELAY_BIZ.CHEAP_LINE + '× 以内)';
    return reclamp + '定价在新官价 ' + ratio.toFixed(2) + '× · 增长线内,影响不大';
  })();
  const users = Math.round(publishPoolDraw(targetName, R.price, strategy) * p2PoolMul());     // 跑分 ×1.5(P1-10);事件期池打折(§20.15)
  // 叠加:不覆盖正常运营已有的用户,只额外注入这波对标池流量
  // surge:true(P1-6)= 外部流量,不受「工具调用并发上限」约束(上限只管自然增长)
  for (let i = 0; i < users; i++) R.userSlots.push({ leftH: 2 + Math.random() * (4 + R.reputation / 50), surge: true });
  R.users = R.userSlots.length;
  if (strategy === 'bench') R.reputation = Math.min(100, R.reputation + PUBLISH_CFG.BENCH_REP_GAIN);
  if (strategy === 'run') {
    const l = PUBLISH_CFG.RUN_REP_LOSS;
    let loss = l[0] + Math.random() * (l[1] - l[0]);
    // 层3:跑分 + 高溢价 → 扣得更狠(1.5× 官价约 ×1.75)
    if (officialPriceOf(target) > 0 && R.price > 0) {
      const prem = Math.max(1, R.price / officialPriceOf(target));
      loss *= 1 + (prem - 1) * PUBLISH_CFG.RUN_REP_PREM_MUL;
    }
    R.reputation = Math.max(0, R.reputation - loss);
  }
  P.active = true; P.strategy = strategy; P.model = targetName;
  P.totalH = (strategy === 'bench' ? PUBLISH_CFG.BENCH_DAYS : PUBLISH_CFG.RUN_DAYS) * 24;
  P.remainH = P.totalH;
  P.lastCap = modelCapability(R.ability);
  saveGame();
  return { ok: true, msg: (strategy === 'bench' ? '已对标发布 ' : '已跑分发布 ') + targetName
    + '（' + R.users + ' 人 / ' + (P.totalH / 24) + ' 天）' + (pubPriceWarn ? ' · ' + pubPriceWarn : '') };
}
function publishTick(gameHours) {
  const P = state.relay.publish;
  if (!P.active) return;
  P.remainH -= gameHours;
  if (P.remainH <= 0) {
    P.active = false; P.strategy = null; P.model = null; P.remainH = 0;
    // 标榜资格门槛(2026-10-04):跑分发布允许「相似度不达标」临时虚标(那是明写的投机),
    // 但热度只有发布期那么长 —— 到期时若相似度仍低于门槛,自动下架,价格钳回自研上限。
    // 否则「花一次跑分信誉(~5 点)换一个永久的 $60 虚标」就成了绕过 LIST_SIM_MIN 的后门。
    const lm = relayListedModel();
    if (lm && similarityTo(state.relay.ability, lm) < RELAY_BIZ.LIST_SIM_MIN) {
      state.relay.listedModel = null;
      if (state.relay.price > RELAY_BIZ.SELF_PRICE_MAX) state.relay.price = RELAY_BIZ.SELF_PRICE_MAX;
      spawnFloatText('跑分热度已过 · 相似度不足,已自动下架', app.screen.width / 2, app.screen.height * 0.28);
    }
  }
}

// 收益速率自适应精度:早期 $/秒 很小,固定 3 位会显示成 0.000,按量级给到有效位
function formatRate(v) {
  if (!v || v <= 0) return '0';
  if (v >= 100) return v.toFixed(0);
  if (v >= 1) return v.toFixed(2);
  if (v >= 0.01) return v.toFixed(3);
  return v.toFixed(5);
}

// 主循环每帧调用:时钟 + 卖 token 换刀乐 + 到点触发小时/信誉刷新
let relayUiAccum = 0; // 活字节流累加器(纯 UI 计时,不进存档)
function updateRelayBusiness(dt) {
  const R = state.relay;
  const gameHours = dt * (RELAY_BIZ.GAME_MIN_PER_REAL_SEC / 60);
  // 时钟:gameHour 0~24 循环;天数用 news.totalH 累计(存档已有),floor(/24)+1 = 第几天
  R.gameHour = (R.gameHour + gameHours) % 24;

  // 活跃系数随机游走(慢,别每帧乱跳)
  if (Math.random() < gameHours * 8) {
    R.activeCoef += (Math.random() - 0.5) * 0.1;
    R.activeCoef = Math.max(RELAY_BIZ.ACTIVE_MIN, Math.min(RELAY_BIZ.ACTIVE_MAX, R.activeCoef));
  }

  // 卖出:上架(标榜)或**自研**(未标榜但价格在上限内,P1-9)都能卖。
  // 收入吃「成交系数」= 偏贵折价 × 弱标榜折价(层2+层4);消耗吃「用量系数」= 高价压制(2026-10-04)。
  const listed = relayListedModel();
  const official = listed ? officialPriceOf(listed) : 0;
  const selfMode = !listed && R.price > 0 && R.price <= RELAY_BIZ.SELF_PRICE_MAX;
  if ((listed || selfMode) && R.price > 0 && R.users > 0) {
    // ⚠️ 补 dt(2026-10-05):ideal 是「每秒」需求口径(ATTR_DESC:速度 1 点=1 token/s),而本函数
    // 每帧调用 —— 原来漏乘 dt,实际消耗是文档口径的 60 倍(帧率依赖),表现为:
    // 收入=全部产出都卖光(永远供不应求)、serviceDown 形同虚设、掉帧反而省 token。
    // 补上后:每帧消耗 = 每秒需求×dt,收入口径 = min(需求,产出),与生产 tokensPerSecond 同尺度。
    // 仿真结论(2026-10-05,assess_dt_rebalance.js):开局无损、收入绝对值全程单调增;
    // 产出>需求=库存缓冲(瓶颈从产能切到客流是设计常态),无需重配产能侧。
    const ideal = R.users * R.ability.speed * R.activeCoef * (listed ? relayUsageMul(R.price, official) : 1) * dt;
    const used = Math.min(ideal, state.tokens);
    if (used < ideal * 0.5) R.serviceDown = true;
    else if (used >= ideal * 0.95) R.serviceDown = false;
    if (used > 0) {
      // 自研没有官价参照、也没有「货不对板」问题(你没对外承诺对标谁)→ 成交系数恒 1
      // C4(2026-10-13):信誉愿付溢价。只作用于标榜线(自研线按 §5.4 不触发信誉机制,保持 1)
      const payMul = (listed ? relaySellPayMul(listed, R.price, official) : 1)
        * (listed ? 1 + RELAY_BIZ.TRUST_PRICE_K * (R.reputation || 0) / 100 : 1);
      state.tokens -= used;
      R.dollars += used * R.price * payMul / 1e6;
      R.totalTokensSold += used;
      R.totalDollarsEarned += used * R.price * payMul / 1e6;
    }
  } else {
    R.serviceDown = false;
  }

  // 到点刷新
  R.hourAccum += gameHours;
  while (R.hourAccum >= 1) { R.hourAccum -= 1; relayHourlyRefresh(); }
  R.repAccum += gameHours;
  while (R.repAccum >= RELAY_BIZ.REP_CYCLE_H) {
    R.repAccum -= RELAY_BIZ.REP_CYCLE_H;
    relayRepSettle();
  }
  // 社区日报:每 6 游戏时
  newsTick(gameHours);
  // 调教养成:AP 连续再生 / 疗程倒计时 / 空闲泄压 / 阈值触发测评(§16)
  updateTrain(gameHours);
  // 发布:对标/跑分窗口倒计时与到期解锁(§19)
  publishTick(gameHours);

  // 后台页开着时原地刷新活字(不整页重绘,避免 destroy 开销)。
  // 节流 0.25s:卖出进行时 dollars 每帧都变,不加节流的话这几条 PIXI.Text 每帧都重栅格化
  // (与购买按钮每帧重绘同类的问题);0.25s 对肉眼足够顺滑,时钟 1 游戏分/秒的精度不受影响。
  // 累加器是模块级变量,不进 state.relay(避免把纯 UI 计时字段序列化进存档)。
  relayUiAccum += dt;
  const uiDue = relayUiAccum >= 0.25;
  if (uiDue) relayUiAccum = 0;
  if (screenPanelOpen && panelTab === 'backend' && backendLive && uiDue) {
    backendLive.dollars.text = '$' + formatNum(R.dollars);
    backendLive.tokens.text = formatNum(state.tokens);
    backendLive.rep.text = R.reputation.toFixed(1);
    backendLive.users.text = String(R.users);
    backendLive.clock.text = gameClockFull();
    backendLive.rate.text = (listed || selfMode) && R.price > 0
      ? '+$' + formatRate(R.users * R.ability.speed * R.activeCoef
          * (listed ? relayUsageMul(R.price, officialPriceOf(listed)) : 1) * R.price
          * (listed ? relaySellPayMul(listed, R.price, officialPriceOf(listed)) : 1)
          * (listed ? 1 + RELAY_BIZ.TRUST_PRICE_K * (R.reputation || 0) / 100 : 1) / 1e6) + ' /秒'
        + (listed ? '' : '（自研）')
      : (R.price > 0 ? '未标榜（自研价超上限 $' + fmt2(RELAY_BIZ.SELF_PRICE_MAX) + '）' : '未标榜');
    // 相似度:优先显示「选中行」的,否则显示当前标榜的;≥80 或 >100 绿,否则红
    // 显示口径 = 有效相似度(属性相似 × 能力倍率);括号里附 raw%,方便看倍率拉了多少
    let simM = null;
    if (backendSelIdx >= 0) simM = REAL_MODELS[backendSelIdx];
    else if (listed) simM = listed;
    if (simM) {
      const raw = rawSimilarityTo(R.ability, simM);
      const mul = capMulTo(R.ability, simM);
      const eff = similarityTo(R.ability, simM);
      const tag = (backendSelIdx >= 0 && listed && simM.n !== listed.n) ? '(选中)'
        : (listed && simM.n === listed.n) ? '(标榜)' : '';
      backendLive.sim.text = '有效相似 ' + eff.toFixed(0) + '% ' + tag
        + '  基础' + raw.toFixed(0) + '% × 能力' + mul.toFixed(2) + '× = ' + eff.toFixed(0) + '%';
      backendLive.sim.style.fill = (eff >= 80 || eff > 100) ? '#2a7a3a' : '#c05a2a';
    } else {
      backendLive.sim.text = '未标榜 · 点下方列表选一个模型';
      backendLive.sim.style.fill = '#b0a294';
    }
    // 瓶颈提示(2026-10-05):0.25s 节流重写文案/配色;需求或产能变化时三态切换
    if (backendLive.bottleneck) {
      const bn = relayBottleneckInfo();
      if (bn) {
        backendLive.bottleneck.text = bn.text;
        backendLive.bottleneck.style.fill = bn.color;
        // 2026-10-13:瓶颈提示拆两行(窄屏整行溢出),第二行只在有内容时显示
        if (backendLive.bottleneck2) backendLive.bottleneck2.text = bn.text2 || '';
      }
      // 没在卖/没客 → 隐藏而不是留陈旧文案(下次面板重绘时槽位也不占)
      backendLive.bottleneck.visible = !!bn;
      if (backendLive.bottleneck2) backendLive.bottleneck2.visible = !!(bn && bn.text2);
    }
  }
  // 中转站顶栏 HUD(与生产 tokens 同位置,不遮电脑面板)—— 同上一条节流
  if (relaySceneOpen && relayHudLine1 && uiDue) {
    const listed2 = relayListedModel();
    relayHudLine1.text = '$' + formatNum(R.dollars) + '   ·   ' + R.users + ' 人   ·   信誉 ' + R.reputation.toFixed(1);
    relayHudLine2.text = gameClockFull()
      + (listed2 ? '   ·   标榜 ' + listed2.n + ' 模型' : '   ·   未标榜')
      + (R.serviceDown ? '   ·   ⚠中断' : '');
  }
  // 调教场景顶栏 HUD:美刀 / token / 时间(节流同 relayHud)
  if (tuneSceneOpen && tuneHudLine1 && uiDue) {
    tuneHudLine1.text = '$' + formatNum(R.dollars) + '   ·   ' + formatNum(state.tokens) + ' tok';
    tuneHudLine2.text = gameClockFull();
  }
}

// ========== 调教养成逻辑(设计 §16;实时,不依赖场景) ==========
function trainGainMul() {
  const base = 1 + (state.relay.ability.params / 100) * TRAIN_CFG.GAIN_MUL_K;
  const pressureMul = Math.max(0, 1 - (state.relay.train.pressure / TRAIN_CFG.PRESSURE_PENALTY_DIV));
  return base * pressureMul;
}
// §22 拟合度推进(2026-10-21):统一入口 —— 不越界,并让「回落」只作用于超出最优点的那部分。
//   回落不会让欠拟合自动变好(那必须靠训练),只会把过拟合往回拉。
// §22 拟合度状态(玩家要能一眼看出「该练 / 稳 / 过头了」)
function fitStateText(fit) {
  if (fit < CAP_FIT_OPT - 12) return '欠拟合';
  if (fit <= CAP_FIT_OPT + 10) return '良好';
  return '过拟合';
}
function fitStateColor(fit) {
  if (fit < CAP_FIT_OPT - 12) return '#c07a2a';   // 欠拟合:橙
  if (fit <= CAP_FIT_OPT + 10) return '#2a7a3a';  // 良好:绿
  return '#8a4ab8';                                // 过拟合:紫(伪装流)
}
function fitDrift(delta) {
  const a = state.relay.ability;
  const before = a.fit;
  a.fit = Math.max(0, Math.min(100, a.fit + delta));
  return a.fit - before;
}
function fitRelaxTowardOpt(amount) {
  const a = state.relay.ability;
  if (a.fit <= CAP_FIT_OPT) return 0;
  const cut = Math.min(amount, a.fit - CAP_FIT_OPT);
  return fitDrift(-cut);
}
function abilityAdd(attr, v) {
  const a = state.relay.ability;
  a[attr] = Math.max(0, Math.min(100, a[attr] + v));
}
function trainItemByKey(key) { for (const it of TRAIN_ITEMS) if (it.key === key) return it; return null; }
// 涨价计数(会衰减)/ 累计购买(只增,卡硬上限)分开两个账本 —— 见 TRAIN_CFG.PRICE_ESC 注释。
function trainPriceCount(key) { const t = state.relay.train; return (t.priceCount && t.priceCount[key]) || 0; }
function trainBoughtCount(key) { const t = state.relay.train; return (t.bought && t.bought[key]) || 0; }
// 当前单价:第 n 次(c=已涨价次数) = cost × (1 + ESC×c)。c=0 → 原价(首次不打折也不加价)。
function trainItemPrice(key) {
  const it = trainItemByKey(key);
  if (!it) return 0;
  return Math.round(it.cost * (1 + TRAIN_CFG.PRICE_ESC * trainPriceCount(key)) * 100) / 100;
}
function trainItemMaxed(key) {
  const it = trainItemByKey(key);
  return !!it && trainBoughtCount(key) >= (it.cap || Infinity);
}
function trainPriceText(p) { return '$' + String(Math.round(p * 100) / 100); }
function trainPressureMaxed() { return state.relay.train.pressure >= TRAIN_CFG.PRESSURE_MAX; }

// 能不能用:买满上限 / 余额(刀乐) / AP / 疗程独占 / 前置门槛 / 压力爆表(摆烂)
function trainCanUse(item) {
  const T = state.relay.train, R = state.relay;
  if (trainItemMaxed(item.key)) return false;   // 2026-10-05:累计买满 cap 次 → 永久锁(再买也不涨了)
  if (trainPressureMaxed()) return false;
  if (R.dollars < trainItemPrice(item.key)) return false;   // 用「当前涨价后的价」判,不是 cost
  if (T.ap < item.ap) return false;
  if (item.kind === 'session' && T.session) return false;
  if (item.need) { for (const k in item.need) { if (R.ability[k] < item.need[k]) return false; } }
  return true;
}

function useTrainItem(item) {
  if (!trainCanUse(item)) return false;
  const T = state.relay.train, R = state.relay;
  R.dollars -= trainItemPrice(item.key);   // 2026-10-05:按涨价后的价扣
  spendAP(item.ap);
  T.pressure = Math.min(TRAIN_CFG.PRESSURE_MAX, T.pressure + item.pres);
  // §22:训练推高拟合度 —— 练得越专一推得越猛(数据配比单一 = 过拟合);数值见 TRAIN_ITEMS 的 fitDrift。
  if (item.fitDrift) fitDrift(item.fitDrift);
  T.bought[item.key] = (T.bought[item.key] || 0) + 1;          // 硬上限账本(只增)
  T.priceCount[item.key] = (T.priceCount[item.key] || 0) + 1;   // 涨价账本(每 10 游戏天 ×0.8)
  if (item.kind === 'instant') {
    const mul = trainGainMul();
    for (const k in item.rate) {
      const gain = (100 - R.ability[k]) * item.rate[k] * mul;
      abilityAdd(k, gain);
    }
  } else {
    T.session = { key: item.key, remainMin: item.duraMin, totalMin: item.duraMin };
  }
  saveGame();
  if (typeof refreshTrainUI === 'function') refreshTrainUI();
  return true;
}

function finishSession() {
  const T = state.relay.train;
  const item = trainItemByKey(T.session.key);
  if (item) {
    const mul = trainGainMul();
    for (const k in item.rate) {
      const gain = (100 - state.relay.ability[k]) * item.rate[k] * mul;
      abilityAdd(k, gain);
    }
  }
  T.session = null;
}

// 训练开始后累计的游戏天数(锚定首次 tick 的 totalH,老存档不会一次性补发全部测评)
function trainElapsedDays() {
  const T = state.relay.train;
  const totalH = (state.relay.news && typeof state.relay.news.totalH === 'number') ? state.relay.news.totalH : 0;
  if (T.examStartH == null) T.examStartH = totalH;
  return Math.floor((totalH - T.examStartH) / 24);
}

function updateTrain(gameHours) {
  const T = state.relay.train;
  const gm = gameHours * 60; // 游戏分钟(1 游戏时 = 60 游戏分)
  // 强化训练进行中(且正停留在调教场景)才暂停算力回复;切去别的板块时算力照常回复,不冻死
  if (!(gameState && tuneSceneOpen) && T.ap < TRAIN_CFG.AP_MAX) {
    T.apAccum += gm;
    while (T.apAccum >= 1 && T.ap < TRAIN_CFG.AP_MAX) { T.apAccum -= 1; T.ap += 1; }
    if (T.ap >= TRAIN_CFG.AP_MAX) T.apAccum = 0;
  }
  // §22:空闲时拟合度向最优点回落(只收超出部分);闭关训练期间不回落(那正是在练)
  if (!T.session) fitRelaxTowardOpt(TRAIN_CFG.FIT_DECAY_PER_GAME_H * gameHours);
  if (T.session) {
    T.session.remainMin -= gm;
    if (T.session.remainMin <= 0) finishSession();
  } else if (T.pressure > 0) {
    T.pressure = Math.max(0, T.pressure - TRAIN_CFG.PRESSURE_DECAY_PER_GAME_H * gameHours);
  }
  // 涨价计数衰减(2026-10-05):锚 news.totalH(只算游戏时,暂停/离线不回涨),
  // 每 PRICE_DECAY_H 游戏时把 priceCount ×PRICE_DECAY。bought(硬上限账本)绝不参与衰减。
  const totalH0 = (state.relay.news && typeof state.relay.news.totalH === 'number') ? state.relay.news.totalH : 0;
  if (T.priceDecayAnchorH == null) T.priceDecayAnchorH = totalH0;
  while (totalH0 - T.priceDecayAnchorH >= TRAIN_CFG.PRICE_DECAY_H) {
    T.priceDecayAnchorH += TRAIN_CFG.PRICE_DECAY_H;
    for (const k in T.priceCount) {
      if (T.priceCount[k] > 0) T.priceCount[k] = T.priceCount[k] * TRAIN_CFG.PRICE_DECAY;   // 不取整:避免多次衰减的路径漂移,单价在 trainItemPrice 里再 round
    }
  }
  const elapsed = trainElapsedDays();
  // ===== §17.6 考试状态机:到点开考 → 考期内累积分数 → 到点结算 =====
  // 时钟一律用 totalH(绝对游戏时,只算游戏时/暂停与离线不推进),与 trainElapsedDays 同源。
  const totalH = (state.relay.news && typeof state.relay.news.totalH === 'number') ? state.relay.news.totalH : 0;
  if (T.examSession) {
    examTick(totalH, gameHours);          // 过程化:累积分数,到点结算
  } else if (T.examStage < TRAIN_CFG.EXAMS.length) {
    const ex = TRAIN_CFG.EXAMS[T.examStage];
    const retakes = T.examRetakes[T.examStage] || 0;
    const dueDay = ex.atDay + retakes * TRAIN_CFG.RETAKE_DELAY_DAYS;   // 落榜后 7 天再战
    if (elapsed >= dueDay) startExam(T.examStage);
  }
}

// ========== §17.6 考试 = 「会话式」过程化考试(2026-10-16)==========
// 与旧 fireExam 的区别:①不是瞬间结算,开考后持续 durationH 游戏时,期间分数累积;
// ②有隐藏阈值 passGrade(不告诉玩家)⇒ 只给等级/点评;③落榜可重考(7 游戏天),奖励 ×0.7^(k-1);
// ④通过奖励 = token + 信誉 + 用户量临时上调(按 importance 递增);⑤毕业大考通过 ⇒ graduate 标记。
// 第二步才会加「作文比赛式限时提示点选」(分数 +N / 属性 +δ),本步先留 examTick 的 gain 钩子。

function startExam(idx) {
  const R = state.relay, T = R.train;
  const ex = TRAIN_CFG.EXAMS[idx];
  if (!ex) return;
  const totalH = (R.news && typeof R.news.totalH === 'number') ? R.news.totalH : 0;
  // §17.6 第二步(作文比赛式):hints = 浮现的限时提示;点击给「本次分数 +N」与「属性 +δ」。
  // 分数只进本次考试(不进存档/不影响局外);属性是唯一带出局外的收益,且每场有总量上限防刷。
  T.examSession = { idx, startH: totalH, endH: totalH + (ex.durationH || 6), score: 0,
                    clicks: 0, attrGain: 0, hints: [], hintSeq: 0, nextHintH: totalH + 0.3 };
  if (typeof spawnFloatText === 'function') {
    spawnFloatText(ex.name + ' 开考(持续 ' + (ex.durationH || 6) + ' 游戏时)', app.screen.width / 2, app.screen.height * 0.32);
  }
}

// 考试进行中:每游戏时累积基础分(由能力决定),到点结算
function examTick(totalH, gameHours) {
  const R = state.relay, T = R.train;
  const s = T.examSession;
  if (!s) return;
  const ex = TRAIN_CFG.EXAMS[s.idx];
  if (!ex) { T.examSession = null; return; }
  // 基础得分速率:能力/refCap(钳 0~1.5)⇒ 满分 100 的考试期间线性累积
  const ability = modelCapability(R.ability);
  const ratio = Math.max(0, Math.min(1.5, ability / Math.max(ex.refCap, 1)));
  const span = Math.max(1, s.endH - s.startH);
  const perHour = (ratio / span) * 100 * Math.min(1, gameHours);   // 每游戏时得分(上限 100)
  s.score = Math.min(100, s.score + perHour);
  // ── 作文比赛式限时提示(§17.6 第二步)──
  // 生成节奏:每 ~0.3~0.9 游戏时一条(importance 越高越密);存活 TTL 随 importance 缩短(越重要越紧张)。
  spawnExamHint(s, ex, totalH, gameHours);
  // 清理过期
  if (s.hints && s.hints.length) s.hints = s.hints.filter(h => h.untilH > totalH);
  if (totalH >= s.endH) settleExam();
}

// ===== §8.1 公关三选一 UI(2026-10-17)=====
// 只在「有活跃事件」或「收到预警」时出现 —— 平时不占版面。
// 选择结果写进 R.p2.prPolicy,由 prResolve 在下次事件时执行;玩家可随时改。
function drawPrPanel(x, y, w, h, baseY) {
  const R = state.relay, P = p2Ensure();
  const totalH = (R.news && R.news.totalH) || 0;
  const activeEv = (P.events || []).filter(e => e.untilH > totalH);
  const warned = (P.warnUntilH || 0) > totalH;
  if (!activeEv.length && !warned) { prFocus = false; return; }      // 无事件无预警 ⇒ 不显示(高亮标记一并消费)

  const padX = w * 0.04;
  const pw = w - padX * 2;
  // 画在**页面底部**(价格输入框与提示行上方),避免压住 priceY 区(实测 baseY-118 会盖住定价行)
  const top = y + h - 132;
  const card = new PIXI.Graphics();
  card.beginFill(0xfff0e0, 0.92);
  card.lineStyle(prFocus ? 3 : 1.5, 0xd8843a, prFocus ? 1 : 0.9);   // §8.3 预警跳转的一次性强高亮
  card.drawRoundedRect(x + padX, top, pw, 110, 8);
  card.endFill();
  panelContentArea.addChild(card);

  const head = makeText(activeEv.length ? '⚠ 事件处理中 —— 选一个应对' : '⚠ 有人开始质疑 —— 要不要提前公关?',
    { size: 13, color: '#8a3a10', weight: 'bold' });
  head.x = x + padX + 10; head.y = top + 8;
  panelContentArea.addChild(head);

  const sub = makeText('成功率 ' + Math.round(prChance(R, activeEv.length ? (activeEv[0].sev || 0.5) : (P.warnProb || 0.3)) * 100)
    + '%(随信誉/指令提升)· 选定后下次事件生效', { size: 10, color: '#9a7a5a' });
  sub.x = x + padX + 10; sub.y = top + 26;
  panelContentArea.addChild(sub);

  const opts = [
    { key: 'deflect',   name: '诡辩', desc: '成功减半 / 失败声名更糟且客流再降' },
    { key: 'apologize', name: '道歉', desc: '成功只担一半 / 失败小亏(最稳)' },
    { key: 'subsidize', name: '补贴', desc: '花 token 必定消灾 · 约 ' + (prSubsidyCost(R) / 1e6).toFixed(1) + 'M' },
    { key: null,        name: '不公关', desc: '全额承担' },
  ];
  const btnW = (pw - 30) / 4;
  opts.forEach((o, i) => {
    const bx = x + padX + 8 + i * (btnW + 4);
    const by = top + 44;
    const sel = (P.prPolicy || null) === o.key;
    const bg = new PIXI.Graphics();
    bg.beginFill(sel ? 0xd8843a : 0xffffff, sel ? 0.95 : 0.85);
    bg.lineStyle(1.2, sel ? 0xb85a10 : 0xc9b090, 0.95);
    bg.drawRoundedRect(bx, by, btnW, 34, 6);
    bg.endFill();
    bg.eventMode = 'static'; bg.cursor = 'pointer';
    bg.on('pointerdown', (e) => {
      e.stopPropagation();
      // §8.3(星光 2026-10-19):四选项一律「点击→弹窗确认→才生效」。
      // 原直接写 prPolicy:诡辩/道歉/不公关体感像「选中」,补贴像「直接执行」,行为不一致 ⇒ 统一加确认。
      prConfirm = { key: o.key, name: o.name, desc: o.desc };
      layoutScreenPanel();
    });
    panelContentArea.addChild(bg);
    const nm = makeText(o.name, { size: 12, color: sel ? '#ffffff' : '#6a4a1a', weight: 'bold' });
    nm.x = bx + 8; nm.y = by + 4;
    panelContentArea.addChild(nm);
    const ds = makeText(o.desc, { size: 8, color: sel ? '#ffe8cc' : '#9a8a78' });
    ds.x = bx + 6; ds.y = by + 20;
    if (ds.width > btnW - 10) ds.scale.set((btnW - 10) / ds.width);
    panelContentArea.addChild(ds);
  });
  // §8.3 高亮是一次性:本次已按 prFocus 画出 3px 描边,绘完即消费 ⇒ 下次重绘恢复 1.5px
  //   (不消费会永久高亮;放在末尾而非开头,否则首帧就看不到高亮)
  prFocus = false;
}

const EXAM_HINT_TEXT = ['灵感', '素材', '金句', '考点'];   // 卡片前缀(作文场景的五味措辞)

function examHintLerp(pair, importance) {
  const k = Math.max(0, Math.min(1, importance || 0));
  return pair[0] + (pair[1] - pair[0]) * k;
}
// 用游戏内私有随机(不消耗游戏 Math.random 流,免得污染经济仿真的可比性)
function examHintRand(T) {
  T._hr = (T._hr || 12345) * 1103515245 + 12345;
  return ((T._hr >>> 8) & 0xffffff) / 0x1000000;
}

function spawnExamHint(s, ex, totalH, gameHours) {
  const cfg = EXAM_HINT_CFG;
  const imp = ex.importance || 0.2;
  if (!s.hints) s.hints = [];
  if ((s.hints.length >= cfg.MAX_ALIVE) || !(totalH >= (s.nextHintH || 0))) return;
  const rnd = examHintRand(state.relay.train);
  s.nextHintH = totalH + examHintLerp(cfg.INTERVAL_H, imp) * (0.7 + rnd * 0.6);
  // §17.8:EXAM_HINTS 是「一条卡一个条目」的扁平表(由文本池生成),text 已含前缀语义,
  //         故不再从 tips 里二次取;prefix 仍按轮转给画面变化。
  const kind = EXAM_HINTS[Math.floor(rnd * EXAM_HINTS.length) % EXAM_HINTS.length];
  s.hintSeq = (s.hintSeq || 0) + 1;
  s.hints.push({
    id: s.hintSeq,
    attrKey: kind.key,
    // 文案:直接用池里那条(如「先证伪再下结论」);label 作为前缀来源之一
    text: kind.text,
    prefix: EXAM_HINT_TEXT[s.hintSeq % EXAM_HINT_TEXT.length],
    untilH: totalH + examHintLerp(cfg.TTL_H, imp),
    score: Math.round(examHintLerp(cfg.SCORE, imp)),
    attr: examHintLerp(cfg.ATTR, imp),
    // 屏幕位置(0~1 归一化,渲染时乘面板尺寸):避免与文字重叠,分四个区
    ux: 0.12 + rnd * 0.76,
    uy: 0.18 + ((s.hintSeq * 0.37) % 1) * 0.5,
  });
}

// 点中提示:返回 true = 命中(调用方负责重绘)
function examHintClick(px, py, area) {
  const T = state.relay.train;
  const s = T && T.examSession;
  if (!s || !s.hints || !s.hints.length || !area) return false;
  // 从后往前判(后画的在上层)
  for (let i = s.hints.length - 1; i >= 0; i--) {
    const h = s.hints[i];
    const cx = area.x + h.ux * area.w;
    const cy = area.y + h.uy * area.h;
    const hw = Math.max(52, Math.min(120, area.w * 0.22)) / 2;
    const hh = 16;
    if (Math.abs(px - cx) <= hw && Math.abs(py - cy) <= hh) {
      // ① 本次考试分数(只在本次结算内有效)
      s.score = Math.min(100, s.score + h.score);
      s.clicks = (s.clicks || 0) + 1;
      // ② 属性(唯一带出局外的收益;每场有硬上限防刷)
      const room = Math.max(0, EXAM_HINT_CFG.ATTR_CAP_PER_EXAM - (s.attrGain || 0));
      const add = Math.min(room, h.attr);
      if (add > 0) {
        const A = state.relay.ability;
        const cur = A[h.attrKey] || 0;
        A[h.attrKey] = Math.min(100, cur + add);
        s.attrGain = (s.attrGain || 0) + add;
      }
      s.hints.splice(i, 1);
      if (typeof spawnFloatText === 'function') {
        spawnFloatText(h.prefix + ' +' + h.score + ' 分' + (add > 0 ? ' · ' + h.attrKey + ' +' + add.toFixed(2) : ''),
          px, py - 14);
      }
      return true;
    }
  }
  return false;
}

function settleExam() {
  const R = state.relay, T = R.train;
  const s = T.examSession;
  if (!s) return;
  T.examSession = null;
  const idx = s.idx, ex = TRAIN_CFG.EXAMS[idx];
  if (!ex) return;
  const score = Math.max(0, Math.min(100, s.score));
  const passLine = Math.max(1, Math.min(99, ex.passGrade * 100));   // 隐藏阈值(不给玩家看)
  const passed = score >= passLine;
  const retakes = T.examRetakes[idx] || 0;
  T.examScores[idx] = Math.round(score);
  // §22:考试 = 泛化检验 ⇒ 每场额外把拟合度拉回最优点(现实里做 eval 就是在发现过拟合)
  fitRelaxTowardOpt(TRAIN_CFG.FIT_EXAM_RELIEF);
  T.examLastGrade[idx] = score;
  // 等级映射(模糊信号第 1 层):按「得分 / 隐藏阈值」的比值分档,不公开分界
  const rr = score / passLine;
  const gradeTxt = rr >= 1.15 ? 'S' : rr >= 1.0 ? 'A' : rr >= 0.92 ? 'B' : rr >= 0.8 ? 'C' : 'D';
  const decay = Math.pow(TRAIN_CFG.RETAKE_REWARD_DECAY, retakes);
  const listed = relayListedModel();
  const simFactor = listed ? (0.6 + rawSimilarityTo(R.ability, listed) / 100 * 0.6) : 0.7;
  // ⚠️ 2026-10-16 关键设计修正(token 照发,不过关才不给「额外奖励」):
  //    本作经济里**考试 token 是供给主源**(D30 占 65%),而能力提升又依赖 token 玩强化训练。
  //    若「不通过 = 没有 token」⇒ 能力永远不涨 ⇒ 死锁(实测:连 D30 局数都掉到 1、供给 0.73M)。
  //    故:得分换算 token 始终发放(与 §16.5 旧口径一致,保证经济链不断),
  //        「通过」才额外给 信誉 + 用户量加成 + 推进到下一场;落榜只是原地 7 天后重考。
  const gradeNum = Math.min(1.5, score / 100);
  // ⚠️ 重考不发 token(2026-10-16 修):首考无论过没过都发(否则经济链死锁),
  //    但**重考只重新评估**,再发就变成「落榜刷钱」——实测 D30 考试供给会从 28M 涨到 74M。
  // 首考全额;重考 3 折(不发 ⇒ 能力练不上去会死锁;全额 ⇒ 落榜刷钱)。实测两者都错过一次。
  const tokenMul = retakes === 0 ? 1 : 0.3;
  const tokens = ex.tokenM * 1e6 * (0.5 + gradeNum) * simFactor * tokenMul;
  if (tokens > 0) {
    state.tokens += tokens;
    updateTokenDisplay();
  }
  if (passed) {
    if (ex.rep) R.reputation = Math.min(100, R.reputation + ex.rep * decay);
    if (ex.usersPct) {
      const totalH = (R.news && typeof R.news.totalH === 'number') ? R.news.totalH : 0;
      T.userBoost = { untilH: totalH + (ex.usersDays || 3) * 24, pct: ex.usersPct * decay };
    }
    if (ex.graduate) T.graduate = true;
    T.examStage = idx + 1;                       // 进入下一场
  } else {
    T.examRetakes[idx] = retakes + 1;            // 落榜:7 天后再战
  }
  if (typeof spawnFloatText === 'function') {
    spawnFloatText(ex.name + (passed ? ' 通过(' : ' 落榜(') + gradeTxt + ') · ' + Math.round(score) + ' 分'
      + ' +' + formatNum(tokens) + ' tok' + (passed ? '' : ' —— 评委说还差些火候'),
      app.screen.width / 2, app.screen.height * 0.3);
    // §17.8 模型内心戏:按「本次考试最弱的那一维 × 对错」从文本池抽一条(池来自《考试文案池.md》)
    const line = examThinkLine(R, passed);
    if (line) {
      // 不延迟:vm 沙箱里没有 setTimeout(实测 ReferenceError)。两条浮字上下错开即可。
      spawnFloatText('「' + line + '」', app.screen.width / 2, app.screen.height * 0.38);
    }
  }
}

// §17.8:挑一条内心戏。优先按「本次最弱维度 × 对错」;没有再回落到通用池。
// 文本池由 sync_exam_text.py 从《考试文案池.md》生成(EXAM_THINK),这里只做挑选。
function examThinkLine(R, passed) {
  const A = R.ability || {};
  // 找最弱的一维(用同一条 0~100 口径;缺省视为中等)
  let weak = 'reasoning', weakV = 1e9;
  const dims = ['reasoning', 'knowledge', 'instruct', 'longCtx', 'toolCall', 'multimodal', 'speed'];
  for (const k of dims) {
    const v = (typeof A[k] === 'number') ? A[k] : 50;
    if (v < weakV) { weakV = v; weak = k; }
  }
  const key = weak + (passed ? '_ok' : '_bad');
  const pool = (EXAM_THINK && EXAM_THINK[key]) || [];
  const gen = (EXAM_THINK && EXAM_THINK._general) || [];
  const src = pool.length ? pool : gen;
  if (!src.length) return '';
  // ⚠️ 展示抽取**绝不消耗主随机流**(2026-10-18,§17.9):初版用 Math.random ⇒ 每场考试结算多掷一次
  //    ⇒ sim 轨迹与 §17.7 基线分叉(1.89/1.13 → 1.93/0.93,二分定位到 a5b4a1b;同 §20.14 发现 3)。
  //    改自增游标:零随机、跨考试轮播;游标挂 R 上(exF 只抽函数体,模块级变量进不了沙箱)。
  const tick = ((R.examThinkTick || 0) + 1);
  R.examThinkTick = tick;
  return src[tick % src.length];
}

// 旧名字保留(其它调用点/外部脚本可能引用):立刻按「满时长考完」结算一次
function fireExam(exam) {
  const idx = TRAIN_CFG.EXAMS.indexOf(exam);
  if (idx < 0) return;
  startExam(idx);
  state.relay.train.examSession.endH = state.relay.news.totalH;
  settleExam();
}

// ========== 调教「强化训练」= 点按成组消除(设计 §16.10;在调教场景内,与电脑面板区分;主流缓慢增长) ==========
// 颜色=属性维度;模式决定棋盘出现哪些维、主色涨得多。结算与商店共用「(100-当前值)×比例」口径。

//     6 色各形状在该可用区下的「全盘无 >=3 连通」(= 消不动/步数白费)概率:
//       14x9 = 4.9%(最优) · 16x8 = 5.3% · 12x10 = 6.1% · 18x7 = 6.9% · 13x9 = 7.7% · 17x7 = 10.9% · 20x6 = 12.7%
//   ⚠️ 颜色越多,「至少 3 块相邻同色」越罕见,所需格数近乎按颜色数平方增长 —— 这是 8 色做不了的根本原因,不是懒得做。
//   代价:每维点数 18.0 → 9.3/局(步数 14 与总消除量不变,只是摊到更多维度上)。
const GAME_CFG = {
  COLS: 14, ROWS: 9,
  COLORS: 6,             // 每局出现的颜色数(= 属性维度数);必须与 TRAIN_MODES[].colors.length 一致
  MIN_GROUP: 3,          // 相连同色 >=3 才能点消
  START_MOVES: 14,       // 每局有效消除次数上限
  AP_COST: 3,            // 开局消耗算力(行动点)
  TOKEN_START: 3e4,      // 开局消耗 token(基准值,随游玩天数放大)
  TOKEN_PER_MOVE: 5e3,   // 每有效消除一步消耗 token(基准值,随游玩天数放大)
  TOKEN_GROWTH_PER_DAY: 0.3, // 成本倍率 = 1 + 已玩天数 × 此值(开局与每步同倍率,越玩越贵)
  TOKEN_MUL_CAP: 4,          // P1-12:成本倍率硬封顶(day10 起不再涨),防后期「收益递减 × 成本递增」双杀
  BASE_POINTS: 40,       // 结算分母:某维点数/此值 = 占比(封顶 1)
  WEIGHT_PRIMARY: 0.09,  // 主色:每满占比最多涨这么多 headroom
  WEIGHT_SECOND: 0.045,  // 副色
};
const TRAIN_MODES = [
  { key: 'reason', name: '推理特训', desc: '偏涨推理;工具调用/知识/速度/上下文/指令均衡',
    colors: ['reasoning', 'toolCall', 'knowledge', 'speed', 'longCtx', 'instruct'], primary: 'reasoning' },
];
// 6 色方块(索引对应 mode.colors):色相拉开到 约 215/0/130/45/275/185,保证相邻块肉眼可分
const GAME_TILE_HEX = [0x4a7ac0, 0xc05a5a, 0x4aa05a, 0xd0a53a, 0x9a5ad0, 0x3a9aa0];
let gameState = null; // 临时,不进存档:{ mode, board[ROWS][COLS], moves, tally:{key:n}, over }

// 通用行动点扣除(将来同学聊天/交友等也走这个池)
function spendAP(n) { state.relay.train.ap = Math.max(0, state.relay.train.ap - n); }

// token 成本倍率:随已玩的游戏天数线性上涨(越玩越贵);开局与每步共用
// P1-12(2026-10-03):加硬封顶。原来无上限 —— day10 ×4 / day30 ×10 / day100 ×31,
// 而属性收益是 (100-当前值)×rate 递减 → 后期「收益递减 × 成本递增」双杀,
// 属性练到 70+ 后强化训练几乎不可用,与「练属性 → 卖更多」的主循环直接冲突。
// 封顶 4(= day10 的水平):10 天之后成本恒定,训练变成「想练就练」。
function gameTokenMul() {
  const totalH = (state.relay.news && typeof state.relay.news.totalH === 'number') ? state.relay.news.totalH : 0;
  const daysPlayed = totalH / 24;
  return Math.min(1 + daysPlayed * GAME_CFG.TOKEN_GROWTH_PER_DAY, GAME_CFG.TOKEN_MUL_CAP);
}
function gameStartTokenCost() { return GAME_CFG.TOKEN_START * gameTokenMul(); }
function gameMoveTokenCost() { return GAME_CFG.TOKEN_PER_MOVE * gameTokenMul(); }

function gameCanStart() {
  return state.relay.train.ap >= GAME_CFG.AP_COST && state.tokens >= gameStartTokenCost();
}
function randColor() { return Math.floor(Math.random() * GAME_CFG.COLORS); }
function makeBoard() {
  const b = [];
  for (let r = 0; r < GAME_CFG.ROWS; r++) { b.push([]); for (let c = 0; c < GAME_CFG.COLS; c++) b[r].push(randColor()); }
  return b;
}
function startGame() {
  if (gameState || !gameCanStart()) return false;
  spendAP(GAME_CFG.AP_COST);
  state.tokens -= gameStartTokenCost();
  updateTokenDisplay();
  const tally = {};
  for (const k of TRAIN_MODES[0].colors) tally[k] = 0;
  gameState = { mode: TRAIN_MODES[0], board: makeBoard(), moves: GAME_CFG.START_MOVES, tally, over: false };
  return true;
}
// 从 (r,c) flood fill 同色相连块
function findGroup(board, r0, c0) {
  const color = board[r0][c0];
  if (color < 0) return [];
  const seen = {}, out = [], stack = [[r0, c0]];
  while (stack.length) {
    const [r, c] = stack.pop();
    const key = r + ',' + c;
    if (seen[key]) continue;
    if (r < 0 || r >= GAME_CFG.ROWS || c < 0 || c >= GAME_CFG.COLS) continue;
    if (board[r][c] !== color) continue;
    seen[key] = 1; out.push([r, c]);
    stack.push([r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]);
  }
  return out;
}
// 消除 + 重力下落 + 顶部补新
// §19.14(2026-10-21):除了改棋盘,还返回每列落位映射,让视觉层做「上→下坠落」而不是整块重绘。
// moves: [{ c, toR, fromR }],fromR = -1 表示顶部新生成的格子(从棋盘上方掉进来)。
function clearAndDrop(board, cells) {
  for (const [r, c] of cells) board[r][c] = -1;
  const moves = [];
  for (let c = 0; c < GAME_CFG.COLS; c++) {
    let write = GAME_CFG.ROWS - 1;
    for (let r = GAME_CFG.ROWS - 1; r >= 0; r--) {
      if (board[r][c] >= 0) {
        board[write][c] = board[r][c];
        if (write !== r) { board[r][c] = -1; moves.push({ c, toR: write, fromR: r }); }
        write--;
      }
    }
    for (let r = write; r >= 0; r--) { board[r][c] = randColor(); moves.push({ c, toR: r, fromR: -1 }); }
  }
  return { board, moves };
}
// 结算:每维按 (100-当前值) × min(1,点数/基准) × 权重 × trainGainMul() 涨
function settleGame() {
  if (!gameState) return null;
  const R = state.relay, mul = trainGainMul();
  const gains = {};
  for (const k in gameState.tally) {
    const n = gameState.tally[k];
    if (n <= 0) continue;
    const frac = Math.min(1, n / GAME_CFG.BASE_POINTS);
    const w = (k === gameState.mode.primary) ? GAME_CFG.WEIGHT_PRIMARY : GAME_CFG.WEIGHT_SECOND;
    const gain = (100 - R.ability[k]) * frac * w * mul;
    abilityAdd(k, gain);
    gains[k] = gain;
  }
  gameState = null;
  saveGame();
  if (typeof refreshTrainUI === 'function') refreshTrainUI(true);
  return gains;
}

function layoutScreenPanel() {
  const w = app.screen.width;

  // 背景遮罩(半透明深色模拟虚化,加深)

  panelMask.drawRect(0, 0, w, h);
  panelMask.endFill();

  // 面板尺寸(占绝大部分,留有边距)
  const pw = w * 0.88;
  const ph = h * 0.85;
  const px = (w - pw) / 2;
  const py = (h - ph) / 2;
  const radius = 14;

  // 面板主体(米白色,简约风格)
  panelBody.clear();
  panelBody.lineStyle(1, 0xc4b8a8, 0.6);
  panelBody.beginFill(0xf5f0e8, 1);
  panelBody.drawRoundedRect(px, py, pw, ph, radius);
  panelBody.endFill();
  // 显式 hitArea:比依赖 Graphics 的填充几何做命中判定更可靠,且随布局一起更新
  panelBody.hitArea = new PIXI.Rectangle(px, py, pw, ph);

  // 顶部栏(稍深米色,高度48px)
  const topH = 48;
  panelTopBar.clear();
  panelTopBar.beginFill(0xe8e0d4, 1);
  panelTopBar.drawRoundedRect(px, py, pw, topH, radius);
  panelTopBar.endFill();
  // 遮盖底部圆角(让顶部栏和面板主体无缝衔接)
  panelTopBar.beginFill(0xe8e0d4, 1);
  panelTopBar.drawRect(px, py + topH - radius, pw, radius);
  panelTopBar.endFill();

  // 左侧栏(稍深米色)。窄屏(竖屏手机)按比例收窄,否则固定的 200px 会把内容区挤没
  const sideW = Math.min(200, w * 0.24);
  panelSideBar.clear();
  panelSideBar.beginFill(0xe8e0d4, 1);
  panelSideBar.drawRoundedRect(px, py + topH, sideW, ph - topH, radius);
  panelSideBar.endFill();
  // 遮盖右侧圆角
  panelSideBar.beginFill(0xe8e0d4, 1);
  panelSideBar.drawRect(px + sideW - radius, py + topH, radius, ph - topH - radius);
  panelSideBar.endFill();
  // 左侧栏和顶部栏之间的分隔线

  panelSideBar.moveTo(px + sideW, py + topH);
  panelSideBar.lineTo(px + sideW, py + ph);

  // 只 removeChildren 的话 JS 对象会被 GC,但它们占着的 canvas 纹理不会立刻释放,
  // 反复改数值就泄漏一堆纹理 → 越用越卡。销毁推迟到下一帧,避免在事件派发途中析构正在派发的对象。
  const wipeLater = (container) => {
    const old = container.removeChildren();
    setTimeout(() => { for (const c of old) if (!c.destroyed) c.destroy({ children: true }); }, 0);
  };
  wipeLater(panelPlaceholders);
  wipeLater(panelContentArea);

// 榜单滚轮:直接挂 DOM wheel,不走 Pixi 的事件系统 ——
// 面板已占屏 88%×85%,不需要把指针精确停在列表上才响应;也免得再踩一次 Pixi 命中测试的坑。
// 只在「面板开着 + 当前是榜单页/后台页」时生效。
app.view.addEventListener('wheel', (e) => {
  if (!screenPanelOpen) return;
  if (panelTab === 'leaderboard') {
    if (boardPickIdx >= 0) return;   // 编辑器开着时不要滚动背后的榜单
    searchHitIdx = -1;               // 滚动了就清掉搜索跳转蓝框
    const step = e.deltaY > 0 ? 3 : -3;
    const next = Math.max(0, Math.min(REAL_MODELS.length - 1, boardScroll + step));
    if (next === boardScroll) return;
    boardScroll = next;
    layoutScreenPanel();
  } else if (panelTab === 'backend') {
    if (backendEditingPrice) return;
    const step = e.deltaY > 0 ? 3 : -3;
    const next = Math.max(0, Math.min(REAL_MODELS.length - 1, backendPickScroll + step));
    if (next === backendPickScroll) return;
    backendPickScroll = next;
    layoutScreenPanel();
  } else if (panelTab === 'community') {
    if (communityDetailKey || communityPostOpen) return;
    const feed = newsFeedSorted();
    const step = e.deltaY > 0 ? 2 : -2;
    const next = Math.max(0, Math.min(Math.max(0, feed.length - 1), communityScroll + step));
    if (next === communityScroll) return;
    communityScroll = next;
    layoutScreenPanel();
  }
}, { passive: true });

  const sub = makeText('你最接近的模型 · 相似度 ' + tw.similarity + '%', { size: 13, color: '#8a7a68' });

  sub.y = title.y + title.height + 6;
  panelContentArea.addChild(sub);

  // 左下:评分块(参考图的荧光绿块,这里用暖橙,和面板色调一致)
  const bw = w * 0.30, bh = h * 0.28;
  const bx = x + w * 0.05, by = y + h * 0.58;
  const block = new PIXI.Graphics();
  block.beginFill(0xd4a574, 1);
  block.drawRoundedRect(bx, by, bw, bh, 6);
  block.endFill();
  panelContentArea.addChild(block);

  const scoreLabel = makeText('综合评分', { size: 12, color: '#6a4a24', weight: 'bold' });
  scoreLabel.x = bx + 16; scoreLabel.y = by + 12;
  panelContentArea.addChild(scoreLabel);

  const scoreVal = makeText(String(Math.round(cap * 10)), { size: Math.min(52, bh * 0.42), color: '#3a2a14', weight: 'bold' });
  scoreVal.x = bx + 16; scoreVal.y = by + bh * 0.30;
  panelContentArea.addChild(scoreVal);

  // cap(0-100 刻度的综合能力值,榜单同款)显示在大数右侧
  const capTxt = makeText('cap ' + (Math.round(cap * 10) / 10), { size: 16, color: '#6a4a24', weight: 'bold' });
  capTxt.x = scoreVal.x + scoreVal.width + 14;
  capTxt.y = scoreVal.y + scoreVal.height - capTxt.height - 2;
  panelContentArea.addChild(capTxt);

  // 「标称」= 对外宣传口径(速度×3,与真实模型榜单的 AA 实测可比);
  // 实际服务吞吐是 1 点=1 token/s(见中转站面板),两个数别打架(2026-10-03 修 P1-5)。
  const scoreMeta = makeText('标称 ' + fmt2(tokPerSec(a.speed)) + ' tokens/s · 上下文 ' + Math.round(ctx) + 'k',
    { size: 12, color: '#6a4a24' });
  scoreMeta.x = bx + 16; scoreMeta.y = by + bh - 26;
  panelContentArea.addChild(scoreMeta);

  // 右侧:九轴雷达图(全部基础属性,一个都不少)
  drawRadar(x + w * 0.64, y + h * 0.42, Math.min(w * 0.24, h * 0.34), a, tw.model ? modelToAttrs(tw.model) : null);

  // 底部图例 + 两个"非单调属性"的读法说明(不解释的话玩家会把拟合当成越高越好)
  const notes = [
    '灰 = 最接近的真实模型   橙 = 你的模型',
    '拟合最优 ' + CAP_FIT_OPT + '(过高过拟合 / 过低欠拟合,都会掉能力) · 参数不直接加能力,只放大训练收益',
  ];
  notes.forEach((s, i) => {
    const t = makeText(s, { size: 11, color: '#8a7a68' });
    t.x = x + w * 0.05;
    t.y = y + h * 0.90 + i * 17;
    panelContentArea.addChild(t);
  });

  drawAttrDetailButton(x + w, y);
}

// 纸页图标(日志/文档感):圆角纸 + 右上折角 + 三条内容线。s = 图标高度
function drawPaperIcon(g, x, y, s) {
  const w = s * 0.8;
  g.beginFill(0xfdfaf5, 1);
  g.drawRoundedRect(x, y, w, s, 2);
  g.endFill();
  g.lineStyle(1, 0x8a7a68, 1);
  g.drawRoundedRect(x, y, w, s, 2);
  // 右上折角
  g.beginFill(0xd4a574, 1);
  g.moveTo(x + w * 0.58, y);
  g.lineTo(x + w, y + s * 0.34);
  g.lineTo(x + w * 0.58, y + s * 0.34);
  g.closePath();
  g.endFill();
  // 三条内容线
  g.lineStyle(1, 0x8a7a68, 0.75);
  for (let i = 0; i < 3; i++) {
    const ly = y + s * (0.46 + i * 0.17);
    g.moveTo(x + w * 0.2, ly);
    g.lineTo(x + w * (i === 2 ? 0.58 : 0.8), ly);
  }
}

// ---------- 弹层几何助手(§19.10,2026-10-19 星光:「弹窗放大一点,适配小屏手机」) ----------
// 原状:各弹窗写死 640~860 宽 + 固定行高,667×375 手机横屏下卡片(488px)比屏还高 ⇒ 底部被裁。
// 规则:窄面板(<560,手机横屏)宽度占比抬到 ~0.97;高度**永远钳进面板可视区**,行高按可用高均分;
//       行高压不下去时(极矮屏)字号由调用方按 fsK 同步缩。桌面(fsw≥560)几何与旧版几乎一致。
function popupGeom(px, py, pw, ph, rows, baseRowH, headH, footH, wFrac, capW) {
  const narrow = pw < 560;
  const cw = Math.min(pw * (narrow ? 0.97 : wFrac), capW);
  const wantH = headH + rows * baseRowH + footH;
  const chh = Math.min(wantH, ph - 14);
  const rowH = rows > 0 ? Math.max(24, (chh - headH - footH) / rows) : baseRowH;
  return { cw, chh, cx: px + (pw - cw) / 2, cy: py + (ph - chh) / 2, rowH, narrow };
}

// ---------- 模型页「数据详情」弹层 ----------
// 阴影铺满整个屏幕(不只包住卡片),它同时是"点卡片外任意处关闭"的点击层。
function drawAttrDetail(px, py, pw, ph) {
  const w = app.screen.width, h = app.screen.height;

  const shade = new PIXI.Graphics();
  shade.beginFill(0x1a1208, 0.5);
  shade.drawRect(0, 0, w, h);
  shade.endFill();
  shade.eventMode = 'static';
  shade.hitArea = new PIXI.Rectangle(0, 0, w, h);
  shade.on('pointerdown', () => { showAttrDetail = false; layoutScreenPanel(); });
  attrDetailLayer.addChild(shade);

  const headH = 58, footH = 24;
  const pg = popupGeom(px, py, pw, ph, RADAR_KEYS.length, 40, headH, footH, 0.8, 720);   // §19.12:放大
  const cw = pg.cw, rowH = pg.rowH, chh = pg.chh, cx = pg.cx, cy = pg.cy;
  const fsK = (pg.narrow ? 1.15 : 1) * Math.max(0.95, Math.min(1.1, rowH / 40));   // §19.12:小屏字号增益(星光:看得清)

  const card = new PIXI.Graphics();
  card.lineStyle(1, 0xc4b8a8, 0.9);
  card.beginFill(0xf5f0e8, 1);
  card.drawRoundedRect(cx, cy, cw, chh, 12);
  card.endFill();
  // 头部条用和左侧栏/顶部栏同一个浅米色,视觉上就是"这个面板的一部分"
  card.beginFill(0xe8e0d4, 1);
  card.drawRoundedRect(cx, cy, cw, headH, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRect(cx, cy + headH - 12, cw, 12);
  card.endFill();
  card.eventMode = 'static';   // 挡住阴影:点卡片内部不关闭
  card.hitArea = new PIXI.Rectangle(cx, cy, cw, chh);
  attrDetailLayer.addChild(card);

  const title = makeText('属性数据详情', { size: 17, color: '#2a2118', weight: 'bold' });
  title.x = cx + 20; title.y = cy + 17;
  attrDetailLayer.addChild(title);

  const tip = makeText('点卡片外任意处关闭', { size: 11, color: '#8a7a68' });
  tip.x = cx + cw - tip.width - 20; tip.y = cy + 21;
  attrDetailLayer.addChild(tip);

  const ak = state.relay.ability;
  RADAR_KEYS.forEach((k, i) => {
    const ry = cy + headH + i * rowH;
    if (i > 0) {
      const line = new PIXI.Graphics();
      line.lineStyle(1, 0xc4b8a8, 0.28);
      line.moveTo(cx + 20, ry); line.lineTo(cx + cw - 20, ry);
      attrDetailLayer.addChild(line);
    }
    const nm = makeText(ATTR_NAMES[k], { size: Math.round(14 * fsK), color: '#2a2118', weight: 'bold' });
    nm.x = cx + 20; nm.y = ry + 12 * fsK;
    attrDetailLayer.addChild(nm);

    const val = makeText(String(Math.round(ak[k])), { size: Math.round(13 * fsK), color: '#c05a2a', weight: 'bold' });
    val.x = cx + 96; val.y = ry + 13 * fsK;
    attrDetailLayer.addChild(val);

    const desc = makeText(ATTR_DESC[k], { size: Math.round(12 * fsK), color: '#8a7a68' });
    desc.style.wordWrap = true;
    desc.style.breakWords = true;
    desc.style.wordWrapWidth = cw - 148 - 20;
    desc.x = cx + 148; desc.y = ry + 13;
    attrDetailLayer.addChild(desc);
  });
}

// ---------- 【临时调试】榜单点行弹出的模型属性编辑器 ----------
// 用途:直接改某个真实模型的等效属性,实时看雷达图灰影与「最接近的模型」怎么变,方便调数值。
// 只写 MODEL_ATTR_OVERRIDE(localStorage),**不碰** REAL_MODELS / 存档 / 设计文档。
// 交互:点数值框 → 输数字(最多 3 位)→ 回车确认 / ESC 取消;数字键只更新那一个框,不整页重绘。
// ponytail: 纯调试面板,没做撤销栈、没做多模型并排;要上线就把整块连同 MODEL_ATTR_OVERRIDE 删掉。
function drawModelAttrEditor(px, py, pw, ph) {
  const m = REAL_MODELS[boardPickIdx];
  if (!m) { boardPickIdx = -1; return; }
  const w = app.screen.width, h = app.screen.height;

  const shade = new PIXI.Graphics();
  shade.beginFill(0x1a1208, 0.5);
  shade.drawRect(0, 0, w, h);
  shade.endFill();
  shade.eventMode = 'static';
  shade.hitArea = new PIXI.Rectangle(0, 0, w, h);
  shade.on('pointerdown', () => { boardPickIdx = -1; editingKey = null; layoutScreenPanel(); });
  attrDetailLayer.addChild(shade);

  // 卡片与面板内容区**同比例**(用户要求):宽占 pw 的 97%、高占 ph 的 97%(留一点缝透气),
  // 行高随剩余高度均分 9 行,窗口拉高卡片就跟着拉长,字不会挤。
  const cw = Math.max(560, Math.min(pw * 0.97, 1120));
  const headH = 62, footH = 36;
  const rowH = Math.max(36, Math.floor((ph * 0.97 - headH - footH) / RADAR_KEYS.length));
  const chh = headH + RADAR_KEYS.length * rowH + footH;
  const cx = px + (pw - cw) / 2;
  const cy = py + (ph - chh) / 2;
  // 右栏(与「模型」页一致的能力评价 + 雷达图)宽度的起点;x 皆相对卡片
  const rightW = Math.min(380, cw * 0.42);
  const listW = cw - rightW;

  const card = new PIXI.Graphics();
  card.lineStyle(1, 0xc4b8a8, 0.9);
  card.beginFill(0xf5f0e8, 1);
  card.drawRoundedRect(cx, cy, cw, chh, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRoundedRect(cx, cy, cw, headH, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRect(cx, cy + headH - 12, cw, 12);
  card.endFill();
  card.eventMode = 'static';
  card.hitArea = new PIXI.Rectangle(cx, cy, cw, chh);
  attrDetailLayer.addChild(card);

  // 编辑器标题显示**当前名次**(有效 cap 排序后),不是原始下标 —— 改数值名次会动,标题跟着真实
  const rankNow = boardOrder().findIndex((e) => e.i === boardPickIdx) + 1;
  const title = makeText('第 ' + rankNow + ' 名 · ' + m.n, { size: 20, color: '#2a2118', weight: 'bold' });
  title.x = cx + 22; title.y = cy + 12;
  attrDetailLayer.addChild(title);

  // 左上角副标题里的截止日期:编辑器改「知识」后跟着变(effectiveCutoff),不是静态 m.k
  const meta = makeText(m.v + ' · ' + m.t + ' · cap ' + m.cap + ' · ' + effectiveCutoff(m) + ' · ' + m.c + 'k · $' + m.pi + '/' + m.po,
    { size: 13, color: '#8a7a68' });
  meta.x = cx + 22; meta.y = cy + 38;
  attrDetailLayer.addChild(meta);

  const editable = lbDebug;                    // 调试态可改;玩家态只读查看
  const tip = makeText(editable ? '点数值框输入 · 回车确认 · ESC 取消 · 临时调试' : '查看模型属性',
    { size: 12, color: '#b0a294', anchor: 1 });
  tip.x = cx + cw - 22; tip.y = cy + 24;
  attrDetailLayer.addChild(tip);

  const cur = modelToAttrs(m);                 // 已含覆盖值
  const cap = modelCapabilityOf(m);            // 与「模型」页同一把尺子量出来的综合评分
  const ov = MODEL_ATTR_OVERRIDE[m.n] || {};
  editRef = null;

  // ---- 右栏:与「模型」页一致的能力评价(综合评分块)+ 9 轴雷达图 ----
  // 左栏改属性 → 右栏实时反映(modelToAttrs 每次重绘都重新算)。布局参考 artificialanalysis:
  // 榜单选一个模型 → 看「智能指数 + 分项能力图」。
  const rx = cx + listW;
  const bw = rightW * 0.84, bh = chh * 0.24;
  const bx0 = rx + (rightW - bw) / 2, by0 = cy + headH + 12;
  const block = new PIXI.Graphics();
  block.beginFill(0xd4a574, 1);
  block.drawRoundedRect(bx0, by0, bw, bh, 6);
  block.endFill();
  attrDetailLayer.addChild(block);

  const scoreLabel = makeText('综合评分', { size: 13, color: '#6a4a24', weight: 'bold' });
  scoreLabel.x = bx0 + 16; scoreLabel.y = by0 + 7;
  attrDetailLayer.addChild(scoreLabel);

  const scoreVal = makeText(String(Math.round(cap * 10)), { size: Math.min(48, bh * 0.5), color: '#3a2a14', weight: 'bold' });
  scoreVal.x = bx0 + 16; scoreVal.y = by0 + bh * 0.30;
  attrDetailLayer.addChild(scoreVal);

  // cap(0-100 刻度,与榜单一致;含编辑器覆盖的有效值)显示在大数右侧
  const capTxt = makeText('cap ' + (Math.round(effectiveCap(m) * 10) / 10), { size: 16, color: '#6a4a24', weight: 'bold' });
  capTxt.x = scoreVal.x + scoreVal.width + 14;
  capTxt.y = scoreVal.y + scoreVal.height - capTxt.height - 2;
  attrDetailLayer.addChild(capTxt);

  const scoreMeta = makeText(fmt2(tokPerSec(cur.speed)) + ' tokens/s · 上下文 ' + Math.round(ctxK(cur.longCtx)) + 'k',
    { size: 13, color: '#6a4a24' });
  scoreMeta.x = bx0 + 16; scoreMeta.y = by0 + bh - 24;
  attrDetailLayer.addChild(scoreMeta);

  // 半径按"评分块下缘 → 页脚上缘"的竖向空间倒推:上下两根轴的标签还要占 r+29
  const zoneTop = by0 + bh + 14, zoneBottom = cy + chh - footH - 6;
  const radarR = Math.max(30, Math.min(rightW * 0.36, (zoneBottom - zoneTop - 58) / 2));
  // 画在右栏下半部;模型页的动画只在「模型」页播(编辑器里 radarAnim 已被消费,不会重播)
  drawRadar(rx + rightW / 2, zoneTop + 29 + radarR, radarR, cur, null, attrDetailLayer, 12);

  // ---- 左栏:9 项属性的可编辑列表(原样式) ----
  RADAR_KEYS.forEach((k, i) => {
    const ry = cy + headH + i * rowH;
    if (i > 0) {
      const line = new PIXI.Graphics();
      line.lineStyle(1, 0xc4b8a8, 0.28);
      line.moveTo(cx + 20, ry); line.lineTo(cx + listW - 16, ry);
      attrDetailLayer.addChild(line);
    }
    const editing = editingKey === k;
    const changed = ov[k] !== undefined;

    const nm = makeText(ATTR_NAMES[k], { size: 16, color: '#2a2118', weight: 'bold' });
    nm.x = cx + 22; nm.y = ry + (rowH - 22) / 2;
    attrDetailLayer.addChild(nm);

    // 数值框:调试态点一下进入输入态;玩家态只展示数值(不挂事件)
    const bx = cx + 116, bw2 = 68, bh2 = 26, by = ry + (rowH - bh2) / 2;
    const box = new PIXI.Graphics();
    box.lineStyle(editing ? 2 : 1, editing ? 0xe86a3a : 0xc4b8a8, editing ? 1 : 0.8);
    box.beginFill(editing ? 0xfff0dc : 0xfffaf2, 1);
    box.drawRoundedRect(bx, by, bw2, bh2, 5);
    box.endFill();
    if (editable) {
      box.eventMode = 'static';
      box.cursor = 'text';
      box.hitArea = new PIXI.Rectangle(bx, by, bw2, bh2);
      box.on('pointerdown', () => {
        editingKey = k;
        editBuf = String(Math.round(cur[k]));
        layoutScreenPanel();
      });
    }
    attrDetailLayer.addChild(box);

    const vt = makeText(editing ? editBuf : String(Math.round(cur[k])),
      { size: 15, color: editable && changed ? '#c05a2a' : '#3a2f22', weight: 'bold', anchor: 0.5 });
    vt.x = bx + bw2 / 2; vt.y = by + bh2 / 2;
    attrDetailLayer.addChild(vt);
    if (editing) editRef = vt;                  // 敲键只改这一个 Text

    if (editable && changed) {
      const dot = makeText('已改', { size: 11, color: '#e86a3a' });
      dot.x = bx + bw2 + 8; dot.y = by + 5;
      attrDetailLayer.addChild(dot);
    }

    const desc = makeText(ATTR_DESC[k], { size: 13, color: '#8a7a68' });
    desc.style.wordWrap = true;
    desc.style.breakWords = true;
    desc.style.wordWrapWidth = listW - 220 - 26;
    desc.x = cx + 220; desc.y = ry + (rowH - desc.height) / 2;
    attrDetailLayer.addChild(desc);
  });

  // 左右栏分隔线(画在雷达图之前,别压住内容)
  const vline = new PIXI.Graphics();
  vline.lineStyle(1, 0xc4b8a8, 0.4);
  vline.moveTo(rx - 4, cy + headH + 6);
  vline.lineTo(rx - 4, cy + chh - footH - 4);
  attrDetailLayer.addChild(vline);

  // __DEBUG_STRIP_BEGIN__ 调试按钮整块(重置/清空/导出/导入/保存到文档;正式构建整块剔除)
  if (lbDebug) {   // 调试态专用:已改计数 + 重置/清空/导出/导入/保存到文档(玩家态只读,全部隐藏)
  // 已改计数挪到页脚中间,别和右栏雷达图/轴标签重叠
  const cnt = makeText('已改 ' + Object.keys(MODEL_ATTR_OVERRIDE).length + ' 个模型 · 只存在本机浏览器里',
    { size: 12, color: '#b0a294', anchor: 0.5 });
  cnt.x = cx + listW + (rightW - 200) / 2 + 40;
  cnt.y = cy + chh - footH / 2 - 7;
  attrDetailLayer.addChild(cnt);

  // 页脚:重置本模型 + 清空全部(调试用,免得一个个删)
  const footY = cy + headH + RADAR_KEYS.length * rowH;
  const mkBtn = (label, bx, onTap) => {
    const bw = 108, bh = 26, by = footY + 4;
    const g = new PIXI.Graphics();
    g.lineStyle(1, 0xc4b8a8, 0.9);
    g.beginFill(0xe8e0d4, 1);
    g.drawRoundedRect(bx, by, bw, bh, 6);
    g.endFill();
    g.eventMode = 'static';
    g.cursor = 'pointer';
    g.hitArea = new PIXI.Rectangle(bx, by, bw, bh);
    g.on('pointerdown', onTap);
    attrDetailLayer.addChild(g);
    const t = makeText(label, { size: 12, color: '#5a4632', weight: 'bold', anchor: 0.5 });
    t.x = bx + bw / 2; t.y = by + bh / 2;
    attrDetailLayer.addChild(t);
  };
  mkBtn('重置本模型', cx + 22, () => {
    delete MODEL_ATTR_OVERRIDE[m.n];
    saveModelOverrides();
    editingKey = null;
    layoutScreenPanel();
  });
  mkBtn('清空全部', cx + 138, () => {
    // 清空前自动落一份备份文件 —— 覆盖层一清,没导出的调整就真没了(吃过一次亏)
    const n = Object.keys(MODEL_ATTR_OVERRIDE).length;
    if (n) {
      const blob = new Blob([JSON.stringify(MODEL_ATTR_OVERRIDE, null, 1)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dshgame-adjustments-backup.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    MODEL_ATTR_OVERRIDE = {};
    saveModelOverrides();
    editingKey = null;
    layoutScreenPanel();
    if (n) spawnFloatText('已清空(清空前的备份已下载)', cx + 192, footY - 10);
  });
  // 调整值只存在浏览器 localStorage 里(不进存档/文件),给个导入导出防丢:
  // 换浏览器、清缓存、或者让我跑构建测试之前,先「导出」留一份。
  if (listW >= 520) {
    // 一键导出:自动下载 dshgame-adjustments.json + 复制到剪贴板(双保险)。
    // 调整值按"打开方式"隔离在各自的 localStorage 里,换窗口/换浏览器就靠这对按钮搬家。
    mkBtn('导出调整', cx + 254, () => {
      const n = Object.keys(MODEL_ATTR_OVERRIDE).length;
      if (!n) { spawnFloatText('当前没有调整,无需导出', cx + 320, footY - 10); return; }
      const json = JSON.stringify(MODEL_ATTR_OVERRIDE, null, 1);
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dshgame-adjustments.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      try { navigator.clipboard.writeText(JSON.stringify(MODEL_ATTR_OVERRIDE)); } catch (e) { /* file:// 等场景可能拒绝,下载已兜底 */ }
      spawnFloatText('已下载备份 + 已复制 ' + n + ' 个模型', cx + 320, footY - 10);
    });
    // 一键导入:选一个之前导出的 json 文件
    // 「保存到文档」:把当前覆盖 POST 给本地服务(server.py),自动写进设计文档 §3.1 并重建 ——
    // 不用再导出/导入。要求用 127.0.0.1:8765 打开且 server.py 在跑;file:// 或服务未启动时走导出兜底。
    if (listW >= 640) mkBtn('保存到文档', cx + 502, () => {
      const n = Object.keys(MODEL_ATTR_OVERRIDE).length;
      if (!n) { spawnFloatText('当前没有调整', cx + 556, footY - 10); return; }
      spawnFloatText('正在写入设计文档…', cx + 556, footY - 10);
      // payload 附带有效 cap(__cap)与截止日期(__k):不然属性固化了、cap 会退回静态值(踩过的坑)
      const payload = {};
      for (const [name, kv] of Object.entries(MODEL_ATTR_OVERRIDE)) {
        const m = REAL_MODELS.find((x) => x.n === name);
        payload[name] = Object.assign({}, kv);
        if (m) {
          payload[name].__cap = Math.round(effectiveCap(m) * 10) / 10;
          payload[name].__k = effectiveCutoff(m);
        }
      }
      fetch('/api/save-overrides', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then((r2) => r2.json())
        .then((j) => {
          MODEL_ATTR_OVERRIDE = {};
          saveModelOverrides();
          editingKey = null;
          layoutScreenPanel();
          spawnFloatText('已固化 ' + (j.updated || []).length + ' 个模型,按 F5 刷新读新数据', cx + 556, footY - 10);
        })
        .catch(() => spawnFloatText('保存失败:需用 127.0.0.1:8765 打开且 server.py 在跑', cx + 556, footY - 10));
    });
    mkBtn('导入调整', cx + 386, () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.onchange = () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const obj = JSON.parse(String(rd.result));
            if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
              MODEL_ATTR_OVERRIDE = obj;
              saveModelOverrides();
              editingKey = null;
              layoutScreenPanel();
              spawnFloatText('已导入 ' + Object.keys(obj).length + ' 个模型的调整', cx + 452, footY - 10);
            } else {
              spawnFloatText('文件内容不是对象', cx + 452, footY - 10);
            }
          } catch (e) { spawnFloatText('解析失败:不是合法 JSON', cx + 452, footY - 10); }
        };
        rd.readAsText(f);
      };
      inp.click();
    });
  }
  }   // if (lbDebug) 闭合(调试按钮整块)
  // __DEBUG_STRIP_END__
}

// __DEBUG_STRIP_BEGIN__ 调试:覆盖落盘 + 输入提交(正式构建剔除;玩家态编辑框不挂事件,二者不可达)
// 【临时调试】覆盖值落盘(键名 MODEL_ATTR_KEY,见定义处)
function saveModelOverrides() {
  try { localStorage.setItem(MODEL_ATTR_KEY, JSON.stringify(MODEL_ATTR_OVERRIDE)); } catch (e) { /* 隐私模式等,忽略 */ }
}

// 【临时调试】提交一次输入:clamp 0-100 整数,写进覆盖表并重绘
function commitModelAttrEdit() {
  if (!editingKey || boardPickIdx < 0) return;
  const m = REAL_MODELS[boardPickIdx];
  const v = Math.max(0, Math.min(100, parseInt(editBuf || '0', 10) || 0));
  if (!MODEL_ATTR_OVERRIDE[m.n]) MODEL_ATTR_OVERRIDE[m.n] = {};
  MODEL_ATTR_OVERRIDE[m.n][editingKey] = v;
  saveModelOverrides();
  editingKey = null; editBuf = ''; editRef = null;
  layoutScreenPanel();
}
