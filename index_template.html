<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSH · 地下机房</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a1410;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #game { width: 100%; height: 100%; }
  canvas { display: block; touch-action: none; }

  /* 手机横屏引导 */
  #rotatePrompt {
    position: fixed; inset: 0; z-index: 9999;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(15, 10, 6, 0.96);
    color: #ffd98a; font-family: inherit;
    pointer-events: auto;
  }
  #rotatePrompt.show { display: flex; }
  #rotatePrompt .rotate-phone {
    width: 64px; height: 104px;
    border: 3px solid #ffb35c; border-radius: 12px;
    position: relative;
    animation: rotateDevice 1.8s ease-in-out infinite;
    margin-bottom: 20px;
  }
  #rotatePrompt .rotate-phone::after {
    content: ""; position: absolute;
    left: 50%; bottom: 7px;
    transform: translateX(-50%);
    width: 20px; height: 3px;
    background: #ffb35c; border-radius: 2px;
  }
  #rotatePrompt .rotate-title {
    color: #ffd98a; font-size: 1.1rem;
    letter-spacing: 6px; font-weight: bold;
    margin-bottom: 8px;
  }
  #rotatePrompt .rotate-sub {
    color: #a89880; font-size: 0.78rem;
    letter-spacing: 2px;
  }
  @keyframes rotateDevice {
    0%, 38% { transform: rotate(0); }
    62%, 100% { transform: rotate(-90deg); }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotatePrompt" aria-hidden="true">
  <div class="rotate-phone"></div>
  <div class="rotate-title">请横屏游玩</div>
  <div class="rotate-sub">旋转设备以获得最佳体验</div>
</div>
<script>__PIXIES__</script>
<script>__ASSETS__</script>
<script>
// ==================== 工具函数 ====================
// 渲染分辨率唯一来源:canvas 后备缓冲与文字栅格化都用它,避免两处各写一份而不同步。
// 上限 2 是性能与清晰度的折中(填充率按平方增长):dpr=3 的手机也用 2。
// 注:autoDensity 下 app.screen 仍是 CSS 像素,所有百分比布局不受影响。
const RENDER_RESOLUTION = Math.min(window.devicePixelRatio || 1, 2);

function rand(min, max) { return Math.random() * (max - min) + min; }

function makeText(text, opts) {
  const style = new PIXI.TextStyle({
    fontFamily: '"PingFang SC", "Microsoft YaHei", sans-serif',
    fontSize: opts.size || 16,
    fill: opts.color || '#fff5e6',
    fontWeight: opts.weight || 'normal',
    align: opts.align || 'left',
    lineHeight: opts.lineHeight || opts.size * 1.3,
  });
  const t = new PIXI.Text(text, style);
  t.resolution = RENDER_RESOLUTION;
  if (opts.anchor !== undefined) t.anchor.set(opts.anchor);
  return t;
}

function roundRect(g, x, y, w, h, r, color, alpha) {
  g.clear();
  g.beginFill(color, alpha);
  g.drawRoundedRect(x, y, w, h, r);
  g.endFill();
}

// ==================== 补间动画 ====================
const tweens = [];
function tween(target, delta, duration, onComplete) {
  const start = {};
  for (const k in delta) start[k] = target[k];
  tweens.push({ target, start, delta, duration, elapsed: 0, onComplete });
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.elapsed += dt;
    const p = Math.min(tw.elapsed / tw.duration, 1);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    for (const k in tw.delta) tw.target[k] = tw.start[k] + tw.delta[k] * e;
    if (p >= 1) {
      if (tw.onComplete) tw.onComplete();
      tweens.splice(i, 1);
    }
  }
}

function addPressFeedback(obj, scale = 0.92) {
  obj.eventMode = 'static';
  obj.cursor = 'pointer';
  obj.on('pointerdown', () => { obj.scale.set(scale); });
  obj.on('pointerup', () => { obj.scale.set(1); });
  obj.on('pointerupoutside', () => { obj.scale.set(1); });
  obj.on('pointercancel', () => { obj.scale.set(1); });
}

// ==================== PIXI 初始化 ====================
const app = new PIXI.Application({
  resizeTo: window,
  background: '#1a1410',
  antialias: false, // 纯 sprite 渲染,MSAA 无收益且移动端费填充率
  autoDensity: true, // canvas CSS 尺寸不变、后备缓冲按 resolution 放大 → app.screen 仍是 CSS 像素
  resolution: RENDER_RESOLUTION, // 手机 dpr 2~3,原来只有 1,全屏贴图会糊
});
document.getElementById('game').appendChild(app.view);

// ==================== 层级容器 ====================
const layers = {
  bg: new PIXI.Container(),
  clickArea: new PIXI.Container(),
  characters: new PIXI.Container(),
  scene: new PIXI.Container(),
  ui: new PIXI.Container(),
  topbar: new PIXI.Container(),
  fx: new PIXI.Container(),
  settings: new PIXI.Container(),
  panel: new PIXI.Container(), // 独立面板层(不受设置面板visible影响)
  nav: new PIXI.Container(), // 底部场景切换标签,置于最顶(切换场景时仍可见)
};
app.stage.addChild(layers.bg, layers.clickArea, layers.characters, layers.scene, layers.ui, layers.topbar, layers.fx, layers.settings, layers.panel, layers.nav);

// ==================== 背景层（灯效） ====================
const bgLight = PIXI.Sprite.from(ASSETS.bg_light);
const bgDark = PIXI.Sprite.from(ASSETS.bg_dark);
bgDark.visible = false; // 用 visible 而非 alpha=0,关灯层不参与渲染批次
layers.bg.addChild(bgLight, bgDark);

function fitBg(sprite) {
  if (!sprite.texture || sprite.texture.width <= 0 || sprite.texture.height <= 0) return;
  const s = Math.max(app.screen.width / sprite.texture.width, app.screen.height / sprite.texture.height);
  if (!isFinite(s) || s <= 0) return;
  sprite.scale.set(s);
  sprite.x = (app.screen.width - sprite.texture.width * s) / 2;
  sprite.y = (app.screen.height - sprite.texture.height * s) / 2;
}
function fitAllBgs() { fitBg(bgLight); fitBg(bgDark); }

// 灯效控制：高频快速交替闪烁
let lightState = 'on';
let lightStateStart = performance.now();
let nextFlickerIn = rand(6, 12);
let nextLightOnIn = 2;
let flickerSeq = [];
let flickerStart = 0;
let flickerNextState = 'off';

function startFlicker(seq, nextState) {
  lightState = 'flickering';
  flickerSeq = seq;
  flickerStart = performance.now();
  flickerNextState = nextState;
  bgDark.visible = seq[0].alpha > 0;
}

function updateLight() {
  if (lightState === 'on') {
    const elapsed = (performance.now() - lightStateStart) / 1000;
    if (elapsed > nextFlickerIn) {
      startFlicker([
        {alpha: 0, dur: 0.07}, {alpha: 1, dur: 0.09},
        {alpha: 0, dur: 0.06}, {alpha: 1, dur: 0.11},
        {alpha: 0, dur: 0.05}, {alpha: 1, dur: 0.08},
        {alpha: 0, dur: 0.04},
      ], 'off');
    }
  } else if (lightState === 'off') {
    const elapsed = (performance.now() - lightStateStart) / 1000;
    if (elapsed > nextLightOnIn) {
      startFlicker([
        {alpha: 1, dur: 0.06}, {alpha: 0, dur: 0.08},
        {alpha: 1, dur: 0.05}, {alpha: 0, dur: 0.1},
        {alpha: 1, dur: 0.04},
      ], 'on');
    }
  } else if (lightState === 'flickering') {
    const fe = (performance.now() - flickerStart) / 1000;
    let acc = 0;
    for (let i = 0; i < flickerSeq.length; i++) {
      acc += flickerSeq[i].dur;
      if (fe < acc) { bgDark.visible = flickerSeq[i].alpha > 0; return; }
    }
    lightState = flickerNextState;
    lightStateStart = performance.now();
    if (flickerNextState === 'off') {
      bgDark.visible = true;
      nextLightOnIn = rand(1.5, 3);
    } else {
      bgDark.visible = false;
      nextFlickerIn = rand(22, 38);
    }
  }
}

// ==================== 点击增量层 ====================
const clickMask = new PIXI.Graphics();
clickMask.beginFill(0x000000, 0.001);
clickMask.drawRect(0, 0, app.screen.width, app.screen.height);
clickMask.endFill();
clickMask.eventMode = 'static';
clickMask.cursor = 'pointer';
layers.clickArea.addChild(clickMask);

const floatTexts = new PIXI.Container();
layers.fx.addChild(floatTexts);

clickMask.on('pointerdown', (e) => {
  if (relaySceneOpen) return; // 中转站时不触发生产点击
  if (state.paused) return;
  const pos = e.global;
  doClick(pos.x, pos.y);
});

function doClick(x, y) {
  const isCrit = Math.random() < state.critChance;
  let gain = state.tokensPerClick;
  if (isCrit) gain = state.tokensPerClick * state.critMultiplier;
  state.tokens += gain;
  if (isCrit) {
    spawnCritText('暴击! +' + formatNum(gain), x, y);
  } else {
    spawnFloatText('+' + formatNum(gain), x, y);
  }
  updateTokenDisplay();
  triggerCharacterTalk();
}

// 浮字对象池:避免连点时反复创建/销毁 PIXI.Text
const floatPool = [];
const FLOAT_POOL_MAX = 40;
const FLOAT_LIVE_MAX = 30; // 同时在屏上限,防连点刷屏
let floatLiveCount = 0;

function acquireFloatText(size, color, rotation) {
  let t = floatPool.pop();
  if (!t) t = makeText('', { size, color, weight: 'bold', anchor: 0.5 });
  t.style.fontSize = size;
  t.style.fill = color;
  t.text = '';
  t.alpha = 1;
  t.rotation = rotation || 0;
  t.scale.set(1);
  return t;
}

function releaseFloatText(t) {
  floatLiveCount--;
  floatTexts.removeChild(t);
  if (floatPool.length < FLOAT_POOL_MAX) floatPool.push(t);
  else t.destroy();
}

function spawnFloatText(text, x, y) {
  if (floatLiveCount >= FLOAT_LIVE_MAX) return;
  floatLiveCount++;
  const t = acquireFloatText(22, '#ffd98a');
  t.text = text;
  t.x = x; t.y = y;
  floatTexts.addChild(t);
  tween(t, { y: y - 60, alpha: 0 }, 0.9, () => { releaseFloatText(t); });
}

function spawnCritText(text, x, y) {
  if (floatLiveCount >= FLOAT_LIVE_MAX) return;
  floatLiveCount++;
  const t = acquireFloatText(30, '#ff6b6b', -0.08);
  t.text = text;
  t.x = x; t.y = y;
  floatTexts.addChild(t);
  tween(t.scale, { x: 1.3, y: 1.3 }, 0.12);
  tween(t, { y: y - 80, alpha: 0 }, 1.1, () => { releaseFloatText(t); });
}

// ==================== 角色层 ====================
const charClosed = PIXI.Sprite.from(ASSETS.char2);
const charOpen = PIXI.Sprite.from(ASSETS.char1);
charClosed.visible = true;
charOpen.visible = false;
const speechBubble = PIXI.Sprite.from(ASSETS.speech_bubble);
speechBubble.visible = false;
layers.characters.addChild(charClosed, charOpen, speechBubble);

let isTalking = false;
let talkTimer = 0;

function triggerCharacterTalk() {
  if (isTalking) { talkTimer = 0.35; return; }
  isTalking = true;
  talkTimer = 0.35;
  charClosed.visible = false;
  charOpen.visible = true;
}

function updateCharacters(dt) {
  if (isTalking) {
    talkTimer -= dt;
    if (talkTimer <= 0) {
      isTalking = false;
      charClosed.visible = true;
      charOpen.visible = false;
    }
  }
}

function layoutCharacters() {
  const targetH = Math.min(340, app.screen.height * 0.4);
  const scale = targetH / 400;
  for (const c of [charClosed, charOpen]) {
    c.scale.set(scale);
    c.x = app.screen.width - 400 * scale - 10;
    c.y = app.screen.height - 400 * scale - 10;
  }
  // 说话气泡：人物左上角
  const bubbleScale = Math.min(1, (app.screen.width * 0.15) / speechBubble.texture.width);
  speechBubble.scale.set(bubbleScale);
  const bw = speechBubble.texture.width * bubbleScale;
  const bh = speechBubble.texture.height * bubbleScale;
  speechBubble.x = charClosed.x - bw + 110;
  speechBubble.y = charClosed.y - bh + 85;
}

// ==================== 场景层（机箱/占位图） ====================
const pcCase = PIXI.Sprite.from(ASSETS.pc_case);
const casePlaceholder = PIXI.Sprite.from(ASSETS.placeholder);
const fanSprite = PIXI.Sprite.from(ASSETS.fan);
layers.scene.addChild(pcCase, casePlaceholder, fanSprite);

// ==================== 机箱物理交互系统 ====================
const casePhysics = {
  vx: 0, vy: 0,
  isDragging: false,
  isActive: false,
  groundY: 0,
  gravity: 0.7,
  bounce: 0.45,
  friction: 0.96,
  dragHistory: [],
  dragOffset: { x: 0, y: 0 },
  userMoved: false,
};
let caseInitialized = false;

function getCaseDisplayWidth() {
  return pcCase.texture.width * pcCase.scale.x;
}
function getCaseDisplayHeight() {
  return pcCase.texture.height * pcCase.scale.y;
}

function startCaseDrag(e) {
  if (!pcCase.visible) return;
  e.stopPropagation();
  casePhysics.isDragging = true;
  casePhysics.isActive = false;
  casePhysics.vx = 0;
  casePhysics.vy = 0;
  casePhysics.dragHistory = [];
  const pos = e.global;
  casePhysics.dragOffset.x = pos.x - pcCase.x;
  casePhysics.dragOffset.y = pos.y - pcCase.y;
  pcCase.cursor = 'grabbing';
}

function updateCaseDrag(e) {
  if (!casePhysics.isDragging) return;
  const pos = e.global;
  const now = performance.now();
  pcCase.x = pos.x - casePhysics.dragOffset.x;
  pcCase.y = pos.y - casePhysics.dragOffset.y;
  casePhysics.dragHistory.push({ x: pcCase.x, y: pcCase.y, t: now });
  if (casePhysics.dragHistory.length > 6) casePhysics.dragHistory.shift();
}

function endCaseDrag() {
  if (!casePhysics.isDragging) return;
  casePhysics.isDragging = false;
  pcCase.cursor = 'pointer';
  // 从拖动历史计算松开时的速度
  const hist = casePhysics.dragHistory;
  if (hist.length >= 2) {
    const first = hist[Math.max(0, hist.length - 4)];
    const last = hist[hist.length - 1];
    const dt = Math.max(last.t - first.t, 1);
    casePhysics.vx = (last.x - first.x) / dt * 16;
    casePhysics.vy = (last.y - first.y) / dt * 16;
  }
  // 限制最大速度
  const maxV = 30;
  casePhysics.vx = Math.max(-maxV, Math.min(maxV, casePhysics.vx));
  casePhysics.vy = Math.max(-maxV, Math.min(maxV, casePhysics.vy));
  casePhysics.isActive = true;
}

function updateCasePhysics() {
  if (!casePhysics.isActive || casePhysics.isDragging) return;
  if (!pcCase.visible) return;

  // 重力
  casePhysics.vy += casePhysics.gravity;

  // 更新位置
  pcCase.x += casePhysics.vx;
  pcCase.y += casePhysics.vy;

  const cw = getCaseDisplayWidth();
  const ch = getCaseDisplayHeight();
  const sw = app.screen.width;
  let settled = false;

  // 地面碰撞
  if (pcCase.y >= casePhysics.groundY) {
    pcCase.y = casePhysics.groundY;
    if (Math.abs(casePhysics.vy) > 2.5) {
      casePhysics.vy = -casePhysics.vy * casePhysics.bounce;
      casePhysics.vx *= casePhysics.friction;
      // 奇迹算法：砸地面有概率获得额外token
      if (state.scripts.miracle && Math.random() < 0.25) {
        const bonus = Math.max(1, Math.floor(state.tokens * 0.03));
        state.tokens += bonus;
        spawnFloatText('奇迹! +' + formatNum(bonus), pcCase.x + 60, casePhysics.groundY - 20);
        updateTokenDisplay();
      }
    } else {
      casePhysics.vy = 0;
      casePhysics.vx *= 0.85;
      if (Math.abs(casePhysics.vx) < 0.15) {
        casePhysics.vx = 0;
        settled = true;
      }
    }
  }

  // 左墙碰撞
  if (pcCase.x <= 0) {
    pcCase.x = 0;
    casePhysics.vx = -casePhysics.vx * casePhysics.bounce;
  }
  // 右墙碰撞
  if (pcCase.x >= sw - cw) {
    pcCase.x = sw - cw;
    casePhysics.vx = -casePhysics.vx * casePhysics.bounce;
  }
  // 顶部碰撞
  if (pcCase.y <= 0) {
    pcCase.y = 0;
    casePhysics.vy = -casePhysics.vy * casePhysics.bounce;
  }

  if (settled) casePhysics.isActive = false;
}

// 机箱拖动事件
pcCase.eventMode = 'static';
pcCase.cursor = 'pointer';
pcCase.hitArea = new PIXI.Rectangle(0, 0, 1, 1); // 临时，layoutCase中更新
pcCase.on('pointerdown', startCaseDrag);
pcCase.on('pointermove', updateCaseDrag);
pcCase.on('pointerup', endCaseDrag);
pcCase.on('pointerupoutside', endCaseDrag);

function layoutCase() {
  // RTX3080数量>=9时切换为升级机箱贴图
  const useUpgraded = state.machines.rtx3080.count >= 9;
  const targetSource = useUpgraded ? ASSETS.pc_case_upgraded : ASSETS.pc_case;
  const newTexture = PIXI.Texture.from(targetSource);
  if (pcCase.texture !== newTexture) {
    pcCase.texture = newTexture;
  }
  const maxCaseH = app.screen.height * 0.42;
  const maxWByHeight = maxCaseH * pcCase.texture.width / pcCase.texture.height;
  const targetW = Math.min(app.screen.width * 0.38, 420, maxWByHeight);
  const s = targetW / pcCase.texture.width;
  const caseH = pcCase.texture.height * s;
  pcCase.scale.set(s);
  const bottomMargin = Math.min(80, app.screen.height * 0.06);
  const defaultX = app.screen.width * 0.28;
  const defaultY = app.screen.height - caseH - bottomMargin - 65;
  const hasFirstGpu = state.machines.rtx3080.count > 0;
  // 只在机箱首次显示时设置默认位置，之后永远不主动改变x/y
  if (hasFirstGpu && !caseInitialized) {
    pcCase.x = defaultX;
    pcCase.y = defaultY;
    caseInitialized = true;
  }
  const ps = targetW * 0.82 / casePlaceholder.texture.width;
  casePlaceholder.scale.set(ps);
  casePlaceholder.x = defaultX;
  casePlaceholder.y = defaultY + (caseH - casePlaceholder.texture.height * ps) / 2;
  casePlaceholder.visible = !hasFirstGpu;
  pcCase.visible = hasFirstGpu;

  // 风扇：机箱镜像位置（右侧），竖长造型
  const maxFanH = app.screen.height * 0.48;
  const fanS = maxFanH / fanSprite.texture.height;
  const fanW = fanSprite.texture.width * fanS;
  fanSprite.scale.set(fanS);
  // 镜像：机箱左边距28%，风扇右边距也28%
  fanSprite.x = app.screen.width * 0.72 - fanW;
  fanSprite.y = app.screen.height - maxFanH - bottomMargin - 65;
  fanSprite.visible = state.cooling.fan.count > 0;

  // 记录地面高度（物理系统用）
  casePhysics.groundY = defaultY;
  // 更新机箱hitArea为实际大小
  pcCase.hitArea = new PIXI.Rectangle(0, 0, pcCase.texture.width, pcCase.texture.height);
}

// ==================== 购买面板 ====================
const purchasePanel = new PIXI.Container();
layers.ui.addChild(purchasePanel);

const purchaseBtn = new PIXI.Container();
const purchaseBtnBg = new PIXI.Graphics();
const purchaseArrow = new PIXI.Graphics();
const purchaseText = makeText('购\n买', { size: 15, color: '#fff5e6', weight: 'bold', align: 'center', anchor: 0.5, lineHeight: 18 });
purchaseBtn.addChild(purchaseBtnBg, purchaseArrow, purchaseText);

const panelContent = new PIXI.Container();
const panelBg = new PIXI.Graphics();
panelContent.addChild(panelBg);
purchasePanel.addChild(panelContent, purchaseBtn);

let panelExpanded = false;
const panelW = 360;
const panelH = 420;

function drawPurchaseArrow(expanded) {
  purchaseArrow.clear();
  purchaseArrow.lineStyle(2.5, 0xfff5e6, 0.9);
  const cx = 21, cy = 18;
  if (expanded) {
    purchaseArrow.moveTo(cx - 6, cy + 4);
    purchaseArrow.lineTo(cx, cy - 4);
    purchaseArrow.lineTo(cx + 6, cy + 4);
  } else {
    purchaseArrow.moveTo(cx - 4, cy - 6);
    purchaseArrow.lineTo(cx + 4, cy);
    purchaseArrow.lineTo(cx - 4, cy + 6);
  }
}

function layoutPurchasePanel() {
  const btnW = 48, btnH = 92;
  const baseX = app.screen.width - btnW - 16;
  const baseY = app.screen.height * 0.2;
  purchaseBtn.x = baseX;
  purchaseBtn.y = baseY;
  roundRect(purchaseBtnBg, 0, 0, btnW, btnH, 10, 0xc4853a, 0.92);
  purchaseText.x = btnW / 2;
  purchaseText.y = btnH / 2 + 8;
  drawPurchaseArrow(panelExpanded);
  purchaseBtn.hitArea = new PIXI.Rectangle(0, 0, btnW, btnH);

  panelContent.x = baseX - panelW - 8;
  panelContent.y = baseY;
  panelContent.visible = panelExpanded;
  if (panelExpanded) {
    roundRect(panelBg, 0, 0, panelW, panelH, 12, 0xfff8ee, 0.95);
  }
}

function drawBuyButton(g, canAfford, color) {
  g.clear();
  const bgColor = canAfford ? color : 0x6b6b6b;
  roundRect(g, 0, 0, 320, 68, 10, bgColor, 0.9);
}

const allBuyItems = [];

// 只有"可负担/已拥有/数量"状态变化时才重绘 Graphics,每帧仅做几次比较
function refreshBuyItem(item, force) {
  const ownedNow = item.oneTime && item.owned();
  const lockedNow = item.lockedFn && item.lockedFn();
  const price = item.priceFn();
  const afford = !ownedNow && !lockedNow && state.tokens >= price;
  const count = item.countFn ? item.countFn() : 0;
  const key = (ownedNow ? 'o' : lockedNow ? 'l' : afford ? 'a' : 'p') + ':' + count;
  if (!force && item._uiKey === key) return;
  item._uiKey = key;
  if (ownedNow) {
    item.priceText.text = '已拥有';
    item.countText.text = '';
    drawBuyButton(item.bg, false, item.buyColor);
  } else if (lockedNow) {
    // 锁定状态:显示提示文字,按钮灰色不可点击
    item.priceText.text = item.lockHintFn ? item.lockHintFn() : '未解锁';
    if (item.countFn) {
      item.countText.text = count > 0 ? 'x' + count : '';
      item.countText.x = item.nameText.x + item.nameText.width + 6;
    }
    drawBuyButton(item.bg, false, item.buyColor);
  } else {
    item.priceText.text = price + ' token';
    if (item.countFn) {
      item.countText.text = count > 0 ? 'x' + count : '';
      item.countText.x = item.nameText.x + item.nameText.width + 6;
    }
    drawBuyButton(item.bg, afford, item.buyColor);
  }
}

function updateAllBuyButtons(force) {
  for (const item of allBuyItems) refreshBuyItem(item, force);
}

function createBuyItem(container, y, iconDraw, name, desc, priceFn, buyColor, onBuy, oneTime, owned, countFn, lockedFn, lockHintFn) {
  const bg = new PIXI.Graphics();
  bg.x = 20; bg.y = y;
  container.addChild(bg);

  const icon = new PIXI.Graphics();
  icon.x = 28; icon.y = y + 12;
  iconDraw(icon);
  container.addChild(icon);

  const nameText = makeText(name, { size: 15, color: '#fff5e6', weight: 'bold' });
  nameText.x = 80; nameText.y = y + 14;
  container.addChild(nameText);

  const countText = makeText('', { size: 13, color: '#ffd98a', weight: 'bold' });
  countText.y = y + 14;
  container.addChild(countText);

  const descText = makeText(desc, { size: 11, color: '#d4c4a8' });
  descText.x = 80; descText.y = y + 36;
  container.addChild(descText);

  const priceText = makeText('', { size: 14, color: '#ffd98a', weight: 'bold', anchor: 1 });
  priceText.x = panelW - 24; priceText.y = y + 30;
  container.addChild(priceText);

  const item = { bg, nameText, countText, priceText, priceFn, oneTime, owned, countFn, buyColor, lockedFn, lockHintFn, _uiKey: null };
  refreshBuyItem(item, true);

  bg.eventMode = 'static';
  bg.cursor = 'pointer';
  bg.hitArea = new PIXI.Rectangle(0, 0, 320, 68);
  bg.on('pointerdown', () => {
    if (oneTime && owned()) return;
    if (lockedFn && lockedFn()) return; // 锁定状态不可购买
    const price = priceFn();
    if (state.tokens >= price) {
      state.tokens -= price;
      onBuy();
      refreshBuyItem(item, true);
      updateAllBuyButtons();
      updateTokenDisplay();
      layoutCase();
      updateRelayTabVisibility();
      saveGame();
    }
  });

  allBuyItems.push(item);
  return item;
}

// 属性 → 派生量。三处互逆:ctxK() ↔ 长上下文属性、cutoffMonths() ↔ 知识属性。
const CTX_MIN_K = 20, CTX_MAX_K = 1000, CTX_RATIO = 50;
const KNOW_M0 = 2024 * 12 + 8;    // 知识=5   → 2024-08
const KNOW_M1 = 2026 * 12 + 9;    // 知识=100 → 2026-09
const TOK_PER_SPEED_POINT = 2;

function ctxK(longCtx)      { return CTX_MIN_K * Math.pow(CTX_RATIO, longCtx / 100); }
function tokPerSec(speed)   { return speed * TOK_PER_SPEED_POINT; }
function cutoffMonths(know) { return KNOW_M0 + (know - 5) * (KNOW_M1 - KNOW_M0) / 95; }
function monthsStr(m)       { const y = Math.floor(m / 12), mo = Math.round(m % 12) + 1; return y + '-' + (mo < 10 ? '0' : '') + mo; }
function modelCapability(a) {
  const core = a.reasoning * CAP_W.reasoning + a.instruct * CAP_W.instruct + a.toolCall * CAP_W.toolCall;
  const knowMul = 1 + (a.knowledge - 50) / 200;
  const fitMul = 1 - CAP_FIT_PENALTY * Math.pow(Math.abs(a.fit - CAP_FIT_OPT) / 70, CAP_FIT_EXP);
  return Math.max(0, Math.min(100, core * knowMul * fitMul / CAP_NORM));
}
// 真实模型的能力反推成"等效属性",用于雷达图叠影与加权距离(与 modelCapability 同一套公式反解)
function modelToAttrs(m) {
  const ao = Math.log(m.c / CTX_MIN_K) / Math.log(CTX_RATIO) * 100;
  return {
    longCtx: Math.max(0, Math.min(100, ao)),
    speed: Math.max(0, Math.min(100, (m.cap - 5) * 1.6 + 15)),
    knowledge: Math.max(0, Math.min(100, 5 + (m.k ? 5 : 0))),
    multimodal: [10, 45, 55, 65][m.m] || 10,
    toolCall: m.tools ? 75 : 12,
    instruct: Math.max(0, Math.min(100, m.cap * 0.95 + 4)),
    reasoning: Math.max(0, Math.min(100, m.cap * 1.02 + 3)),
    // 拟合/参数是内部量,真实模型无从反推,按「训练良好的成品」给锚点:
    // 拟合贴近最优点(略偏高,量产模型通常轻微过拟合),参数随能力规模走。
    // 只用于雷达图对照;相似度距离(SIM_W)不含这两个键,所以不影响 closestModel。
    fit: Math.min(100, CAP_FIT_OPT + m.cap * 0.10),
    params: Math.min(100, m.cap * 0.90 + 5),
  };
}
function modelCapabilityOf(m) { return modelCapability(modelToAttrs(m)); }

// "最接近的模型"(设计文档第 4 节):7 维加权距离 + 两个硬门槛,取最小距离者
function closestModel(a) {
  const cutoff = cutoffMonths(a.knowledge);
  let best = null, bestD = Infinity;
  for (const m of REAL_MODELS) {
    const ma = modelToAttrs(m);
    let d = 0;
    for (const k of ATTR_KEYS) d += SIM_W[k] * Math.abs(a[k] - ma[k]) / 100;
    const mCut = monthsFromStr(m.k);
    if (cutoff < mCut - 3) d += 0.35;                                  // 知识不如它新 → 细节问题上会露馅
    if (a.multimodal < ma.multimodal) d += 0.30;                       // 模态档位不够 → 差距太大
    if (d < bestD) { bestD = d; best = m; }
  }
  return { model: best, distance: bestD, similarity: Math.max(0, Math.round(100 * (1 - bestD / SIM_SAT))) };
}
function monthsFromStr(s) { const p = String(s).split('-'); return (+p[0]) * 12 + (+p[1]); }

// ========== 电脑屏幕面板(点击描边打开) ==========
const screenPanel = new PIXI.Container();

// 背景遮罩:只在「点击落在面板之外」时关闭(面板主体会先一步接住点击,见 panelBody)
const panelMask = new PIXI.Graphics();
panelMask.eventMode = 'static';
panelMask.cursor = 'pointer';
panelMask.on('pointerdown', (e) => {
  // 兜底:面板占屏 88%×85%,极端宽高比下电脑屏幕区域可能露在面板之外,那种情况下点它也不该关面板
  // (主防线是 panelBody 接住面板内的点击,见其定义处)
  if (screenGlowHit.visible) {
    const b = screenGlowHit.getBounds();
    const p = e.global;
    if (p.x >= b.x && p.x <= b.x + b.width && p.y >= b.y && p.y <= b.y + b.height) {
      return;
    }
  }
  closeScreenPanel();
});
screenPanel.addChild(panelMask);

// 面板主体。**这里必须是 eventMode='static'**:Pixi 命中测试会跳过「eventMode='auto' 且没有任何监听器」
// 的对象(auto 的语义是「有监听器才参与交互」)。若留默认值,点击面板内部时命中目标会直接落到下层遮罩,
// 遮罩的 pointerdown 一触发就把面板关了——表现就是「点面板里面也返回」。
// 设成 static 后,遮罩(b 的兄弟节点,不在事件的父链上)在面板范围内永远不会成为命中目标。
const panelBody = new PIXI.Graphics();
panelBody.eventMode = 'static';
screenPanel.addChild(panelBody);

// 顶部栏
const panelTopBar = new PIXI.Graphics();
screenPanel.addChild(panelTopBar);

// 左侧栏
const panelSideBar = new PIXI.Graphics();

// 内容区容器(画在左侧栏之上、占位/标签之下)
// 子元素全部使用**绝对屏幕坐标**——该容器自身位移为 0,所以不需要被父容器坐标换算干扰。

// 左侧栏标签页。内容与数值设计见 中转站设计.md 第 11 节;当前只做到"能切、有占位图"。
const PANEL_TABS = [
  { key: 'model', label: '模型' },
  { key: 'community', label: '社区' },
  { key: 'backend', label: '后台' },
];
let panelTab = 'model';

// 占位容器(顶部栏和左侧栏的占位UI元素)
const panelPlaceholders = new PIXI.Container();
screenPanel.addChild(panelPlaceholders);

// 面板左上角网站logo(大肥鱼站,新版横排)
const panelLogo = PIXI.Sprite.from(ASSETS.panel_logo);
panelLogo.anchor.set(0, 0.5);

// 模型页右上角「数据详情」的弹层。**必须是 screenPanel 的最后一个子节点**:
// 阴影要盖住顶部栏和左侧栏(只包住卡片会显得卡片浮在半空),同时它也是"点任意处关闭"的点击层。
const attrDetailLayer = new PIXI.Container();
attrDetailLayer.visible = false;
screenPanel.addChild(attrDetailLayer);
let showAttrDetail = false;

let screenPanelOpen = false;

function openScreenPanel() {
  if (screenPanelOpen) return; // 防止重复打开
  screenPanelOpen = true;
  screenPanel.visible = true;
  screenGlowHit.eventMode = 'none'; // 打开后禁用屏幕点击,避免重复触发
  layoutScreenPanel();
}

function closeScreenPanel() {
  screenPanelOpen = false;
  showAttrDetail = false;
  screenPanel.visible = false;
  screenGlowHit.eventMode = 'static'; // 恢复屏幕点击
}

function layoutScreenPanel() {
  const w = app.screen.width;
  const h = app.screen.height;

  // 背景遮罩(半透明深色模拟虚化,加深)
  panelMask.clear();
  panelMask.beginFill(0x1a1208, 0.72);
  panelMask.drawRect(0, 0, w, h);
  panelMask.endFill();

  // 面板尺寸(占绝大部分,留有边距)
  const pw = w * 0.88;
  const ph = h * 0.85;
  const px = (w - pw) / 2;
  const py = (h - ph) / 2;
  const radius = 14;

  // 面板主体(米白色,简约风格)
  panelBody.clear();
  panelBody.lineStyle(1, 0xc4b8a8, 0.6);
  panelBody.beginFill(0xf5f0e8, 1);
  panelBody.drawRoundedRect(px, py, pw, ph, radius);
  panelBody.endFill();
  // 显式 hitArea:比依赖 Graphics 的填充几何做命中判定更可靠,且随布局一起更新
  panelBody.hitArea = new PIXI.Rectangle(px, py, pw, ph);

  // 顶部栏(稍深米色,高度48px)
  const topH = 48;
  panelTopBar.clear();
  panelTopBar.beginFill(0xe8e0d4, 1);
  panelTopBar.drawRoundedRect(px, py, pw, topH, radius);
  panelTopBar.endFill();
  // 遮盖底部圆角(让顶部栏和面板主体无缝衔接)
  panelTopBar.beginFill(0xe8e0d4, 1);
  panelTopBar.drawRect(px, py + topH - radius, pw, radius);
  panelTopBar.endFill();

  // 左侧栏(稍深米色)。窄屏(竖屏手机)按比例收窄,否则固定的 200px 会把内容区挤没
  const sideW = Math.min(200, w * 0.24);
  panelSideBar.clear();
  panelSideBar.beginFill(0xe8e0d4, 1);
  panelSideBar.drawRoundedRect(px, py + topH, sideW, ph - topH, radius);
  panelSideBar.endFill();
  // 遮盖右侧圆角
  panelSideBar.beginFill(0xe8e0d4, 1);
  panelSideBar.drawRect(px + sideW - radius, py + topH, radius, ph - topH - radius);
  panelSideBar.endFill();
  // 左侧栏和顶部栏之间的分隔线
  panelSideBar.lineStyle(1, 0xc4b8a8, 0.4);
  panelSideBar.moveTo(px + sideW, py + topH);
  panelSideBar.lineTo(px + sideW, py + ph);
  // 顶部栏和内容区分隔线
  panelSideBar.moveTo(px, py + topH);
  panelSideBar.lineTo(px + pw, py + topH);

  // 清空旧占位与旧内容
  panelPlaceholders.removeChildren();
  panelContentArea.removeChildren();
  attrDetailLayer.removeChildren();

  // ===== 顶部栏占位 =====
  // 左侧网站logo(大肥鱼站,新版横排,米色背景和顶部栏融合)
  const logoH = topH * 1.0; // 顶部栏高度(48px)
  const logoScale = logoH / panelLogo.texture.height;
  panelLogo.scale.set(logoScale);
  panelLogo.x = px + 14;
  panelLogo.y = py + topH / 2;
  panelLogo.visible = true;

  // 搜索框占位(保留;搜索不是当前重点,只是一个视觉锚点)
  const searchBox = new PIXI.Graphics();
  searchBox.lineStyle(1, 0xc4b8a8, 0.5);
  searchBox.beginFill(0xf5f0e8, 0.8);
  searchBox.drawRoundedRect(px + pw - 130, py + topH / 2 - 12, 100, 24, 6);
  searchBox.endFill();
  panelPlaceholders.addChild(searchBox);

  // ===== 左侧栏:可点击的分类标签(模型 / 社区 / 后台) =====
  // 内容全部画进 panelContentArea(用绝对屏幕坐标;它是容器子节点、自身位移为 0,
  // 所以子元素直接用绝对坐标即可,不需要换算局部坐标)。
  const sideX = px + 16;
  let sideY = py + topH + 20;   // 与旧占位一致:分组标题占位后接菜单项的位置
  for (const tab of PANEL_TABS) {
    const active = tab.key === panelTab;
    const item = new PIXI.Graphics();
    if (active) {
      item.beginFill(0xd4a574, 0.5); // 选中项暖橙高亮
      item.drawRoundedRect(sideX - 4, sideY - 4, sideW - 24, 32, 6);
      item.endFill();
    }
    item.beginFill(active ? 0xd4a574 : 0xc4b8a8, 0.8);
    item.drawRoundedRect(sideX + 4, sideY + 4, 16, 16, 3);   // 图标占位
    item.endFill();
    item.beginFill(active ? 0xb8956a : 0xc4b8a8, 0.6);
    item.drawRoundedRect(sideX + 28, sideY + 6, sideW - 60, 12, 3); // 文字占位(未做文字渲染)
    item.endFill();
    item.eventMode = 'static';   // 可点击(见 panelBody 的注释:auto 不参与命中测试)
    item.cursor = 'pointer';
    item.hitArea = new PIXI.Rectangle(sideX - 4, sideY - 4, sideW - 24, 32);
    item.on('pointerdown', () => { panelTab = tab.key; showAttrDetail = false; layoutScreenPanel(); });
    panelPlaceholders.addChild(item);

    // 标签名(用真文字,方便辨认;占位阶段够用)
    const label = makeText(tab.label, { size: 13, color: active ? '#7a4a22' : '#8a7a68', weight: active ? 'bold' : 'normal' });
    label.x = sideX + 28;
    label.y = sideY + 7;
    panelPlaceholders.addChild(label);

    sideY += 36;
  }
  // 预留一行提示:标签页是全新内容,旧的三组占位菜单已移除
  const sideHint = makeText('训练 / 调教见底部「调教」标签', { size: 11, color: '#b0a294' });
  sideHint.x = sideX;
  sideHint.y = sideY + 10;
  panelPlaceholders.addChild(sideHint);

  // ===== 内容区:按当前标签渲染 =====
  const cx0 = px + sideW, cy0 = py + topH;
  const cw = pw - sideW, ch = ph - topH;
  if (panelTab === 'model')      drawModelPage(cx0, cy0, cw, ch);
  else if (panelTab === 'community') drawCommunityPage(cx0, cy0, cw, ch);
  else                            drawBackendPage(cx0, cy0, cw, ch);

  // 数据详情弹层(只在模型页存在)
  attrDetailLayer.visible = showAttrDetail && panelTab === 'model';
  if (attrDetailLayer.visible) drawAttrDetail(px, py, pw, ph);
}

// 雷达图轴序 = 用户定义的全部 9 项基础属性(推理/知识/长上下文/速度/指令遵循/工具调用/多模态/拟合/参数)。
// 前 7 项是"越高越好"的能力维度(与相似度算法 ATTR_KEYS 同集合,只是显示顺序更靠前);
// 「拟合」「参数」不是单调属性,放最后并单独处理:
//   拟合 —— 在轴上额外标出最优点 CAP_FIT_OPT,玩家一眼能看出自己欠拟合还是过拟合;
//   参数 —— 值本身有意义(放大训练收益),照常画。
// 轴序变化不影响算法:相似度与叠影对照都是按 key 取值的。
const RADAR_KEYS = ['reasoning', 'knowledge', 'longCtx', 'speed', 'instruct', 'toolCall', 'multimodal', 'fit', 'params'];
function drawRadar(cx, cy, r, myAttrs, theirAttrs) {
  const n = RADAR_KEYS.length;
  const angle = (i) => -Math.PI / 2 + i * 2 * Math.PI / n;   // 第一条轴朝正上
  const at = (i, v) => {
    const rr = r * Math.max(0, Math.min(100, v)) / 100;
    return [cx + Math.cos(angle(i)) * rr, cy + Math.sin(angle(i)) * rr];
  };

  const grid = new PIXI.Graphics();
  // 5 层同心多边形网格
  for (let lv = 1; lv <= 5; lv++) {
    const rr = r * lv / 5;
    grid.lineStyle(1, 0xc4b8a8, lv === 5 ? 0.9 : 0.35);
    for (let i = 0; i <= n; i++) {
      const a = angle(i % n);
      const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
      if (i === 0) grid.moveTo(px, py); else grid.lineTo(px, py);
    }
  }
  // 轴线
  for (let i = 0; i < n; i++) {
    grid.lineStyle(1, 0xc4b8a8, 0.35);
    grid.moveTo(cx, cy);
    const [ex, ey] = at(i, 100);
    grid.lineTo(ex, ey);
  }
  panelContentArea.addChild(grid);

  // 单个多边形(叠影对照 / 我的模型共用)
  const polyOf = (attrs, color, alpha, lineW) => {
    const g = new PIXI.Graphics();
    if (lineW) g.lineStyle(lineW, color, 1);
    g.beginFill(color, alpha);
    for (let i = 0; i < n; i++) {
      const [px, py] = at(i, attrs[RADAR_KEYS[i]]);
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.endFill();
    panelContentArea.addChild(g);
  };
  if (theirAttrs) polyOf(theirAttrs, 0x8a8a8a, 0.16, 1);   // 对照:最接近的真实模型(灰)
  polyOf(myAttrs, 0xe86a3a, 0.22, 2);                       // 我的模型(暖橙)

  // 拟合轴上的"最优点"刻度:拟合不是越高越好,单看多边形大小会读反
  const fi = RADAR_KEYS.indexOf('fit');
  const [ox, oy] = at(fi, CAP_FIT_OPT);
  const perp = angle(fi) + Math.PI / 2;
  const mk = new PIXI.Graphics();
  mk.lineStyle(2, 0x3a8a4a, 1);
  mk.moveTo(ox + Math.cos(perp) * 7, oy + Math.sin(perp) * 7);
  mk.lineTo(ox - Math.cos(perp) * 7, oy - Math.sin(perp) * 7);
  panelContentArea.addChild(mk);
  const optT = makeText('最优 ' + CAP_FIT_OPT, { size: 10, color: '#3a8a4a', weight: 'bold', anchor: 0.5 });
  optT.x = ox + Math.cos(perp) * 26;
  optT.y = oy + Math.sin(perp) * 26;
  panelContentArea.addChild(optT);

  // 轴标签 + 数值(9 条轴,全部属性都要能看到值)
  for (let i = 0; i < n; i++) {
    const k = RADAR_KEYS[i];
    const a = angle(i);
    const t = makeText(ATTR_NAMES[k] + ' ' + Math.round(myAttrs[k]),
      { size: 12, color: '#2a2118', weight: 'bold' });
    // 左右两侧的标签贴圆外缘对齐(anchor 0/1),避免 9 轴下标签互相压字或压到左侧评分块
    t.anchor.set(Math.cos(a) > 0.2 ? 0 : (Math.cos(a) < -0.2 ? 1 : 0.5), 0.5);
    t.x = cx + Math.cos(a) * (r + 12);
    t.y = cy + Math.sin(a) * (r + 20);
    panelContentArea.addChild(t);
  }
}

// 行走人物(在椅子之前添加,这样椅子在人物上层,有前后层次感)
const WALK_FRAME_W = 158;
const WALK_FRAME_H = 220;
const WALK_FRAMES = 6;

// 从精灵图提取6帧纹理(向左/向右各一套)
function makeWalkFrames(assetKey) {
  const baseTex = PIXI.Texture.from(ASSETS[assetKey]);
  const frames = [];
  for (let i = 0; i < WALK_FRAMES; i++) {
    frames.push(new PIXI.Texture(baseTex.baseTexture,
      new PIXI.Rectangle(i * WALK_FRAME_W, 0, WALK_FRAME_W, WALK_FRAME_H)));
  }
  return frames;
}
const walkFramesLeft = makeWalkFrames('walk_left');
const walkFramesRight = makeWalkFrames('walk_right');

// 行走人物容器(统一控制位置)
const walkerContainer = new PIXI.Container();
relayScene.addChild(walkerContainer);

// 行走动画(行走时显示)
const walker = new PIXI.AnimatedSprite(walkFramesLeft);
walker.anchor.set(0.5, 1); // 底部中心
walker.animationSpeed = 0.25;
walker.visible = false;
walkerContainer.addChild(walker);

// 休息静态贴图(休息时显示)
const walkIdleTex = PIXI.Texture.from(ASSETS.walk_idle);
const walkerIdle = new PIXI.Sprite(walkIdleTex);
walkerIdle.anchor.set(0.5, 1); // 底部中心
walkerIdle.visible = true;
walkerContainer.addChild(walkerIdle);

// 被提起时的贴图(拖拽时显示)
const walkerLiftTex = PIXI.Texture.from(ASSETS.walker_lift);
const walkerLift = new PIXI.Sprite(walkerLiftTex);
walkerLift.anchor.set(0.5, 1); // 底部中心
walkerLift.visible = false;
walkerContainer.addChild(walkerLift);

// 坐姿背影贴图(坐在椅子上时显示)
const walkerSitTex = PIXI.Texture.from(ASSETS.walker_sit);
const walkerSit = new PIXI.Sprite(walkerSitTex);
walkerSit.anchor.set(0.5, 1); // 底部中心
walkerSit.visible = false;
walkerContainer.addChild(walkerSit);

// 统一切换人物贴图:任何状态都一次性设好全部 visible,避免漏设导致旧贴图残留。
// 新增贴图只需在这里加一行;所有状态切换(含事件处理函数)都必须走这里,不要各自手写四行。
function showWalker(which) {
  walker.visible = which === 'walk';
  walkerIdle.visible = which === 'idle';
  walkerLift.visible = which === 'lift';
  walkerSit.visible = which === 'sit';
}

// 人物拖拽状态
const walkerDrag = {
  isDragging: false,
  offsetX: 0,
  offsetY: 0,
};
// 人物自由落体物理(无碰撞反弹,落地即恢复走路/坐下)
const walkerPhysics = {
  vy: 0,
  gravity: 0.25,  // 重力加速度(较小,避免太快)
  isFalling: false,
  targetY: 0,     // 目标落地高度(地面或椅子坐高)
  sitOnChair: false, // 是否落在椅子上
};
// 椅子可坐区域参数(在 layoutRelayScene 中计算)
const chairSeat = {
  sitY: 0,        // 坐的高度(人物底部y)
  minX: 0,        // 可坐区域左边界
  maxX: 0,        // 可坐区域右边界
};

// 椅子(高清素材,锚点底部中心,方便按地面线摆放)
const chairSprite = PIXI.Sprite.from(ASSETS.chair);
chairSprite.anchor.set(0.5, 1);
relayScene.addChild(chairSprite);

// 椅子描边图(提起人物时替换椅子原图显示,提示可坐区域)
const chairOutline = PIXI.Sprite.from(ASSETS.chair_outline);
chairOutline.anchor.set(0.5, 1);
chairOutline.visible = false;
relayScene.addChild(chairOutline);

// 把屏幕点击区域移到最上层(不被walkerContainer/chairSprite等遮挡)
relayScene.addChild(screenGlowHit);

// AI 随机行走状态
const walkerAI = {
  x: 0, y: 0,           // 当前位置
  dx: 0, dy: 0,         // 移动方向(归一化)
  speed: 1.2,            // 移动速度(像素/帧)
  state: 'idle',         // idle / walking
  timer: 0,               // 状态持续计时器
  facing: 'left',         // 朝向
  bounds: { minX: 0, maxX: 0, minY: 0, maxY: 0 }
};

function updateWalkerAI() {
  if (!relaySceneOpen) return;

  // 自由落体中(无碰撞,落到目标高度后恢复走路或锁定坐姿)
  if (walkerPhysics.isFalling) {
    walkerPhysics.vy += walkerPhysics.gravity;
    walkerContainer.y += walkerPhysics.vy;
    walkerAI.y = walkerContainer.y;
    if (walkerContainer.y >= walkerPhysics.targetY) {
      walkerContainer.y = walkerPhysics.targetY;
      walkerAI.y = walkerPhysics.targetY;
      walkerPhysics.isFalling = false;
      walkerPhysics.vy = 0;
      if (walkerPhysics.sitOnChair) {
        // 落在椅子上:锁定坐姿,不再随机走动
        walkerAI.state = 'sitting';
        walkerAI.x = chairSprite.x; // 对齐椅子中心
        walkerContainer.x = walkerAI.x;
      } else {
        // 落在地面:恢复走路姿态
        walkerAI.state = 'walking';
        walkerAI.timer = 120 + Math.floor(Math.random() * 120);
        if (Math.random() < 0.5) {
          walkerAI.dx = Math.random() < 0.5 ? -1 : 1;
          walkerAI.dy = 0;
        } else {
          const angle = Math.random() * Math.PI * 2;
          walkerAI.dx = Math.cos(angle);
          walkerAI.dy = Math.sin(angle) * 0.5;
        }
        if (Math.abs(walkerAI.dx) > 0.1) {
          walkerAI.facing = walkerAI.dx > 0 ? 'right' : 'left';
          walker.textures = walkerAI.facing === 'left' ? walkFramesLeft : walkFramesRight;
        }
      }
    }
    // 落体时显示提起贴图
    showWalker('lift');
    return;
  }

  // 坐姿锁定:不随机走动,显示背影,电脑屏幕显示草绿色描边
  if (walkerAI.state === 'sitting') {
    showWalker('sit'); // 坐姿背影
    walkerContainer.scale.set(1.0); // 背影本身已放大,不需要额外缩放
    screenGlow.visible = true; // 人物坐下,电脑屏幕描边显示
    screenGlowHit.visible = true;
    return;
  }
  // 非坐姿时隐藏屏幕描边
  if (screenGlow.visible) screenGlow.visible = false;
  if (screenGlowHit.visible) screenGlowHit.visible = false;
  // 非坐姿时恢复正常大小
  if (walkerContainer.scale.x !== 1) walkerContainer.scale.set(1);

  if (walkerDrag.isDragging) {
    // 拖拽中:显示提起贴图,暂停AI;椅子保持描边图显示
    showWalker('lift');
    return;
  }

  walkerAI.timer--;

  if (walkerAI.state === 'idle') {
    // 休息结束,开始行走
    if (walkerAI.timer <= 0) {
      walkerAI.state = 'walking';
      walkerAI.timer = 180 + Math.floor(Math.random() * 180); // 3-6秒(60fps)
      // 随机方向(8方向)
      if (Math.random() < 0.5) {
        walkerAI.dx = Math.random() < 0.5 ? -1 : 1;
        walkerAI.dy = 0;
      } else {
        const angle = Math.random() * Math.PI * 2;
        walkerAI.dx = Math.cos(angle);
        walkerAI.dy = Math.sin(angle) * 0.5;
      }
      // 更新朝向
      if (Math.abs(walkerAI.dx) > 0.1) {
        const newFacing = walkerAI.dx > 0 ? 'right' : 'left';
        if (newFacing !== walkerAI.facing) {
          walkerAI.facing = newFacing;
          walker.textures = newFacing === 'left' ? walkFramesLeft : walkFramesRight;
          walker.play();
        }
      }
    }
  } else {
    // 行走中
    walkerAI.x += walkerAI.dx * walkerAI.speed;
    walkerAI.y += walkerAI.dy * walkerAI.speed;

    // 碰到边界反弹
    const b = walkerAI.bounds;
    if (walkerAI.x < b.minX) { walkerAI.x = b.minX; walkerAI.dx = Math.abs(walkerAI.dx); walkerAI.facing = 'right'; walker.textures = walkFramesRight; walker.play(); }
    if (walkerAI.x > b.maxX) { walkerAI.x = b.maxX; walkerAI.dx = -Math.abs(walkerAI.dx); walkerAI.facing = 'left'; walker.textures = walkFramesLeft; walker.play(); }
    if (walkerAI.y < b.minY) { walkerAI.y = b.minY; walkerAI.dy = Math.abs(walkerAI.dy); }
    if (walkerAI.y > b.maxY) { walkerAI.y = b.maxY; walkerAI.dy = -Math.abs(walkerAI.dy); }

    // 行走结束,休息
    if (walkerAI.timer <= 0) {
      walkerAI.state = 'idle';
      walkerAI.timer = 120 + Math.floor(Math.random() * 120); // 2-4秒休息(60fps)
    }
  }

  walkerContainer.x = walkerAI.x;
  walkerContainer.y = walkerAI.y;
  // 休息时显示静态贴图,行走时播放动画
  if (walkerAI.state === 'idle') {
    if (walker.playing) { walker.stop(); walker.gotoAndStop(0); }
    showWalker('idle');
  } else {
    showWalker('walk');
    if (!walker.playing) walker.play();
  }
}

// ========== 人物拖拽(无物理碰撞,松开恢复走路) ==========
function startWalkerDrag(e) {
  if (!relaySceneOpen) return;
  walkerDrag.isDragging = true;
  const pos = e.global;
  walkerDrag.offsetX = pos.x - walkerContainer.x;
  walkerDrag.offsetY = pos.y - walkerContainer.y;
  walkerAI.state = 'idle';
  walkerAI.timer = 0;
  walkerPhysics.isFalling = false;
  walkerPhysics.sitOnChair = false;
  if (walker.playing) { walker.stop(); walker.gotoAndStop(0); }
  // 立即切到提起贴图(不能等 updateWalkerAI,拖拽分支会提前return,坐姿背影会残留)
  showWalker('lift');
  screenGlow.visible = false; // 从椅子上拖起,隐藏屏幕描边
  screenGlowHit.visible = false;
  // 提起人物时椅子换成描边图,提示可坐区域
  chairSprite.visible = false;
  chairOutline.visible = true;
  walkerContainer.scale.set(1); // 拖拽时恢复正常大小
}

function updateWalkerDrag(e) {
  if (!walkerDrag.isDragging) return;
  const pos = e.global;
  walkerContainer.x = pos.x - walkerDrag.offsetX;
  walkerContainer.y = pos.y - walkerDrag.offsetY;
  walkerAI.x = walkerContainer.x;
  walkerAI.y = walkerContainer.y;
}

function endWalkerDrag(e) {
  if (!walkerDrag.isDragging) return;
  walkerDrag.isDragging = false;
  // 恢复椅子原图
  chairSprite.visible = true;
  chairOutline.visible = false;

  // 判断是否在椅子可坐区域内松开
  const atChair = (walkerAI.x >= chairSeat.minX && walkerAI.x <= chairSeat.maxX &&
                   walkerAI.y < chairSeat.sitY); // 在坐高上方松开
  walkerPhysics.vy = 0;
  walkerPhysics.isFalling = true;
  if (atChair) {
    // 落在椅子上:目标高度=坐高
    walkerPhysics.targetY = chairSeat.sitY;
    walkerPhysics.sitOnChair = true;
  } else {
    // 落在地面:目标高度=行走区域下边界
    walkerPhysics.targetY = walkerAI.bounds ? walkerAI.bounds.maxY : h * 0.85;
    walkerPhysics.sitOnChair = false;
  }
}

// 人物可拖拽(事件绑定到容器,三个子元素都能触发)
walkerContainer.eventMode = 'static';
walkerContainer.cursor = 'pointer';
walkerContainer.on('pointerdown', startWalkerDrag);
walkerContainer.on('pointermove', updateWalkerDrag);
walkerContainer.on('pointerup', endWalkerDrag);
walkerContainer.on('pointerupoutside', endWalkerDrag);

function layoutRelayScene() {
  const w = app.screen.width;
  const h = app.screen.height;
  // 纹理未加载完成时使用默认尺寸,避免除以0导致NaN边界
  const rbgW = relayBg.texture.width > 1 ? relayBg.texture.width : 1672;
  const rbgH = relayBg.texture.height > 1 ? relayBg.texture.height : 941;
  const bgScale = Math.max(w / rbgW, h / rbgH);
  relayBg.scale.set(bgScale);
  relayBg.x = (w - rbgW * bgScale) / 2;
  relayBg.y = (h - rbgH * bgScale) / 2;
  // 椅子:与背景同一坐标系,位置/大小对齐原始带椅子背景
  // (在 1672x941 原图坐标系中:顶 0.3996 / 底 0.9277 / 水平中心 0.508)
  const bw = rbgW;
  const bh = rbgH;
  const chH = (0.9277 - 0.3996) * bh * bgScale;
  const chairTexH = chairSprite.texture.height > 1 ? chairSprite.texture.height : 800;
  chairSprite.scale.set(chH / chairTexH);
  chairSprite.x = relayBg.x + 0.508 * bw * bgScale;
  chairSprite.y = relayBg.y + 0.9277 * bh * bgScale; // anchor (0.5, 1):底部中心

  // 电脑屏幕草绿色描边(贴合左边显示表格的宽屏主显示器)
  screenGlow.clear();
  const sgX = relayBg.x + 0.421 * bw * bgScale;
  const sgY = relayBg.y + 0.298 * bh * bgScale;
  const sgW = 0.174 * bw * bgScale;
  const sgH = 0.160 * bh * bgScale;
  screenGlow.lineStyle(3, 0x7cba3f, 0.85); // 草绿色
  screenGlow.drawRoundedRect(sgX, sgY, sgW, sgH, 4);
  // 透明点击区域覆盖整个矩形(描边+内部)
  screenGlowHit.clear();
  screenGlowHit.beginFill(0x000000, 0.001); // 几乎透明(alpha=0可能不响应事件)
  screenGlowHit.drawRect(sgX, sgY, sgW, sgH);
  screenGlowHit.endFill();
  screenGlowHit.hitArea = new PIXI.Rectangle(sgX, sgY, sgW, sgH);

  // 行走人物:大小与场景适配,边界在背景图范围内
  const walkerScale = (h * 0.32) / WALK_FRAME_H;
  walker.scale.set(walkerScale);
  // 休息贴图与行走人物等高(保持比例)
  const idleScale = (WALK_FRAME_H * walkerScale) / walkerIdle.texture.height * 1.12;
  walkerIdle.scale.set(idleScale);
  // 提起贴图与行走人物等高(保持比例)
  const liftScale = (WALK_FRAME_H * walkerScale) / walkerLift.texture.height;
  walkerLift.scale.set(liftScale);
  // 坐姿背影贴图:比行走人物稍大(坐姿背影更饱满)
  const sitScale = (WALK_FRAME_H * walkerScale * 1.15) / walkerSit.texture.height;
  walkerSit.scale.set(sitScale);
  const ww = WALK_FRAME_W * walkerScale;
  const wh = WALK_FRAME_H * walkerScale;
  // 活动边界:地面区域(背景图下半部分),留出边距
  // 用 rbgH*bgScale 而非 relayBg.height,后者在纹理未加载时=1*bgScale 会导致边界错误
  const bgH = rbgH * bgScale;
  walkerAI.bounds = {
    minX: relayBg.x + ww * 0.6,
    maxX: relayBg.x + rbgW * bgScale - ww * 0.6,
    minY: relayBg.y + bgH * 0.70,
    maxY: relayBg.y + bgH - wh * 0.12
  };
  // 首次布局时设置初始位置(椅子旁边)
  if (walkerAI.x === 0 && walkerAI.y === 0) {
    walkerAI.x = chairSprite.x - 150;
    walkerAI.y = chairSprite.y;
  }
  walkerContainer.x = walkerAI.x;
  walkerContainer.y = walkerAI.y;

  // 计算椅子可坐区域:坐高=椅子高度40%处(从底部往上,比一半低一点),宽度=椅子宽度
  const chairW = chairSprite.width;
  const chairH = chairSprite.height;
  chairSeat.sitY = chairSprite.y - chairH * 0.40; // 底部往上40%(顶部往下60%,比一半低一点)
  chairSeat.minX = chairSprite.x - chairW * 0.5;
  chairSeat.maxX = chairSprite.x + chairW * 0.5;

  // 椅子描边图与椅子同位置同大小
  const outlineTexH = chairOutline.texture.height > 1 ? chairOutline.texture.height : chairTexH;
  chairOutline.scale.set(chH / outlineTexH);
  chairOutline.x = chairSprite.x;
  chairOutline.y = chairSprite.y;

  // resize时(如F12开关控制台)如果人物处于坐姿,重新对齐到椅子坐高,避免位置偏移
  if (walkerAI.state === 'sitting') {
    walkerAI.x = chairSprite.x;
    walkerAI.y = chairSeat.sitY;
    walkerContainer.x = chairSprite.x;
    walkerContainer.y = chairSeat.sitY;
  }
}

function formatNum(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  // 一位小数，去掉末尾多余的0
  const rounded = Math.round(n * 10) / 10;
  return rounded.toString();
}

function drawGear(g, cx, cy, r) {
  g.clear();
  g.lineStyle(2.5, 0xfff5e6, 0.9);
  g.beginFill(0xfff5e6, 0.1);
  const teeth = 8;
  g.moveTo(cx + r, cy);
  for (let i = 0; i < teeth * 2; i++) {
    const angle = (i / (teeth * 2)) * Math.PI * 2;
    const rr = i % 2 === 0 ? r : r * 0.7;
    g.lineTo(cx + Math.cos(angle) * rr, cy + Math.sin(angle) * rr);
  }
  g.closePath();
  g.endFill();
  g.drawCircle(cx, cy, r * 0.35);
}

function createSlider(x, y, w, value, onChange) {
  const container = new PIXI.Container();
  container.x = x; container.y = y;

  const track = new PIXI.Graphics();
  track.beginFill(0x4a3a2a, 0.8);
  track.drawRoundedRect(0, 8, w, 6, 3);
  track.endFill();
  container.addChild(track);

  const fill = new PIXI.Graphics();
  container.addChild(fill);

  const handle = new PIXI.Graphics();
  container.addChild(handle);

  function update() {
    fill.clear();
    fill.beginFill(0xffd98a, 0.9);
    fill.drawRoundedRect(0, 8, w * value, 6, 3);
    fill.endFill();
    handle.clear();
    handle.beginFill(0xffd98a, 1);
    handle.drawCircle(w * value, 11, 9);
    handle.endFill();
  }
  update();

  container.eventMode = 'static';
  container.cursor = 'pointer';
  container.hitArea = new PIXI.Rectangle(0, 0, w, 22);
  container.on('pointerdown', (e) => {
    const localX = e.global.x - container.getGlobalPosition().x;
    value = Math.max(0, Math.min(1, localX / w));
    update();
    if (onChange) onChange(value);
  });
  container.on('pointermove', (e) => {
    if (e.buttons === 1) {
      const localX = e.global.x - container.getGlobalPosition().x;
      value = Math.max(0, Math.min(1, localX / w));
      update();
      if (onChange) onChange(value);
    }
  });

  return container;
}

  paused: false,
  critChance: 0.005,
  critMultiplier: 1.5,
  machines: {
    rtx3080: { count: 0 },
    a100: { count: 0 },
    extraRack: { count: 0 },
    server: { count: 0 },
  },
  cooling: {
    fan: { count: 0 },
    waterCooling: { count: 0 },
  },
  scripts: {
    autoClick: false,
    miracle: false,
  },
  relay: {
    // 中转站:模型养成玩法。属性和数值全部待定稿,见 中转站设计.md;
    // 这里先落一份初值,便于雷达图/最接近模型立刻有东西可显示。
    ability: { reasoning: 5, longCtx: 2, speed: 5, knowledge: 5, fit: 10, multimodal: 10, instruct: 5, params: 5, toolCall: 5 },
    listedModel: null,   // 标榜的真实模型名(未上架 = null)
    price: 0,            // 自定售价(token / 百万 token)
    pool: 'standard',    // 号池档位
    reputation: 50,      // 站信誉 0~100
  },
  waterCoolingTimer: 0,
  waterCoolingNextTrigger: 10,
  autoClickAccum: 0,
};

function rtx3080Price() {
  return Math.floor(50 * Math.pow(1.5, state.machines.rtx3080.count));
}
function fanPrice() {
  return Math.floor(80 * Math.pow(1.5, state.cooling.fan.count));
}
function a100Price() {
  return Math.floor(2000 * Math.pow(1.5, state.machines.a100.count));
}
function extraRackPrice() {
  return Math.floor(5000 * Math.pow(2, state.machines.extraRack.count));
}
function recalcClickPower() {
  state.tokensPerClick = Math.pow(1.25, state.cooling.fan.count);
}
function recalcCrit() {
  state.critChance = 0.005 + state.machines.a100.count * 0.005;
  state.critMultiplier = 1.5 + state.machines.extraRack.count * 0.01;
}
function recalcProduction() {
  state.tokensPerSecond = state.machines.rtx3080.count * 5 + state.machines.a100.count * 50;
}

// ==================== 本地存档 ====================
const SAVE_KEY = 'dshgame_save_v1';
let saveAccum = 0;

function saveGame() {
  try {
    const data = {
      tokens: state.tokens,
      rtx3080: state.machines.rtx3080.count,
      a100: state.machines.a100.count,
      extraRack: state.machines.extraRack.count,
      server: state.machines.server.count,
      fan: state.cooling.fan.count,
      waterCooling: state.cooling.waterCooling.count,
      autoClick: state.scripts.autoClick,
      miracle: state.scripts.miracle,
      relay: state.relay,
      savedAt: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch(e) { return false; }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    state.tokens = data.tokens || 0;
    state.machines.rtx3080.count = data.rtx3080 || 0;
    state.machines.a100.count = data.a100 || 0;
    state.machines.extraRack.count = data.extraRack || 0;
    state.machines.server.count = data.server || 0;
    state.cooling.fan.count = data.fan || 0;
    state.cooling.waterCooling.count = data.waterCooling || 0;
    state.scripts.autoClick = !!(data.autoClick || data.niger); // 兼容旧存档的 niger 字段
    state.scripts.miracle = data.miracle || false;
    // 中转站:旧存档没有该字段 → 保持初始值(data.relay 为 undefined 时不覆盖)
    if (data.relay && typeof data.relay === 'object') {
      Object.assign(state.relay, data.relay);
      Object.assign(state.relay.ability, data.relay.ability || {});
    }
    refreshRelayPanel(); // 属性可能变了,刷新雷达图/最接近模型
    recalcProduction();
    recalcClickPower();
    recalcCrit();
    return true;
  } catch(e) { return false; }
}

function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
  state.tokens = 0;
  state.machines.rtx3080.count = 0;
  state.machines.a100.count = 0;
  state.machines.extraRack.count = 0;
  state.machines.server.count = 0;
  state.cooling.fan.count = 0;
  state.cooling.waterCooling.count = 0;
  state.scripts.autoClick = false;
  state.scripts.miracle = false;
  state.relay = {
    // 中转站:模型养成玩法。属性和数值全部待定稿,见 中转站设计.md
    ability: { reasoning: 5, longCtx: 2, speed: 5, knowledge: 5, fit: 10, multimodal: 10, instruct: 5, params: 5, toolCall: 5 },
    listedModel: null,
    price: 0,
    pool: 'standard',
    reputation: 50,
  };
  recalcProduction();
  recalcClickPower();
  recalcCrit();
  caseInitialized = false;
  casePhysics.userMoved = false;
  updateTokenDisplay();
  layoutCase();
  updateRelayTabVisibility();
}

// ==================== 统一布局 ====================
function layoutAll() {
  fitAllBgs();
  clickMask.clear();
  clickMask.beginFill(0x000000, 0.001);
  clickMask.drawRect(0, 0, app.screen.width, app.screen.height);
  clickMask.endFill();
  layoutCharacters();
  layoutTopbar();
  layoutSettingsBtn();
  layoutCase();
  initPurchasePanel();
  layoutPurchasePanel();
  layoutNavTabs();
  if (relaySceneOpen) layoutRelayScene();
  if (tuneSceneOpen) layoutTuneScene();
  updateTokenDisplay();
}

// resize 高频触发(拖拽窗口/旋转手机),rAF 节流到每帧最多一次全量布局
let resizePending = false;
window.addEventListener('resize', () => {
  if (resizePending) return;
  resizePending = true;
  requestAnimationFrame(() => { resizePending = false; layoutAll(); });
});

// ==================== 手机横屏引导 ====================
function isTouchDevice() {
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  const touches = Number(navigator.maxTouchPoints || 0) > 0;
  return coarse || touches;
}
function isPortraitViewport() { return window.innerHeight > window.innerWidth; }
function updateOrientationGate() {
  const el = document.getElementById('rotatePrompt');
  if (!el) return;
  const show = isTouchDevice() && isPortraitViewport();
  el.classList.toggle('show', show);
  el.setAttribute('aria-hidden', String(!show));
}
updateOrientationGate();
window.addEventListener('resize', updateOrientationGate);
window.addEventListener('orientationchange', () => { setTimeout(updateOrientationGate, 300); });

// ==================== 主循环 ====================
let secondAccum = 0;
let lastFrameTime = performance.now();

app.ticker.add(() => {
  const now = performance.now();
  const dt = Math.min((now - lastFrameTime) / 1000, 0.5);
  lastFrameTime = now;
  updateTweens(dt);
  // 中转站行走人物AI(不受暂停影响)
  updateWalkerAI();
  // 电脑屏幕描边呼吸动画(4s周期:0.4s出现+1.2s保持+0.4s消失+2s等待,悬停常驻)
  // 悬停时timer停止累积,移出时平滑过渡避免跳变
  if (relaySceneOpen && screenGlow.visible) {
    if (!screenGlowHover) {
      screenGlowTimer += dt;
      if (screenGlowTimer >= 4) screenGlowTimer -= 4;
    }
    let targetA = 0;
    if (screenGlowHover) {
      targetA = 1;
    } else if (screenGlowTimer < 0.4) {
      targetA = screenGlowTimer / 0.4;
    } else if (screenGlowTimer < 1.6) {
      targetA = 1;
    } else if (screenGlowTimer < 2.0) {
      targetA = 1 - (screenGlowTimer - 1.6) / 0.4;
    }
    // 平滑过渡(lerp),避免移出时alpha突然跳变被误以为卡顿
    screenGlow.alpha += (targetA - screenGlow.alpha) * Math.min(1, dt * 8);
  } else {
    screenGlowTimer = 0;
    screenGlow.alpha = 0;
  }
  if (!state.paused) {
    // ===== 生产场景专属更新(中转站时跳过,减少CPU开销) =====
    if (!relaySceneOpen) {
      updateLight();
      updateCharacters(dt);
      updateAllBuyButtons();
      updateCasePhysics();
      // 说话气泡：拖动或物理运动时显示，静止时隐藏
      const caseMoving = casePhysics.isDragging || (casePhysics.isActive && (Math.abs(casePhysics.vx) > 0.2 || Math.abs(casePhysics.vy) > 0.2));
      speechBubble.visible = caseMoving;
    }

    // ===== 全局逻辑(中转站时也运行:token增加/自动点击/水冷/存档) =====
    // 自动点击脚本：每秒3次
    if (state.scripts.autoClick) {
      state.autoClickAccum += dt * 3;
      while (state.autoClickAccum >= 1) {
        state.autoClickAccum -= 1;
        const cx = pcCase.x + pcCase.texture.width * pcCase.scale.x / 2;
        const cy = pcCase.y + 20;
        doClick(cx, cy);
      }
    }

    // 水冷随机事件
    if (state.cooling.waterCooling.count > 0) {
      state.waterCoolingTimer += dt;
      if (state.waterCoolingTimer >= state.waterCoolingNextTrigger) {
        state.waterCoolingTimer = 0;
        state.waterCoolingNextTrigger = 10 + Math.random() * 110;
        if (Math.random() < 0.19) {
          const bonus = state.tokens * 0.2;
          state.tokens += bonus;
          spawnFloatText('水冷! +' + formatNum(bonus), app.screen.width / 2, app.screen.height / 3);
          updateTokenDisplay();
        }
      }
    }

    secondAccum += dt;
    if (secondAccum >= 1) {
      const add = state.tokensPerSecond * Math.floor(secondAccum);
      if (add > 0) {
        state.tokens += add;
        updateTokenDisplay();
      }
      if (state.cooling.fan.count > 0) recalcClickPower();
      secondAccum = secondAccum % 1;
    }
    // 自动存档：每30秒
    saveAccum += dt;
    if (saveAccum >= 30) {
      saveAccum = 0;
      saveGame();
    }
  }
});

// ==================== 启动（多重布局保险） ====================
// 加载本地存档
const hasSave = loadGame();
layoutAll();
if (hasSave) {
  updateTokenDisplay();
  layoutCase();
  updateRelayTabVisibility();
}

let relayoutPending = false;
function safeRelayout() {
  const texturesReady = bgLight.texture.width > 0 && bgDark.texture.width > 0 &&
    charClosed.texture.width > 0 && charOpen.texture.width > 0 &&
    pcCase.texture.width > 0;
  if (!texturesReady) return false;
  if (relayoutPending) return true;
  relayoutPending = true;
  requestAnimationFrame(() => { relayoutPending = false; layoutAll(); });
  return true;
}

bgLight.texture.on('update', () => { safeRelayout(); });
bgDark.texture.on('update', () => { safeRelayout(); });
charClosed.texture.on('update', () => { safeRelayout(); });
charOpen.texture.on('update', () => { safeRelayout(); });
pcCase.texture.on('update', () => { safeRelayout(); });
relayBg.texture.on('update', () => { safeRelayout(); });
chairSprite.texture.on('update', () => { safeRelayout(); });

window.addEventListener('load', () => { setTimeout(safeRelayout, 0); });

// ticker 一次性布局修正：前60帧检查背景图是否覆盖全屏
let layoutFixFrames = 0;
const layoutFixTicker = () => {
  layoutFixFrames++;
  if (layoutFixFrames > 60) { app.ticker.remove(layoutFixTicker); return; }
  const bl = bgLight;
  const coversFull = bl.texture.width > 0 && isFinite(bl.scale.x) && bl.scale.x > 0 &&
    bl.texture.width * bl.scale.x >= app.screen.width - 1 &&
    bl.texture.height * bl.scale.y >= app.screen.height - 1;
  if (!coversFull) { safeRelayout(); }
  else { app.ticker.remove(layoutFixTicker); }
};
app.ticker.add(layoutFixTicker);
</script>
</body>
