// 强化训练棋盘层:全屏压暗 + 可点棋盘 + 资源/步数 + 右侧点数统计 + 结算
// 强化训练棋盘层的状态(持久贴图,便于做消除动画)
let tuneGameTiles = null;      // [r][c] = Graphics
let tuneGameGeo = null;        // { cell, bx, by }
let tuneGameFx = null;         // 特效层
let tuneGameAnimating = false; // 消除动画期间锁输入
let tuneGameMovesText = null, tuneGameResText = null, tuneGameTallyTexts = null;

function tuneTilePos(r, c) { return { x: tuneGameGeo.bx + c * tuneGameGeo.cell, y: tuneGameGeo.by + r * tuneGameGeo.cell }; }
// tween() 的 delta 是"变化量";这个助手让你按"目标值"传参(内部换算成差值)
function gtween(obj, to, dur, cb) { const d = {}; for (const k in to) d[k] = to[k] - obj[k]; return tween(obj, d, dur, cb); }
function gameTileDraw(tile, colorIdx) {
  const cell = tuneGameGeo.cell;
  tile.clear();
  tile.beginFill(GAME_TILE_HEX[colorIdx], 0.95);
  tile.drawRoundedRect(0, 0, cell - 4, cell - 4, 6);
  tile.endFill();
}
function gameTileSet(r, c, colorIdx, dropIn) {
  const tile = tuneGameTiles[r][c];
  const cell = tuneGameGeo.cell, p = tuneTilePos(r, c);
  gameTileDraw(tile, colorIdx);
  tile.pivot.set((cell - 4) / 2, (cell - 4) / 2);
  tile.position.set(p.x + cell / 2, p.y + cell / 2); // pivot 是方块中心 → position 要是格子中心
  if (dropIn) {
    tile.scale.set(0.35); tile.alpha = 0.15;
    gtween(tile.scale, { x: 1, y: 1 }, 0.18);
    gtween(tile, { alpha: 1 }, 0.16);
  } else {
    tile.scale.set(1); tile.alpha = 1;
  }
}
function gamePopTile(r, c) {
  const tile = tuneGameTiles[r][c];
  gtween(tile.scale, { x: 1.5, y: 1.5 }, 0.16);
  gtween(tile, { alpha: 0 }, 0.16);
}
function gameBurst(r, c) {
  const p = tuneTilePos(r, c), cell = tuneGameGeo.cell;
  const cx = p.x + cell / 2, cy = p.y + cell / 2;
  const ring = new PIXI.Graphics();
  ring.lineStyle(3, 0xfff2d0, 0.95);
  ring.drawCircle(0, 0, cell * 0.34);
  ring.position.set(cx, cy);
  ring.scale.set(0.5);
  tuneGameFx.addChild(ring);
  gtween(ring.scale, { x: 2.3, y: 2.3 }, 0.28);
  gtween(ring, { alpha: 0 }, 0.28, () => { if (!ring.destroyed) ring.destroy(); });
}
function gameProjectedGain(k, count) {
  const R = state.relay, mul = trainGainMul();
  const frac = Math.min(1, (count || 0) / GAME_CFG.BASE_POINTS);
  const wt = (k === gameState.mode.primary) ? GAME_CFG.WEIGHT_PRIMARY : GAME_CFG.WEIGHT_SECOND;
  return (100 - R.ability[k]) * frac * wt * mul;
}
// §19.13(2026-10-20 星光「强化训练的右侧维度数值变化可以有点特效和放大一点」):
// 维度行从 14px 放大到 17px,并在**块数变化时**做一次「放大→回落」脉冲 + 绿色高亮 ⇒ 一眼看到哪一维在涨。
const TALLY_FONT = 17;          // 维度行字号(原 14)
const TALLY_PULSE_MS = 260;     // 脉冲时长
const TALLY_PULSE_SCALE = 1.32; // 脉冲起始放大倍数
const tallyPulse = {};          // key → {t0, from}:本次变化的时间戳与变化前块数
function tallyPulseMark(k, n) {
  const prev = tallyPulse[k];
  if (!prev || prev.n !== n) { tallyPulse[k] = { t0: performance.now(), n }; return true; }
  return false;
}
function gameTallyLabel(k) {
  const n = gameState.tally[k] || 0;
  const g = gameProjectedGain(k, n);
  // 2026-10-06:属性列改到棋盘下方横排(2 列),标签必须压短到 ~10 字 —— 原来 "(主)  12  (+1.5)" 的双空格格式会撑爆半屏宽。
  return (ATTR_CN[k] || k) + (k === gameState.mode.primary ? '★' : '') + ' ' + n + ' +' + g.toFixed(1);
}
// 资源行文案:构建时与每步刷新时共用同一份,避免两处格式各写一份而不同步。
// 2026-10-06 由「三行/竖排」压成单行 —— 横屏 375px 高,顶部没有第二行的位置(见 buildTuneGameLayer 注释)。
function trainResLine() {
  return '算力 ' + (state.relay.train.ap | 0) + '/' + TRAIN_CFG.AP_MAX +
    ' · token ' + formatNum(state.tokens) + ' · 每步消耗 ' + formatNum(gameMoveTokenCost());
}
function movesColor(n) { return n <= 3 ? '#ff6a4a' : (n <= 8 ? '#ffb44a' : '#ffe9c4'); }   // §19.13 步数紧张度配色
// §19.13:维度数值的「放大→回落」脉冲。纯视觉:只改 scale/alpha,不碰 tally 与属性值。
// 用主 ticker 驱动(不新开 rAF),关场景/无文本时直接 return。
function updateTallyPulse() {
  // ⚠️ 必须有 `!gameState` 判空(2026-10-21 卡死真因):
  //   结算跑 settleGame() 会把 gameState 置 null,而本函数由**主 ticker 每帧**调用;
  //   旧版这里直接读 gameState.mode.colors[i] ⇒ 一帧内抛 TypeError ⇒ **PIXI ticker 整条挂掉**
  //   (画面冻结 + 点击全部无响应 = 玩家看到的「卡死」,而且是永久性的,连重建都等不到)。
  //   注意:layoutTuneScene 重建前 tuneGameTallyTexts 仍是旧数组,长度非 0,靠它挡不住。
  if (!gameState || !tuneGameTallyTexts || !tuneGameTallyTexts.length) return;
  const now = performance.now();
  const cols = (gameState.mode && gameState.mode.colors) || [];
  for (let i = 0; i < tuneGameTallyTexts.length; i++) {
    const k = cols[i];
    if (k === undefined) continue;
    const p = tallyPulse[k];
    const tl = tuneGameTallyTexts[i];
    if (!p || !tl || tl.destroyed) continue;
    const e = (now - p.t0) / TALLY_PULSE_MS;
    if (e < 0 || e >= 1) { tl.scale.set(1); continue; }
    // 先冲高再回落(1→放大→1),用 sin 峰值在 1/3 处,观感比线性更"弹"
    const bump = Math.sin(Math.min(1, e * 1.5) * Math.PI);
    tl.scale.set(1 + (TALLY_PULSE_SCALE - 1) * bump);
  }
}
function gameRefreshHud() {
  // §19.14b:同样要判空 —— 结算后 gameState 为 null,而这些文本引用可能还没被重建替换掉。
  //   任何「可能被延时/ticker 调到」的函数,都按可能为 null 处理。
  if (!gameState) return;
  if (tuneGameMovesText && !tuneGameMovesText.destroyed) {
    tuneGameMovesText.text = '剩余 ' + gameState.moves + ' 步';
    tuneGameMovesText.style.fill = movesColor(gameState.moves);
  }
  if (tuneGameResText) tuneGameResText.text = trainResLine();
  if (tuneGameTallyTexts) for (let i = 0; i < tuneGameTallyTexts.length; i++) {
    const k = gameState.mode.colors[i];
    const n = gameState.tally[k] || 0;
    const changed = tallyPulseMark(k, n);
    const tl = tuneGameTallyTexts[i];
    tl.text = gameTallyLabel(k);
    // §19.13:变化的那一维立刻变亮绿,并在 ticker 里做放大回落(纯视觉,不碰数值)
    tl.style.fill = changed ? '#8fe0a8' : '#ffe9c4';
  }
}
// 带动画的消除:点→够组就弹掉+爆环+扣费计步,落定后新/移位的块缩放入场
// §19.13(星光「没有后点击会有抖动和拒绝的音效」):点不动的时候要给反馈,不能静默返回。
// 三种拒绝:步数用完 / token 不够 / 没够组(点了孤块)。抖动棋盘 + 拒绝音效。
function gameReject(reason) {
  playSfx('reject');
  if (tuneGameLayer) {
    const t0 = performance.now();
    const base = tuneGameShakeBase;
    const tick = (now) => {
      if (!tuneGameLayer || tuneGameLayer.destroyed) return;
      const e = (now - t0) / 220;
      if (e >= 1) { tuneGameLayer.x = base.x; tuneGameLayer.y = base.y; return; }
      const damp = (1 - e) * 6;
      tuneGameLayer.x = base.x + Math.sin(e * Math.PI * 8) * damp;
      tuneGameLayer.y = base.y + Math.sin(e * Math.PI * 6) * damp * 0.4;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  if (tuneGameMovesText && reason === 'moves') {
    tuneGameMovesText.style.fill = '#ff3a2a';
    setTimeout(() => { if (tuneGameMovesText && !tuneGameMovesText.destroyed) tuneGameMovesText.style.fill = movesColor(gameState ? gameState.moves : 0); }, 320);
  }
}
function gameClearAt(r, c) {
  if (!gameState || tuneGameAnimating) return;
  if (gameState.over || gameState.moves <= 0) { gameReject('moves'); return; }
  if (state.tokens < gameMoveTokenCost()) { gameReject('tokens'); return; }
  const board = gameState.board;
  const colorIdx = board[r][c];
  const cells = findGroup(board, r, c);
  if (cells.length < GAME_CFG.MIN_GROUP) { gameReject('group'); return; }
  tuneGameAnimating = true;
  const key = gameState.mode.colors[colorIdx];
  if (key) gameState.tally[key] = (gameState.tally[key] || 0) + cells.length;
  state.tokens -= gameMoveTokenCost(); updateTokenDisplay();
  playSfx('pop'); // 成组消除确认
  gameState.moves -= 1;
  const before = board.map((row) => row.slice());
  const clearedSet = {};
  for (const [rr, cc] of cells) { clearedSet[rr + ',' + cc] = 1; gamePopTile(rr, cc); gameBurst(rr, cc); }
  const dropMoves = clearAndDrop(board, cells).moves;
  gameRefreshHud();
  // §19.14:被消的格子先全部隐藏(等坠落接管),其余格子按落位映射做「上→下」坠落动画。
  setTimeout(() => {
    const cell = tuneGameGeo.cell;
    // 1) 清场:被消除的格子隐藏;其它格子的**最终色**先不写(下面按 moves 摆位)
    for (let rr = 0; rr < GAME_CFG.ROWS; rr++) for (let cc = 0; cc < GAME_CFG.COLS; cc++) {
      if (clearedSet[rr + ',' + cc]) { const tl = tuneGameTiles[rr][cc]; tl.visible = false; tl.alpha = 1; tl.scale.set(1); }
    }
    // 2) 先按「源位置」把方块摆好(下落前的样子):fromR >= 0 用源行;fromR = -1(新生成)从棋盘上方掉入
    const DUR = 0.34;   // 坠落时长(秒),比消除的 0.18 长一点,能看清
    const seen = {};
    for (const mv of dropMoves) {
      const { c, toR, fromR } = mv;
      const tile = tuneGameTiles[toR][c];
      if (!tile) continue;
      seen[toR + ',' + c] = 1;
      tile.visible = true;
      cancelTweensOf(tile);   // 清掉弹飞/旧坠落残留,避免与本次 gtween 互扯
      gameTileDraw(tile, board[toR][c]);
      tile.pivot.set((cell - 4) / 2, (cell - 4) / 2);
      const toP = tuneTilePos(toR, c);
      const startP = fromR >= 0 ? tuneTilePos(fromR, c)
        : { x: toP.x, y: tuneTilePos(0, c).y - cell * (toR + 1.2) };   // 屏幕上方逐层错开
      tile.position.set(startP.x + cell / 2, startP.y + cell / 2);
      tile.scale.set(1); tile.alpha = 1;
      gtween(tile, { x: toP.x + cell / 2, y: toP.y + cell / 2 }, DUR);
    }
    // 3) 没进 moves 的格子(原地不动的)兜底重画,避免残留弹飞态
    for (let rr = 0; rr < GAME_CFG.ROWS; rr++) for (let cc = 0; cc < GAME_CFG.COLS; cc++) {
      if (seen[rr + ',' + cc] || clearedSet[rr + ',' + cc]) continue;
      if (before[rr][cc] === board[rr][cc]) { const tl = tuneGameTiles[rr][cc]; tl.visible = true; tl.alpha = 1; tl.scale.set(1); }
    }
    // 4) 坠落结束再解锁输入(期间点击无效,避免棋盘与视觉错位)
    setTimeout(() => {
      tuneGameAnimating = false;
      if (gameState && gameState.moves <= 0) { gameState.over = true; rebuildTuneGameLayer(); }
    }, DUR * 1000 + 40);
  }, 180);
}

function buildTuneGameLayer() {
  const w = app.screen.width, h = app.screen.height, mode = TRAIN_MODES[0];
  tuneGameAnimating = false; // 重建即解锁输入(防御:动画中途出错也不会永久卡住点击)
  const layer = new PIXI.Container();
  const bg = new PIXI.Graphics();
  bg.beginFill(0x0a0806, 0.6); bg.drawRect(0, 0, w, h); bg.endFill();
  bg.eventMode = 'static'; bg.hitArea = new PIXI.Rectangle(0, 0, w, h);
  bg.on('pointerdown', (e) => e.stopPropagation());
  layer.addChild(bg);

  // 标题/资源行:避开左上角设置按钮(14,14,48,48 → 底 62)。
  //   2026-10-06 压成紧凑两行 —— 手机横屏(667x375)高只有 375px,顶部每省 1px 都是棋盘的 1px,原 92/124 白占 34px。
  // 标题 + 资源挤在**同一行**:横屏 375px 高时,两行会顶到棋盘外框(by-10),而下方无空间可挪。
  const title = makeText('强化训练 · ' + mode.name, { size: 20, color: '#ffe9c4', weight: 'bold' });
  title.x = 20; title.y = 68; layer.addChild(title);
  tuneGameResText = makeText(trainResLine(), { size: 14, color: '#ffd98a', weight: 'bold' });
  tuneGameResText.x = title.x + title.width + 18; tuneGameResText.y = 74; layer.addChild(tuneGameResText);

  // ===== 2026-10-06 布局定案(横屏优先):棋盘在左 + 属性区在右(2 列) + 结算按钮在属性区下方,整体水平居中 =====
  // ⚠️ 方向修正(重要):最初按「手机竖屏 375x667」把棋盘选成「窄而高」的 9x13 是错的 ——
  //   游戏用 updateOrientationGate() 强制触屏设备横屏(isTouchDevice && isPortraitViewport),
  //   竖屏只会看到「请横屏游玩」遮罩。真实手机场景是 667x375 / 844x390,高只有 375~390px,棋盘必须「宽而扁」。
  // ⚠️ 底部标签栏(layoutNavTabs: y = h-42-14)派生于 tuneScene 之后,会盖住落在 h-56 以下的东西,须留 14px 净空。
  // 依据 sim/tune_landscape.js(每形状 1200 局):6 色候选里 14x9 无解率最低(4.9%),格/色 21.0(与竖屏 9x13 的 19.5 同量级)。
  const LM = 20, GAP = 26, TOP = 112, NAV_H = 56, CLEAR = 14, ROW_H = 24, SBH = 46;
  const listW = Math.min(300, w * 0.42);
  const availW = w - LM * 2 - listW - GAP, availH = h - TOP - NAV_H - CLEAR;
  // cell 上限 56:桌面 1440x980 算得出 76.7,不封顶会铺满整屏、方块大得发傻。
  const cell = Math.max(14, Math.min(availW / GAME_CFG.COLS, availH / GAME_CFG.ROWS, 56));
  const bw2 = cell * GAME_CFG.COLS, bh2 = cell * GAME_CFG.ROWS;
  const bx = Math.max(LM, (w - (bw2 + GAP + listW)) / 2);
  const by = TOP + Math.max(0, (availH - bh2) / 2);
  tuneGameGeo = { cell, bx, by };
  const board = new PIXI.Graphics();
  board.lineStyle(2, 0xd4a574, 0.9); board.beginFill(0x2a1f16, 0.6);
  board.drawRoundedRect(bx - 10, by - 10, bw2 + 20, bh2 + 20, 12); board.endFill();
  layer.addChild(board);
  tuneGameTiles = [];
  for (let r = 0; r < GAME_CFG.ROWS; r++) {
    tuneGameTiles.push([]);
    for (let c = 0; c < GAME_CFG.COLS; c++) {
      const tile = new PIXI.Graphics();
      tile.eventMode = 'static'; tile.cursor = 'pointer';
      tile.hitArea = new PIXI.Rectangle(0, 0, cell, cell);
      const rr = r, cc = c;
      tile.on('pointerdown', (e) => { e.stopPropagation(); gameClearAt(rr, cc); });
      layer.addChild(tile);
      tuneGameTiles[r].push(tile);
    }
  }
  tuneGameFx = new PIXI.Container(); tuneGameFx.eventMode = 'none'; layer.addChild(tuneGameFx);
  for (let r = 0; r < GAME_CFG.ROWS; r++) for (let c = 0; c < GAME_CFG.COLS; c++) gameTileSet(r, c, gameState.board[r][c], false);

  // 属性区放在棋盘右侧(2 列 x 3 行) —— 横屏是「宽而矮」,竖排 6 行/放下方都会顶到屏幕底;右侧是唯一有富余的方向。
  // §19.13:步数是本局唯一硬约束,18px 容易被棋盘吃掉 → 24px + 少步变红
  tuneGameMovesText = makeText('剩余 ' + gameState.moves + ' 步', { size: 24, color: movesColor(gameState.moves), weight: 'bold', anchor: 1 });
  tuneGameMovesText.x = w - 20; tuneGameMovesText.y = 62; layer.addChild(tuneGameMovesText);

  const listX = bx + bw2 + GAP, colW = listW / 2;
  const tHead = makeText('色块 = 维度 · 数字 = 已消块数 · +N = 预计属性增量', { size: 12, color: '#e8dcc2' });
  tHead.x = listX; tHead.y = by; layer.addChild(tHead);
  const listY0 = by + 20;
  const listRows = Math.ceil(mode.colors.length / 2);
  tuneGameTallyTexts = [];
  for (let i = 0; i < mode.colors.length; i++) {
    const k = mode.colors[i];
    const cx = listX + (i % 2) * colW, cy = listY0 + Math.floor(i / 2) * ROW_H;
    const sw = new PIXI.Graphics(); sw.beginFill(GAME_TILE_HEX[i], 0.95); sw.drawRoundedRect(cx, cy + 2, 14, 14, 3); sw.endFill(); layer.addChild(sw);
    const tl = makeText(gameTallyLabel(k), { size: TALLY_FONT, color: '#ffe9c4' });
    tl.x = cx + 22; tl.y = cy - 1; layer.addChild(tl);
    tl.anchor.set(0, 0);
    tallyPulse[k] = { t0: 0, n: gameState.tally[k] || 0 };   // 建立基准,首帧不脉冲
    tuneGameTallyTexts.push(tl);
  }
  const sbw = Math.min(200, listW), sbh = SBH, sbx = listX;
  const sby = Math.min(listY0 + listRows * ROW_H + 14, h - NAV_H - CLEAR - SBH);
  const sg = new PIXI.Graphics();
  sg.lineStyle(2, 0xd4a574, 0.95); sg.beginFill(gameState.over ? 0x3a9a6a : 0xc4853a, 0.95);
  sg.drawRoundedRect(sbx, sby, sbw, sbh, 10); sg.endFill();
  sg.eventMode = 'static'; sg.cursor = 'pointer'; sg.hitArea = new PIXI.Rectangle(sbx, sby, sbw, sbh);
  // §19.14(2026-10-21 星光「点击结算并退出会卡死」):**不能在 pointerdown 里摧毁自己**。
  //   原来直接 settleGame() + layoutTuneScene() ⇒ 后者把 tuneGameLayer 连同正在派发事件的 sg 一起 destroy,
  //   PIXI 在事件冒泡途中丢了目标,表现为整块 UI 变成死区(方块/结算都不再响应 = 卡死)。
  //   改为:先锁输入(防重入) → 结算 → **下一帧**再重建(此时事件已派发完毕,销毁是安全的)。
  sg.on('pointerdown', (e) => {
    e.stopPropagation();
    if (tuneGameSettling) return;
    tuneGameSettling = true;
    settleGame();
    requestAnimationFrame(() => { tuneGameSettling = false; layoutTuneScene(); });
  });
  layer.addChild(sg);
  const sl = makeText(gameState.over ? '结算' : '结算并退出', { size: 16, color: '#fff5e6', weight: 'bold', anchor: 0.5 });
  sl.x = sbx + sbw / 2; sl.y = sby + sbh / 2; layer.addChild(sl);
  if (gameState.over) { const hint = makeText('步数用完，点结算', { size: 12, color: '#8fe0a8' }); hint.x = sbx; hint.y = sby + sbh + 6; layer.addChild(hint); }

  tuneGameShakeBase = { x: layer.x, y: layer.y };   // §19.13 抖动基准(避免连续抖动漂移)
  tuneGameLayer = layer;
  tuneScene.addChild(layer); // 追加到最后 = 盖住人物/课桌/抽屉
  if (whipCursor) whipCursor.visible = false;
}
function rebuildTuneGameLayer() {
  // §19.14:摧毁调色板/棋盘会连带销毁事件目标。若当前帧正在派发事件(例如步数用完那一刻的重建),
  //   直接 destroy 可能让 PIXI 冒泡途中失去 target ⇒ 后续点击全失效。故延到下一帧。
  const doRebuild = () => {
    if (tuneGameLayer) { if (tuneGameLayer.parent) tuneScene.removeChild(tuneGameLayer); if (!tuneGameLayer.destroyed) tuneGameLayer.destroy({ children: true }); tuneGameLayer = null; }
    buildTuneGameLayer();
  };
  if (tuneGameRebuildQueued) return;
  tuneGameRebuildQueued = true;
  requestAnimationFrame(() => { tuneGameRebuildQueued = false; doRebuild(); });
}
function rebuildTuneGameLayerNow() {
  if (tuneGameLayer) { tuneScene.removeChild(tuneGameLayer); if (!tuneGameLayer.destroyed) tuneGameLayer.destroy({ children: true }); tuneGameLayer = null; }
  tuneGameTiles = null; tuneGameFx = null; tuneGameMovesText = null; tuneGameResText = null; tuneGameTallyTexts = null;
  if (gameState) buildTuneGameLayer(); else layoutTuneScene();
}

const ATTR_CN = { reasoning: '推理', knowledge: '知识', longCtx: '上下文', speed: '速度', multimodal: '多模态', instruct: '指令', toolCall: '工具', fit: '拟合', params: '参数' };

// 原地刷抽屉:HUD(AP/刀乐/压力/测评进度)+ 每格可买态/价格/增益。key 不变则跳过重绘(同 updateAllBuyButtons)
function refreshTrainUI(force) {
  const L = tunePropLive;
  if (!L || !tuneSceneOpen || !tunePropExpanded) return;
  const T = state.relay.train, R = state.relay;
  const pMul = Math.max(0, 1 - (T.pressure / TRAIN_CFG.PRESSURE_PENALTY_DIV));
  L.hud.text = '点数 ' + (T.ap | 0) + '/' + TRAIN_CFG.AP_MAX + '   压力 ' + (T.pressure | 0) + '(效果×' + pMul.toFixed(2) + ')' + (trainPressureMaxed() ? '摆烂' : '') + '   刀乐 $' + formatNum(R.dollars);
  const ex = T.examStage < TRAIN_CFG.EXAMS.length ? TRAIN_CFG.EXAMS[T.examStage] : null;
  const elapsed = trainElapsedDays();
  L.hud2.text = ex ? ('第' + elapsed + '天 · 下测评 ' + ex.name + ' ' + (ex.atDay - elapsed) + '天后') : ('第' + elapsed + '天 · 测评已全完');
  for (const row of L.rows) {
    if (row.kind === 'whip') {
      const sel = tuneSelectedItem === 'whip' ? 1 : 0;
      if (!force && row._uiKey === sel) continue;
      row._uiKey = sel;
      row.bg.clear();
      row.bg.lineStyle(2, sel ? 0xd4a574 : 0xc4b8a8, 0.9);
      row.bg.beginFill(sel ? 0xf5e6d0 : 0xe8e0d4, 0.95);
      row.bg.drawRoundedRect(6, 0, L.panelW - 16, L.rowH, 8);
      row.bg.endFill();
      continue;
    }
    const it = row.item;
    const usable = trainCanUse(it) ? 1 : 0;
    const inSession = it.kind === 'session' && T.session && T.session.key === it.key;
    const priceStr = inSession ? ('闭关 ' + Math.max(0, Math.ceil(T.session.remainMin)) + 'min')
      : ('$' + it.cost + ' · ' + it.ap + '点');
    const mul = trainGainMul();
    let dtxt = Object.keys(it.rate).map((k) => (ATTR_CN[k] || k) + '+' + ((100 - R.ability[k]) * it.rate[k] * mul).toFixed(1)).join(' ');
    if (it.need) { for (const k in it.need) { if (R.ability[k] < it.need[k]) dtxt += ' 🔒'; } }
    const key = priceStr + '|' + dtxt + '|' + usable + '|' + (inSession ? 1 : 0);
    if (!force && row._uiKey === key) continue;
    row._uiKey = key;
    row.bg.clear();
    row.bg.lineStyle(2, inSession ? 0x3a9a6a : (usable ? 0xd4a574 : 0xbdb2a2), 0.9);
    row.bg.beginFill(inSession ? 0xe6f2e8 : (usable ? 0xf5ecd8 : 0xdcd4c6), 0.95);
    row.bg.drawRoundedRect(6, 0, L.panelW - 16, L.rowH, 8);
    row.bg.endFill();
    row.price.text = priceStr;
    row.st.text = dtxt;
  }
}

function layoutTuneScene() {
  const w = app.screen.width, h = app.screen.height;
  const tw = tuneBgSprite.texture.width > 1 ? tuneBgSprite.texture.width : 1920;
  const th = tuneBgSprite.texture.height > 1 ? tuneBgSprite.texture.height : 1081;
  const s = Math.max(w / tw, h / th);
  tuneBgSprite.scale.set(s);
  tuneBgSprite.x = (w - tw * s) / 2;
  tuneBgSprite.y = (h - th * s) / 2;
  tuneShade.clear();
  tuneShade.beginFill(0x0a0806, 0.12);
  tuneShade.drawRect(0, 0, w, h);
  tuneShade.endFill();

  // 层级:bg → shade → 人物 → 课桌 → UI(人物在桌子下,桌盖人)
  tuneScene.setChildIndex(tuneDeskSprite, 3);
  if (tuneWalker && tuneWalker.container.parent === tuneScene) {
    tuneScene.setChildIndex(tuneWalker.container, 2);
  }

  // 课桌:教室中央地面带上;宽约屏宽 18%(缩小)
  const deskW = Math.max(120, w * 0.18);
  const dw = tuneDeskSprite.texture.width > 1 ? tuneDeskSprite.texture.width : 900;
  const dh = tuneDeskSprite.texture.height > 1 ? tuneDeskSprite.texture.height : 647;
  const deskScale = deskW / dw;
  tuneDeskSprite.scale.set(deskScale);
  tuneDeskSprite.x = w * 0.5;
  tuneDeskSprite.visible = true;
  // 桌脚落在站立线附近;cover 裁切后站立线可能落到屏幕外,夹回可视区
  const floorY = Math.min(tuneBgSprite.y + th * s * 0.90, h - 2);
  tuneDeskSprite.y = floorY;

  // 清旧 UI 再重建
  for (const ref of ['tunePanelBtn', 'tunePropDrawer', 'tuneTrainBtn', 'tuneGameLayer']) {
    const obj = ({ tunePanelBtn, tunePropDrawer, tuneTrainBtn, tuneGameLayer })[ref];
    if (obj) { tuneScene.removeChild(obj); if (!obj.destroyed) obj.destroy({ children: true }); }
  }
  tunePanelBtn = tunePropDrawer = tuneTrainBtn = tuneGameLayer = null;
  if (gameState) {
    // 强化训练进行中:只显示棋盘层(盖住人物/课桌/抽屉)
    buildTuneGameLayer();
  } else {
    layoutTunePanelBtn();
    layoutTunePropDrawer();
    // UI 要在课桌之上
    if (tunePanelBtn) tuneScene.setChildIndex(tunePanelBtn, tuneScene.children.length - 3);
    if (tunePropDrawer) tuneScene.setChildIndex(tunePropDrawer, tuneScene.children.length - 2);
    layoutTuneTrainBtn();
    if (tuneTrainBtn) tuneScene.setChildIndex(tuneTrainBtn, tuneScene.children.length - 1);
    applyWhipScale();
  }

  // 可坐区域:先算好(不依赖人物是否已建)
  // 人物在桌下层:脚贴地会被桌沿挡头,但坐到桌面上又太高。
  // 脚底落在「地面～桌面」之间(约地面 +35%桌高,上限 72px),腿在桌后、头露出桌沿。
  const deskH = dh * deskScale;
  const deskTop = floorY - deskH;
  deskSeat.sitY = floorY - Math.min(deskH * 0.35, 72);
  // 头顶至少高出桌沿 2% 屏高(超宽桌高时兜底微调,不整段抬到桌面)
  const sitCharH = h * 0.32 * 1.12;
  const sitPad = sitCharH * 0.25;
  deskSeat.sitY = Math.min(Math.max(deskSeat.sitY, sitPad), h - 2);
  if (deskSeat.sitY - sitCharH > deskTop - h * 0.02) {
    deskSeat.sitY = deskTop - h * 0.02 + sitCharH;
    deskSeat.sitY = Math.min(Math.max(deskSeat.sitY, sitPad), h - 2);
  }
  deskSeat.minX = tuneDeskSprite.x - tuneDeskSprite.width * 0.5;
  deskSeat.maxX = tuneDeskSprite.x + tuneDeskSprite.width * 0.5;

  if (!tuneWalker) return;
  applyWalkerMetrics(tuneWalker, tuneBgSprite.x, tuneBgSprite.y, tw * s, th * s, 0.74, 0.90);
  if (tuneWalker.ai.x === 0 && tuneWalker.ai.y === 0) {
    const b = tuneWalker.ai.bounds;
    tuneWalker.ai.x = Math.max(b.minX, Math.min(b.maxX, tuneBgSprite.x + tw * s * 0.4));
    tuneWalker.ai.y = Math.max(b.minY, Math.min(b.maxY, tuneBgSprite.y + th * s * 0.83));
    tuneWalker.container.x = tuneWalker.ai.x;
    tuneWalker.container.y = tuneWalker.ai.y;
  }

  // 坐姿时重新对齐桌心 + 强制可见(修「坐上桌人没了」)
  if (tuneWalker.ai.state === 'sitting' && tuneWalker.physics.sitOnChair) {
    tuneWalker.ai.x = tuneDeskSprite.x;
    tuneWalker.ai.y = Math.min(deskSeat.sitY || (h * 0.9), h - 2);
    tuneWalker.container.x = tuneWalker.ai.x;
    tuneWalker.container.y = tuneWalker.ai.y;
    tuneWalker.container.visible = true;
    tuneWalker.container.alpha = 1;
    showWalkerRig(tuneWalker, 'idle');
    // 人物保持在课桌正下方
    if (tuneDeskSprite) {
      const di = tuneScene.getChildIndex(tuneDeskSprite);
      const wi = tuneScene.getChildIndex(tuneWalker.container);
      if (wi > di) tuneScene.setChildIndex(tuneWalker.container, di);
      else if (wi < di - 1) tuneScene.setChildIndex(tuneWalker.container, di - 1);
    }
  }
}

function openTuneScene() {
  tuneSceneOpen = true;
  tuneScene.visible = true;
  setProductionLayersVisible(false);
  if (!tuneWalker) {
    // 停顿 + 桌前坐姿都用 Q 版立绘(tune_idle),不用背影 walker_sit
    tuneWalker = createWalkerRig('tune_idle', 'tune_idle');
    tuneScene.addChild(tuneWalker.container);
    bindWalkerDrag(tuneWalker, 'tune');
    // 开场直接走,不先停
    tuneWalker.ai.state = 'walking';
    tuneWalker.ai.timer = 180;
    pickWalkDir(tuneWalker.ai);
    syncWalkFacing(tuneWalker.ai, tuneWalker);
    if (tuneDeskSprite) {
      // 人物在桌子下、课桌盖在人上(与 layoutTuneScene 一致)
      tuneScene.setChildIndex(tuneWalker.container, 2);
      tuneScene.setChildIndex(tuneDeskSprite, 3);
    }
  }
  showWalkerRig(tuneWalker, tuneWalker.ai.state === 'idle' || tuneWalker.ai.state === 'sitting' ? 'idle' : 'walk');
  if (tuneWalker.ai.state === 'walking' && !tuneWalker.walk.playing) tuneWalker.walk.play();
  // tune_idle 异步解码完成后重算一次缩放/布局,避免首次 layout 时 height=0 把 scale 算成 Infinity
  const idleTex = tuneWalker.idle.texture;
  if (idleTex && !idleTex.__tuneIdleRetuned) {
    idleTex.__tuneIdleRetuned = true;
    idleTex.on('update', () => { if (tuneSceneOpen) layoutTuneScene(); });
  }
  ensureWhipAssets();
  // 鲸鱼等 pointermove 再出现,避免钉在左上
  if (whaleCursor) whaleCursor.visible = false;
  if (whipCursor) whipCursor.visible = false;
  if (tuneHud) { layoutTuneHud(); tuneHud.visible = true; }
  setBGM('bgm_tune');
  layoutTuneScene();
}

function closeTuneScene() {
  tuneSceneOpen = false;
  tuneScene.visible = false;
  if (tuneHud) tuneHud.visible = false;
  // 不自动结算:切去生产/中转站等板块时保留 gameState,回调教继续这局(友好:别让玩家白耗算力)
  setBGM(relaySceneOpen ? 'bgm_relay' : 'bgm_basement');
  if (whipCursor) whipCursor.visible = false;
  if (whaleCursor) whaleCursor.visible = true;
  app.view.classList.remove('whip-cursor');
  app.view.classList.add('custom-cursor');
  if (screenPanelOpen) closeScreenPanel();
  setProductionLayersVisible(true);
}

function layoutRelayScene() {
  const w = app.screen.width;
  const h = app.screen.height;
  // 纹理未加载完成时使用默认尺寸,避免除以0导致NaN边界
  const rbgW = relayBg.texture.width > 1 ? relayBg.texture.width : 1672;
  const rbgH = relayBg.texture.height > 1 ? relayBg.texture.height : 941;
  const bgScale = Math.max(w / rbgW, h / rbgH);
  relayBg.scale.set(bgScale);
  relayBg.x = (w - rbgW * bgScale) / 2;
  relayBg.y = (h - rbgH * bgScale) / 2;
  // 椅子:与背景同一坐标系,位置/大小对齐原始带椅子背景
  // (在 1672x941 原图坐标系中:顶 0.3996 / 底 0.9277 / 水平中心 0.508)
  const bw = rbgW;
  const bh = rbgH;
  const chH = (0.9277 - 0.3996) * bh * bgScale;
  const chairTexH = chairSprite.texture.height > 1 ? chairSprite.texture.height : 800;
  chairSprite.scale.set(chH / chairTexH);
  chairSprite.x = relayBg.x + 0.508 * bw * bgScale;
  chairSprite.y = relayBg.y + 0.9277 * bh * bgScale; // anchor (0.5, 1):底部中心

  // 电脑屏幕草绿色描边(贴合左边显示表格的宽屏主显示器)
  screenGlow.clear();
  const sgX = relayBg.x + 0.421 * bw * bgScale;
  const sgY = relayBg.y + 0.298 * bh * bgScale;
  const sgW = 0.174 * bw * bgScale;
  const sgH = 0.160 * bh * bgScale;
  screenGlow.lineStyle(3, 0x7cba3f, 0.85); // 草绿色
  screenGlow.drawRoundedRect(sgX, sgY, sgW, sgH, 4);
  // 透明点击区域覆盖整个矩形(描边+内部)
  screenGlowHit.clear();
  screenGlowHit.beginFill(0x000000, 0.001); // 几乎透明(alpha=0可能不响应事件)
  screenGlowHit.drawRect(sgX, sgY, sgW, sgH);
  screenGlowHit.endFill();
  screenGlowHit.hitArea = new PIXI.Rectangle(sgX, sgY, sgW, sgH);

  // 行走人物(relayWalker):与调教共用 applyWalkerMetrics 算法,实例各自独立
  const bgH = rbgH * bgScale;
  applyWalkerMetrics(relayWalker, relayBg.x, relayBg.y, rbgW * bgScale, bgH, 0.70);
  // 首次布局时设置初始位置(椅子旁边)
  if (relayWalker.ai.x === 0 && relayWalker.ai.y === 0) {
    relayWalker.ai.x = chairSprite.x - 150;
    relayWalker.ai.y = chairSprite.y;
    relayWalker.container.x = relayWalker.ai.x;
    relayWalker.container.y = relayWalker.ai.y;
  }

  // 计算椅子可坐区域:坐高=椅子高度40%处(从底部往上,比一半低一点),宽度=椅子宽度
  const chairW = chairSprite.width;
  const chairH = chairSprite.height;
  chairSeat.sitY = chairSprite.y - chairH * 0.40; // 底部往上40%(顶部往下60%,比一半低一点)
  chairSeat.minX = chairSprite.x - chairW * 0.5;
  chairSeat.maxX = chairSprite.x + chairW * 0.5;

  // 椅子描边图与椅子同位置同大小
  const outlineTexH = chairOutline.texture.height > 1 ? chairOutline.texture.height : chairTexH;
  chairOutline.scale.set(chH / outlineTexH);
  chairOutline.x = chairSprite.x;
  chairOutline.y = chairSprite.y;

  // resize时(如F12开关控制台)如果人物处于坐姿,重新对齐到椅子坐高,避免位置偏移
  if (relayWalker.ai.state === 'sitting') {
    relayWalker.ai.x = chairSprite.x;
    relayWalker.ai.y = chairSeat.sitY;
    relayWalker.container.x = chairSprite.x;
    relayWalker.container.y = chairSeat.sitY;
  }
}

function formatNum(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  // 一位小数，去掉末尾多余的0
  const rounded = Math.round(n * 10) / 10;
  return rounded.toString();
}

let lastTokenStr = '';
let lastTpsStr = '';
function updateTokenDisplay() {
  const ts = formatNum(state.tokens) + ' tokens';

function drawGear(g, cx, cy, r) {
  g.clear();
  g.lineStyle(2.5, 0xfff5e6, 0.9);
  g.beginFill(0xfff5e6, 0.1);
  const teeth = 8;
  g.moveTo(cx + r, cy);
  for (let i = 0; i < teeth * 2; i++) {
    const angle = (i / (teeth * 2)) * Math.PI * 2;
    const rr = i % 2 === 0 ? r : r * 0.7;
    g.lineTo(cx + Math.cos(angle) * rr, cy + Math.sin(angle) * rr);
  }
  g.closePath();
  g.endFill();
  g.drawCircle(cx, cy, r * 0.35);
}

function createSlider(x, y, w, value, onChange) {
  const container = new PIXI.Container();
  container.x = x; container.y = y;

  const track = new PIXI.Graphics();
  track.beginFill(0x4a3a2a, 0.8);
  track.drawRoundedRect(0, 8, w, 6, 3);
  track.endFill();
  container.addChild(track);

  const fill = new PIXI.Graphics();
  container.addChild(fill);

  const handle = new PIXI.Graphics();
  container.addChild(handle);

  function update() {
    fill.clear();
    fill.beginFill(0xffd98a, 0.9);
    fill.drawRoundedRect(0, 8, w * value, 6, 3);
    fill.endFill();
    handle.clear();
    handle.beginFill(0xffd98a, 1);
    handle.drawCircle(w * value, 11, 9);
    handle.endFill();
  }
  update();

  container.eventMode = 'static';
  container.cursor = 'pointer';
  container.hitArea = new PIXI.Rectangle(0, 0, w, 22);
  container.on('pointerdown', (e) => {
    const localX = e.global.x - container.getGlobalPosition().x;
    value = Math.max(0, Math.min(1, localX / w));
    update();
    if (onChange) onChange(value);
  });
  container.on('pointermove', (e) => {
    if (e.buttons === 1) {
      const localX = e.global.x - container.getGlobalPosition().x;
      value = Math.max(0, Math.min(1, localX / w));
      update();
      if (onChange) onChange(value);
    }
  });

  return container;
}

const SAVE_KEY = 'dshgame_save_v1';
let saveAccum = 0;

function saveGame() {
  try {
    const data = {
      tokens: state.tokens,
      rtx3080: state.machines.rtx3080.count,
      a100: state.machines.a100.count,
      extraRack: state.machines.extraRack.count,
      server: state.machines.server.count,
      fan: state.cooling.fan.count,
      waterCooling: state.cooling.waterCooling.count,
      autoClick: state.scripts.autoClick,
      miracle: state.scripts.miracle,
      relay: state.relay,
      settings: { music: musicVolume, sfx: sfxVolume },
      savedAt: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch(e) { return false; }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    state.tokens = data.tokens || 0;
    state.machines.rtx3080.count = data.rtx3080 || 0;
    state.machines.a100.count = data.a100 || 0;
    state.machines.extraRack.count = data.extraRack || 0;
    state.machines.server.count = data.server || 0;
    state.cooling.fan.count = data.fan || 0;
    state.cooling.waterCooling.count = data.waterCooling || 0;
    state.scripts.autoClick = !!(data.autoClick || data.niger); // 兼容旧存档的 niger 字段
    state.scripts.miracle = data.miracle || false;
    // 中转站:旧存档没有该字段 → 保持初始值(data.relay 为 undefined 时不覆盖)
    if (data.relay && typeof data.relay === 'object') {
      Object.assign(state.relay, data.relay);
      Object.assign(state.relay.ability, data.relay.ability || {});
      // 拟合初值迁移(2026-10-03):旧默认 fit=10 会被 fitMul 罚掉约 29% 能力,而当时无任何提升途径。
      // 当前版本没有任何代码能修改玩家 fit(道具/强化训练/编辑器都不碰它),所以 fit===10 只可能来自旧默认值,
      // 不会误伤玩家操作 —— 将来补了 fit 道具后删掉本段迁移。
      // §22:拟合有涨落途径后,旧档迁移目标从 70 改为 30(与全新档一致)
      if (state.relay.ability.fit === 10) state.relay.ability.fit = 30;
      // 经营 v1 迁移:老存档(无 dollars)的 reputation=50 是旧稿初值,按 §14 重置
      if (data.relay.dollars === undefined) {
        state.relay.reputation = 1;
        state.relay.users = 2;
        state.relay.userSlots = [];
        state.relay.listedModel = null;
        state.relay.price = 0;
        state.relay.dollars = 0;
        state.relay.activeCoef = 0.65;
        state.relay.gameHour = 0;
        state.relay.hourAccum = 0;
        state.relay.repAccum = 0;
        state.relay.serviceDown = false;
        state.relay.totalTokensSold = 0;
        state.relay.totalDollarsEarned = 0;
      }
      if (!Array.isArray(state.relay.userSlots)) state.relay.userSlots = [];
      // 初始用户:人数按 slots 补齐
      while (state.relay.userSlots.length < state.relay.users) {
        state.relay.userSlots.push({ leftH: 2 + Math.random() * 4 });
      }
      if (state.relay.userSlots.length > state.relay.users) {
        state.relay.userSlots.length = state.relay.users;
      }
      // 社区日报:老存档无 news 字段 → 用默认
      if (!state.relay.news || typeof state.relay.news !== 'object') {
        state.relay.news = newsDefaults();
      } else {
        if (!Array.isArray(state.relay.news.active)) state.relay.news.active = [];
        if (!state.relay.news.collected) state.relay.news.collected = {};
        if (!Array.isArray(state.relay.news.boosts)) state.relay.news.boosts = [];
        if (typeof state.relay.news.totalH !== 'number') state.relay.news.totalH = 0;
        if (typeof state.relay.news.nextSpawnH !== 'number') state.relay.news.nextSpawnH = NEWS_INTERVAL_H;
        // 旧文案迁移:已生成日报里的「开源」改「闭源」(NEWS_POOL 已改,存档里旧条目仍要洗)
        for (const a of state.relay.news.active) {
          if (a && typeof a.body === 'string' && a.body.indexOf('开源模型') >= 0) {
            a.body = a.body.replace(/开源模型/g, '闭源模型');
          }
        }
      }
    }
    // 调教养成:老存档无 train → 用默认;有则补齐数值型(与 news 迁移同款防御)
    if (!state.relay.train || typeof state.relay.train !== 'object') state.relay.train = trainDefaults();
    if (typeof state.relay.train.ap !== 'number') state.relay.train.ap = 0;
    if (typeof state.relay.train.apAccum !== 'number') state.relay.train.apAccum = 0;
    if (typeof state.relay.train.pressure !== 'number') state.relay.train.pressure = 0;
    if (state.relay.train.examStartH == null) state.relay.train.examStartH = null;
    if (typeof state.relay.train.examStage !== 'number') state.relay.train.examStage = 0;
    // ===== §17.6 考试状态机字段(老存档兜底;不补会让 examRetakes[idx] 直接抛错)=====
    if (!state.relay.train.examRetakes || typeof state.relay.train.examRetakes !== 'object') state.relay.train.examRetakes = {};
    if (!state.relay.train.examScores || typeof state.relay.train.examScores !== 'object') state.relay.train.examScores = {};
    if (!state.relay.train.examLastGrade || typeof state.relay.train.examLastGrade !== 'object') state.relay.train.examLastGrade = {};
    if (typeof state.relay.train.graduate !== 'boolean') state.relay.train.graduate = false;
    if (state.relay.train.examSession === undefined) state.relay.train.examSession = null;
    if (state.relay.train.userBoost === undefined) state.relay.train.userBoost = null;
    // 道具涨价/上限账本(2026-10-05):老存档缺 bought/priceCount → 补空表(老玩家视为「一次都没买过」)
    if (!state.relay.train.bought || typeof state.relay.train.bought !== 'object') state.relay.train.bought = {};
    if (!state.relay.train.priceCount || typeof state.relay.train.priceCount !== 'object') state.relay.train.priceCount = {};
    if (typeof state.relay.train.priceDecayAnchorH !== 'number') state.relay.train.priceDecayAnchorH = null;
    // 发布:老存档无 publish 字段 → 补默认
    if (!state.relay.publish || typeof state.relay.publish !== 'object') {
      state.relay.publish = { active: false, strategy: null, model: null, remainH: 0, totalH: 0, lastCap: null };
    }
    // 设置(音量):老存档无 settings → 保持默认;有则夹到 0..1
    if (data.settings && typeof data.settings === 'object') {
      if (typeof data.settings.music === 'number') musicVolume = Math.max(0, Math.min(1, data.settings.music));
      if (typeof data.settings.sfx === 'number') sfxVolume = Math.max(0, Math.min(1, data.settings.sfx));
    }
    refreshRelayPanel(); // 属性可能变了,刷新雷达图/最接近模型
    recalcProduction();
    // 离线收益(帧 dt 坑修复的配套):用存档里的 savedAt 时间戳补 tokens。
    // 只补生产 —— 中转站出售/信誉/调教都不补(见 applyOfflineEarnings 注释)。
    if (typeof data.savedAt === 'number') {
      const offS = (Date.now() - data.savedAt) / 1000;
      const gained = applyOfflineEarnings(offS);
      if (gained > 0) {
        // 此刻 layoutAll 还没跑,延迟一点再飘字(否则可能飘在未布局的画布上)
        setTimeout(() => {
          try {
            spawnFloatText('欢迎回来 · 离线 +' + formatNum(gained) + ' tok', app.screen.width / 2, app.screen.height * 0.3);
            updateTokenDisplay();
          } catch (e) { /* 启动早期失败就算了,收益已进 tokens */ }
        }, 700);
      }
    }
    recalcClickPower();
    recalcCrit();
    return true;
  } catch(e) { return false; }
}

  if (resizePending) return;
  resizePending = true;
  requestAnimationFrame(() => { resizePending = false; layoutAll(); });
});

// ==================== 手机横屏引导 ====================
function isTouchDevice() {
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  const touches = Number(navigator.maxTouchPoints || 0) > 0;
  return coarse || touches;
}
function isPortraitViewport() { return window.innerHeight > window.innerWidth; }
function updateOrientationGate() {
  const el = document.getElementById('rotatePrompt');
  if (!el) return;
  const show = isTouchDevice() && isPortraitViewport();
  el.classList.toggle('show', show);
  el.setAttribute('aria-hidden', String(!show));
}
updateOrientationGate();
window.addEventListener('resize', updateOrientationGate);
window.addEventListener('orientationchange', () => { setTimeout(updateOrientationGate, 300); });

// ==================== 时间与离线收益(修「帧 dt」技术坑,2026-10-03) ====================
// 旧写法 dt = min((now - lastFrameTime)/1000, 0.5) 有两个问题:
//  ① 切标签/最小化时 rAF 暂停,回来只补 0.5s → 那段现实时间凭空消失(时钟、生产、调教全丢);
//  ② 关掉游戏再打开没有任何离线收益(放置游戏的本分)。
// 现在:短间隔走「欠时池」逐帧补足(每帧最多 0.5s,动画不跳、时间不丢);
// 长间隔(≥ OFFLINE_GAP_S)判定为离线 → **只补 tokens**,不逐帧模拟中转站/调教。
const OFFLINE_GAP_S = 120;    // 超过 120s 没跑帧 → 按离线结算
const OFFLINE_CAP_H = 8;      // 离线收益上限(小时)
const OFFLINE_EFF = 0.5;      // 离线效率(半速):鼓励在线经营,也给挂机一个保底
const TIME_DEBT_MAX_S = 120;  // 欠时池上限(= 离线阈值,保证阈值以下的时间一秒不丢)
const FRAME_CATCHUP_S = 0.5;  // 单帧最多补多少秒(与老版本同值,动画手感不变)
let timeDebt = 0;             // 欠时池:切走/卡顿欠下的现实秒数,逐帧还

// 离线结算:只给 tokens(生产),**不**推进中转站出售/信誉/调教 AP ——
// 避免「关掉游戏回来信誉暴涨」这类时间旅行刷法;离线期本来也没有中断/流失/新闻模拟,
// 不给才自洽。倒流(系统时间往回调)由 Math.max(0, …) 挡掉。
function applyOfflineEarnings(seconds) {
  const s = Math.max(0, Math.min(seconds, OFFLINE_CAP_H * 3600));
  if (s < 30) return 0;                       // 太短不算(顺手挡住反复刷新刷收益)
  const rate = state.tokensPerSecond || 0;
  if (rate <= 0) return 0;
  const gained = rate * s * OFFLINE_EFF;
  state.tokens += gained;
  return gained;
}

// ==================== 主循环 ====================
let secondAccum = 0;
let lastFrameTime = performance.now();

app.ticker.add(() => {
  const now = performance.now();
  const realDt = (now - lastFrameTime) / 1000;
  lastFrameTime = now;
  let dt;
  if (realDt >= OFFLINE_GAP_S) {
    // 离线:只结算 tokens(不逐帧跑模拟;离线期间中转站/调教的时间不补)
    const gained = applyOfflineEarnings(realDt);
    if (gained > 0) {
      spawnFloatText('欢迎回来 · 离线 +' + formatNum(gained) + ' tok', app.screen.width / 2, app.screen.height * 0.3);
      updateTokenDisplay();
    }
    timeDebt = 0;
    dt = FRAME_CATCHUP_S;
  } else {
    timeDebt = Math.min(timeDebt + realDt, TIME_DEBT_MAX_S);
    dt = Math.min(timeDebt, FRAME_CATCHUP_S);
    timeDebt -= dt;
  }
  updateTweens(dt);
  updateTallyPulse();   // §19.13 维度数值脉冲(内部自判空,开销可忽略)
  // 雷达图轴标签数字滚动(只在雷达开启动画的 0.45s 内有活,平时直接 return)
  radarTicker();
  // 中转站行走人物AI(不受暂停影响)
  updateWalkerAI();
  // 闭关训练头顶标签:跟随当前可见场景的人物(生产/中转站/调教)
  syncSessionLabel();
  // 电脑屏幕描边呼吸动画(4s周期:0.4s出现+1.2s保持+0.4s消失+2s等待,悬停常驻)
  // 悬停时timer停止累积,移出时平滑过渡避免跳变
  if (relaySceneOpen && screenGlow.visible) {
    if (!screenGlowHover) {
      screenGlowTimer += dt;
      if (screenGlowTimer >= 4) screenGlowTimer -= 4;
    }
    let targetA = 0;
    if (screenGlowHover) {
      targetA = 1;
    } else if (screenGlowTimer < 0.4) {
      targetA = screenGlowTimer / 0.4;
    } else if (screenGlowTimer < 1.6) {
      targetA = 1;
    } else if (screenGlowTimer < 2.0) {
      targetA = 1 - (screenGlowTimer - 1.6) / 0.4;
    }
    // 平滑过渡(lerp),避免移出时alpha突然跳变被误以为卡顿
    screenGlow.alpha += (targetA - screenGlow.alpha) * Math.min(1, dt * 8);
  } else {
    screenGlowTimer = 0;
    screenGlow.alpha = 0;
  }
  if (!state.paused) {
    // ===== 生产场景专属更新(中转站时跳过,减少CPU开销) =====
    if (!relaySceneOpen) {
      updateLight();
      updateCharacters(dt);
      updateAllBuyButtons();
      updateCasePhysics();
      // 说话气泡：拖动或物理运动时显示，静止时隐藏
      const caseMoving = casePhysics.isDragging || (casePhysics.isActive && (Math.abs(casePhysics.vx) > 0.2 || Math.abs(casePhysics.vy) > 0.2));
      speechBubble.visible = caseMoving;
    }

    // ===== 全局逻辑(中转站时也运行:token增加/自动点击/水冷/存档) =====
    // 自动点击脚本：每秒3次
    if (state.scripts.autoClick) {
      state.autoClickAccum += dt * 3;
      while (state.autoClickAccum >= 1) {
        state.autoClickAccum -= 1;
        const cx = pcCase.x + pcCase.texture.width * pcCase.scale.x / 2;
        const cy = pcCase.y + 20;
        doClick(cx, cy);
      }
    }

    // 水冷随机事件
    if (state.cooling.waterCooling.count > 0) {
      state.waterCoolingTimer += dt;
      if (state.waterCoolingTimer >= state.waterCoolingNextTrigger) {
        state.waterCoolingTimer = 0;
        state.waterCoolingNextTrigger = 10 + Math.random() * 110;
        if (Math.random() < 0.19) {
          const bonus = state.tokens * 0.2;
          state.tokens += bonus;
          spawnFloatText('水冷! +' + formatNum(bonus), app.screen.width / 2, app.screen.height / 3);
          updateTokenDisplay();
        }
      }
    }

    secondAccum += dt;
    if (secondAccum >= 1) {
      const add = state.tokensPerSecond * Math.floor(secondAccum);
      if (add > 0) {
        state.tokens += add;
        updateTokenDisplay();
      }
      if (state.cooling.fan.count > 0) recalcClickPower();
      secondAccum = secondAccum % 1;
    }
    // 自动存档：每30秒
    saveAccum += dt;
    if (saveAccum >= 30) {
      saveAccum = 0;
      saveGame();
    }

    // 中转站经营 v1:时钟 + 卖 token 换刀乐 + 小时/信誉刷新(§14;生产中也跑,不依赖场景)
    updateRelayBusiness(dt);

    // 鞭子挥动帧回退
    if (whipShowingCrack) {
      whipCrackTimer -= dt;
      if (whipCrackTimer <= 0) showWhipFrame(false);
    }

    // 鞭打受击计时:到点恢复普通 idle 贴图,让人物重新走神(下一帧 AI 继续)
    if (tuneHitTimer > 0) {
      tuneHitTimer -= dt;
      if (tuneHitTimer <= 0) {
        tuneHitTimer = 0;
        if (tuneWalker) {
          tuneWalker.idle.texture = tuneIdleTex;
          // ⚠️ 坐姿**不能被受击恢复抹成 idle**(2026-10-19 星光:鞭打坐着的模型会「从椅子上掉下」):
          //    受击期间 state 一直是 'sitting'(updateWalkerAI 提前 return),这里若无条件写 idle,
          //    人物立刻起身走开 ⇒ 观感就是被打飞下桌。坐着的抽完继续坐,站着/走着的才恢复 idle。
          if (tuneWalker.ai.state !== 'sitting') {
            tuneWalker.ai.state = 'idle';
            tuneWalker.ai.timer = 60;
          }
        }
      }
    }
  }
});

// ==================== 启动（多重布局保险） ====================
// 加载本地存档
const hasSave = loadGame();
// 离开页面 / 切后台前补一次存档:让 savedAt 尽量贴近真实离开时间(离线收益的计时基准;
// 平时每 30s 自动存档,最坏情况也只差 30s)
window.addEventListener('pagehide', () => { saveGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
// WebGL 上下文兜底(2026-10-13):移动端切后台常被系统强制回收 context。Pixi 内部有丢失/恢复处理
// (preventDefault + 纹理重传),这里补玩家侧三件事——丢失瞬间立刻存档 + 全屏 DOM 提示 + 恢复后
// 强制重排一次防布局漂移;8 秒未恢复则提示刷新(进度已自动存)。⚠️ e.preventDefault() 不能删
// (不调则 webglcontextrestored 永远不触发),与 Pixi 自带的监听并存、幂等无冲突。
const ctxLostPrompt = document.createElement('div');
ctxLostPrompt.id = 'ctxLostPrompt';
ctxLostPrompt.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;display:none;'
  + 'align-items:center;justify-content:center;background:rgba(13,11,8,.94);z-index:9999;'
  + 'color:#ffd98a;font:bold 1rem "Microsoft YaHei","PingFang SC","DSHGameCN",sans-serif;letter-spacing:2px;text-align:center;padding:0 24px;';
document.body.appendChild(ctxLostPrompt);
let ctxLostTimer = null;
app.view.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  saveGame();
  ctxLostPrompt.textContent = '图形上下文已丢失,正在恢复…';
  ctxLostPrompt.style.display = 'flex';
  if (ctxLostTimer) clearTimeout(ctxLostTimer);
  ctxLostTimer = setTimeout(() => { ctxLostPrompt.textContent = '恢复失败,请刷新页面(进度已自动保存)'; }, 8000);
}, false);
app.view.addEventListener('webglcontextrestored', () => {
  if (ctxLostTimer) { clearTimeout(ctxLostTimer); ctxLostTimer = null; }
  ctxLostPrompt.style.display = 'none';
  safeRelayout();
}, false);
layoutAll();
ensureWhaleCursor();
ensureWhipAssets();
// 启动先不显示鲸鱼,等第一次进入画布再贴鼠标
if (whaleCursor) whaleCursor.visible = false;
if (whipCursor) whipCursor.visible = false;
app.view.classList.add('custom-cursor');
if (hasSave) {
  updateTokenDisplay();
  layoutCase();
  updateRelayTabVisibility();
}

// 背景音乐:只预载当前场景那一轨(其余懒加载);浏览器自动播放策略要求首次用户手势后才起
initBGM();
(function armBGM() {
  const go = () => {
    startBGMOnGesture();
    window.removeEventListener('pointerdown', go);
    window.removeEventListener('keydown', go);
  };
  window.addEventListener('pointerdown', go);
  window.addEventListener('keydown', go);
})();

let relayoutPending = false;
function safeRelayout() {
  const texturesReady = bgLight.texture.width > 0 && bgDark.texture.width > 0 &&
    charClosed.texture.width > 0 && charOpen.texture.width > 0 &&
    pcCase.texture.width > 0;
  if (!texturesReady) return false;
  if (relayoutPending) return true;
  relayoutPending = true;
  requestAnimationFrame(() => { relayoutPending = false; layoutAll(); });
  return true;
}

bgLight.texture.on('update', () => { safeRelayout(); });
bgDark.texture.on('update', () => { safeRelayout(); });
charClosed.texture.on('update', () => { safeRelayout(); });
charOpen.texture.on('update', () => { safeRelayout(); });
pcCase.texture.on('update', () => { safeRelayout(); });
relayBg.texture.on('update', () => { safeRelayout(); });
chairSprite.texture.on('update', () => { safeRelayout(); });
tuneBgSprite.texture.on('update', () => { safeRelayout(); });
// tune_idle 解码完成后重算缩放(否则 height=0 → scale=Infinity,坐桌/停顿时人会整张消失)
if (typeof tuneIdleTex !== 'undefined' && tuneIdleTex) {
  tuneIdleTex.on('update', () => { if (tuneSceneOpen) layoutTuneScene(); });
}

window.addEventListener('load', () => { setTimeout(safeRelayout, 0); });

// ticker 一次性布局修正：前60帧检查背景图是否覆盖全屏
let layoutFixFrames = 0;
const layoutFixTicker = () => {
  layoutFixFrames++;
  if (layoutFixFrames > 60) { app.ticker.remove(layoutFixTicker); return; }
  const bl = bgLight;
  const coversFull = bl.texture.width > 0 && isFinite(bl.scale.x) && bl.scale.x > 0 &&
    bl.texture.width * bl.scale.x >= app.screen.width - 1 &&
    bl.texture.height * bl.scale.y >= app.screen.height - 1;
  if (!coversFull) { safeRelayout(); }
  else { app.ticker.remove(layoutFixTicker); }
};
app.ticker.add(layoutFixTicker);
</script>
