<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DSH · 地下机房</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a1410;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #game { width: 100%; height: 100%; }
  canvas { display: block; touch-action: none; }

  /* 手机横屏引导 */
  #rotatePrompt {
    position: fixed; inset: 0; z-index: 9999;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(15, 10, 6, 0.96);
    color: #ffd98a; font-family: inherit;
    pointer-events: auto;
  }
  #rotatePrompt.show { display: flex; }
  #rotatePrompt .rotate-phone {
    width: 64px; height: 104px;
    border: 3px solid #ffb35c; border-radius: 12px;
    position: relative;
    animation: rotateDevice 1.8s ease-in-out infinite;
    margin-bottom: 20px;
  }
  #rotatePrompt .rotate-phone::after {
    content: ""; position: absolute;
    left: 50%; bottom: 7px;
    transform: translateX(-50%);
    width: 20px; height: 3px;
    background: #ffb35c; border-radius: 2px;
  }
  #rotatePrompt .rotate-title {
    color: #ffd98a; font-size: 1.1rem;
    letter-spacing: 6px; font-weight: bold;
    margin-bottom: 8px;
  }
  #rotatePrompt .rotate-sub {
    color: #a89880; font-size: 0.78rem;
    letter-spacing: 2px;
  }
  @keyframes rotateDevice {
    0%, 38% { transform: rotate(0); }
    62%, 100% { transform: rotate(-90deg); }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotatePrompt" aria-hidden="true">
  <div class="rotate-phone"></div>
  <div class="rotate-title">请横屏游玩</div>
  <div class="rotate-sub">旋转设备以获得最佳体验</div>
</div>
<script>__PIXIES__</script>
<script>__ASSETS__</script>
<script>
// ==================== 工具函数 ====================
// 渲染分辨率唯一来源:canvas 后备缓冲与文字栅格化都用它,避免两处各写一份而不同步。
// 上限 2 是性能与清晰度的折中(填充率按平方增长):dpr=3 的手机也用 2。
// 注:autoDensity 下 app.screen 仍是 CSS 像素,所有百分比布局不受影响。
const RENDER_RESOLUTION = Math.min(window.devicePixelRatio || 1, 2);

function rand(min, max) { return Math.random() * (max - min) + min; }

function makeText(text, opts) {
  const style = new PIXI.TextStyle({
    fontFamily: '"PingFang SC", "Microsoft YaHei", sans-serif',
    fontSize: opts.size || 16,
    fill: opts.color || '#fff5e6',
    fontWeight: opts.weight || 'normal',
    align: opts.align || 'left',
    lineHeight: opts.lineHeight || opts.size * 1.3,
  });
  const t = new PIXI.Text(text, style);
  t.resolution = RENDER_RESOLUTION;
  if (opts.anchor !== undefined) t.anchor.set(opts.anchor);
  return t;
}

function roundRect(g, x, y, w, h, r, color, alpha) {
  g.clear();
  g.beginFill(color, alpha);
  g.drawRoundedRect(x, y, w, h, r);
  g.endFill();
}

// ==================== 补间动画 ====================
const tweens = [];
function tween(target, delta, duration, onComplete) {
  const start = {};
  for (const k in delta) start[k] = target[k];
  const tw = { target, start, delta, duration, elapsed: 0, onComplete };
  // target 自身的 expando(如雷达 scale 上的 __radar 标记)透传给补间记录,radarTicker 靠它找进度
  for (const k in target) if (!(k in tw)) tw[k] = target[k];
  tweens.push(tw);
  return tw;
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.elapsed += dt;
    const p = Math.min(tw.elapsed / tw.duration, 1);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    for (const k in tw.delta) tw.target[k] = tw.start[k] + tw.delta[k] * e;
    if (p >= 1) {
      if (tw.onComplete) tw.onComplete();
      tweens.splice(i, 1);
    }
  }
}

function addPressFeedback(obj, scale = 0.92) {
  obj.eventMode = 'static';
  obj.cursor = 'pointer';
  obj.on('pointerdown', () => { obj.scale.set(scale); });
  obj.on('pointerup', () => { obj.scale.set(1); });
  obj.on('pointerupoutside', () => { obj.scale.set(1); });
  obj.on('pointercancel', () => { obj.scale.set(1); });
}

// ==================== PIXI 初始化 ====================
const app = new PIXI.Application({
  resizeTo: window,
  background: '#1a1410',
  antialias: false, // 纯 sprite 渲染,MSAA 无收益且移动端费填充率
  autoDensity: true, // canvas CSS 尺寸不变、后备缓冲按 resolution 放大 → app.screen 仍是 CSS 像素
  resolution: RENDER_RESOLUTION, // 手机 dpr 2~3,原来只有 1,全屏贴图会糊
});
document.getElementById('game').appendChild(app.view);

// ==================== 层级容器 ====================
const layers = {
  bg: new PIXI.Container(),
  clickArea: new PIXI.Container(),
  characters: new PIXI.Container(),
  scene: new PIXI.Container(),
  ui: new PIXI.Container(),
  topbar: new PIXI.Container(),
  fx: new PIXI.Container(),
  settings: new PIXI.Container(),
  panel: new PIXI.Container(), // 独立面板层(不受设置面板visible影响)
  nav: new PIXI.Container(), // 底部场景切换标签,置于最顶(切换场景时仍可见)
};
app.stage.addChild(layers.bg, layers.clickArea, layers.characters, layers.scene, layers.ui, layers.topbar, layers.fx, layers.settings, layers.panel, layers.nav);

// ==================== 背景层（灯效） ====================
const bgLight = PIXI.Sprite.from(ASSETS.bg_light);
const bgDark = PIXI.Sprite.from(ASSETS.bg_dark);
bgDark.visible = false; // 用 visible 而非 alpha=0,关灯层不参与渲染批次
layers.bg.addChild(bgLight, bgDark);

function fitBg(sprite) {
  if (!sprite.texture || sprite.texture.width <= 0 || sprite.texture.height <= 0) return;
  const s = Math.max(app.screen.width / sprite.texture.width, app.screen.height / sprite.texture.height);
  if (!isFinite(s) || s <= 0) return;
  sprite.scale.set(s);
  sprite.x = (app.screen.width - sprite.texture.width * s) / 2;
  sprite.y = (app.screen.height - sprite.texture.height * s) / 2;
}
function fitAllBgs() { fitBg(bgLight); fitBg(bgDark); }

// 灯效控制：高频快速交替闪烁
let lightState = 'on';
let lightStateStart = performance.now();
let nextFlickerIn = rand(6, 12);
let nextLightOnIn = 2;
let flickerSeq = [];
let flickerStart = 0;
let flickerNextState = 'off';

function startFlicker(seq, nextState) {
  lightState = 'flickering';
  flickerSeq = seq;
  flickerStart = performance.now();
  flickerNextState = nextState;
  bgDark.visible = seq[0].alpha > 0;
}

function updateLight() {
  if (lightState === 'on') {
    const elapsed = (performance.now() - lightStateStart) / 1000;
    if (elapsed > nextFlickerIn) {
      startFlicker([
        {alpha: 0, dur: 0.07}, {alpha: 1, dur: 0.09},
        {alpha: 0, dur: 0.06}, {alpha: 1, dur: 0.11},
        {alpha: 0, dur: 0.05}, {alpha: 1, dur: 0.08},
        {alpha: 0, dur: 0.04},
      ], 'off');
    }
  } else if (lightState === 'off') {
    const elapsed = (performance.now() - lightStateStart) / 1000;
    if (elapsed > nextLightOnIn) {
      startFlicker([
        {alpha: 1, dur: 0.06}, {alpha: 0, dur: 0.08},
        {alpha: 1, dur: 0.05}, {alpha: 0, dur: 0.1},
        {alpha: 1, dur: 0.04},
      ], 'on');
    }
  } else if (lightState === 'flickering') {
    const fe = (performance.now() - flickerStart) / 1000;
    let acc = 0;
    for (let i = 0; i < flickerSeq.length; i++) {
      acc += flickerSeq[i].dur;
      if (fe < acc) { bgDark.visible = flickerSeq[i].alpha > 0; return; }
    }
    lightState = flickerNextState;
    lightStateStart = performance.now();
    if (flickerNextState === 'off') {
      bgDark.visible = true;
      nextLightOnIn = rand(1.5, 3);
    } else {
      bgDark.visible = false;
      nextFlickerIn = rand(22, 38);
    }
  }
}

// ==================== 点击增量层 ====================
const clickMask = new PIXI.Graphics();
clickMask.beginFill(0x000000, 0.001);
clickMask.drawRect(0, 0, app.screen.width, app.screen.height);
clickMask.endFill();
clickMask.eventMode = 'static';
clickMask.cursor = 'pointer';
layers.clickArea.addChild(clickMask);

const floatTexts = new PIXI.Container();
layers.fx.addChild(floatTexts);

clickMask.on('pointerdown', (e) => {
  if (relaySceneOpen) return; // 中转站时不触发生产点击
  if (state.paused) return;
  const pos = e.global;
  doClick(pos.x, pos.y);
});

function doClick(x, y) {
  const isCrit = Math.random() < state.critChance;
  let gain = state.tokensPerClick;
  if (isCrit) gain = state.tokensPerClick * state.critMultiplier;
  state.tokens += gain;
  if (isCrit) {
    spawnCritText('暴击! +' + formatNum(gain), x, y);
  } else {
    spawnFloatText('+' + formatNum(gain), x, y);
  }
  updateTokenDisplay();
  triggerCharacterTalk();
}

// 浮字对象池:避免连点时反复创建/销毁 PIXI.Text
const floatPool = [];
const FLOAT_POOL_MAX = 40;
const FLOAT_LIVE_MAX = 30; // 同时在屏上限,防连点刷屏
let floatLiveCount = 0;

function acquireFloatText(size, color, rotation) {
  let t = floatPool.pop();
  if (!t) t = makeText('', { size, color, weight: 'bold', anchor: 0.5 });
  t.style.fontSize = size;
  t.style.fill = color;
  t.text = '';
  t.alpha = 1;
  t.rotation = rotation || 0;
  t.scale.set(1);
  return t;
}

function releaseFloatText(t) {
  floatLiveCount--;
  floatTexts.removeChild(t);
  if (floatPool.length < FLOAT_POOL_MAX) floatPool.push(t);
  else t.destroy();
}

function spawnFloatText(text, x, y) {
  if (floatLiveCount >= FLOAT_LIVE_MAX) return;
  floatLiveCount++;
  const t = acquireFloatText(22, '#ffd98a');
  t.text = text;
  t.x = x; t.y = y;
  floatTexts.addChild(t);
  tween(t, { y: y - 60, alpha: 0 }, 0.9, () => { releaseFloatText(t); });
}

function spawnCritText(text, x, y) {
  if (floatLiveCount >= FLOAT_LIVE_MAX) return;
  floatLiveCount++;
  const t = acquireFloatText(30, '#ff6b6b', -0.08);
  t.text = text;
  t.x = x; t.y = y;
  floatTexts.addChild(t);
  tween(t.scale, { x: 1.3, y: 1.3 }, 0.12);
  tween(t, { y: y - 80, alpha: 0 }, 1.1, () => { releaseFloatText(t); });
}

// ==================== 角色层 ====================
const charClosed = PIXI.Sprite.from(ASSETS.char2);
const charOpen = PIXI.Sprite.from(ASSETS.char1);
charClosed.visible = true;
charOpen.visible = false;
const speechBubble = PIXI.Sprite.from(ASSETS.speech_bubble);
speechBubble.visible = false;
layers.characters.addChild(charClosed, charOpen, speechBubble);

let isTalking = false;
let talkTimer = 0;

function triggerCharacterTalk() {
  if (isTalking) { talkTimer = 0.35; return; }
  isTalking = true;
  talkTimer = 0.35;
  charClosed.visible = false;
  charOpen.visible = true;
}

function updateCharacters(dt) {
  if (isTalking) {
    talkTimer -= dt;
    if (talkTimer <= 0) {
      isTalking = false;
      charClosed.visible = true;
      charOpen.visible = false;
    }
  }
}

function layoutCharacters() {
  const targetH = Math.min(340, app.screen.height * 0.4);
  const scale = targetH / 400;
  for (const c of [charClosed, charOpen]) {
    c.scale.set(scale);
    c.x = app.screen.width - 400 * scale - 10;
    c.y = app.screen.height - 400 * scale - 10;
  }
  // 说话气泡：人物左上角
  const bubbleScale = Math.min(1, (app.screen.width * 0.15) / speechBubble.texture.width);
  speechBubble.scale.set(bubbleScale);
  const bw = speechBubble.texture.width * bubbleScale;
  const bh = speechBubble.texture.height * bubbleScale;
  speechBubble.x = charClosed.x - bw + 110;
  speechBubble.y = charClosed.y - bh + 85;
}

// ==================== 场景层（机箱/占位图） ====================
const pcCase = PIXI.Sprite.from(ASSETS.pc_case);
const casePlaceholder = PIXI.Sprite.from(ASSETS.placeholder);
const fanSprite = PIXI.Sprite.from(ASSETS.fan);
layers.scene.addChild(pcCase, casePlaceholder, fanSprite);

// ==================== 机箱物理交互系统 ====================
const casePhysics = {
  vx: 0, vy: 0,
  isDragging: false,
  isActive: false,
  groundY: 0,
  gravity: 0.7,
  bounce: 0.45,
  friction: 0.96,
  dragHistory: [],
  dragOffset: { x: 0, y: 0 },
  userMoved: false,
};
let caseInitialized = false;

function getCaseDisplayWidth() {
  return pcCase.texture.width * pcCase.scale.x;
}
function getCaseDisplayHeight() {
  return pcCase.texture.height * pcCase.scale.y;
}

function startCaseDrag(e) {
  if (!pcCase.visible) return;
  e.stopPropagation();
  casePhysics.isDragging = true;
  casePhysics.isActive = false;
  casePhysics.vx = 0;
  casePhysics.vy = 0;
  casePhysics.dragHistory = [];
  const pos = e.global;
  casePhysics.dragOffset.x = pos.x - pcCase.x;
  casePhysics.dragOffset.y = pos.y - pcCase.y;
  pcCase.cursor = 'grabbing';
}

function updateCaseDrag(e) {
  if (!casePhysics.isDragging) return;
  const pos = e.global;
  const now = performance.now();
  pcCase.x = pos.x - casePhysics.dragOffset.x;
  pcCase.y = pos.y - casePhysics.dragOffset.y;
  casePhysics.dragHistory.push({ x: pcCase.x, y: pcCase.y, t: now });
  if (casePhysics.dragHistory.length > 6) casePhysics.dragHistory.shift();
}

function endCaseDrag() {
  if (!casePhysics.isDragging) return;
  casePhysics.isDragging = false;
  pcCase.cursor = 'pointer';
  // 从拖动历史计算松开时的速度
  const hist = casePhysics.dragHistory;
  if (hist.length >= 2) {
    const first = hist[Math.max(0, hist.length - 4)];
    const last = hist[hist.length - 1];
    const dt = Math.max(last.t - first.t, 1);
    casePhysics.vx = (last.x - first.x) / dt * 16;
    casePhysics.vy = (last.y - first.y) / dt * 16;
  }
  // 限制最大速度
  const maxV = 30;
  casePhysics.vx = Math.max(-maxV, Math.min(maxV, casePhysics.vx));
  casePhysics.vy = Math.max(-maxV, Math.min(maxV, casePhysics.vy));
  casePhysics.isActive = true;
}

function updateCasePhysics() {
  if (!casePhysics.isActive || casePhysics.isDragging) return;
  if (!pcCase.visible) return;

  // 重力
  casePhysics.vy += casePhysics.gravity;

  // 更新位置
  pcCase.x += casePhysics.vx;
  pcCase.y += casePhysics.vy;

  const cw = getCaseDisplayWidth();
  const ch = getCaseDisplayHeight();
  const sw = app.screen.width;
  let settled = false;

  // 地面碰撞
  if (pcCase.y >= casePhysics.groundY) {
    pcCase.y = casePhysics.groundY;
    if (Math.abs(casePhysics.vy) > 2.5) {
      casePhysics.vy = -casePhysics.vy * casePhysics.bounce;
      casePhysics.vx *= casePhysics.friction;
      // 奇迹算法：砸地面有概率获得额外token
      if (state.scripts.miracle && Math.random() < 0.25) {
        const bonus = Math.max(1, Math.floor(state.tokens * 0.03));
        state.tokens += bonus;
        spawnFloatText('奇迹! +' + formatNum(bonus), pcCase.x + 60, casePhysics.groundY - 20);
        updateTokenDisplay();
      }
    } else {
      casePhysics.vy = 0;
      casePhysics.vx *= 0.85;
      if (Math.abs(casePhysics.vx) < 0.15) {
        casePhysics.vx = 0;
        settled = true;
      }
    }
  }

  // 左墙碰撞
  if (pcCase.x <= 0) {
    pcCase.x = 0;
    casePhysics.vx = -casePhysics.vx * casePhysics.bounce;
  }
  // 右墙碰撞
  if (pcCase.x >= sw - cw) {
    pcCase.x = sw - cw;
    casePhysics.vx = -casePhysics.vx * casePhysics.bounce;
  }
  // 顶部碰撞
  if (pcCase.y <= 0) {
    pcCase.y = 0;
    casePhysics.vy = -casePhysics.vy * casePhysics.bounce;
  }

  if (settled) casePhysics.isActive = false;
}

// 机箱拖动事件
pcCase.eventMode = 'static';
pcCase.cursor = 'pointer';
pcCase.hitArea = new PIXI.Rectangle(0, 0, 1, 1); // 临时，layoutCase中更新
pcCase.on('pointerdown', startCaseDrag);
pcCase.on('pointermove', updateCaseDrag);
pcCase.on('pointerup', endCaseDrag);
pcCase.on('pointerupoutside', endCaseDrag);

function layoutCase() {
  // RTX3080数量>=9时切换为升级机箱贴图
  const useUpgraded = state.machines.rtx3080.count >= 9;
  const targetSource = useUpgraded ? ASSETS.pc_case_upgraded : ASSETS.pc_case;
  const newTexture = PIXI.Texture.from(targetSource);
  if (pcCase.texture !== newTexture) {
    pcCase.texture = newTexture;
  }
  const maxCaseH = app.screen.height * 0.42;
  const maxWByHeight = maxCaseH * pcCase.texture.width / pcCase.texture.height;
  const targetW = Math.min(app.screen.width * 0.38, 420, maxWByHeight);
  const s = targetW / pcCase.texture.width;
  const caseH = pcCase.texture.height * s;
  pcCase.scale.set(s);
  const bottomMargin = Math.min(80, app.screen.height * 0.06);
  const defaultX = app.screen.width * 0.28;
  const defaultY = app.screen.height - caseH - bottomMargin - 65;
  const hasFirstGpu = state.machines.rtx3080.count > 0;
  // 只在机箱首次显示时设置默认位置，之后永远不主动改变x/y
  if (hasFirstGpu && !caseInitialized) {
    pcCase.x = defaultX;
    pcCase.y = defaultY;
    caseInitialized = true;
  }
  const ps = targetW * 0.82 / casePlaceholder.texture.width;
  casePlaceholder.scale.set(ps);
  casePlaceholder.x = defaultX;
  casePlaceholder.y = defaultY + (caseH - casePlaceholder.texture.height * ps) / 2;
  casePlaceholder.visible = !hasFirstGpu;
  pcCase.visible = hasFirstGpu;

  // 风扇：机箱镜像位置（右侧），竖长造型
  const maxFanH = app.screen.height * 0.48;
  const fanS = maxFanH / fanSprite.texture.height;
  const fanW = fanSprite.texture.width * fanS;
  fanSprite.scale.set(fanS);
  // 镜像：机箱左边距28%，风扇右边距也28%
  fanSprite.x = app.screen.width * 0.72 - fanW;
  fanSprite.y = app.screen.height - maxFanH - bottomMargin - 65;
  fanSprite.visible = state.cooling.fan.count > 0;

  // 记录地面高度（物理系统用）
  casePhysics.groundY = defaultY;
  // 更新机箱hitArea为实际大小
  pcCase.hitArea = new PIXI.Rectangle(0, 0, pcCase.texture.width, pcCase.texture.height);
}

// ==================== 购买面板 ====================
const purchasePanel = new PIXI.Container();
layers.ui.addChild(purchasePanel);

const purchaseBtn = new PIXI.Container();
const purchaseBtnBg = new PIXI.Graphics();
const purchaseArrow = new PIXI.Graphics();
const purchaseText = makeText('购\n买', { size: 15, color: '#fff5e6', weight: 'bold', align: 'center', anchor: 0.5, lineHeight: 18 });
purchaseBtn.addChild(purchaseBtnBg, purchaseArrow, purchaseText);

const panelContent = new PIXI.Container();
const panelBg = new PIXI.Graphics();
panelContent.addChild(panelBg);
purchasePanel.addChild(panelContent, purchaseBtn);

let panelExpanded = false;
const panelW = 360;
const panelH = 420;

function drawPurchaseArrow(expanded) {
  purchaseArrow.clear();
  purchaseArrow.lineStyle(2.5, 0xfff5e6, 0.9);
  const cx = 21, cy = 18;
  if (expanded) {
    purchaseArrow.moveTo(cx - 6, cy + 4);
    purchaseArrow.lineTo(cx, cy - 4);
    purchaseArrow.lineTo(cx + 6, cy + 4);
  } else {
    purchaseArrow.moveTo(cx - 4, cy - 6);
    purchaseArrow.lineTo(cx + 4, cy);
    purchaseArrow.lineTo(cx - 4, cy + 6);
  }
}

function layoutPurchasePanel() {
  const btnW = 48, btnH = 92;
  const baseX = app.screen.width - btnW - 16;
  const baseY = app.screen.height * 0.2;
  purchaseBtn.x = baseX;
  purchaseBtn.y = baseY;
  roundRect(purchaseBtnBg, 0, 0, btnW, btnH, 10, 0xc4853a, 0.92);
  purchaseText.x = btnW / 2;
  purchaseText.y = btnH / 2 + 8;
  drawPurchaseArrow(panelExpanded);
  purchaseBtn.hitArea = new PIXI.Rectangle(0, 0, btnW, btnH);

  panelContent.x = baseX - panelW - 8;
  panelContent.y = baseY;
  panelContent.visible = panelExpanded;
  if (panelExpanded) {
    roundRect(panelBg, 0, 0, panelW, panelH, 12, 0xfff8ee, 0.95);
  }
}

function drawBuyButton(g, canAfford, color) {
  g.clear();
  const bgColor = canAfford ? color : 0x6b6b6b;
  roundRect(g, 0, 0, 320, 68, 10, bgColor, 0.9);
}

const allBuyItems = [];

// 只有"可负担/已拥有/数量"状态变化时才重绘 Graphics,每帧仅做几次比较
function refreshBuyItem(item, force) {
  const ownedNow = item.oneTime && item.owned();
  const lockedNow = item.lockedFn && item.lockedFn();
  const price = item.priceFn();
  const afford = !ownedNow && !lockedNow && state.tokens >= price;
  const count = item.countFn ? item.countFn() : 0;
  const key = (ownedNow ? 'o' : lockedNow ? 'l' : afford ? 'a' : 'p') + ':' + count;
  if (!force && item._uiKey === key) return;
  item._uiKey = key;
  if (ownedNow) {
    item.priceText.text = '已拥有';
    item.countText.text = '';
    drawBuyButton(item.bg, false, item.buyColor);
  } else if (lockedNow) {
    // 锁定状态:显示提示文字,按钮灰色不可点击
    item.priceText.text = item.lockHintFn ? item.lockHintFn() : '未解锁';
    if (item.countFn) {
      item.countText.text = count > 0 ? 'x' + count : '';
      item.countText.x = item.nameText.x + item.nameText.width + 6;
    }
    drawBuyButton(item.bg, false, item.buyColor);
  } else {
    item.priceText.text = price + ' token';
    if (item.countFn) {
      item.countText.text = count > 0 ? 'x' + count : '';
      item.countText.x = item.nameText.x + item.nameText.width + 6;
    }
    drawBuyButton(item.bg, afford, item.buyColor);
  }
}

function updateAllBuyButtons(force) {

function createBuyItem(container, y, iconDraw, name, desc, priceFn, buyColor, onBuy, oneTime, owned, countFn, lockedFn, lockHintFn) {
  const bg = new PIXI.Graphics();
  bg.x = 20; bg.y = y;
  container.addChild(bg);

  const icon = new PIXI.Graphics();
  icon.x = 28; icon.y = y + 12;
  iconDraw(icon);
  container.addChild(icon);

  const nameText = makeText(name, { size: 15, color: '#fff5e6', weight: 'bold' });
  nameText.x = 80; nameText.y = y + 14;
  container.addChild(nameText);

  const countText = makeText('', { size: 13, color: '#ffd98a', weight: 'bold' });
  countText.y = y + 14;
  container.addChild(countText);

  const descText = makeText(desc, { size: 11, color: '#d4c4a8' });
  descText.x = 80; descText.y = y + 36;
  container.addChild(descText);

  const priceText = makeText('', { size: 14, color: '#ffd98a', weight: 'bold', anchor: 1 });
  priceText.x = panelW - 24; priceText.y = y + 30;
  container.addChild(priceText);

  const item = { bg, nameText, countText, priceText, priceFn, oneTime, owned, countFn, buyColor, lockedFn, lockHintFn, _uiKey: null };
  refreshBuyItem(item, true);

  bg.eventMode = 'static';
  bg.cursor = 'pointer';
  bg.hitArea = new PIXI.Rectangle(0, 0, 320, 68);
  bg.on('pointerdown', () => {
    if (oneTime && owned()) return;
    if (lockedFn && lockedFn()) return; // 锁定状态不可购买
    const price = priceFn();
    if (state.tokens >= price) {
      state.tokens -= price;
      onBuy();
      refreshBuyItem(item, true);
      updateAllBuyButtons();
      updateTokenDisplay();
      layoutCase();
      updateRelayTabVisibility();
      saveGame();
    }
  });

  allBuyItems.push(item);
  return item;
}

function layoutNavTabs() {
  const w = 104, h = 42, gap = 18;
  const vis = TABS.filter(t => t.container.visible);
  // 右下角站着人物(layoutCharacters 用的同一套尺寸)。旧版把标签均匀铺满整屏宽,
  // 最后一个标签会正好压在人物身上 → 这里改成:先按屏宽居中,再整体左移到人物左边。
  const charW = Math.min(340, app.screen.height * 0.4);
  const rightLimit = app.screen.width - charW - 16;
  const totalW = vis.length * w + Math.max(0, vis.length - 1) * gap;
  let startX = Math.min((app.screen.width - totalW) / 2, rightLimit - totalW);
  startX = Math.max(startX, 12);
  vis.forEach((t, i) => {
    t.container.x = startX + i * (w + gap);
    t.container.y = app.screen.height - h - 14;
    // 高亮当前场景:这里统一画,避免"布局函数画一种颜色、切换函数再覆盖另一种"的两处不同步
    roundRect(t.bg, 0, 0, w, h, 10, navScene === t.key ? t.on : t.off, 0.85);
    t.text.x = w / 2;
    t.text.y = h / 2;
  });
}

function switchScene(name) {
  // 中转站常显但未解锁:买了服务器才放行。点击冒提示 —— 原地保持 1.6s 再缓慢淡出
  // (2026-09-12 用户要求:不要一闪而过;不走浮字池,浮字池是"上飘快消"的动线)
  if (name === 'relay' && state.machines.server.count <= 0) {
    const tb = tabOf('relay').container;
    if (relayHint) { relayHint.destroy(); relayHint = null; }
    const hint = makeText('暂未解锁 · 购买服务器后开放', { size: 15, color: '#ffd98a', weight: 'bold', anchor: 0.5 });
    hint.x = tb.x + 52;
    hint.y = tb.y - 34;
    floatTexts.addChild(hint);
    relayHint = hint;
    setTimeout(() => {
      if (relayHint !== hint) return;
      tween(hint, { alpha: 0 }, 1.2, () => { hint.destroy(); relayHint = null; });
    }, 1600);
    return;
  }
  if (name !== 'relay' && relaySceneOpen) closeRelayScene();
  if (name !== 'tune' && tuneSceneOpen) closeTuneScene();
  if (name === 'relay' && !relaySceneOpen) openRelayScene();
  if (name === 'tune' && !tuneSceneOpen) openTuneScene();
  navScene = name;
  layoutNavTabs();
}

// 属性 → 派生量。三处互逆:ctxK() ↔ 长上下文属性、cutoffMonths() ↔ 知识属性。
// 上下文区间 0k ~ 1000k(2026-09-11 用户改:原来 20k 起步,8k 的小模型属性被顶死在 0)。
// 曲线 = 平移对数:x=0 → 恰好 0k、x=100 → 1000k,中高段保持对数手感,严格递增、可精确反解。
const CTX_MAX_K = 1000, CTX_RATIO = 50;
const KNOW_M0 = 2024 * 12 + 8;    // 知识=5   → 2024-08
const KNOW_M1 = 2026 * 12 + 9;    // 知识=100 → 2026-09
const TOK_PER_SPEED_POINT = 3;    // 2026-09-11 用户改:1 分 = 3 tok/s(原 2)

function ctxK(longCtx)      { return CTX_MAX_K * (Math.pow(CTX_RATIO, longCtx / 100) - 1) / (CTX_RATIO - 1); }
function tokPerSec(speed)   { return speed * TOK_PER_SPEED_POINT; }
function cutoffMonths(know) { return KNOW_M0 + (know - 5) * (KNOW_M1 - KNOW_M0) / 95; }
// 月份存的是 年*12 + 月(1~12),不是 0-indexed —— 曾经按 0-indexed 还原,所有日期显示都差一个月
function monthsStr(m)       { m = Math.round(m); const y = Math.floor((m - 1) / 12), mo = m - y * 12; return y + '-' + (mo < 10 ? '0' : '') + mo; }
// 长上下文属性 → 上下文 的逆映射(ctxK 的反函数),deriveModelAttrs 用
function ctxAttr(ctxKv)     { return 100 * Math.log(1 + (CTX_RATIO - 1) * ctxKv / CTX_MAX_K) / Math.log(CTX_RATIO); }
function modelCapability(a) {
  // 2026-09-11 用户定稿:速度/长上下文/多模态也计入能力,但都以「推理」为闸门 ——
  // 推理决定这些能力用不用得上:推理 0 时三者一律 0 分,推理 100 时足额给(× reasoning/100)。
  // 权重都刻意小于主项(CAP_W),加分 = 属性值 × 权重,直接进 core(照样吃知识/拟合乘区)。
  const gate = a.reasoning / 100;
  const ctxW = a.longCtx >= 60 ? CAP_CTX_W_HI : CAP_CTX_W_LO;   // 长上下文 60 分两档,高档略大
  const mmW = a.multimodal > 60 ? CAP_MM_W_HIGH                 // >60(文图视PDF):比 LOW 略高
    : a.multimodal >= 40 ? CAP_MM_W_MID                          // 40–60(文图/文图视):最小,平台期不给甜头
    : CAP_MM_W_LOW;                                              // <40(纯文本):小权重
  const core = a.reasoning * CAP_W.reasoning + a.instruct * CAP_W.instruct + a.toolCall * CAP_W.toolCall
    + a.speed * CAP_SPEED_W * gate
    + a.longCtx * ctxW * gate
    + a.multimodal * mmW * gate;
  // 知识乘区受推理闸门(2026-09-12 用户定稿):推理越高,知识发挥的倍率越大。
  // gate = 推理/100:推理 100 时足额 ±25%(与旧公式一致),推理 0 时知识不起作用(倍率恒 1)。
  const knowMul = 1 + ((a.knowledge - 50) / 200) * (a.reasoning / 100);
  const fitMul = 1 - CAP_FIT_PENALTY * Math.pow(Math.abs(a.fit - CAP_FIT_OPT) / 70, CAP_FIT_EXP);
  return Math.max(0, Math.min(100, core * knowMul * fitMul / CAP_NORM));
}

  // 推理/知识/长上下/速度/多模态/指令/工具/拟合/参数)时**直接采用**,不再从 cap 硬推;
  // 没有的行(设计属性 = —)退回下面的 cap 推导。编辑器覆盖在其上合并(见 modelToAttrs)。
  // ⚠️ 属性由此变为第一手数据:改 §3.1 设计属性列 + --write 即生效,cap/名次不再牵动属性。
  if (m.ax) {
    return {
      reasoning: m.ax[0], knowledge: m.ax[1], longCtx: m.ax[2], speed: m.ax[3],
      multimodal: m.ax[4], instruct: m.ax[5], toolCall: m.ax[6], fit: m.ax[7], params: m.ax[8],
    };
  }
  const ao = ctxAttr(m.c);   // 0k~1000k 平移对数的逆映射(见 ctxK/ctxAttr 定义处)
  // 知识属性必须能反推回 m.k 的月份(设计文档 §3.3:与 cutoff() 互逆)。
  // 这里曾经写成 `m.k ? 5 : 0` —— m.k 是 'YYYY-MM' 字符串恒为真,于是**每个模型的知识都恒等于 10**,
  // cutoff 恒为 2024-09。后果不只是雷达图难看:closestModel 里「知识不如它新 +0.35」那道门槛
  // 连模型对**自己**都会触发,而 Qwen2.5-7B / Mistral 7B 是仅有的两条不触发的老截止行,
  // 于是 53 条里有 34 条查出来最近的是 Qwen2.5-7B(实测)。
  const know = 5 + (monthsFromStr(m.k) - KNOW_M0) * 95 / (KNOW_M1 - KNOW_M0);
  return {
    longCtx: Math.max(0, Math.min(100, ao)),
    // 速度:锚定 §3.1 的 AA 实测 tok/s(ts / 3,与 tokPerSec 互逆)——2026-09-12 最终定稿。
    // 这样 cap 重排/任何其它调整都不会再拖动速度(用户要求:不要轻易修改速度属性)。
    // 能力公式里的速度项(0.06 × 推理闸门)基于此值,单项影响 <1 分。
    speed: Math.max(0, Math.min(100, m.ts / TOK_PER_SPEED_POINT)),
    knowledge: Math.max(0, Math.min(100, know)),
    multimodal: [10, 45, 55, 65][m.m] || 10,
    toolCall: m.tools ? 75 : 12,
    instruct: Math.max(0, Math.min(100, m.cap * 0.95 + 4)),
    reasoning: Math.max(0, Math.min(100, m.cap * 1.02 + 3)),
    // 拟合/参数是内部量,真实模型无从反推,按「训练良好的成品」给锚点:
    // 拟合贴近最优点(略偏高,量产模型通常轻微过拟合),参数随能力规模走。
    // 只用于雷达图对照;相似度距离(SIM_W)不含这两个键,所以不影响 closestModel。
    fit: Math.min(100, CAP_FIT_OPT + m.cap * 0.10),
    params: Math.min(100, m.cap * 0.90 + 5),
  };
}
// 【临时调试】榜单编辑器改数值后的"有效 cap" = 静态设计值 + 覆盖引起的派生能力变化量(Δ)。
// 用 Δ 而不是直接拿派生值排,是因为两套刻度有系统差(旗舰派生 ~78 vs 设计 cap 87):
// 直接换刻度会导致"改 1 点属性名次猛跳几位"。Δ 方案:没改的模型顺序与 §3.1 完全一致,
// 改多少、挪多少,顺手感。REAL_MODELS 数组本身仍不动(closestModel 等不受影响)。
function effectiveCap(m) {
  if (!MODEL_ATTR_OVERRIDE[m.n]) return m.cap;
  const before = modelCapability(deriveModelAttrs(m));
  const after = modelCapability(modelToAttrs(m));
  return m.cap + (after - before);
}
// 有效知识截止日期:编辑器改了「知识」后,所有显示日期的地方(编辑器左上角、榜单截止列)
// 都跟着 cutoffMonths() 反推(与知识属性互逆,见 §2.1)。没改过的模型就是表里的静态 m.k。
function effectiveCutoff(m) {
  const ov = MODEL_ATTR_OVERRIDE[m.n];
  if (!ov || ov.knowledge === undefined) return m.k;   // 没改知识 = 表里静态日期(避免钳位反推失真)
  return monthsStr(cutoffMonths(ov.knowledge));        // 改了 → 按改后的知识反推
}
// 榜单显示顺序:按有效 cap 降序(平手按原表序)。每帧排序 56 条,开销可忽略。
function boardOrder() {
  return REAL_MODELS
    .map((m, i) => ({ m, i }))
    .sort((a, b) => (effectiveCap(b.m) - effectiveCap(a.m)) || (a.i - b.i));
}
// 【临时调试】合并覆盖值(编辑器手改的等效属性);注意它依赖下方 MODEL_ATTR_OVERRIDE(运行时才取,无初始化顺序问题)
function modelToAttrs(m) {
  const a = deriveModelAttrs(m);
  const ov = MODEL_ATTR_OVERRIDE[m.n];
  return ov ? Object.assign(a, ov) : a;
}
function modelCapabilityOf(m) { return modelCapability(modelToAttrs(m)); }

// "最接近的模型"(设计文档第 4 节):7 维加权距离 + 两个硬门槛,取最小距离者
function closestModel(a) {
  const cutoff = cutoffMonths(a.knowledge);
  let best = null, bestD = Infinity;
  for (const m of REAL_MODELS) {
    const ma = modelToAttrs(m);
    let d = 0;
    for (const k of ATTR_KEYS) d += SIM_W[k] * Math.abs(a[k] - ma[k]) / 100;
    const mCut = monthsFromStr(m.k);
    if (cutoff < mCut - 3) d += 0.35;                                  // 知识不如它新 → 细节问题上会露馅
    if (a.multimodal < ma.multimodal) d += 0.30;                       // 模态档位不够 → 差距太大
    if (d < bestD) { bestD = d; best = m; }
  }
  return { model: best, distance: bestD, similarity: Math.max(0, Math.round(100 * (1 - bestD / SIM_SAT))) };
}
function monthsFromStr(s) { const p = String(s).split('-'); return (+p[0]) * 12 + (+p[1]); }

// ========== 中转站经营 v1(设计文档 §14;拍板见 §14.10) ==========
// tokens 单池:用户每秒消耗 state.tokens,按定价换成刀乐。1 现实秒 = 1 游戏分钟。
const RELAY_BIZ = {
  GAME_MIN_PER_REAL_SEC: 1,   // 1 现实秒 → 1 游戏分钟 → 1/60 游戏时
  REP_CYCLE_H: 10,            // 信誉结算周期(游戏时)
  REP_STEP: [0.1, 0.5],       // 单次结算幅度
  USER_TENURE: [2, 6],        // 新用户存在时长(游戏时);信誉加成 +信誉/50
  GROW_PCT: [0.05, 0.20],     // 定价有竞争力时的增长比(基于 base)
  CHEAP_LINE: 0.8,            // ≤ 官方参考价×0.8 → 概率/比例上调(2026-09-12 起无市场价,只对官价)
  RENEW_LINE: 1.1,            // ≤ 官方参考价×1.1 → 有机会续约
  ACTIVE_MIN: 0.3, ACTIVE_MAX: 1.0,
  DOWN_REP_HOURLY: 1,         // 每小时处在服务中断 → 信誉 -1
};

function blendPriceNum(m) { return (m.pi + m.po * 3) / 4; }
// 2026-09-12 用户要求:删除「市场价」概念,经营对比只保留官方参考价(blendPrice)。
// CHEAP_LINE / RENEW_LINE 直接乘官价;旧 marketPriceOf() 已废除。
function officialPriceOf(m) { return blendPriceNum(m); }
function findModelByName(n) {
  if (!n) return null;
  for (const m of REAL_MODELS) if (m.n === n) return m;
  return null;
}
// 对「某个指定模型」的属性相似度(距离算法同 §4,0~100,不含能力倍率)。
// ⚠️ 初始属性极弱时 d 很容易 ≥ SIM_SAT(0.6) → 显示 0%:这是「和任何真实模型都完全不像」,
// 不是 bug。硬门槛(知识截止 +0.35 / 多模态 +0.30)会再叠距离,新手对旗舰几乎必是 0。
function rawSimilarityTo(a, m) {
  const ma = modelToAttrs(m);
  const cutoff = cutoffMonths(a.knowledge);
  let d = 0;
  for (const k of ATTR_KEYS) d += SIM_W[k] * Math.abs(a[k] - ma[k]) / 100;
  if (cutoff < monthsFromStr(m.k) - 3) d += 0.35;
  if (a.multimodal < ma.multimodal) d += 0.30;
  return Math.max(0, 100 * (1 - d / SIM_SAT));
}
// 能力倍率:我的 cap / 标榜 cap,幂函数软化(§14.11)。
// 比值 1→1.0  2→~1.32  0.5→~0.76;封顶 1.5、保底 0.4,防极端比值把相似度炸飞或压死。
function capMulTo(a, m) {
  const myCap = modelCapability(a);
  const listCap = Math.max(m.cap, 1);
  return Math.max(0.4, Math.min(1.5, Math.pow(myCap / listCap, 0.4)));
}
// 有效相似度 = 属性相似 × 能力倍率。可 >100(高配低标 / 能力溢出的「灰测」感)。
// 信誉结算与后台展示都用这个,不再用裸属性距离。
function similarityTo(a, m) {
  const raw = rawSimilarityTo(a, m);
  const mul = capMulTo(a, m);
  return Math.min(140, raw * mul);
}
function relayListedModel() { return findModelByName(state.relay.listedModel); }
function relayBaseUsers() { return 2 + Math.floor(state.relay.reputation / 25); }

// 每游戏时:续约 + 概率增长。增长基于 base(防复利,§14.5 用户强调)。
// 价格对比基准 = 官方参考价(2026-09-12 起无市场价)。
function relayHourlyRefresh() {
  const R = state.relay;
  const listed = relayListedModel();
  const official = listed ? officialPriceOf(listed) : 0;
  const keep = [];
  for (const u of R.userSlots) {
    u.leftH -= 1;
    if (u.leftH > 0) { keep.push(u); continue; }
    // 到期:定价不太离谱 + 信誉尚可 → 续约(保持留存,不全靠新增)
    if (R.price > 0 && official > 0 && R.price <= official * RELAY_BIZ.RENEW_LINE
        && Math.random() < 0.5 + R.reputation / 200) {
      keep.push({ leftH: RELAY_BIZ.USER_TENURE[0] + Math.random() * (RELAY_BIZ.USER_TENURE[1] - RELAY_BIZ.USER_TENURE[0] + R.reputation / 50) });
    }
  }
  R.userSlots = keep;
  // 新增:定价 ≤ 官价×0.8 才触发;概率与比例都随便宜程度上调
  if (listed && R.price > 0 && official > 0 && R.price <= official * RELAY_BIZ.CHEAP_LINE) {
    const cheapness = Math.min(1, (official * RELAY_BIZ.CHEAP_LINE - R.price) / (official * RELAY_BIZ.CHEAP_LINE));
    const p = 0.20 + 0.40 * cheapness;
    if (Math.random() < p) {
      const base = relayBaseUsers();
      const pct = RELAY_BIZ.GROW_PCT[0] + (RELAY_BIZ.GROW_PCT[1] - RELAY_BIZ.GROW_PCT[0]) * cheapness;
      const add = Math.max(1, Math.round(base * pct));
      const tMin = RELAY_BIZ.USER_TENURE[0], tMax = RELAY_BIZ.USER_TENURE[1] + R.reputation / 50;
      for (let i = 0; i < add; i++) {
        keep.push({ leftH: tMin + Math.random() * Math.max(0.5, tMax - tMin) });
      }
    }
  }
  R.users = R.userSlots.length;
  // 服务中断惩罚
  if (R.serviceDown) {
    R.reputation = Math.max(0, R.reputation - RELAY_BIZ.DOWN_REP_HOURLY);
  }
}

// 每 10 游戏时:按对标榜模型的相似度结算信誉(§14.4)
function relayRepSettle() {
  const R = state.relay;
  const listed = relayListedModel();
  if (!listed) return; // 自研不结算
  const sim = similarityTo(R.ability, listed);
  const step = RELAY_BIZ.REP_STEP[0] + Math.random() * (RELAY_BIZ.REP_STEP[1] - RELAY_BIZ.REP_STEP[0]);
  if (sim > 100) {
    // 高配低标:只升,幅度小
    R.reputation = Math.min(100, R.reputation + step * 0.4);
  } else if (sim >= 80) {
    const pUp = (sim - 80) / 20; // 80→0  100→1,越高越易升
    if (Math.random() < 0.25 + pUp * 0.5) {
      R.reputation = Math.min(100, R.reputation + step);
    } else {
      R.reputation = Math.max(0, R.reputation - step * 0.5);
    }
  } else {
    // <80:主跌,越低越狠
    const sev = Math.min(1, (80 - sim) / 80);
    R.reputation = Math.max(0, R.reputation - step * (1 + sev * 2));
  }
}

// 主循环每帧调用:时钟 + 卖 token 换刀乐 + 到点触发小时/信誉刷新
function updateRelayBusiness(dt) {
  const R = state.relay;
  const gameHours = dt * (RELAY_BIZ.GAME_MIN_PER_REAL_SEC / 60);
  R.gameHour = (R.gameHour + gameHours) % 24;

  // 活跃系数随机游走(慢,别每帧乱跳)
  if (Math.random() < gameHours * 8) {
    R.activeCoef += (Math.random() - 0.5) * 0.1;
    R.activeCoef = Math.max(RELAY_BIZ.ACTIVE_MIN, Math.min(RELAY_BIZ.ACTIVE_MAX, R.activeCoef));
  }

  // 卖出:仅上架且定价 > 0
  const listed = relayListedModel();
  if (listed && R.price > 0 && R.users > 0) {
    const ideal = R.users * R.ability.speed * R.activeCoef;
    const used = Math.min(ideal, state.tokens);
    if (used < ideal * 0.5) R.serviceDown = true;
    else if (used >= ideal * 0.95) R.serviceDown = false;
    if (used > 0) {
      state.tokens -= used;
      R.dollars += used * R.price / 1e6;
      R.totalTokensSold += used;
      R.totalDollarsEarned += used * R.price / 1e6;
    }
  } else {
    R.serviceDown = false;
  }

  // 到点刷新
  R.hourAccum += gameHours;
  while (R.hourAccum >= 1) { R.hourAccum -= 1; relayHourlyRefresh(); }
  R.repAccum += gameHours;
  while (R.repAccum >= RELAY_BIZ.REP_CYCLE_H) {
    R.repAccum -= RELAY_BIZ.REP_CYCLE_H;
    relayRepSettle();
  }

  // 后台页开着时原地刷新活字(不整页重绘,避免 destroy 开销)
  if (screenPanelOpen && panelTab === 'backend' && backendLive) {
    backendLive.dollars.text = '$' + formatNum(R.dollars);
    backendLive.tokens.text = formatNum(state.tokens);
    backendLive.rep.text = R.reputation.toFixed(1);
    backendLive.users.text = String(R.users);
    backendLive.clock.text = String(Math.floor(R.gameHour)).padStart(2, '0') + ':' + String(Math.floor((R.gameHour % 1) * 60)).padStart(2, '0');
    backendLive.rate.text = listed && R.price > 0
      ? '+$' + (R.users * R.ability.speed * R.activeCoef * R.price / 1e6).toFixed(3) + ' /秒'
      : '未标榜';
    // 相似度:优先显示「选中行」的,否则显示当前标榜的;≥80 或 >100 绿,否则红
    // 显示口径 = 有效相似度(属性相似 × 能力倍率);括号里附 raw%,方便看倍率拉了多少
    let simM = null;
    if (backendSelIdx >= 0) simM = REAL_MODELS[backendSelIdx];
    else if (listed) simM = listed;
    if (simM) {
      const raw = rawSimilarityTo(R.ability, simM);
      const mul = capMulTo(R.ability, simM);
      const eff = similarityTo(R.ability, simM);
      const tag = (backendSelIdx >= 0 && listed && simM.n !== listed.n) ? '(选中)'
        : (listed && simM.n === listed.n) ? '(标榜)' : '';
      backendLive.sim.text = '有效相似 ' + eff.toFixed(0) + '% ' + tag
        + '  属性' + raw.toFixed(0) + '% ×能力' + mul.toFixed(2) + '×';
      backendLive.sim.style.fill = (eff >= 80 || eff > 100) ? '#2a7a3a' : '#c05a2a';
    } else {
      backendLive.sim.text = '未标榜 · 点下方列表选一个模型';
      backendLive.sim.style.fill = '#b0a294';
    }
  }
  // 中转站顶栏 HUD(与生产 tokens 同位置,不遮电脑面板)
  if (relaySceneOpen && relayHudLine1) {
    const listed2 = relayListedModel();
    relayHudLine1.text = '$' + formatNum(R.dollars) + '   ·   ' + R.users + ' 人   ·   信誉 ' + R.reputation.toFixed(1);
    relayHudLine2.text = String(Math.floor(R.gameHour)).padStart(2, '0') + ':' + String(Math.floor((R.gameHour % 1) * 60)).padStart(2, '0')
      + (listed2 ? '   ·   标榜 ' + listed2.n : '   ·   未标榜')
      + (R.serviceDown ? '   ·   ⚠中断' : '');
  }
}

// 影响面就一处:modelToAttrs 末尾把覆盖值合并进去 → 雷达图灰影 + 「最接近的模型」跟着变。
// 要撤掉:删本块 + modelToAttrs 的合并 + 榜单行点击 + drawModelAttrEditor + keydown 里 editingKey 那段。
// ponytail: 调试工具,只做 0-100 整数 + 本地存,没做撤销/多存档;正式版整块删。
const MODEL_ATTR_KEY = 'dshgame.modelAttrOverride';
let MODEL_ATTR_OVERRIDE = {};
try { MODEL_ATTR_OVERRIDE = JSON.parse(localStorage.getItem(MODEL_ATTR_KEY) || '{}') || {}; }
catch (e) { MODEL_ATTR_OVERRIDE = {}; }
let boardPickIdx = -1;   // 正在查看的榜单行(-1 = 无)
let editingKey = null;   // 正在输入的属性 key(null = 没在输入)
let editBuf = '';        // 输入缓冲(字符串,提交时转 int)
let editRef = null;      // { g, t, ... } 当前值框引用:敲键只更新这一个框,不整页重绘

let screenPanelOpen = false;

function openScreenPanel() {
  if (screenPanelOpen) return; // 防止重复打开
  screenPanelOpen = true;
  screenPanel.visible = true;
  screenGlowHit.eventMode = 'none'; // 打开后禁用屏幕点击,避免重复触发
  radarAnim = true;                 // 每次打开都重新播一次"从中心长出"
  layoutScreenPanel();
}

function closeScreenPanel() {
  screenPanelOpen = false;
  showAttrDetail = false;
  backendDetailOpen = false;
  boardPickIdx = -1;
  editingKey = null;
  screenPanel.visible = false;
  screenGlowHit.eventMode = 'static'; // 恢复屏幕点击
  if (typeof ensureLbDom === 'function') {
    const lbDom = ensureLbDom();
    lbDom.inp.style.display = 'none';
    lbDom.drop.style.display = 'none';
  }
  if (typeof backendPriceDom === 'function') {
    backendPriceDom().inp.style.display = 'none';
  }
}

function layoutScreenPanel() {
  const w = app.screen.width;
  const h = app.screen.height;

  // 背景遮罩(半透明深色模拟虚化,加深)
  panelMask.clear();
  panelMask.beginFill(0x1a1208, 0.72);
  panelMask.drawRect(0, 0, w, h);
  panelMask.endFill();

  // 面板尺寸(占绝大部分,留有边距)
  const pw = w * 0.88;
  const ph = h * 0.85;
  const px = (w - pw) / 2;
  const py = (h - ph) / 2;
  const radius = 14;

  // 面板主体(米白色,简约风格)
  panelBody.clear();
  panelBody.lineStyle(1, 0xc4b8a8, 0.6);
  panelBody.beginFill(0xf5f0e8, 1);
  panelBody.drawRoundedRect(px, py, pw, ph, radius);
  panelBody.endFill();
  // 显式 hitArea:比依赖 Graphics 的填充几何做命中判定更可靠,且随布局一起更新
  panelBody.hitArea = new PIXI.Rectangle(px, py, pw, ph);

  // 顶部栏(稍深米色,高度48px)
  const topH = 48;
  panelTopBar.clear();
  panelTopBar.beginFill(0xe8e0d4, 1);
  panelTopBar.drawRoundedRect(px, py, pw, topH, radius);
  panelTopBar.endFill();
  // 遮盖底部圆角(让顶部栏和面板主体无缝衔接)
  panelTopBar.beginFill(0xe8e0d4, 1);
  panelTopBar.drawRect(px, py + topH - radius, pw, radius);
  panelTopBar.endFill();

  // 左侧栏(稍深米色)。窄屏(竖屏手机)按比例收窄,否则固定的 200px 会把内容区挤没
  const sideW = Math.min(200, w * 0.24);
  panelSideBar.clear();
  panelSideBar.beginFill(0xe8e0d4, 1);
  panelSideBar.drawRoundedRect(px, py + topH, sideW, ph - topH, radius);
  panelSideBar.endFill();
  // 遮盖右侧圆角
  panelSideBar.beginFill(0xe8e0d4, 1);
  panelSideBar.drawRect(px + sideW - radius, py + topH, radius, ph - topH - radius);
  panelSideBar.endFill();
  // 左侧栏和顶部栏之间的分隔线
  panelSideBar.lineStyle(1, 0xc4b8a8, 0.4);
  panelSideBar.moveTo(px + sideW, py + topH);
  panelSideBar.lineTo(px + sideW, py + ph);
  // 顶部栏和内容区分隔线
  panelSideBar.moveTo(px, py + topH);
  panelSideBar.lineTo(px + pw, py + topH);

  // 清空旧占位与旧内容。⚠️ 必须 destroy:面板每次重绘都新建一两百个 Text/Graphics,
  // 只 removeChildren 的话 JS 对象会被 GC,但它们占着的 canvas 纹理不会立刻释放,
  // 反复改数值就泄漏一堆纹理 → 越用越卡。销毁推迟到下一帧,避免在事件派发途中析构正在派发的对象。
  const wipeLater = (container) => {
    const old = container.removeChildren();
    setTimeout(() => { for (const c of old) if (!c.destroyed) c.destroy({ children: true }); }, 0);
  };
  wipeLater(panelPlaceholders);
  wipeLater(panelContentArea);
  wipeLater(attrDetailLayer);
  radarCounters.clear();   // 计数器里引用的 Text 已在上面的销毁队列里
  editRef = null;

  // ===== 顶部栏占位 =====
  // 左侧网站logo(大肥鱼站,新版横排,米色背景和顶部栏融合)
  const logoH = topH * 1.0; // 顶部栏高度(48px)
  const logoScale = logoH / panelLogo.texture.height;
  panelLogo.scale.set(logoScale);
  panelLogo.x = px + 14;
  panelLogo.y = py + topH / 2;
  panelLogo.visible = true;

  // 搜索框占位(保留;搜索不是当前重点,只是一个视觉锚点)
  const searchBox = new PIXI.Graphics();
  searchBox.lineStyle(1, 0xc4b8a8, 0.5);
  searchBox.beginFill(0xf5f0e8, 0.8);
  searchBox.drawRoundedRect(px + pw - 130, py + topH / 2 - 12, 100, 24, 6);
  searchBox.endFill();
  panelPlaceholders.addChild(searchBox);

  // ===== 左侧栏:可点击的分类标签(模型 / 社区 / 后台) =====
  // 内容全部画进 panelContentArea(用绝对屏幕坐标;它是容器子节点、自身位移为 0,
  // 所以子元素直接用绝对坐标即可,不需要换算局部坐标)。
  const sideX = px + 16;
  let sideY = py + topH + 20;   // 与旧占位一致:分组标题占位后接菜单项的位置
  for (const tab of PANEL_TABS) {
    const active = tab.key === panelTab;
    const item = new PIXI.Graphics();
    if (active) {
      item.beginFill(0xd4a574, 0.5); // 选中项暖橙高亮
      item.drawRoundedRect(sideX - 4, sideY - 4, sideW - 24, 32, 6);
      item.endFill();
    }
    item.beginFill(active ? 0xd4a574 : 0xc4b8a8, 0.8);
    item.drawRoundedRect(sideX + 4, sideY + 4, 16, 16, 3);   // 图标占位
    item.endFill();
    item.beginFill(active ? 0xb8956a : 0xc4b8a8, 0.6);
    item.drawRoundedRect(sideX + 28, sideY + 6, sideW - 60, 12, 3); // 文字占位(未做文字渲染)
    item.endFill();
    item.eventMode = 'static';   // 可点击(见 panelBody 的注释:auto 不参与命中测试)
    item.cursor = 'pointer';
    item.hitArea = new PIXI.Rectangle(sideX - 4, sideY - 4, sideW - 24, 32);
    item.on('pointerdown', () => {
      panelTab = tab.key;
      showAttrDetail = false;
      backendDetailOpen = false;
      boardPickIdx = -1;
      editingKey = null;
      if (tab.key === 'model') radarAnim = true;   // 切回模型页也重播一次
      layoutScreenPanel();
    });
    panelPlaceholders.addChild(item);

    // 标签名(用真文字,方便辨认;占位阶段够用)
    const label = makeText(tab.label, { size: 13, color: active ? '#7a4a22' : '#8a7a68', weight: active ? 'bold' : 'normal' });
    label.x = sideX + 28;
    label.y = sideY + 7;
    panelPlaceholders.addChild(label);

    sideY += 36;
  }
  // 预留一行提示:标签页是全新内容,旧的三组占位菜单已移除
  const sideHint = makeText('训练 / 调教见底部「调教」标签', { size: 11, color: '#b0a294' });
  sideHint.x = sideX;
  sideHint.y = sideY + 10;
  panelPlaceholders.addChild(sideHint);

  // ===== 内容区:按当前标签渲染 =====
  const cx0 = px + sideW, cy0 = py + topH;
  const cw = pw - sideW, ch = ph - topH;
  if (panelTab === 'model')            drawModelPage(cx0, cy0, cw, ch);
  else if (panelTab === 'leaderboard') drawLeaderboardPage(cx0, cy0, cw, ch);
  else if (panelTab === 'community')   drawCommunityPage(cx0, cy0, cw, ch);
  else                                 drawBackendPage(cx0, cy0, cw, ch);

  // 弹层:榜单行点开的是模型属性编辑器(临时调试);模型页是「数据详情」;后台页是经营数据详情
  attrDetailLayer.visible = boardPickIdx >= 0
    || (showAttrDetail && panelTab === 'model')
    || (backendDetailOpen && panelTab === 'backend');
  if (boardPickIdx >= 0) drawModelAttrEditor(px, py, pw, ph);
  else if (backendDetailOpen && panelTab === 'backend') drawBackendDetail(px, py, pw, ph);
  else if (attrDetailLayer.visible) drawAttrDetail(px, py, pw, ph);

  // 搜索框 DOM:只在「面板开着 + 榜单页 + 没打开模型面板」显示
  // (搜索框是 DOM,叠在画布最上层,模型面板开着时不藏会盖在面板上)
  const lbDom = ensureLbDom();
  const lbShow = screenPanelOpen && panelTab === 'leaderboard' && boardPickIdx < 0;
  lbDom.inp.style.display = lbShow ? 'block' : 'none';
  if (!lbShow) lbDom.drop.style.display = 'none';

  // 价格输入 DOM:只在「面板开着 + 后台页 + 没开数据详情」显示
  const bp = backendPriceDom();
  bp.inp.style.display = (screenPanelOpen && panelTab === 'backend' && !backendDetailOpen) ? 'block' : 'none';
}

// 榜单滚轮:直接挂 DOM wheel,不走 Pixi 的事件系统 ——
// 面板已占屏 88%×85%,不需要把指针精确停在列表上才响应;也免得再踩一次 Pixi 命中测试的坑。
// 只在「面板开着 + 当前是榜单页/后台页」时生效。
app.view.addEventListener('wheel', (e) => {
  if (!screenPanelOpen) return;
  if (panelTab === 'leaderboard') {
    if (boardPickIdx >= 0) return;   // 编辑器开着时不要滚动背后的榜单
    searchHitIdx = -1;               // 滚动了就清掉搜索跳转蓝框
    const step = e.deltaY > 0 ? 3 : -3;
    const next = Math.max(0, Math.min(REAL_MODELS.length - 1, boardScroll + step));
    if (next === boardScroll) return;
    boardScroll = next;
    layoutScreenPanel();
  } else if (panelTab === 'backend') {
    if (backendEditingPrice) return;
    const step = e.deltaY > 0 ? 3 : -3;
    const next = Math.max(0, Math.min(REAL_MODELS.length - 1, backendPickScroll + step));
    if (next === backendPickScroll) return;
    backendPickScroll = next;
    layoutScreenPanel();
  }
}, { passive: true });

// 面板内容重绘(存档载入/属性变化后调用)
function refreshRelayPanel() {
  if (screenPanelOpen) layoutScreenPanel();
}

// ---------- 内容页:模型(雷达图 + 最接近的模型) ----------
// 布局参考用户给的 "YOUR MODEL TWIN" 图:左上标题/副标题,左下评分块,右侧七轴雷达图。
function drawModelPage(x, y, w, h) {
  const a = state.relay.ability;
  const tw = closestModel(a);
  const cap = modelCapability(a);
  const ctx = ctxK(a.longCtx);

  // 标题:最接近的真实模型名(玩家一眼就能"代入"某个真实模型)
  const title = makeText(tw.model ? tw.model.n : '—', { size: Math.min(40, w * 0.075), color: '#2a2118', weight: 'bold' });
  title.x = x + w * 0.06;
  title.y = y + h * 0.05;
  panelContentArea.addChild(title);

  const sub = makeText('你最接近的模型 · 相似度 ' + tw.similarity + '%', { size: 13, color: '#8a7a68' });
  sub.x = x + w * 0.06;
  sub.y = title.y + title.height + 6;
  panelContentArea.addChild(sub);

  // 左下:评分块(参考图的荧光绿块,这里用暖橙,和面板色调一致)
  const bw = w * 0.30, bh = h * 0.28;
  const bx = x + w * 0.05, by = y + h * 0.58;
  const block = new PIXI.Graphics();
  block.beginFill(0xd4a574, 1);
  block.drawRoundedRect(bx, by, bw, bh, 6);
  block.endFill();
  panelContentArea.addChild(block);

  const scoreLabel = makeText('综合评分', { size: 12, color: '#6a4a24', weight: 'bold' });
  scoreLabel.x = bx + 16; scoreLabel.y = by + 12;
  panelContentArea.addChild(scoreLabel);

  const scoreVal = makeText(String(Math.round(cap * 10)), { size: Math.min(52, bh * 0.42), color: '#3a2a14', weight: 'bold' });
  scoreVal.x = bx + 16; scoreVal.y = by + bh * 0.30;
  panelContentArea.addChild(scoreVal);

  // cap(0-100 刻度的综合能力值,榜单同款)显示在大数右侧
  const capTxt = makeText('cap ' + (Math.round(cap * 10) / 10), { size: 16, color: '#6a4a24', weight: 'bold' });
  capTxt.x = scoreVal.x + scoreVal.width + 14;
  capTxt.y = scoreVal.y + scoreVal.height - capTxt.height - 2;
  panelContentArea.addChild(capTxt);

  const scoreMeta = makeText(tokPerSec(a.speed).toFixed(1) + ' tok/s · 上下文 ' + Math.round(ctx) + 'k',
    { size: 12, color: '#6a4a24' });
  scoreMeta.x = bx + 16; scoreMeta.y = by + bh - 26;
  panelContentArea.addChild(scoreMeta);

  // 右侧:九轴雷达图(全部基础属性,一个都不少)
  drawRadar(x + w * 0.64, y + h * 0.42, Math.min(w * 0.24, h * 0.34), a, tw.model ? modelToAttrs(tw.model) : null);

  // 底部图例 + 两个"非单调属性"的读法说明(不解释的话玩家会把拟合当成越高越好)
  const notes = [
    '灰 = 最接近的真实模型   橙 = 你的模型',
    '拟合最优 ' + CAP_FIT_OPT + '(过高过拟合 / 过低欠拟合,都会掉能力) · 参数不直接加能力,只放大训练收益',
  ];
  notes.forEach((s, i) => {
    const t = makeText(s, { size: 11, color: '#8a7a68' });
    t.x = x + w * 0.05;
    t.y = y + h * 0.90 + i * 17;
    panelContentArea.addChild(t);
  });

  drawAttrDetailButton(x + w, y);
}

// 模型页右上角「数据详情」按钮。样式贴左侧栏:浅米色底 + 暖橙纸页图标 + 深色标签。
function drawAttrDetailButton(right, top) {
  const bw = 108, bh = 30;
  const bx = right - bw - 16, by = top + 14;
  const btn = new PIXI.Graphics();
  btn.lineStyle(1, 0xc4b8a8, 0.9);
  btn.beginFill(showAttrDetail ? 0xd4a574 : 0xe8e0d4, 1);
  btn.drawRoundedRect(bx, by, bw, bh, 8);
  btn.endFill();
  drawPaperIcon(btn, bx + 13, by + 8, 14);
  btn.eventMode = 'static';
  btn.cursor = 'pointer';
  btn.hitArea = new PIXI.Rectangle(bx, by, bw, bh);
  btn.on('pointerdown', () => { showAttrDetail = !showAttrDetail; layoutScreenPanel(); });
  panelContentArea.addChild(btn);

  const label = makeText('数据详情', { size: 12, color: '#5a4632', weight: 'bold' });
  label.x = bx + 34;
  label.y = by + (bh - 12) / 2 - 2;
  panelContentArea.addChild(label);
}

// 纸页图标(日志/文档感):圆角纸 + 右上折角 + 三条内容线。s = 图标高度
function drawPaperIcon(g, x, y, s) {
  const w = s * 0.8;
  g.beginFill(0xfdfaf5, 1);
  g.drawRoundedRect(x, y, w, s, 2);
  g.endFill();
  g.lineStyle(1, 0x8a7a68, 1);
  g.drawRoundedRect(x, y, w, s, 2);
  // 右上折角
  g.beginFill(0xd4a574, 1);
  g.moveTo(x + w * 0.58, y);
  g.lineTo(x + w, y + s * 0.34);
  g.lineTo(x + w * 0.58, y + s * 0.34);
  g.closePath();
  g.endFill();
  // 三条内容线
  g.lineStyle(1, 0x8a7a68, 0.75);
  for (let i = 0; i < 3; i++) {
    const ly = y + s * (0.46 + i * 0.17);
    g.moveTo(x + w * 0.2, ly);
    g.lineTo(x + w * (i === 2 ? 0.58 : 0.8), ly);
  }
}

// ---------- 模型页「数据详情」弹层 ----------
// 阴影铺满整个屏幕(不只包住卡片),它同时是"点卡片外任意处关闭"的点击层。
function drawAttrDetail(px, py, pw, ph) {
  const w = app.screen.width, h = app.screen.height;

  const shade = new PIXI.Graphics();
  shade.beginFill(0x1a1208, 0.5);
  shade.drawRect(0, 0, w, h);
  shade.endFill();
  shade.eventMode = 'static';
  shade.hitArea = new PIXI.Rectangle(0, 0, w, h);
  shade.on('pointerdown', () => { showAttrDetail = false; layoutScreenPanel(); });
  attrDetailLayer.addChild(shade);

  const cw = Math.min(pw * 0.74, 640);
  const rowH = 40, headH = 58, footH = 24;
  const chh = headH + RADAR_KEYS.length * rowH + footH;
  const cx = px + (pw - cw) / 2;
  const cy = py + (ph - chh) / 2;

  const card = new PIXI.Graphics();
  card.lineStyle(1, 0xc4b8a8, 0.9);
  card.beginFill(0xf5f0e8, 1);
  card.drawRoundedRect(cx, cy, cw, chh, 12);
  card.endFill();
  // 头部条用和左侧栏/顶部栏同一个浅米色,视觉上就是"这个面板的一部分"
  card.beginFill(0xe8e0d4, 1);
  card.drawRoundedRect(cx, cy, cw, headH, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRect(cx, cy + headH - 12, cw, 12);
  card.endFill();
  card.eventMode = 'static';   // 挡住阴影:点卡片内部不关闭
  card.hitArea = new PIXI.Rectangle(cx, cy, cw, chh);
  attrDetailLayer.addChild(card);

  const title = makeText('属性数据详情', { size: 17, color: '#2a2118', weight: 'bold' });
  title.x = cx + 20; title.y = cy + 17;
  attrDetailLayer.addChild(title);

  const tip = makeText('点卡片外任意处关闭', { size: 11, color: '#8a7a68' });
  tip.x = cx + cw - tip.width - 20; tip.y = cy + 21;
  attrDetailLayer.addChild(tip);

  const ak = state.relay.ability;
  RADAR_KEYS.forEach((k, i) => {
    const ry = cy + headH + i * rowH;
    if (i > 0) {
      const line = new PIXI.Graphics();
      line.lineStyle(1, 0xc4b8a8, 0.28);
      line.moveTo(cx + 20, ry); line.lineTo(cx + cw - 20, ry);
      attrDetailLayer.addChild(line);
    }
    const nm = makeText(ATTR_NAMES[k], { size: 14, color: '#2a2118', weight: 'bold' });
    nm.x = cx + 20; nm.y = ry + 12;
    attrDetailLayer.addChild(nm);

    const val = makeText(String(Math.round(ak[k])), { size: 13, color: '#c05a2a', weight: 'bold' });
    val.x = cx + 96; val.y = ry + 13;
    attrDetailLayer.addChild(val);

    const desc = makeText(ATTR_DESC[k], { size: 12, color: '#8a7a68' });
    desc.style.wordWrap = true;
    desc.style.breakWords = true;
    desc.style.wordWrapWidth = cw - 148 - 20;
    desc.x = cx + 148; desc.y = ry + 13;
    attrDetailLayer.addChild(desc);
  });
}

// ---------- 【临时调试】榜单点行弹出的模型属性编辑器 ----------
// 用途:直接改某个真实模型的等效属性,实时看雷达图灰影与「最接近的模型」怎么变,方便调数值。
// 只写 MODEL_ATTR_OVERRIDE(localStorage),**不碰** REAL_MODELS / 存档 / 设计文档。
// 交互:点数值框 → 输数字(最多 3 位)→ 回车确认 / ESC 取消;数字键只更新那一个框,不整页重绘。
// ponytail: 纯调试面板,没做撤销栈、没做多模型并排;要上线就把整块连同 MODEL_ATTR_OVERRIDE 删掉。
function drawModelAttrEditor(px, py, pw, ph) {
  const m = REAL_MODELS[boardPickIdx];
  if (!m) { boardPickIdx = -1; return; }
  const w = app.screen.width, h = app.screen.height;

  const shade = new PIXI.Graphics();
  shade.beginFill(0x1a1208, 0.5);
  shade.drawRect(0, 0, w, h);
  shade.endFill();
  shade.eventMode = 'static';
  shade.hitArea = new PIXI.Rectangle(0, 0, w, h);
  shade.on('pointerdown', () => { boardPickIdx = -1; editingKey = null; layoutScreenPanel(); });
  attrDetailLayer.addChild(shade);

  // 卡片与面板内容区**同比例**(用户要求):宽占 pw 的 97%、高占 ph 的 97%(留一点缝透气),
  // 行高随剩余高度均分 9 行,窗口拉高卡片就跟着拉长,字不会挤。
  const cw = Math.max(560, Math.min(pw * 0.97, 1120));
  const headH = 62, footH = 36;
  const rowH = Math.max(36, Math.floor((ph * 0.97 - headH - footH) / RADAR_KEYS.length));
  const chh = headH + RADAR_KEYS.length * rowH + footH;
  const cx = px + (pw - cw) / 2;
  const cy = py + (ph - chh) / 2;
  // 右栏(与「模型」页一致的能力评价 + 雷达图)宽度的起点;x 皆相对卡片
  const rightW = Math.min(380, cw * 0.42);
  const listW = cw - rightW;

  const card = new PIXI.Graphics();
  card.lineStyle(1, 0xc4b8a8, 0.9);
  card.beginFill(0xf5f0e8, 1);
  card.drawRoundedRect(cx, cy, cw, chh, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRoundedRect(cx, cy, cw, headH, 12);
  card.endFill();
  card.beginFill(0xe8e0d4, 1);
  card.drawRect(cx, cy + headH - 12, cw, 12);
  card.endFill();
  card.eventMode = 'static';
  card.hitArea = new PIXI.Rectangle(cx, cy, cw, chh);
  attrDetailLayer.addChild(card);

  // 编辑器标题显示**当前名次**(有效 cap 排序后),不是原始下标 —— 改数值名次会动,标题跟着真实
  const rankNow = boardOrder().findIndex((e) => e.i === boardPickIdx) + 1;
  const title = makeText('第 ' + rankNow + ' 名 · ' + m.n, { size: 20, color: '#2a2118', weight: 'bold' });
  title.x = cx + 22; title.y = cy + 12;
  attrDetailLayer.addChild(title);

  // 左上角副标题里的截止日期:编辑器改「知识」后跟着变(effectiveCutoff),不是静态 m.k
  const meta = makeText(m.v + ' · ' + m.t + ' · cap ' + m.cap + ' · ' + effectiveCutoff(m) + ' · ' + m.c + 'k · $' + m.pi + '/' + m.po,
    { size: 13, color: '#8a7a68' });
  meta.x = cx + 22; meta.y = cy + 38;
  attrDetailLayer.addChild(meta);

  const editable = lbDebug;                    // 调试态可改;玩家态只读查看
  const tip = makeText(editable ? '点数值框输入 · 回车确认 · ESC 取消 · 临时调试' : '查看模型属性',
    { size: 12, color: '#b0a294', anchor: 1 });
  tip.x = cx + cw - 22; tip.y = cy + 24;
  attrDetailLayer.addChild(tip);

  const cur = modelToAttrs(m);                 // 已含覆盖值
  const cap = modelCapabilityOf(m);            // 与「模型」页同一把尺子量出来的综合评分
  const ov = MODEL_ATTR_OVERRIDE[m.n] || {};
  editRef = null;

  // ---- 右栏:与「模型」页一致的能力评价(综合评分块)+ 9 轴雷达图 ----
  // 左栏改属性 → 右栏实时反映(modelToAttrs 每次重绘都重新算)。布局参考 artificialanalysis:
  // 榜单选一个模型 → 看「智能指数 + 分项能力图」。
  const rx = cx + listW;
  const bw = rightW * 0.84, bh = chh * 0.24;
  const bx0 = rx + (rightW - bw) / 2, by0 = cy + headH + 12;
  const block = new PIXI.Graphics();
  block.beginFill(0xd4a574, 1);
  block.drawRoundedRect(bx0, by0, bw, bh, 6);
  block.endFill();
  attrDetailLayer.addChild(block);

  const scoreLabel = makeText('综合评分', { size: 13, color: '#6a4a24', weight: 'bold' });
  scoreLabel.x = bx0 + 16; scoreLabel.y = by0 + 7;
  attrDetailLayer.addChild(scoreLabel);

  const scoreVal = makeText(String(Math.round(cap * 10)), { size: Math.min(48, bh * 0.5), color: '#3a2a14', weight: 'bold' });
  scoreVal.x = bx0 + 16; scoreVal.y = by0 + bh * 0.30;
  attrDetailLayer.addChild(scoreVal);

  // cap(0-100 刻度,与榜单一致;含编辑器覆盖的有效值)显示在大数右侧
  const capTxt = makeText('cap ' + (Math.round(effectiveCap(m) * 10) / 10), { size: 16, color: '#6a4a24', weight: 'bold' });
  capTxt.x = scoreVal.x + scoreVal.width + 14;
  capTxt.y = scoreVal.y + scoreVal.height - capTxt.height - 2;
  attrDetailLayer.addChild(capTxt);

  const scoreMeta = makeText(tokPerSec(cur.speed).toFixed(1) + ' tok/s · 上下文 ' + Math.round(ctxK(cur.longCtx)) + 'k',
    { size: 13, color: '#6a4a24' });
  scoreMeta.x = bx0 + 16; scoreMeta.y = by0 + bh - 24;
  attrDetailLayer.addChild(scoreMeta);

  // 半径按"评分块下缘 → 页脚上缘"的竖向空间倒推:上下两根轴的标签还要占 r+29
  const zoneTop = by0 + bh + 14, zoneBottom = cy + chh - footH - 6;
  const radarR = Math.max(30, Math.min(rightW * 0.36, (zoneBottom - zoneTop - 58) / 2));
  // 画在右栏下半部;模型页的动画只在「模型」页播(编辑器里 radarAnim 已被消费,不会重播)
  drawRadar(rx + rightW / 2, zoneTop + 29 + radarR, radarR, cur, null, attrDetailLayer, 12);

  // ---- 左栏:9 项属性的可编辑列表(原样式) ----
  RADAR_KEYS.forEach((k, i) => {
    const ry = cy + headH + i * rowH;
    if (i > 0) {
      const line = new PIXI.Graphics();
      line.lineStyle(1, 0xc4b8a8, 0.28);
      line.moveTo(cx + 20, ry); line.lineTo(cx + listW - 16, ry);
      attrDetailLayer.addChild(line);
    }
    const editing = editingKey === k;
    const changed = ov[k] !== undefined;

    const nm = makeText(ATTR_NAMES[k], { size: 16, color: '#2a2118', weight: 'bold' });
    nm.x = cx + 22; nm.y = ry + (rowH - 22) / 2;
    attrDetailLayer.addChild(nm);

    // 数值框:调试态点一下进入输入态;玩家态只展示数值(不挂事件)
    const bx = cx + 116, bw2 = 68, bh2 = 26, by = ry + (rowH - bh2) / 2;
    const box = new PIXI.Graphics();
    box.lineStyle(editing ? 2 : 1, editing ? 0xe86a3a : 0xc4b8a8, editing ? 1 : 0.8);
    box.beginFill(editing ? 0xfff0dc : 0xfffaf2, 1);
    box.drawRoundedRect(bx, by, bw2, bh2, 5);
    box.endFill();
    if (editable) {
      box.eventMode = 'static';
      box.cursor = 'text';
      box.hitArea = new PIXI.Rectangle(bx, by, bw2, bh2);
      box.on('pointerdown', () => {
        editingKey = k;
        editBuf = String(Math.round(cur[k]));
        layoutScreenPanel();
      });
    }
    attrDetailLayer.addChild(box);

    const vt = makeText(editing ? editBuf : String(Math.round(cur[k])),
      { size: 15, color: editable && changed ? '#c05a2a' : '#3a2f22', weight: 'bold', anchor: 0.5 });
    vt.x = bx + bw2 / 2; vt.y = by + bh2 / 2;
    attrDetailLayer.addChild(vt);
    if (editing) editRef = vt;                  // 敲键只改这一个 Text

    if (editable && changed) {
      const dot = makeText('已改', { size: 11, color: '#e86a3a' });
      dot.x = bx + bw2 + 8; dot.y = by + 5;
      attrDetailLayer.addChild(dot);
    }

    const desc = makeText(ATTR_DESC[k], { size: 13, color: '#8a7a68' });
    desc.style.wordWrap = true;
    desc.style.breakWords = true;
    desc.style.wordWrapWidth = listW - 220 - 26;
    desc.x = cx + 220; desc.y = ry + (rowH - desc.height) / 2;
    attrDetailLayer.addChild(desc);
  });

  // 左右栏分隔线(画在雷达图之前,别压住内容)
  const vline = new PIXI.Graphics();
  vline.lineStyle(1, 0xc4b8a8, 0.4);
  vline.moveTo(rx - 4, cy + headH + 6);
  vline.lineTo(rx - 4, cy + chh - footH - 4);
  attrDetailLayer.addChild(vline);

  if (lbDebug) {   // 调试态专用:已改计数 + 重置/清空/导出/导入/保存到文档(玩家态只读,全部隐藏)
  // 已改计数挪到页脚中间,别和右栏雷达图/轴标签重叠
  const cnt = makeText('已改 ' + Object.keys(MODEL_ATTR_OVERRIDE).length + ' 个模型 · 只存在本机浏览器里',
    { size: 12, color: '#b0a294', anchor: 0.5 });
  cnt.x = cx + listW + (rightW - 200) / 2 + 40;
  cnt.y = cy + chh - footH / 2 - 7;
  attrDetailLayer.addChild(cnt);

  // 页脚:重置本模型 + 清空全部(调试用,免得一个个删)
  const footY = cy + headH + RADAR_KEYS.length * rowH;
  const mkBtn = (label, bx, onTap) => {
    const bw = 108, bh = 26, by = footY + 4;
    const g = new PIXI.Graphics();
    g.lineStyle(1, 0xc4b8a8, 0.9);
    g.beginFill(0xe8e0d4, 1);
    g.drawRoundedRect(bx, by, bw, bh, 6);
    g.endFill();
    g.eventMode = 'static';
    g.cursor = 'pointer';
    g.hitArea = new PIXI.Rectangle(bx, by, bw, bh);
    g.on('pointerdown', onTap);
    attrDetailLayer.addChild(g);
    const t = makeText(label, { size: 12, color: '#5a4632', weight: 'bold', anchor: 0.5 });
    t.x = bx + bw / 2; t.y = by + bh / 2;
    attrDetailLayer.addChild(t);
  };
  mkBtn('重置本模型', cx + 22, () => {
    delete MODEL_ATTR_OVERRIDE[m.n];
    saveModelOverrides();
    editingKey = null;
    layoutScreenPanel();
  });
  mkBtn('清空全部', cx + 138, () => {
    // 清空前自动落一份备份文件 —— 覆盖层一清,没导出的调整就真没了(吃过一次亏)
    const n = Object.keys(MODEL_ATTR_OVERRIDE).length;
    if (n) {
      const blob = new Blob([JSON.stringify(MODEL_ATTR_OVERRIDE, null, 1)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dshgame-adjustments-backup.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    MODEL_ATTR_OVERRIDE = {};
    saveModelOverrides();
    editingKey = null;
    layoutScreenPanel();
    if (n) spawnFloatText('已清空(清空前的备份已下载)', cx + 192, footY - 10);
  });
  // 调整值只存在浏览器 localStorage 里(不进存档/文件),给个导入导出防丢:
  // 换浏览器、清缓存、或者让我跑构建测试之前,先「导出」留一份。
  if (listW >= 520) {
    // 一键导出:自动下载 dshgame-adjustments.json + 复制到剪贴板(双保险)。
    // 调整值按"打开方式"隔离在各自的 localStorage 里,换窗口/换浏览器就靠这对按钮搬家。
    mkBtn('导出调整', cx + 254, () => {
      const n = Object.keys(MODEL_ATTR_OVERRIDE).length;
      if (!n) { spawnFloatText('当前没有调整,无需导出', cx + 320, footY - 10); return; }
      const json = JSON.stringify(MODEL_ATTR_OVERRIDE, null, 1);
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dshgame-adjustments.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      try { navigator.clipboard.writeText(JSON.stringify(MODEL_ATTR_OVERRIDE)); } catch (e) { /* file:// 等场景可能拒绝,下载已兜底 */ }
      spawnFloatText('已下载备份 + 已复制 ' + n + ' 个模型', cx + 320, footY - 10);
    });
    // 一键导入:选一个之前导出的 json 文件
    // 「保存到文档」:把当前覆盖 POST 给本地服务(server.py),自动写进设计文档 §3.1 并重建 ——
    // 不用再导出/导入。要求用 127.0.0.1:8765 打开且 server.py 在跑;file:// 或服务未启动时走导出兜底。
    if (listW >= 640) mkBtn('保存到文档', cx + 502, () => {
      const n = Object.keys(MODEL_ATTR_OVERRIDE).length;
      if (!n) { spawnFloatText('当前没有调整', cx + 556, footY - 10); return; }
      spawnFloatText('正在写入设计文档…', cx + 556, footY - 10);
      // payload 附带有效 cap(__cap)与截止日期(__k):不然属性固化了、cap 会退回静态值(踩过的坑)
      const payload = {};
      for (const [name, kv] of Object.entries(MODEL_ATTR_OVERRIDE)) {
        const m = REAL_MODELS.find((x) => x.n === name);
        payload[name] = Object.assign({}, kv);
        if (m) {
          payload[name].__cap = Math.round(effectiveCap(m) * 10) / 10;
          payload[name].__k = effectiveCutoff(m);
        }
      }
      fetch('/api/save-overrides', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then((r2) => r2.json())
        .then((j) => {
          MODEL_ATTR_OVERRIDE = {};
          saveModelOverrides();
          editingKey = null;
          layoutScreenPanel();
          spawnFloatText('已固化 ' + (j.updated || []).length + ' 个模型,按 F5 刷新读新数据', cx + 556, footY - 10);
        })
        .catch(() => spawnFloatText('保存失败:需用 127.0.0.1:8765 打开且 server.py 在跑', cx + 556, footY - 10));
    });
    mkBtn('导入调整', cx + 386, () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.onchange = () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const obj = JSON.parse(String(rd.result));
            if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
              MODEL_ATTR_OVERRIDE = obj;
              saveModelOverrides();
              editingKey = null;
              layoutScreenPanel();
              spawnFloatText('已导入 ' + Object.keys(obj).length + ' 个模型的调整', cx + 452, footY - 10);
            } else {
              spawnFloatText('文件内容不是对象', cx + 452, footY - 10);
            }
          } catch (e) { spawnFloatText('解析失败:不是合法 JSON', cx + 452, footY - 10); }
        };
        rd.readAsText(f);
      };
      inp.click();
    });
  }
  }   // if (lbDebug) 闭合(调试按钮整块)
}

// 【临时调试】覆盖值落盘(键名 MODEL_ATTR_KEY,见定义处)
function saveModelOverrides() {
  try { localStorage.setItem(MODEL_ATTR_KEY, JSON.stringify(MODEL_ATTR_OVERRIDE)); } catch (e) { /* 隐私模式等,忽略 */ }
}

// 【临时调试】提交一次输入:clamp 0-100 整数,写进覆盖表并重绘
function commitModelAttrEdit() {
  if (!editingKey || boardPickIdx < 0) return;
  const m = REAL_MODELS[boardPickIdx];
  const v = Math.max(0, Math.min(100, parseInt(editBuf || '0', 10) || 0));
  if (!MODEL_ATTR_OVERRIDE[m.n]) MODEL_ATTR_OVERRIDE[m.n] = {};
  MODEL_ATTR_OVERRIDE[m.n][editingKey] = v;
  saveModelOverrides();
  editingKey = null; editBuf = ''; editRef = null;
  layoutScreenPanel();
}

// 雷达图轴序 = 用户定义的全部 9 项基础属性(推理/知识/长上下文/速度/指令遵循/工具调用/多模态/拟合/参数)。
// 前 7 项是"越高越好"的能力维度(与相似度算法 ATTR_KEYS 同集合,只是显示顺序更靠前);
// 「拟合」「参数」不是单调属性,放最后并单独处理:
//   拟合 —— 在轴上额外标出最优点 CAP_FIT_OPT,玩家一眼能看出自己欠拟合还是过拟合;
//   参数 —— 值本身有意义(放大训练收益),照常画。
// 轴序变化不影响算法:相似度与叠影对照都是按 key 取值的。
const RADAR_KEYS = ['reasoning', 'knowledge', 'longCtx', 'speed', 'instruct', 'toolCall', 'multimodal', 'fit', 'params'];
function drawRadar(cx, cy, r, myAttrs, theirAttrs, parent, labelSize) {
  // parent/labelSize 缺省 = 模型页用法;榜单编辑器传 attrDetailLayer + 小号字,把图画进卡片右侧
  parent = parent || panelContentArea;
  labelSize = labelSize || 12;
  const n = RADAR_KEYS.length;
  const angle = (i) => -Math.PI / 2 + i * 2 * Math.PI / n;   // 第一条轴朝正上
  const at = (i, v) => {
    const rr = r * Math.max(0, Math.min(100, v)) / 100;
    return [cx + Math.cos(angle(i)) * rr, cy + Math.sin(angle(i)) * rr];
  };

  // 网格与轴线是"边界",完全静止(用户定稿:多边形边界不要动);动的只有内部线圈的范围和数字。
  const grid = new PIXI.Graphics();
  // 5 层同心多边形网格
  for (let lv = 1; lv <= 5; lv++) {
    const rr = r * lv / 5;
    grid.lineStyle(1, 0xc4b8a8, lv === 5 ? 0.9 : 0.35);
    for (let i = 0; i <= n; i++) {
      const a = angle(i % n);
      const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
      if (i === 0) grid.moveTo(px, py); else grid.lineTo(px, py);
    }
  }
  // 轴线
  for (let i = 0; i < n; i++) {
    grid.lineStyle(1, 0xc4b8a8, 0.35);
    grid.moveTo(cx, cy);
    const [ex, ey] = at(i, 100);
    grid.lineTo(ex, ey);
  }
  parent.addChild(grid);

  // ---- 数据层(数据线圈出的范围 + 拟合最优点刻度)从中心长出来 ----
  // 网格不动,只有这一层做 0→1 的缩放;每帧重画这层 Graphics 太贵,缩放容器最省。
  const dataLayer = new PIXI.Container();
  dataLayer.pivot.set(cx, cy);
  dataLayer.position.set(cx, cy);
  parent.addChild(dataLayer);
  if (radarAnim) {
    dataLayer.scale.set(0.01);
    // tween 的第二个参数是**增量**:从 0.01 长到 1 要写 0.99,写 1 会停在 1.01。
    // 打 __radar 标记给 radarTicker 找进度用。
    dataLayer.scale.__radar = true;
    tween(dataLayer.scale, { x: 0.99, y: 0.99 }, 0.45);
    radarCounters.clear();          // 上一次动画的旧 Text 都被清出面板了,计数器一并作废
    radarCounting = true;
    radarAnim = false;
  }

  // 单个多边形(叠影对照 / 我的模型共用)
  const polyOf = (attrs, color, alpha, lineW) => {
    const g = new PIXI.Graphics();
    if (lineW) g.lineStyle(lineW, color, 1);
    g.beginFill(color, alpha);
    for (let i = 0; i < n; i++) {
      const [px, py] = at(i, attrs[RADAR_KEYS[i]]);
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.endFill();
    dataLayer.addChild(g);
  };
  if (theirAttrs) polyOf(theirAttrs, 0x8a8a8a, 0.16, 1);   // 对照:最接近的真实模型(灰)
  polyOf(myAttrs, 0xe86a3a, 0.22, 2);                       // 我的模型(暖橙)

  // 拟合轴上的"最优点"刻度:拟合不是越高越好,单看多边形大小会读反
  const fi = RADAR_KEYS.indexOf('fit');
  const [ox, oy] = at(fi, CAP_FIT_OPT);
  const perp = angle(fi) + Math.PI / 2;
  const mk = new PIXI.Graphics();
  mk.lineStyle(2, 0x3a8a4a, 1);
  mk.moveTo(ox + Math.cos(perp) * 7, oy + Math.sin(perp) * 7);
  mk.lineTo(ox - Math.cos(perp) * 7, oy - Math.sin(perp) * 7);
  dataLayer.addChild(mk);   // 跟着数据圈一起长出来;下面那行文字留在外面(缩放会把字拉变形)
  const optT = makeText('最优 ' + CAP_FIT_OPT, { size: 10, color: '#3a8a4a', weight: 'bold', anchor: 0.5 });
  optT.x = ox + Math.cos(perp) * 26;
  optT.y = oy + Math.sin(perp) * 26;
  parent.addChild(optT);

  // 轴标签 + 数值(9 条轴,全部属性都要能看到值)
  for (let i = 0; i < n; i++) {
    const k = RADAR_KEYS[i];
    const a = angle(i);
    const label = ATTR_NAMES[k] + ' ';
    const t = makeText(label + Math.round(myAttrs[k]),
      { size: labelSize, color: '#2a2118', weight: 'bold' });
    // 左右两侧的标签贴圆外缘对齐(anchor 0/1),避免 9 轴下标签互相压字或压到左侧评分块
    t.anchor.set(Math.cos(a) > 0.2 ? 0 : (Math.cos(a) < -0.2 ? 1 : 0.5), 0.5);
    t.x = cx + Math.cos(a) * (r + 12);
    t.y = cy + Math.sin(a) * (r + 20);
    parent.addChild(t);
    // 数字从 0 滚到当前值(动画期间每帧只改这 9 个 Text 的 text,不重绘面板)
    radarCounters.set(t, {
      from: 0, to: Math.round(myAttrs[k]), prefix: label,
      apply(v) { t.text = this.prefix + v; },
    });
  }
  // 动画进行中才逐帧推进数字;不动了就把计数器清掉,平常一帧的开销为 0
  if (tweens.some((tw) => tw.target === dataLayer.scale)) radarCounting = true;
  else if (!tweens.some((t) => t.target && t.target.__radar)) {
    // 没动画也没补间在跑(非动画重绘):计数器直接定格在目标值,别留下半截状态
    for (const c of radarCounters.values()) c.apply(c.to);
    radarCounters.clear();
  }
}

// 轴标签数字的滚动计数器(drawRadar 注册;radarTicker 每帧消费)
// key = Text 对象,value = { from, to, prefix, apply(v) }。动画结束统一清空。
const radarCounters = new Map();
let radarCounting = false;
function radarTicker() {
  if (!radarCounting) return;
  // 找到还在跑的雷达缩放补间,用它的缓动进度同步数字 —— 图形长多少,数字就滚多少
  const tw = tweens.find((t) => t.target && t.target.__radar);
  if (!tw) {
    radarCounting = false;
    for (const c of radarCounters.values()) c.apply(c.to);
    radarCounters.clear();
    return;
  }
  const p = Math.min(tw.elapsed / tw.duration, 1);
  const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;   // 与 updateTweens 同一条缓动
  for (const c of radarCounters.values()) c.apply(Math.round(c.from + (c.to - c.from) * e));
}

// ---------- 内容页:榜单(全部在售模型的数据) ----------
// 数据源就是 REAL_MODELS(由《中转站设计.md》§3.1 生成)。
// ⚠️ 型号、性能、价格全部是**虚构设定**(设计文档 §3.1 顶部有同样的声明),所以页脚必须带上免责提示。
// 显示顺序 = boardOrder()(有效 cap 降序):编辑器改数值 → 名次实时跟着变(用户要求,方便调榜)。
// 价格只显示一列(用户要求):入价/出价合并成一个「价$」= 混合价(取入:出 ≈ 1:3 的常用加权),
// 只是榜单速览用,后台定价仍读 §3.1 的 pi/po 两个字段。
const BOARD_COLS = [
  // [标题, 从左起算的 x 占比, 取值函数]
  ['#',    0.00, (m, i) => String(i + 1)],
  ['模型', 0.045, (m) => m.n],
  ['厂商', 0.29, (m) => m.v],
  ['档位', 0.42, (m) => m.t],
  ['截止', 0.49, (m) => effectiveCutoff(m)],   // 编辑器改「知识」后这里跟着变
  ['上下文', 0.57, (m) => (m.c >= 1000 ? (m.c / 1000).toFixed(2).replace(/\.?0+$/, '') + 'M' : m.c + 'k')],
  // 游戏内自洽的 tokens/s(速度属性 × 3),不是外部榜单的实测值
  ['tokens/s', 0.66, (m) => Math.round(m.ts)],   // AA 实测输出速度(与编辑器速度属性×3 一致)
  ['价$', 0.77, (m) => blendPrice(m)],
  ['cap',  0.89, (m) => String(Math.round(effectiveCap(m) * 10) / 10)],
];
// 单一参考价($/M tokens):出价为主、入价加权 —— 真实用量里输出 token 通常只有输入的 ~1/3,
// 但计费上输出贵 3~4 倍,两边占比差不多,取 (pi + po*3) / 4 四舍五入。
function blendPrice(m) {
  const v = (m.pi + m.po * 3) / 4;
  return v >= 10 ? String(Math.round(v)) : String(Math.round(v * 10) / 10);
}

function drawLeaderboardPage(x, y, w, h) {

  exp.drawRoundedRect(x + w - 160, y + 4, 150, 26, 8);

  exp.eventMode = 'static';

  exp.hitArea = new PIXI.Rectangle(x + w - 160, y + 4, 150, 26);
  exp.on('pointerdown', () => {
    // 导出"修改后"的数据:属性/截止/cap 取有效值(含编辑器覆盖),另加「手改项」列标明你动了哪些。
    // 名次按实时排序(tokens/s 列除外,它固定显示 AA 实测原值)。
    const modalNames = ['文', '文图', '文图视', '文图视PDF'];
    const head = '名次,模型,厂商,档位,知识截止,上下文(k),tokens/s,价$,cap,模态,工具,'
      + '推理,知识,长上下文,速度,多模态,指令遵循,工具调用,拟合,参数,手改项';
    const lines = boardOrder().map((e, i) => {
      const m = e.m;
      const a = modelToAttrs(m);                      // 已含覆盖 = 修改后的值
      const ov = MODEL_ATTR_OVERRIDE[m.n];
      const dirty = ov ? RADAR_KEYS.filter((k) => ov[k] !== undefined).join('+') : '';
      return [
        i + 1, '"' + m.n + '"', '"' + m.v + '"', '"' + m.t + '"', effectiveCutoff(m), m.c,
        Math.round(m.ts), blendPrice(m), Math.round(effectiveCap(m) * 10) / 10,
        '"' + (modalNames[m.m] || '文') + '"', m.tools ? '✓' : '✗',
        Math.round(a.reasoning), Math.round(a.knowledge), Math.round(a.longCtx), Math.round(a.speed),
        Math.round(a.multimodal), Math.round(a.instruct), Math.round(a.toolCall),
        Math.round(a.fit), Math.round(a.params),
        '"' + dirty + '"',
      ].join(',');
    });
    const csv = '\ufeff' + head + '\n' + lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dshgame-leaderboard.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
